<html lang="en">
<head>

<style>

.meterchip{flex:1;background:#091125d8;border:1px solid #ffffff1f;border-radius:999px;padding:5px 7px;box-shadow:0 4px 14px #0005}.meterline{height:7px;background:#23304f;border-radius:999px;overflow:hidden}.meterline i{display:block;height:100%;width:0;border-radius:inherit;transition:width .12s linear}.focusbar i{background:linear-gradient(90deg,var(--violet),var(--blue))}.staminabar i{background:linear-gradient(90deg,var(--amber),var(--mint))}.meterlabel{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);margin-bottom:3px;letter-spacing:.08em;text-transform:uppercase}

#quickButtons{position:absolute;right:calc(8px + var(--safeR));bottom:calc(8px + var(--safeB));display:flex;gap:6px;pointer-events:auto}.iconbtn{min-width:44px;min-height:44px;border-radius:12px;background:#111b38e8;border:1px solid var(--line);font-weight:900}

#screenLayer{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(14px + var(--safeT)) calc(14px + var(--safeR)) calc(14px + var(--safeB)) calc(14px + var(--safeL));background:linear-gradient(150deg,#071026e8,#101b3be8);overflow:auto}
.screen{width:min(720px,100%);max-height:100%;overflow:auto;border:1px solid #ffffff26;border-radius:24px;background:linear-gradient(150deg,#121e3bf7,#0d1630f8);box-shadow:0 24px 80px #000b;padding:clamp(20px,4vw,34px)}
.logo{text-align:center}.logo .eyebrow{color:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:900}.logo h1{margin:.12em 0 .06em;font-size:clamp(52px,14vw,104px);line-height:.8;letter-spacing:-.065em;font-weight:1000}.logo h1 span{display:block;color:var(--mint)}.tagline{margin:20px auto 8px;max-width:560px;text-align:center;font-size:clamp(16px,4vw,22px);font-weight:780;line-height:1.35}.lede{margin:0 auto;max-width:600px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}

.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.btn{min-height:48px;padding:11px 17px;border-radius:13px;background:var(--amber);color:#151d35;font-weight:950;text-transform:uppercase;letter-spacing:.055em;box-shadow:0 3px 0 #a86221;flex:1}.btn.secondary{background:#20325a;color:var(--cream);box-shadow:0 3px 0 #0a1021}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.45;cursor:not-allowed}
.sectionTitle{margin:0 0 6px;font-size:clamp(28px,7vw,48px);letter-spacing:-.04em}.sectionLead{color:var(--muted);line-height:1.55;margin:0 0 16px}.opponents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.opp{padding:14px;border:1px solid var(--line);border-radius:15px;background:#162342;text-align:left}.opp strong{display:block;font-size:15px}.opp small{display:block;color:var(--muted);font-size:10px;line-height:1.4;margin-top:4px}.opp .skill{height:6px;background:#253557;border-radius:999px;margin-top:10px;overflow:hidden}.opp .skill i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--red))}.opp.selected{outline:2px solid var(--gold);background:#263353}
.howGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.how{padding:13px;border:1px solid var(--line);border-radius:14px;background:#15213e}.how b{display:block;color:var(--mint);margin-bottom:4px}.how p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.key{display:inline-grid;place-items:center;min-width:25px;height:24px;padding:0 6px;border-radius:6px;background:#26375c;border:1px solid #52658d;color:#fff;font-size:10px;font-weight:900;box-shadow:0 2px 0 #0a1020}
.statGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}.stat{padding:12px 8px;border:1px solid var(--line);border-radius:13px;background:#15213e;text-align:center}.stat b{display:block;color:var(--gold);font-size:22px}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.resultHero{text-align:center}.resultHero .big{font-size:clamp(48px,14vw,92px);font-weight:1000;line-height:.9;color:var(--gold)}.resultHero h2{font-size:clamp(28px,7vw,48px);margin:10px 0 4px}.resultHero p{color:var(--muted);margin:0 auto;max-width:520px;line-height:1.55}
.settingRow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.settingRow:last-child{border:0}.toggle{min-width:92px;min-height:44px;border-radius:999px;background:#26375b;border:1px solid var(--line);font-weight:900}.toggle[aria-pressed="true"]{background:var(--mint);color:#10213b}
#mobileControls{position:absolute;inset:0;z-index:20;pointer-events:none;display:none}
#moveZone{position:absolute;left:calc(10px + var(--safeL));bottom:calc(12px + var(--safeB));width:142px;height:142px;pointer-events:auto;touch-action:none}.joyBase{position:absolute;inset:12px;border-radius:50%;background:#09112599;border:2px solid #ffffff30;box-shadow:inset 0 0 24px #0008}.joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:#9d8cffcc;border:2px solid #fff6;box-shadow:0 7px 20px #0009;transform:translate(0,0)}
#mobileActions{position:absolute;right:calc(10px + var(--safeR));bottom:calc(12px + var(--safeB));display:grid;grid-template-columns:repeat(2,64px);gap:8px;pointer-events:auto}.mob{min-width:64px;min-height:54px;border-radius:16px;background:#14213fe8;border:1px solid #ffffff2c;font-size:10px;font-weight:950;text-transform:uppercase}.mob.hit{grid-row:span 2;min-height:116px;background:linear-gradient(#ffbf6c,#f08b33);color:#15203a;font-size:16px;box-shadow:0 4px 0 #9e4f1d}.mob.focus{background:#5747a7}.mob[aria-pressed="true"]{outline:3px solid #fff;outline-offset:1px}
#mobileShots{position:absolute;left:50%;bottom:calc(145px + var(--safeB));transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}.mshot{width:48px;height:48px;border-radius:12px;background:#121e3de8;border:1px solid #ffffff29;font-size:20px}.mshot[aria-pressed="true"]{background:var(--amber);color:#15203a}
#rotateNotice{display:none;position:absolute;inset:0;z-index:60;background:#0c1530;align-items:center;justify-content:center;text-align:center;padding:25px}.rotateCard{max-width:360px}.rotateCard b{display:block;font-size:28px;margin-bottom:8px}.rotateCard p{color:var(--muted)}
#splash{position:fixed;inset:0;z-index:999;background:#111936;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;transition:opacity .3s}.splashOut{opacity:0;pointer-events:none}.splashWord{font-weight:950;font-size:clamp(26px,8vw,46px)}.splashLine{width:min(62vw,340px);height:4px;background:var(--amber);border-radius:4px;transform:scaleX(0);transform-origin:left;animation:sweep .65s ease-out .08s forwards}@keyframes sweep{to{transform:scaleX(1)}}
.flash{animation:flash .24s ease-out}@keyframes flash{50%{filter:brightness(1.35)}}
@media(max-width:760px){.menuGrid,.opponents{grid-template-columns:1fr}.menuCard{min-height:100px}.howGrid{grid-template-columns:1fr}.statGrid{grid-template-columns:repeat(2,1fr)}#desktopHelp,#shotDock,#quickButtons{display:none}#topbar{grid-template-columns:1fr auto 1fr}.hudbox b{font-size:11px}.score{font-size:21px}#meterrow{top:calc(58px + var(--safeT))}#message{top:15%;font-size:11px}#chargeWrap{bottom:calc(170px + var(--safeB));width:min(62vw,300px)}}
@media(pointer:coarse),(max-width:760px){#mobileControls{display:block}}
@media(max-height:510px) and (orientation:landscape){#moveZone{width:112px;height:112px}.joyKnob{width:48px;height:48px;margin:-24px}#mobileActions{grid-template-columns:repeat(2,58px)}.mob{min-width:58px;min-height:47px}.mob.hit{min-height:102px}#mobileShots{bottom:calc(5px + var(--safeB))}.mshot{width:44px;height:44px}#message{top:12%}}
@media(max-width:350px) and (orientation:portrait){#rotateNotice{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
</style>

<body>
<div id="app">
  <canvas id="court" aria-label="Apex Rally tennis court"></canvas>
  <div id="hud" class="hidden" aria-hidden="true">
    <div id="topbar">
      <div class="hudbox"><span class="tiny">You</span><b id="playerName">MATT</b></div>
      <div class="hudbox scorebox"><span class="score" id="pScore">0</span><span class="dash">–</span><span class="score" id="aScore">0</span></div>
      <div class="hudbox" id="opponentBox"><span class="tiny">Opponent</span><b id="oppName">ROOKIE ROWAN</b></div>
    </div>
    <div id="meterrow">
      <div class="meterchip"><div class="meterlabel"><span>Stamina</span><span id="staminaText">100</span></div><div class="meterline staminabar"><i id="staminaFill"></i></div></div>
      <div class="meterchip"><div class="meterlabel"><span>Apex Focus</span><span id="focusText">0</span></div><div class="meterline focusbar"><i id="focusFill"></i></div></div>
    </div>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="chargeWrap"><div class="chargeTop"><span>SHOT POWER</span><span id="chargeText">25%</span></div><div class="chargeLine"><i id="chargeFill"></i></div><div class="sweetBand" aria-hidden="true"></div></div>
    <div id="desktopHelp">Move <span class="key">WASD</span>/<span class="key">ARROWS</span> · Aim with mouse · Hold/release <span class="key">SPACE</span> · Shots <span class="key">1–4</span> · Focus <span class="key">SHIFT</span></div>
    <div id="shotDock" role="group" aria-label="Shot type">
      <button class="shotbtn" data-shot="flat" aria-pressed="false"><span>➜</span>Flat<small>Fast</small></button>
      <button class="shotbtn" data-shot="topspin" aria-pressed="true"><span>↻</span>Topspin<small>Safe dip</small></button>
      <button class="shotbtn" data-shot="slice" aria-pressed="false"><span>⌁</span>Slice<small>Low skid</small></button>
      <button class="shotbtn" data-shot="lob" aria-pressed="false"><span>⌃</span>Lob<small>High arc</small></button>
    </div>
    <div id="quickButtons"><button class="iconbtn" id="pauseBtn" aria-label="Pause">Ⅱ</button><button class="iconbtn" id="muteBtn" aria-label="Toggle sound">♪</button></div>
  </div>
  <div id="mobileControls" class="hidden" aria-hidden="true">
    <div id="moveZone" aria-label="Movement joystick"><div class="joyBase"></div><div class="joyKnob" id="joyKnob"></div></div>
    <div id="mobileShots" role="group" aria-label="Shot type">
      <button class="mshot" data-shot="flat" aria-label="Flat shot" aria-pressed="false">➜</button>
      <button class="mshot" data-shot="topspin" aria-label="Topspin shot" aria-pressed="true">↻</button>
      <button class="mshot" data-shot="slice" aria-label="Slice shot" aria-pressed="false">⌁</button>
      <button class="mshot" data-shot="lob" aria-label="Lob shot" aria-pressed="false">⌃</button>
    </div>
    <div id="mobileActions"><button class="mob hit" id="hitBtn">Hold<br>Hit</button><button class="mob focus" id="focusBtn">Focus</button><button class="mob" id="mobilePause">Pause</button></div>
  </div>
  <div id="screenLayer"><div class="screen" id="screen"></div></div>
  <div id="rotateNotice"><div class="rotateCard"><b>Turn your phone sideways</b><p>Apex Rally is playable in portrait, but the court is easier to read in landscape.</p></div></div>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<div id="splash"><div class="splashWord">Made by Matt</div><div class="splashLine"></div></div>
<script>
(()=>{
'use strict';

const canvas=document.getElementById('court');
const ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const hypot=Math.hypot;
const TAU=Math.PI*2;
const COURT_W=720, COURT_L=1280, HALF_W=360, HALF_L=640, NET_H=92, GRAV=2100;
const touchMode=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||matchMedia('(pointer:coarse)').matches;

const SHOTS={
  flat:{name:'FLAT',icon:'➜',time:0.69,arc:0.88,bounce:.54,curve:0,error:1.25,stamina:8,color:'#ffb45c'},
  topspin:{name:'TOPSPIN',icon:'↻',time:0.80,arc:1.02,bounce:.67,curve:0,error:.78,stamina:7,color:'#72e1b2'},
  slice:{name:'SLICE',icon:'⌁',time:0.89,arc:.78,bounce:.38,curve:72,error:.92,stamina:6,color:'#61b7ff'},
  lob:{name:'LOB',icon:'⌃',time:1.08,arc:1.32,bounce:.58,curve:0,error:.58,stamina:5,color:'#9d8cff'}
};
const OPPONENTS=[
  {name:'Rookie Rowan',tag:'Learns the centre first',skill:.42,speed:350,reach:122,color:'#72e1b2',style:'steady'},
  {name:'Mika Slice',tag:'Changes pace and keeps it low',skill:.63,speed:405,reach:128,color:'#61b7ff',style:'slice'},
  {name:'Nova Vale',tag:'Attacks space before it opens',skill:.82,speed:455,reach:134,color:'#ff737c',style:'attack'}
];
const defaults={audio:true,reduced:matchMedia('(prefers-reduced-motion:reduce)').matches,name:'MATT'};
let saved={settings:{...defaults},stats:{matches:0,wins:0,bestRally:0,sweets:0,aces:0,championships:0,readPoints:0}};
try{const x=JSON.parse(localStorage.getItem('mbm_apexrally_v1')||'null');if(x){saved.settings={...defaults,...x.settings};saved.stats={...saved.stats,...x.stats}}}catch(_){ }
function persist(){try{localStorage.setItem('mbm_apexrally_v1',JSON.stringify(saved))}catch(_){}}

let audioCtx=null;
function wakeAudio(){if(!saved.settings.audio)return;if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}
function tone(freq,dur=.08,type='sine',vol=.045,delay=0){if(!saved.settings.audio)return;wakeAudio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}
function sfx(kind){if(kind==='hit'){tone(210,.05,'triangle',.06);tone(430,.06,'sine',.025,.02)}else if(kind==='sweet'){tone(310,.05,'triangle',.065);tone(620,.12,'sine',.04,.03)}else if(kind==='bounce'){tone(120,.035,'sine',.025)}else if(kind==='net'){tone(90,.12,'square',.035)}else if(kind==='point'){tone(440,.08,'triangle',.04);tone(660,.11,'triangle',.035,.07)}else if(kind==='lose'){tone(220,.12,'sawtooth',.03);tone(150,.16,'sine',.03,.1)}else if(kind==='focus'){tone(520,.08,'sine',.025);tone(760,.16,'sine',.02,.05)}}

const G={
  mode:'title',matchType:'quick',oppIndex:0,champIndex:0,scoreP:0,scoreA:0,totalPoints:0,server:'player',faults:0,
  pointLocked:false,pointHits:0,rally:0,lastReason:'',aim:{x:0,y:-470},shot:'topspin',messageTimer:0,
  player:{x:0,y:505,stamina:100,focus:0,swing:0,swingPower:.4,readChecked:false},
  ai:{x:0,y:-505,cool:0,serveTimer:0,swing:0},
  ball:{x:0,y:495,z:48,vx:0,vy:0,vz:0,live:false,attached:true,lastHitter:null,bounces:0,isServe:true,bounce:.58,curve:0,spin:0,trail:[],pred:null,readChecked:false,netHit:false},
  keys:new Set(),joyX:0,joyY:0,hitHeld:false,chargeStart:0,focusHeld:false,particles:[],shake:0,flash:0,
  selectedOpp:0,lastTime:0,acc:0,width:0,height:0,dpr:1,view:null
};

function resize(){
  const r=canvas.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  G.width=Math.max(1,r.width);G.height=Math.max(1,r.height);G.dpr=dpr;
  canvas.width=Math.round(G.width*dpr);canvas.height=Math.round(G.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const portraitMobile=(touchMode||G.width<=760)&&G.height>G.width;
  const top=Math.max(G.height<520?72:94,G.height*.13),reserve=portraitMobile?190:70,bottom=Math.min(G.height-reserve,G.height*(portraitMobile?.79:.91)),h=Math.max(250,bottom-top),w=Math.min(G.width*.94,h*.72);
  G.view={cx:G.width/2,top,bottom:top+h,h,w,farW:w*.58,nearW:w};
