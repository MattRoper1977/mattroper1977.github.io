      <circle cx="-4" cy="-4" r="5.5" fill="#1E293B"/>
      <circle cx="-2.5" cy="-5.5" r="2" fill="#FFFFFF"/>
      <circle cx="16" cy="-4" r="5.5" fill="#1E293B"/>
      <circle cx="17.5" cy="-5.5" r="2" fill="#FFFFFF"/>
      <polygon points="5,5 13,5 9,10" fill="#7C2D12"/>
