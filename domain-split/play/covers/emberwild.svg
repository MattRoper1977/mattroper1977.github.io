    <g transform="translate(28,-22)">
      <polygon points="-24,-12 -36,-56 -4,-26" fill="#FB923C" stroke="#FFF7ED" stroke-width="3"/>
      <polygon points="22,-12 36,-54 4,-26" fill="#FB923C" stroke="#FFF7ED" stroke-width="3"/>
      <polygon points="-20,-18 -28,-44 -10,-26" fill="#FDE047"/>
      <polygon points="18,-18 26,-42 8,-26" fill="#FDE047"/>
