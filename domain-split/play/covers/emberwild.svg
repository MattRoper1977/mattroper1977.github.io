<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ew-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="ew-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <!-- Sunlit alpine Vale sky + distant glowing peaks -->
  <rect width="640" height="185" fill="url(#ew-sky)"/>
  <circle cx="538" cy="64" r="34" fill="#FEF08A" stroke="#FFFFFF" stroke-width="6"/>
  <polygon points="0,165 130,68 275,165" fill="#7DD3FC"/>
  <polygon points="210,165 375,54 525,165" fill="#60A5FA"/>
  <polygon points="445,165 580,82 640,130 640,165" fill="#7DD3FC"/>
  <!-- Rolling sunlit Vale hills -->
  <path d="M0,152 Q185,112 365,162 T640,142 V360 H0 Z" fill="url(#ew-hill)"/>
  <!-- Winding golden hidden valley path & sparkling stream -->
  <path d="M350,156 Q315,212 396,246 T316,360 L410,360 Q482,272 414,228 T384,156 Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="3"/>
  <path d="M465,152 Q522,218 476,282 T556,360 L612,360 Q542,286 580,224 T510,150 Z" fill="#38BDF8" fill-opacity="0.82"/>
  <!-- Stylized leafy Vale trees & stone archway on path -->
  <g>
    <rect x="442" y="138" width="16" height="52" rx="4" fill="#94A3B8"/>
    <rect x="498" y="138" width="16" height="52" rx="4" fill="#94A3B8"/>
