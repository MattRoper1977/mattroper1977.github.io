  <!-- Wild shimmering teal forest wisp creature ahead on trail -->
  <g transform="translate(422,196)">
    <circle r="44" fill="#67E8F9" fill-opacity="0.34"/>
    <ellipse cx="-18" cy="-8" rx="20" ry="10" transform="rotate(-26 -18 -8)" fill="#A5F3FC" stroke="#FFFFFF" stroke-width="2.5"/>
    <ellipse cx="18" cy="-8" rx="20" ry="10" transform="rotate(26 18 -8)" fill="#A5F3FC" stroke="#FFFFFF" stroke-width="2.5"/>
