  </g>
  <g>
    <polygon points="74,98 40,174 108,174" fill="#15803D"/>
    <polygon points="122,114 96,178 148,178" fill="#16A34A"/>
    <polygon points="586,96 554,172 618,172" fill="#15803D"/>
  </g>
  <!-- Mossy foreground overlook rock -->
  <path d="M34,360 L68,266 Q180,248 296,274 L334,360 Z" fill="#64748B" stroke="#CBD5E1" stroke-width="3"/>
  <path d="M68,266 Q180,248 296,274 L276,292 Q180,272 78,288 Z" fill="#4ADE80"/>
