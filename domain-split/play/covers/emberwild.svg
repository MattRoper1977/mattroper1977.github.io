    <path d="M-64,-12 C-86,-22 -84,-48 -58,-54 C-66,-36 -58,-22 -46,-16 Z" fill="#FEF08A"/>
    <!-- Body & cream chest -->
    <ellipse cx="-2" cy="10" rx="46" ry="30" fill="#FB923C" stroke="#FFF7ED" stroke-width="3"/>
    <ellipse cx="22" cy="16" rx="22" ry="18" fill="#FEF3C7"/>
    <rect x="-32" y="24" width="14" height="24" rx="6" fill="#EA580C"/>
    <rect x="14" y="24" width="14" height="24" rx="6" fill="#EA580C"/>
