<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="tl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <!-- Cheerful Sunny Neighbourhood Town Sky -->
  <rect width="640" height="176" fill="url(#tl-sky)"/>
  <circle cx="566" cy="54" r="30" fill="#FDE047" stroke="#FEF9C3" stroke-width="5"/>
  <g fill="#FFFFFF" fill-opacity="0.9">
    <ellipse cx="122" cy="56" rx="48" ry="18"/><ellipse cx="154" cy="48" rx="34" ry="16"/>
    <ellipse cx="424" cy="64" rx="44" ry="16"/>
  </g>
  <!-- Lush Sunny Town Park Grass & Curving Street -->
  <rect x="0" y="162" width="640" height="198" fill="#4ADE80"/>
  <!-- Town Asphalt Street + Crosswalk Stripes -->
  <rect x="0" y="252" width="640" height="86" fill="#64748B"/>
  <line x1="0" y1="252" x2="640" y2="252" stroke="#CBD5E1" stroke-width="7"/>
  <line x1="0" y1="338" x2="640" y2="338" stroke="#CBD5E1" stroke-width="7"/>
  <line x1="0" y1="295" x2="640" y2="295" stroke="#FEF08A" stroke-width="5" stroke-dasharray="24 20"/>
  <!-- Crisp White Crosswalk -->
  <g fill="#F8FAFC">
    <rect x="278" y="260" width="38" height="10" rx="3"/>
    <rect x="278" y="278" width="38" height="10" rx="3"/>
    <rect x="278" y="296" width="38" height="10" rx="3"/>
    <rect x="278" y="314" width="38" height="10" rx="3"/>
  </g>
  <!-- Cozy Pastel Two-Story Family Home (Left Hero Building!) -->
  <g transform="translate(172,188)">
    <!-- Chimney -->
    <rect x="44" y="-114" width="22" height="44" rx="3" fill="#B45309"/>
    <!-- Cream walls -->
    <rect x="-86" y="-58" width="172" height="114" rx="6" fill="#FFFBEB" stroke="#92400E" stroke-width="4"/>
    <!-- Warm terracotta pitched roof -->
    <polygon points="-102,-54 0,-118 102,-54" fill="#F97316" stroke="#FFEDD5" stroke-width="4" stroke-linejoin="round"/>
    <!-- Cozy door & warm sunlit windows -->
    <rect x="-18" y="2" width="36" height="54" rx="5" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="3"/>
    <circle cx="10" cy="30" r="3.5" fill="#FDE047"/>
    <rect x="-68" y="-36" width="36" height="32" rx="5" fill="#FEF08A" stroke="#92400E" stroke-width="3.5"/>
    <rect x="32" y="-36" width="36" height="32" rx="5" fill="#FEF08A" stroke="#92400E" stroke-width="3.5"/>
    <rect x="-68" y="10" width="36" height="28" rx="5" fill="#BAE6FD" stroke="#92400E" stroke-width="3.5"/>
    <rect x="32" y="10" width="36" height="28" rx="5" fill="#BAE6FD" stroke="#92400E" stroke-width="3.5"/>
  </g>
  <!-- Friendly Neighborhood Bakery / Shop Building (Right Background) -->
  <g transform="translate(476,196)">
    <rect x="-78" y="-52" width="156" height="98" rx="8" fill="#FCE7F3" stroke="#9D174D" stroke-width="4"/>
    <rect x="-86" y="-66" width="172" height="24" rx="6" fill="#EC4899" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="-58" y="-26" width="52" height="42" rx="5" fill="#BAE6FD" stroke="#9D174D" stroke-width="3"/>
    <rect x="14" y="-12" width="40" height="58" rx="5" fill="#F59E0B" stroke="#FEF9C3" stroke-width="3"/>
  </g>
  <!-- Lush Sunny Town Trees -->
  <g>
    <rect x="42" y="198" width="14" height="48" fill="#78350F"/><circle cx="49" cy="182" r="30" fill="#16A34A"/>
    <rect x="334" y="198" width="14" height="46" fill="#78350F"/><circle cx="341" cy="182" r="28" fill="#22C55E"/>
    <rect x="582" y="196" width="14" height="48" fill="#78350F"/><circle cx="589" cy="180" r="30" fill="#16A34A"/>
  </g>
  <!-- Cute Bright Coral Hatchback Car Cruising Along Street (Left) -->
  <g transform="translate(154,282)">
    <path d="M-66,14 L-58,-8 L-28,-28 L28,-28 L52,-8 L68,2 L68,18 H-66 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-24,-22 22,-22 40,-6 -42,-6" fill="#BAE6FD"/>
    <circle cx="-38" cy="18" r="15" fill="#1E293B" stroke="#E2E8F0" stroke-width="4"/>
    <circle cx="38" cy="18" r="15" fill="#1E293B" stroke="#E2E8F0" stroke-width="4"/>
  </g>
  <!-- Friendly Cyan Service / Delivery Van (Right) -->
  <g transform="translate(468,284)">
    <path d="M-72,16 V-32 H26 L68,-8 V16 Z" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="22,-24 54,-8 22,-8" fill="#E0F2FE"/>
    <rect x="-56" y="-16" width="60" height="12" rx="4" fill="#FDE047"/>
    <circle cx="-40" cy="18" r="15" fill="#1E293B" stroke="#E2E8F0" stroke-width="4"/>
    <circle cx="38" cy="18" r="15" fill="#1E293B" stroke="#E2E8F0" stroke-width="4"/>
  </g>
</svg>
