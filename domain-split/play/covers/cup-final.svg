<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E4A66"/>
      <stop offset="55%" stop-color="#286E68"/>
      <stop offset="100%" stop-color="#1D5A47"/>
    </linearGradient>
    <radialGradient id="cf-rays" cx="0.5" cy="0.46" r="0.52">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.78"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1E4A66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cf-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="52%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#cf-bg)"/>
  <rect width="640" height="360" fill="url(#cf-rays)"/>
  <!-- Radiant Stadium Vault Archway opening around Championship Cup -->
  <path d="M144,344 V162 A176,138 0 0 1 496,162 V344" fill="#0F2E3E" fill-opacity="0.35" stroke="#FDE047" stroke-width="8"/>
  <path d="M174,344 V172 A146,112 0 0 1 466,172 V344" fill="none" stroke="#6EE7B7" stroke-width="4" stroke-dasharray="16 12"/>
  <!-- Pedestal base -->
  <polygon points="218,286 422,286 456,344 184,344" fill="#334155" stroke="#FDE047" stroke-width="4"/>
  <!-- Hero Giant Gleaming Golden Stadium Cup Trophy inside Vault -->
  <g transform="translate(320,164)">
    <path d="M-56,-44 C-102,-44 -98,18 -46,20" fill="none" stroke="#FBBF24" stroke-width="14" stroke-linecap="round"/>
    <path d="M56,-44 C102,-44 98,18 46,20" fill="none" stroke="#FBBF24" stroke-width="14" stroke-linecap="round"/>
    <path d="M-60,-62 H60 L44,24 C36,52 -36,52 -44,24 Z" fill="url(#cf-gold)" stroke="#FEF9C3" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M-36,-48 L-26,18" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-opacity="0.68"/>
    <rect x="-15" y="44" width="30" height="40" fill="#F59E0B"/>
    <rect x="-46" y="80" width="92" height="24" rx="8" fill="#B45309" stroke="#FEF08A" stroke-width="4"/>
    <!-- Football silhouette emblem embossed on Cup -->
    <circle cx="0" cy="-14" r="22" fill="#FEF9C3" stroke="#B45309" stroke-width="3"/>
    <polygon points="0,-24 9,-17 6,-6 -6,-6 -9,-17" fill="#B45309"/>
  </g>
  <!-- Unlocking Beams from the THREE Stadium Code Locks (Blue, Red, White!) -->
  <g stroke="#FEF08A" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round">
    <line x1="138" y1="226" x2="256" y2="176"/>
    <line x1="502" y1="226" x2="384" y2="176"/>
    <line x1="320" y1="54" x2="320" y2="102"/>
  </g>
  <!-- Lock 1: Sky Blue Unlocked Padlock (Left) -->
  <g transform="translate(116,232)">
    <path d="M-18,-22 V-40 A18,18 0 0 1 18,-40 V-30" fill="none" stroke="#E0F2FE" stroke-width="8" stroke-linecap="round"/>
    <rect x="-32" y="-22" width="64" height="54" rx="12" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#FEF08A"/>
    <rect x="-4" y="4" width="8" height="14" rx="3" fill="#FEF08A"/>
  </g>
  <!-- Lock 2: Crimson Red Unlocked Padlock (Right) -->
  <g transform="translate(524,232)">
    <path d="M-18,-22 V-40 A18,18 0 0 1 18,-40 V-30" fill="none" stroke="#FFE4E6" stroke-width="8" stroke-linecap="round"/>
    <rect x="-32" y="-22" width="64" height="54" rx="12" fill="#EF4444" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#FEF08A"/>
    <rect x="-4" y="4" width="8" height="14" rx="3" fill="#FEF08A"/>
  </g>
  <!-- Lock 3: Crisp White-Gold Unlocked Padlock (Top Center) -->
  <g transform="translate(320,56)">
    <path d="M-15,-14 V-28 A15,15 0 0 1 15,-28 V-20" fill="none" stroke="#FEF08A" stroke-width="7" stroke-linecap="round"/>
    <rect x="-26" y="-16" width="52" height="44" rx="10" fill="#F8FAFC" stroke="#F59E0B" stroke-width="4"/>
    <circle cx="0" cy="2" r="7" fill="#F59E0B"/>
    <rect x="-3.5" y="5" width="7" height="11" rx="2.5" fill="#F59E0B"/>
  </g>
</svg>
