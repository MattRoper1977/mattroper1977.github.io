<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ob-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D457C"/>
      <stop offset="55%" stop-color="#4A5496"/>
      <stop offset="100%" stop-color="#2E4B80"/>
    </linearGradient>
    <radialGradient id="ob-glow" cx="0.54" cy="0.5" r="0.48">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#2D457C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ob-bg)"/>
  <rect width="640" height="360" fill="url(#ob-glow)"/>
  <!-- Ornate brass clockwork gears in background -->
  <g fill="none" stroke="#FBBF24" stroke-opacity="0.42">
    <circle cx="144" cy="112" r="76" stroke-width="14" stroke-dasharray="18 14"/>
    <circle cx="144" cy="112" r="56" stroke-width="6"/>
    <circle cx="516" cy="86" r="64" stroke-width="12" stroke-dasharray="16 12"/>
    <circle cx="516" cy="86" r="46" stroke-width="5"/>
  </g>
  <!-- Chronos-Grid tactical circular battle floor -->
  <g transform="translate(320,248)">
    <ellipse rx="268" ry="86" fill="#233B6B" stroke="#67E8F9" stroke-width="5"/>
    <ellipse rx="192" ry="60" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="12 10"/>
    <ellipse rx="112" ry="34" fill="#38BDF8" fill-opacity="0.2" stroke="#FDE047" stroke-width="3"/>
  </g>
  <!-- Towering Clockwork Automaton Foe on right -->
  <g transform="translate(454,174)">
    <ellipse cx="0" cy="82" rx="64" ry="18" fill="#1E293B" fill-opacity="0.45"/>
    <!-- Back brass halo gear -->
    <circle cx="0" cy="-16" r="58" fill="none" stroke="#F59E0B" stroke-width="10" stroke-dasharray="14 10"/>
    <!-- Heavy bronze armor torso & pauldrons -->
    <polygon points="-46,-36 46,-36 34,48 -34,48" fill="#B45309" stroke="#FEF08A" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="-54" cy="-22" r="22" fill="#D97706" stroke="#FEF3C7" stroke-width="3.5"/>
    <circle cx="54" cy="-22" r="22" fill="#D97706" stroke="#FEF3C7" stroke-width="3.5"/>
    <!-- Head & glowing crimson visor -->
    <polygon points="-24,-74 24,-74 30,-38 -30,-38" fill="#78350F" stroke="#FDE047" stroke-width="3.5"/>
    <rect x="-20" y="-60" width="40" height="12" rx="5" fill="#FB7185"/>
    <!-- Glowing clockwork chest core -->
    <circle cx="0" cy="4" r="16" fill="#F43F5E" stroke="#FEF9C3" stroke-width="3.5"/>
    <rect x="-26" y="48" width="18" height="34" rx="5" fill="#78350F"/>
    <rect x="8" y="48" width="18" height="34" rx="5" fill="#78350F"/>
  </g>
  <!-- Curved cyan tactical FLANKING path arrow wrapping behind foe -->
  <path d="M186,262 C256,314 396,306 436,246" fill="none" stroke="#67E8F9" stroke-width="11" stroke-dasharray="14 10" stroke-linecap="round"/>
  <polygon points="444,234 420,248 446,262" fill="#67E8F9"/>
  <!-- Blazing golden-cyan flank slash arc -->
  <path d="M276,120 Q368,146 392,232" fill="none" stroke="#38BDF8" stroke-width="20" stroke-linecap="round" stroke-opacity="0.45"/>
  <path d="M276,120 Q368,146 392,232" fill="none" stroke="#FEF9C3" stroke-width="7" stroke-linecap="round"/>
  <!-- Party Hero 1 (Foreground cyan blade-striker lunging) -->
  <g transform="translate(234,202)">
    <ellipse cx="0" cy="54" rx="34" ry="10" fill="#0F172A" fill-opacity="0.38"/>
    <!-- Flowing cape -->
    <path d="M-12,-22 L-64,12 L-38,34 L-4,8 Z" fill="#38BDF8" stroke="#E0F2FE" stroke-width="3"/>
    <!-- Body -->
    <rect x="-16" y="-22" width="32" height="50" rx="10" fill="#1E3A8A" stroke="#BAE6FD" stroke-width="3"/>
    <circle cx="0" cy="-42" r="18" fill="#FDE68A" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Radiant energy blade -->
    <polygon points="18,-10 116,-58 106,-38 22,6" fill="#67E8F9" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Party Hero 2 (Support violet chronomancer upper-left) -->
  <g transform="translate(132,164)">
    <circle r="34" fill="#C084FC" fill-opacity="0.32"/>
    <polygon points="0,-24 22,26 -22,26" fill="#9333EA" stroke="#F3E8FF" stroke-width="3.5"/>
    <circle cx="0" cy="-38" r="14" fill="#FDBA74" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="32" cy="-24" r="12" fill="#FDE047" stroke="#FFFFFF" stroke-width="3"/>
  </g>
</svg>
