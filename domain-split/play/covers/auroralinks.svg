<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="al-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3B6E"/>
      <stop offset="56%" stop-color="#295B82"/>
      <stop offset="100%" stop-color="#357A8C"/>
    </linearGradient>
    <linearGradient id="al-aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="al-fairway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Luminous Arctic Northern Lights Sky -->
  <rect width="640" height="360" fill="url(#al-sky)"/>
  <!-- Bright Crisp Arctic Stars -->
  <g fill="#FEF9C3">
    <circle cx="72" cy="36" r="3"/><circle cx="192" cy="24" r="3.5"/><circle cx="348" cy="32" r="3"/>
    <circle cx="486" cy="26" r="3.5"/><circle cx="578" cy="48" r="3"/><circle cx="122" cy="84" r="2.5"/>
  </g>
  <!-- Sweeping Vibrant NORTHERN LIGHTS Aurora Ribbons Across Sky! -->
  <path d="M-20,126 C110,22 250,148 390,54 C490,-10 570,96 660,36 L660,114 C570,174 490,74 390,136 C250,222 110,104 -20,196 Z" fill="url(#al-aurora1)" fill-opacity="0.62"/>
  <path d="M-20,126 C110,22 250,148 390,54 C490,-10 570,96 660,36" fill="none" stroke="#A7F3D0" stroke-width="9" stroke-opacity="0.9"/>
  <path d="M40,164 C190,82 320,182 480,96 C550,62 600,110 660,88" fill="none" stroke="#67E8F9" stroke-width="11" stroke-opacity="0.72" stroke-linecap="round"/>
  <!-- Snow-Capped Arctic Mountain Peaks -->
  <polygon points="0,214 134,116 258,214" fill="#3B5B8C"/>
  <polygon points="134,116 102,154 166,154" fill="#F0F9FF"/>
  <polygon points="212,214 388,104 548,214" fill="#324F7E"/>
  <polygon points="388,104 344,148 432,148" fill="#F0F9FF"/>
  <polygon points="462,214 584,128 640,174 640,214" fill="#3B5B8C"/>
  <!-- Rolling Emerald-Teal Links Fairway & Illuminated Putting Green -->
  <path d="M0,214 Q190,186 380,214 T640,202 V360 H0 Z" fill="url(#al-fairway)"/>
  <ellipse cx="484" cy="242" rx="108" ry="34" fill="#34D399" stroke="#A7F3D0" stroke-width="4"/>
  <!-- Arctic Pines -->
  <g fill="#0F4D3A">
    <polygon points="68,162 42,220 94,220"/><polygon points="108,176 86,222 130,222"/>
    <polygon points="586,162 558,220 614,220"/>
  </g>
  <!-- Illuminated Golden Flagstick Pin on Green (Right!) -->
  <g transform="translate(494,238)">
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#0F172A"/>
    <line x1="0" y1="0" x2="0" y2="-92" stroke="#FEF9C3" stroke-width="5.5" stroke-linecap="round"/>
    <polygon points="0,-90 54,-72 0,-54" fill="#FDE047" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Shimmering Mint-Gold Golf Shot Flight Arc under the Aurora! -->
  <path d="M156,284 C208,128 386,104 490,234" fill="none" stroke="#FEF08A" stroke-width="14" stroke-linecap="round" stroke-opacity="0.45"/>
  <path d="M156,284 C208,128 386,104 490,234" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Hero Crisp White Golf Ball Perched on Tee (Bottom-Left) -->
  <g transform="translate(154,284)">
    <polygon points="-6,28 6,28 3,52 -3,52" fill="#FEF08A"/>
    <circle r="38" fill="#67E8F9" fill-opacity="0.34"/>
    <circle r="28" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="3.5"/>
    <g fill="#CBD5E1">
      <circle cx="-9" cy="-8" r="3.5"/><circle cx="6" cy="-10" r="3.5"/><circle cx="-4" cy="6" r="3.5"/><circle cx="11" cy="5" r="3.5"/>
    </g>
  </g>
</svg>
