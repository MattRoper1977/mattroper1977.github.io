<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="av-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="52%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="av-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#254278"/>
      <stop offset="100%" stop-color="#3A639E"/>
    </linearGradient>
  </defs>
  <!-- Indoor Velodrome Arena Roof + Warm Steeply Banked Timber Oval Track! -->
  <rect width="640" height="360" fill="url(#av-roof)"/>
  <!-- Stadium roof rafters & floodlights -->
  <g stroke="#93C5FD" stroke-opacity="0.34" stroke-width="4" fill="none">
    <path d="M0,78 Q320,16 640,78"/>
    <path d="M0,118 Q320,56 640,118"/>
  </g>
  <circle cx="144" cy="48" r="14" fill="#FEF9C3"/>
  <circle cx="496" cy="48" r="14" fill="#FEF9C3"/>
  <!-- Sweeping Banked Honey-Timber Velodrome Track -->
  <path d="M0,154 Q260,84 640,116 V360 H0 Z" fill="url(#av-wood)"/>
  <!-- Timber plank grain curves -->
  <g fill="none" stroke="#92400E" stroke-opacity="0.28" stroke-width="2.5">
    <path d="M0,192 Q280,126 640,162"/>
    <path d="M0,264 Q300,206 640,248"/>
    <path d="M0,334 Q310,282 640,324"/>
  </g>
  <!-- Iconic Velodrome Racing Lines (Blue Stayer, Red Sprinter, Black Measurement!) -->
  <path d="M0,174 Q270,108 640,142" fill="none" stroke="#38BDF8" stroke-width="7"/>
  <path d="M0,236 Q290,176 640,214" fill="none" stroke="#EF4444" stroke-width="7"/>
  <path d="M0,296 Q305,244 640,286" fill="none" stroke="#1E293B" stroke-width="7"/>
  <!-- Emerald Track Apron bottom-right -->
  <path d="M240,360 Q430,326 640,342 V360 Z" fill="#16A34A"/>
  <!-- Rival Coral Cyclist Drafting High on Bank Left -->
  <g transform="translate(184,186) rotate(-10) scale(0.76)">
    <circle cx="-42" cy="24" r="30" fill="#1E293B" stroke="#FFE4E6" stroke-width="5"/>
    <circle cx="46" cy="24" r="30" fill="#1E293B" stroke="#FFE4E6" stroke-width="5"/>
    <polyline points="-42,24 -6,-12 46,24 22,-22 -20,-16" fill="none" stroke="#FB7185" stroke-width="8" stroke-linejoin="round"/>
    <path d="M-16,-24 Q14,-48 40,-24" fill="none" stroke="#F43F5E" stroke-width="22" stroke-linecap="round"/>
    <ellipse cx="44" cy="-34" rx="16" ry="11" fill="#F8FAFC"/>
  </g>
  <!-- Blazing Golden Sprint Energy Burst Streaks behind Hero Cyclist -->
  <g stroke="#FEF08A" stroke-width="8" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="168" y1="264" x2="264" y2="254"/>
    <line x1="192" y1="292" x2="286" y2="282"/>
    <line x1="214" y1="234" x2="286" y2="226"/>
  </g>
  <!-- Hero Electric-Cyan Aerodynamic Track Cyclist Sprinting Past! -->
  <g transform="translate(394,242) rotate(-8)">
    <!-- Aero Carbon Disc Wheels -->
    <circle cx="-58" cy="30" r="40" fill="#0F172A" stroke="#67E8F9" stroke-width="6"/>
    <circle cx="-58" cy="30" r="24" fill="#1E3A8A"/>
    <circle cx="-58" cy="30" r="8" fill="#FEF08A"/>
    <circle cx="64" cy="30" r="40" fill="#0F172A" stroke="#67E8F9" stroke-width="6"/>
    <circle cx="64" cy="30" r="24" fill="#1E3A8A"/>
    <circle cx="64" cy="30" r="8" fill="#FEF08A"/>
    <!-- Sleek Track Bike Frame -->
    <polyline points="-58,30 -4,26 42,-26 -24,-22 -58,30" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linejoin="round"/>
    <line x1="42" y1="-26" x2="64" y2="30" stroke="#E0F2FE" stroke-width="9" stroke-linecap="round"/>
    <!-- Drop Sprint Handlebars -->
    <path d="M42,-26 H66 A12,12 0 0 1 66,-2 H54" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <!-- Cyclist Tucked in Low Aero Sprint Position -->
    <path d="M-24,-26 Q14,-58 50,-32" fill="none" stroke="#0EA5E9" stroke-width="26" stroke-linecap="round"/>
    <path d="M-24,-26 Q14,-58 50,-32" fill="none" stroke="#FEF08A" stroke-width="8" stroke-linecap="round"/>
    <path d="M-12,-14 L-26,18 L-4,26" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46,-26 L64,-10" stroke="#FDBA74" stroke-width="11" stroke-linecap="round"/>
    <!-- Teardrop Aero Helmet -->
    <path d="M36,-54 C54,-62 76,-52 78,-36 C64,-34 46,-36 36,-42 Z" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="3.5"/>
  </g>
</svg>
