<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="lh-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#754C7D"/>
      <stop offset="100%" stop-color="#A66586"/>
    </linearGradient>
    <linearGradient id="lh-win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="55%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="lh-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A618B"/>
      <stop offset="100%" stop-color="#5E4068"/>
    </linearGradient>
  </defs>
  <!-- Cosy sunset wall with subtle decorative arches -->
  <rect width="640" height="175" fill="url(#lh-wall)"/>
  <g stroke="#E9D5FF" stroke-opacity="0.22" stroke-width="3" fill="none">
    <path d="M40,175 V96 A44,44 0 0 1 128,96 V175"/>
    <path d="M512,175 V96 A44,44 0 0 1 600,96 V175"/>
  </g>
  <!-- Warm sunset arched greenhouse window -->
  <path d="M236,154 V66 A84,84 0 0 1 404,66 V154 Z" fill="url(#lh-win)" stroke="#FDE68A" stroke-width="7"/>
  <path d="M320,16 V154 M236,96 H404" stroke="#9D6286" stroke-width="6"/>
  <!-- Soft sunset floor + subtle tiles -->
  <polygon points="0,175 640,175 640,360 0,360" fill="url(#lh-floor)"/>
  <!-- Sunbeam cast from window onto floor -->
  <polygon points="236,175 404,175 495,360 145,360" fill="#FEF3C7" fill-opacity="0.18"/>
  <!-- Cream spiral cloud rug -->
  <g transform="translate(290,262)">
    <ellipse rx="116" ry="52" fill="#F8FAFC" stroke="#E9D5FF" stroke-width="4"/>
    <ellipse rx="84" ry="37" fill="none" stroke="#DDD6FE" stroke-width="4"/>
    <ellipse rx="52" ry="23" fill="none" stroke="#C4B5FD" stroke-width="3.5"/>
  </g>
  <!-- Potted Monstera plant on left -->
  <g transform="translate(132,226)">
    <polygon points="-28,12 28,12 20,58 -20,58" fill="#EA580C" stroke="#FED7AA" stroke-width="3"/>
    <rect x="-32" y="2" width="64" height="14" rx="5" fill="#F97316"/>
    <path d="M0,4 C-18,-25 -46,-38 -52,-76 C-18,-78 0,-42 0,4 Z" fill="#22C55E" stroke="#BBF7D0" stroke-width="2.5"/>
    <path d="M0,4 C16,-30 48,-46 56,-84 C20,-82 2,-45 0,4 Z" fill="#16A34A" stroke="#BBF7D0" stroke-width="2.5"/>
    <path d="M0,2 C-22,-42 -12,-96 6,-116 C26,-92 22,-40 0,2 Z" fill="#4ADE80" stroke="#DCFCE7" stroke-width="2.5"/>
  </g>
  <!-- Hero curled ginger cat on the cosy rug -->
  <g transform="translate(332,248)">
    <!-- Curled body -->
    <ellipse cx="0" cy="10" rx="58" ry="38" fill="#FB923C" stroke="#FFEDD5" stroke-width="3"/>
    <!-- Tail curled round -->
    <path d="M46,24 C74,16 72,-14 44,-14" fill="none" stroke="#F97316" stroke-width="16" stroke-linecap="round"/>
    <!-- Stripes -->
    <path d="M-22,-18 L-12,-2 M-2,-24 L4,-6 M18,-18 L14,-2" stroke="#C2410C" stroke-width="5" stroke-linecap="round"/>
    <!-- Cute cat head & pointed ears -->
    <g transform="translate(-34,-12)">
      <polygon points="-24,-14 -16,-44 0,-22" fill="#FB923C" stroke="#FFEDD5" stroke-width="2.5"/>
      <polygon points="24,-14 16,-44 0,-22" fill="#FB923C" stroke="#FFEDD5" stroke-width="2.5"/>
      <polygon points="-18,-18 -14,-34 -5,-22" fill="#FDA4AF"/>
      <polygon points="18,-18 14,-34 5,-22" fill="#FDA4AF"/>
      <circle r="27" fill="#FB923C" stroke="#FFEDD5" stroke-width="2.5"/>
      <ellipse cx="0" cy="7" rx="14" ry="10" fill="#FFEDD5"/>
      <circle cx="-10" cy="-4" r="4" fill="#1E293B"/>
      <circle cx="10" cy="-4" r="4" fill="#1E293B"/>
      <polygon points="-4,3 4,3 0,8" fill="#F43F5E"/>
    </g>
  </g>
  <!-- Warm glowing table lamp on right -->
  <g transform="translate(508,236)">
    <circle cx="0" cy="-42" r="56" fill="#FEF08A" fill-opacity="0.34"/>
    <ellipse cx="0" cy="48" rx="30" ry="11" fill="#F59E0B"/>
    <rect x="-6" y="-12" width="12" height="58" fill="#FBBF24"/>
    <polygon points="-34,-12 34,-12 24,-66 -24,-66" fill="#FEF08A" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Floating glowing botanical crystal & sparkles -->
  <g transform="translate(226,184)">
    <circle r="22" fill="#C084FC" fill-opacity="0.35"/>
    <polygon points="0,-16 12,0 0,16 -12,0" fill="#E9D5FF" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
  <path d="M446,120 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 z" fill="#FEF9C3"/>
  <path d="M188,92 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z" fill="#FEF9C3"/>
</svg>
