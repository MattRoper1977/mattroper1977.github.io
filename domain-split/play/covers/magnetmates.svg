<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="mm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#285085"/>
      <stop offset="56%" stop-color="#3A72A6"/>
      <stop offset="100%" stop-color="#284F80"/>
    </linearGradient>
    <radialGradient id="mm-bounce" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#285085" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Bright Sunlit Workshop Magnet Foundry Bay -->
  <rect width="640" height="360" fill="url(#mm-bg)"/>
  <rect width="640" height="360" fill="url(#mm-bounce)"/>
  <!-- Subtle Foundry Grid -->
  <g stroke="#BAE6FD" stroke-opacity="0.22" stroke-width="2">
    <path d="M0,90 H640 M0,180 H640 M0,270 H640"/>
    <path d="M128,0 V360 M256,0 V360 M384,0 V360 M512,0 V360"/>
  </g>
  <!-- Top Matching Color Scrap Sorting Chutes (Goal!) -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round">
    <!-- Left Cyan Chute -->
    <polygon points="78,0 232,0 210,64 100,64" fill="#0EA5E9"/>
    <polygon points="118,52 192,52 155,22" fill="#BAE6FD" stroke="none"/>
    <!-- Right Golden-Coral Chute -->
    <polygon points="408,0 562,0 540,64 430,64" fill="#F59E0B"/>
    <polygon points="448,52 522,52 485,22" fill="#FEF9C3" stroke="none"/>
  </g>
  <!-- Rebound Dotted Bounce Arc Launching Metallic Star into Right Gold Chute! -->
  <path d="M320,256 Q378,136 482,66" fill="none" stroke="#FEF08A" stroke-width="10" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Dazzling Stretched Elastic Magnetic Energy Band Bowing Between Pods! -->
  <path d="M148,244 Q320,316 492,244" fill="none" stroke="#38BDF8" stroke-width="28" stroke-linecap="round" stroke-opacity="0.45"/>
  <path d="M148,244 Q320,316 492,244" fill="none" stroke="#FDE047" stroke-width="14" stroke-linecap="round"/>
  <path d="M148,244 Q320,316 492,244" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Hero Bouncing Gleaming Metallic Star & Scrap Gear Launching High! -->
  <g transform="translate(362,154) rotate(14)">
    <circle r="54" fill="#FEF08A" fill-opacity="0.34"/>
    <polygon points="0,-42 12,-14 42,-14 18,6 28,36 0,18 -28,36 -18,6 -42,-14 -12,-14" fill="#FACC15" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
    <circle r="12" fill="#FFFFFF"/>
  </g>
  <!-- Secondary Metallic Scrap Gear tumbling on Left -->
  <g transform="translate(216,138)">
    <circle r="24" fill="#CBD5E1" stroke="#38BDF8" stroke-width="8" stroke-dasharray="12 8"/>
    <circle r="10" fill="#1E3A8A"/>
  </g>
  <!-- Player 1 Magnet Pod (Left Sky-Blue Horseshoe Magnet Pod!) -->
  <g transform="translate(132,248)">
    <circle r="50" fill="#38BDF8" fill-opacity="0.28"/>
    <rect x="-40" y="-36" width="80" height="72" rx="22" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="5"/>
    <!-- Expressive Cute Magnet Eyes -->
    <circle cx="-12" cy="-6" r="7" fill="#FFFFFF"/><circle cx="-10" cy="-6" r="3.5" fill="#0F172A"/>
    <circle cx="14" cy="-6" r="7" fill="#FFFFFF"/><circle cx="16" cy="-6" r="3.5" fill="#0F172A"/>
    <!-- Glowing silver magnet pole tips facing right -->
    <rect x="26" y="-22" width="22" height="16" rx="4" fill="#E2E8F0" stroke="#0284C7" stroke-width="3"/>
    <rect x="26" y="6" width="22" height="16" rx="4" fill="#E2E8F0" stroke="#0284C7" stroke-width="3"/>
  </g>
  <!-- Player 2 Magnet Pod (Right Coral-Orange Horseshoe Magnet Pod!) -->
  <g transform="translate(508,248)">
    <circle r="50" fill="#FB923C" fill-opacity="0.28"/>
    <rect x="-40" y="-36" width="80" height="72" rx="22" fill="#F97316" stroke="#FFFFFF" stroke-width="5"/>
    <!-- Expressive Cute Magnet Eyes -->
    <circle cx="-14" cy="-6" r="7" fill="#FFFFFF"/><circle cx="-16" cy="-6" r="3.5" fill="#0F172A"/>
    <circle cx="12" cy="-6" r="7" fill="#FFFFFF"/><circle cx="10" cy="-6" r="3.5" fill="#0F172A"/>
    <!-- Glowing silver magnet pole tips facing left -->
    <rect x="-48" y="-22" width="22" height="16" rx="4" fill="#E2E8F0" stroke="#C2410C" stroke-width="3"/>
    <rect x="-48" y="6" width="22" height="16" rx="4" fill="#E2E8F0" stroke="#C2410C" stroke-width="3"/>
  </g>
</svg>
