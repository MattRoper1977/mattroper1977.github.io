<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="nsg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#244274"/>
      <stop offset="55%" stop-color="#316196"/>
      <stop offset="100%" stop-color="#24497A"/>
    </linearGradient>
    <radialGradient id="nsg-core" cx="0.72" cy="0.48" r="0.45">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#244274" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#nsg-bg)"/>
  <rect width="640" height="360" fill="url(#nsg-core)"/>
  <!-- Isometric 3D hexagonal cyber fortress floor tiles -->
  <g fill="#2B5288" fill-opacity="0.78" stroke="#67E8F9" stroke-opacity="0.48" stroke-width="2.5">
    <polygon points="104,228 164,196 224,228 164,260"/>
    <polygon points="224,228 284,196 344,228 284,260"/>
    <polygon points="164,260 224,228 284,260 224,292"/>
    <polygon points="284,260 344,228 404,260 344,292"/>
    <polygon points="344,228 404,196 464,228 404,260"/>
    <polygon points="404,196 464,164 524,196 464,228"/>
    <polygon points="404,260 464,228 524,260 464,292"/>
  </g>
  <!-- Golden Overdrive Power-Link Beam connecting the two Laser Turret Spires -->
  <line x1="224" y1="202" x2="344" y2="128" stroke="#FBBF24" stroke-width="14" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="224" y1="202" x2="344" y2="128" stroke="#FEF9C3" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- Converging Cyan & Magenta Laser Beams blasting red hex-drones -->
  <g stroke-linecap="round">
    <line x1="224" y1="194" x2="132" y2="112" stroke="#38BDF8" stroke-width="16" stroke-opacity="0.45"/>
    <line x1="224" y1="194" x2="132" y2="112" stroke="#FFFFFF" stroke-width="5.5"/>
    <line x1="344" y1="122" x2="196" y2="76" stroke="#E879F9" stroke-width="14" stroke-opacity="0.48"/>
    <line x1="344" y1="122" x2="196" y2="76" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <!-- Incoming Crimson Hex-Drones swarming top-left -->
  <g stroke="#FFE4E6" stroke-width="3.5" stroke-linejoin="round">
    <polygon points="132,86 156,100 156,126 132,140 108,126 108,100" fill="#F43F5E"/>
    <polygon points="196,54 216,66 216,88 196,100 176,88 176,66" fill="#FB7185"/>
    <polygon points="84,158 106,170 106,194 84,206 62,194 62,170" fill="#F43F5E"/>
  </g>
  <!-- Explosion burst on lead drone -->
  <polygon points="132,82 140,104 162,110 142,120 144,142 128,126 108,136 116,116 102,100 122,104" fill="#FEF08A"/>
  <!-- 3D Turret Spire 1 (Magenta Plasma Spire upper-center) -->
  <g transform="translate(344,174)">
    <polygon points="-28,14 0,-2 28,14 0,30" fill="#3B82F6"/>
    <polygon points="-18,10 -12,-52 12,-52 18,10" fill="#9333EA" stroke="#F3E8FF" stroke-width="3.5"/>
    <circle cx="0" cy="-54" r="15" fill="#F472B6" stroke="#FFFFFF" stroke-width="3.5"/>
  </g>
  <!-- 3D Turret Spire 2 (Hero Cyan Rail Spire foreground-left) -->
  <g transform="translate(224,254)">
    <polygon points="-34,16 0,-4 34,16 0,36" fill="#0284C7"/>
    <polygon points="-22,12 -14,-62 14,-62 22,12" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="4"/>
    <circle cx="0" cy="-64" r="18" fill="#67E8F9" stroke="#FFFFFF" stroke-width="4"/>
  </g>
  <!-- Hero Massive Levitating Radiant Cyan Prism CORE on right -->
  <g transform="translate(476,184)">
    <ellipse cx="0" cy="74" rx="68" ry="22" fill="#38BDF8" fill-opacity="0.35" stroke="#BAE6FD" stroke-width="4"/>
    <ellipse cx="0" cy="4" rx="76" ry="24" transform="rotate(-14)" fill="none" stroke="#FDE047" stroke-width="5"/>
    <polygon points="0,-78 52,0 0,78 -52,0" fill="#38BDF8" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="0,-78 52,0 0,0" fill="#BAE6FD"/>
    <polygon points="0,-42 26,0 0,42 -26,0" fill="#FFFFFF" fill-opacity="0.72"/>
  </g>
</svg>
