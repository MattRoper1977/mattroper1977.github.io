<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="hg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28508C"/>
      <stop offset="58%" stop-color="#3B79B8"/>
      <stop offset="100%" stop-color="#264C82"/>
    </linearGradient>
    <radialGradient id="hg-spot" cx="0.5" cy="0.38" r="0.52">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.56"/>
      <stop offset="100%" stop-color="#28508C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hg-cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#hg-bg)"/>
  <rect width="640" height="360" fill="url(#hg-spot)"/>
  <!-- Converging championship spotlight cones -->
  <polygon points="110,0 320,310 190,310" fill="#E0F2FE" fill-opacity="0.14"/>
  <polygon points="530,0 450,310 320,310" fill="#E0F2FE" fill-opacity="0.14"/>
  <!-- Four distinct House banners hanging across top -->
  <!-- House 1: Aurora (Cyan + Star) -->
  <g transform="translate(110,16)">
    <polygon points="-36,0 36,0 36,104 0,126 -36,104" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="3.5"/>
    <polygon points="0,30 7,48 26,48 11,59 17,77 0,66 -17,77 -11,59 -26,48 -7,48" fill="#FEF08A"/>
  </g>
  <!-- House 2: Ember (Coral-Orange + Flame) -->
  <g transform="translate(216,16)">
    <polygon points="-36,0 36,0 36,92 0,114 -36,92" fill="#F97316" stroke="#FFEDD5" stroke-width="3.5"/>
    <path d="M0,26 C18,46 18,74 0,78 C-18,74 -18,46 0,26 Z" fill="#FEF08A"/>
  </g>
  <!-- House 3: Tide (Mint-Emerald + Wave) -->
  <g transform="translate(424,16)">
    <polygon points="-36,0 36,0 36,92 0,114 -36,92" fill="#10B981" stroke="#D1FAE5" stroke-width="3.5"/>
    <path d="M-22,56 Q-10,36 0,56 T22,56" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- House 4: Forge (Violet-Gold + Diamond) -->
  <g transform="translate(530,16)">
    <polygon points="-36,0 36,0 36,104 0,126 -36,104" fill="#8B5CF6" stroke="#EDE9FE" stroke-width="3.5"/>
    <polygon points="0,28 22,54 0,80 -22,54" fill="#FDE047"/>
  </g>
  <!-- Rising house score bars behind podium -->
  <g fill-opacity="0.72">
    <rect x="86" y="216" width="46" height="106" rx="8" fill="#38BDF8"/>
    <rect x="148" y="246" width="46" height="76" rx="8" fill="#FB923C"/>
    <rect x="446" y="232" width="46" height="90" rx="8" fill="#34D399"/>
    <rect x="508" y="254" width="46" height="68" rx="8" fill="#A78BFA"/>
  </g>
  <!-- Stepped Championship Podium -->
  <g stroke="#E2E8F0" stroke-width="3.5">
    <rect x="168" y="264" width="98" height="62" rx="8" fill="#94A3B8"/>
    <rect x="374" y="276" width="98" height="50" rx="8" fill="#D97706"/>
    <rect x="260" y="236" width="120" height="90" rx="10" fill="#F59E0B" stroke="#FEF9C3" stroke-width="4.5"/>
  </g>
  <!-- Podium medal stars (zero numbers!) -->
  <circle cx="217" cy="295" r="14" fill="#E2E8F0"/>
  <circle cx="423" cy="301" r="13" fill="#FDBA74"/>
  <polygon points="320,262 327,277 344,277 330,287 335,303 320,293 305,303 310,287 296,277 313,277" fill="#FEF9C3"/>
  <!-- Hero Radiant Golden House Cup Trophy -->
  <g transform="translate(320,152)">
    <circle r="74" fill="#FEF08A" fill-opacity="0.26"/>
    <!-- Trophy handles -->
    <path d="M-46,-34 C-82,-34 -80,14 -40,16" fill="none" stroke="#FBBF24" stroke-width="11" stroke-linecap="round"/>
    <path d="M46,-34 C82,-34 80,14 40,16" fill="none" stroke="#FBBF24" stroke-width="11" stroke-linecap="round"/>
    <!-- Cup bowl -->
    <path d="M-50,-48 H50 L36,22 C30,44 -30,44 -36,22 Z" fill="url(#hg-cup)" stroke="#FEF9C3" stroke-width="4" stroke-linejoin="round"/>
    <!-- Highlight stripe -->
    <path d="M-30,-38 L-22,16" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.65"/>
    <!-- Stem & base -->
    <rect x="-12" y="38" width="24" height="28" fill="#F59E0B"/>
    <rect x="-36" y="62" width="72" height="18" rx="6" fill="#B45309" stroke="#FEF08A" stroke-width="3"/>
    <!-- Crown star atop trophy -->
    <polygon points="0,-82 8,-64 28,-64 12,-52 18,-34 0,-45 -18,-34 -12,-52 -28,-64 -8,-64" fill="#FFFFFF"/>
  </g>
  <!-- Festive sparkles -->
  <g fill="#FEF9C3">
    <circle cx="152" cy="158" r="5"/><circle cx="486" cy="154" r="6"/>
    <circle cx="256" cy="94" r="5"/><circle cx="384" cy="90" r="5"/>
  </g>
</svg>
