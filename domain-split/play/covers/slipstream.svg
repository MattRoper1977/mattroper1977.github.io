<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sl-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27407C"/>
      <stop offset="55%" stop-color="#485B9E"/>
      <stop offset="100%" stop-color="#305A8E"/>
    </linearGradient>
    <linearGradient id="sl-draft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sl-sky)"/>
  <!-- Floating Twilight Cyber Highway -->
  <polygon points="244,132 396,132 630,360 10,360" fill="#2A3E6E"/>
  <line x1="244" y1="132" x2="10" y2="360" stroke="#38BDF8" stroke-width="9"/>
  <line x1="396" y1="132" x2="630" y2="360" stroke="#F472B6" stroke-width="9"/>
  <line x1="320" y1="132" x2="320" y2="360" stroke="#E0F2FE" stroke-width="5" stroke-dasharray="22 18" stroke-opacity="0.65"/>
  <!-- Glowing Overhead Cyber Relay Arch Gate -->
  <path d="M138,244 V104 A182,78 0 0 1 502,104 V244" fill="none" stroke="#67E8F9" stroke-width="16" stroke-opacity="0.42" stroke-linecap="round"/>
  <path d="M138,244 V104 A182,78 0 0 1 502,104 V244" fill="none" stroke="#E0F2FE" stroke-width="6" stroke-linecap="round"/>
  <!-- Luminous Mint-Green SLIPSTREAM Draft Ribbon streaming behind Rival -->
  <polygon points="348,186 436,186 382,356 174,356" fill="url(#sl-draft)"/>
  <g stroke="#A7F3D0" stroke-width="4" stroke-dasharray="18 14" stroke-linecap="round">
    <line x1="366" y1="194" x2="232" y2="352"/>
    <line x1="416" y1="194" x2="342" y2="352"/>
  </g>
  <!-- Lead Rival Magenta Cyber Car ahead right -->
  <g transform="translate(394,174)">
    <polygon points="-44,18 -32,-12 32,-12 44,18" fill="#EC4899" stroke="#FCE7F3" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-24,-12 -14,-28 14,-28 24,-12" fill="#1E293B" stroke="#F9A8D4" stroke-width="2.5"/>
    <rect x="-42" y="-16" width="84" height="8" rx="4" fill="#FDE047"/>
    <rect x="-34" y="4" width="18" height="8" rx="3" fill="#FFF1F2"/>
    <rect x="16" y="4" width="18" height="8" rx="3" fill="#FFF1F2"/>
  </g>
  <!-- Sweeping Slingshot Overtake Arrow curving left past rival -->
  <path d="M276,278 C218,224 218,176 266,144" fill="none" stroke="#FDE047" stroke-width="11" stroke-dasharray="14 10" stroke-linecap="round"/>
  <polygon points="278,136 250,136 268,160" fill="#FDE047"/>
  <!-- Hero Electric-Cyan Arcade Racer Slingshotting Past! -->
  <g transform="translate(248,274) rotate(-10)">
    <!-- Roaring boost exhaust flames -->
    <polygon points="-46,36 -66,86 -16,36" fill="#F97316"/>
    <polygon points="16,36 66,86 46,36" fill="#F97316"/>
    <polygon points="-38,36 -50,68 -22,36" fill="#FEF08A"/>
    <polygon points="22,36 50,68 38,36" fill="#FEF08A"/>
    <!-- Rear wheels -->
    <rect x="-86" y="6" width="26" height="36" rx="7" fill="#0F172A"/>
    <rect x="60" y="6" width="26" height="36" rx="7" fill="#0F172A"/>
    <!-- Sleek wedge cyber car body -->
    <polygon points="-82,28 -68,-14 68,-14 82,28" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-44,-14 -26,-42 26,-42 44,-14" fill="#1E293B" stroke="#BAE6FD" stroke-width="3"/>
    <!-- Wide glowing rear wing -->
    <rect x="-80" y="-26" width="160" height="12" rx="5" fill="#67E8F9" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Twin glowing tail lights -->
    <rect x="-66" y="6" width="32" height="12" rx="4" fill="#FEF08A"/>
    <rect x="34" y="6" width="32" height="12" rx="4" fill="#FEF08A"/>
  </g>
</svg>
