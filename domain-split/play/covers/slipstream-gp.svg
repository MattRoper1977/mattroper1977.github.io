<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="gp2-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="68%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="gp2-asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Crisp Sunlit Daylight Grand Prix Circuit -->
  <rect width="640" height="164" fill="url(#gp2-sky)"/>
  <!-- Grandstands & Emerald Infield -->
  <rect x="0" y="128" width="640" height="38" fill="#E2E8F0"/>
  <rect x="0" y="142" width="640" height="14" fill="#3B82F6"/>
  <rect x="0" y="160" width="640" height="200" fill="#22C55E"/>
  <!-- Sweeping GP Asphalt Straight + Yellow/White Curbs -->
  <polygon points="212,160 428,160 640,360 0,360" fill="url(#gp2-asphalt)"/>
  <line x1="212" y1="160" x2="0" y2="360" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="212" y1="160" x2="0" y2="360" stroke="#F59E0B" stroke-width="14" stroke-dasharray="26 22"/>
  <line x1="428" y1="160" x2="640" y2="360" stroke="#FFFFFF" stroke-width="14"/>
  <line x1="428" y1="160" x2="640" y2="360" stroke="#F59E0B" stroke-width="14" stroke-dasharray="26 22"/>
  <!-- Overhead Checkered GP Start/Finish Gantry Arch -->
  <rect x="148" y="64" width="14" height="118" fill="#475569"/>
  <rect x="478" y="64" width="14" height="118" fill="#475569"/>
  <rect x="144" y="54" width="352" height="32" rx="6" fill="#1E293B" stroke="#F8FAFC" stroke-width="3.5"/>
  <!-- Checkered squares on gantry (pure pattern, zero text!) -->
  <g fill="#FFFFFF">
    <rect x="160" y="58" width="22" height="12"/><rect x="204" y="58" width="22" height="12"/>
    <rect x="248" y="58" width="22" height="12"/><rect x="292" y="58" width="22" height="12"/>
    <rect x="336" y="58" width="22" height="12"/><rect x="380" y="58" width="22" height="12"/>
    <rect x="424" y="58" width="22" height="12"/><rect x="468" y="58" width="20" height="12"/>
    <rect x="182" y="70" width="22" height="12"/><rect x="226" y="70" width="22" height="12"/>
    <rect x="270" y="70" width="22" height="12"/><rect x="314" y="70" width="22" height="12"/>
    <rect x="358" y="70" width="22" height="12"/><rect x="402" y="70" width="22" height="12"/>
    <rect x="446" y="70" width="22" height="12"/>
  </g>
  <!-- Rival Open-Wheel Formula Pack Ahead -->
  <g transform="translate(264,186) scale(0.54)">
    <rect x="-74" y="-8" width="26" height="44" rx="8" fill="#0F172A"/><rect x="48" y="-8" width="26" height="44" rx="8" fill="#0F172A"/>
    <polygon points="-44,24 -28,-22 28,-22 44,24" fill="#EF4444" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="-56" y="-28" width="112" height="14" rx="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(392,202) scale(0.62)">
    <rect x="-74" y="-8" width="26" height="44" rx="8" fill="#0F172A"/><rect x="48" y="-8" width="26" height="44" rx="8" fill="#0F172A"/>
    <polygon points="-44,24 -28,-22 28,-22 44,24" fill="#2563EB" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="-56" y="-28" width="112" height="14" rx="4" fill="#38BDF8"/>
  </g>
  <g transform="translate(328,172) scale(0.42)">
    <polygon points="-44,24 -28,-22 28,-22 44,24" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="-56" y="-28" width="112" height="14" rx="4" fill="#FFFFFF"/>
  </g>
  <!-- Crisp Airflow Speed Streaks off Hero Aero Wing -->
  <g stroke="#FEF9C3" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="196" y1="216" x2="146" y2="274"/>
    <line x1="418" y1="216" x2="468" y2="274"/>
  </g>
  <!-- Hero Open-Wheel Golden-Yellow Formula GP Car with Flipped Crimson Aero Wing -->
  <g transform="translate(306,274)">
    <ellipse cx="0" cy="48" rx="116" ry="24" fill="#0F172A" fill-opacity="0.45"/>
    <!-- Exposed fat F1 slick tyres -->
    <rect x="-112" y="-12" width="38" height="62" rx="12" fill="#0F172A" stroke="#475569" stroke-width="3"/>
    <rect x="74" y="-12" width="38" height="62" rx="12" fill="#0F172A" stroke="#475569" stroke-width="3"/>
    <!-- Front wing peeks out sides -->
    <rect x="-92" y="-44" width="184" height="12" rx="5" fill="#F59E0B" stroke="#FEF9C3" stroke-width="2.5"/>
    <!-- Narrow sculpted Formula monocoque nose & sidepods -->
    <polygon points="-76,34 -56,-22 56,-22 76,34" fill="#FACC15" stroke="#FEF9C3" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-24,-54 24,-54 36,28 -36,28" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3.5"/>
    <!-- Driver Helmet & Cockpit Halo -->
    <circle cx="0" cy="-22" r="16" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="3.5"/>
    <!-- Glowing Crimson Active AERO Rear Wing (Open DRS flap!) -->
    <rect x="-86" y="-8" width="172" height="18" rx="6" fill="#EF4444" stroke="#FEF08A" stroke-width="4"/>
    <rect x="-78" y="-22" width="156" height="9" rx="4" fill="#FEF08A"/>
  </g>
</svg>
