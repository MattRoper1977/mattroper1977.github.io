<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="obh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D3B73"/>
      <stop offset="60%" stop-color="#3E4E8C"/>
      <stop offset="100%" stop-color="#35467A"/>
    </linearGradient>
    <linearGradient id="obh-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#obh-bg)"/>
  <!-- Night workshop floor & warm wooden workbench -->
  <rect x="0" y="210" width="640" height="150" fill="#46568E"/>
  <g stroke="#93C5FD" stroke-opacity="0.24" stroke-width="2">
    <line x1="0" y1="255" x2="640" y2="255"/><line x1="0" y1="305" x2="640" y2="305"/>
  </g>
  <!-- Hanging amber studio worklamp + wide golden light cone -->
  <polygon points="320,56 122,360 518,360" fill="url(#obh-cone)"/>
  <line x1="320" y1="0" x2="320" y2="34" stroke="#E2E8F0" stroke-width="5"/>
  <polygon points="274,56 366,56 346,28 294,28" fill="#F59E0B" stroke="#FEF9C3" stroke-width="3.5"/>
  <ellipse cx="320" cy="56" rx="34" ry="8" fill="#FEF9C3"/>
  <!-- Studio workbench on right where secret Glitch Saboteur hides -->
  <g transform="translate(476,184)">
    <!-- Peeking Glitched Saboteur Silhouette behind bench! -->
    <g transform="translate(8,-48)">
      <!-- Offset magenta/cyan glitch echo bars -->
      <rect x="-36" y="-26" width="58" height="14" rx="4" fill="#F43F5E" fill-opacity="0.82"/>
      <rect x="-14" y="-6" width="58" height="14" rx="4" fill="#38BDF8" fill-opacity="0.82"/>
      <rect x="-28" y="-32" width="56" height="58" rx="12" fill="#1E293B" stroke="#F472B6" stroke-width="4"/>
      <circle cx="-10" cy="-6" r="6" fill="#FEF08A"/>
      <circle cx="12" cy="-6" r="6" fill="#FEF08A"/>
    </g>
    <!-- Workbench surface -->
    <rect x="-86" y="-6" width="172" height="22" rx="6" fill="#D97706" stroke="#FEF3C7" stroke-width="3"/>
    <rect x="-74" y="16" width="18" height="72" rx="4" fill="#92400E"/>
    <rect x="56" y="16" width="18" height="72" rx="4" fill="#92400E"/>
    <!-- Friendly innocent mint Ring shape witness on left of bench -->
    <circle cx="-132" cy="-16" r="24" fill="none" stroke="#6EE7B7" stroke-width="11"/>
  </g>
  <!-- Glowing Magenta-and-Mint Glitch Footprints / Clue Trail -->
  <g fill="#F472B6" stroke="#FCE7F3" stroke-width="2">
    <ellipse cx="144" cy="296" rx="14" ry="8" transform="rotate(-18 144 296)"/>
    <ellipse cx="192" cy="276" rx="14" ry="8" transform="rotate(-18 192 276)"/>
    <ellipse cx="246" cy="264" rx="14" ry="8" transform="rotate(-12 246 264)"/>
    <ellipse cx="302" cy="248" rx="14" ry="8" transform="rotate(-12 302 248)"/>
    <ellipse cx="360" cy="236" rx="14" ry="8" transform="rotate(-10 360 236)"/>
  </g>
  <!-- Hero Huge Detective Magnifying Glass inspecting bright clue shard -->
  <g transform="translate(232,208)">
    <!-- Handle -->
    <line x1="-54" y1="54" x2="-118" y2="118" stroke="#F59E0B" stroke-width="22" stroke-linecap="round"/>
    <line x1="-54" y1="54" x2="-118" y2="118" stroke="#FEF3C7" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5"/>
    <!-- Lens glass + bright rim -->
    <circle r="76" fill="#BAE6FD" fill-opacity="0.46" stroke="#38BDF8" stroke-width="14"/>
    <circle r="76" fill="none" stroke="#E0F2FE" stroke-width="3.5"/>
    <!-- Magnified glowing glitch clue diamond inside lens -->
    <polygon points="0,-32 28,0 0,32 -28,0" fill="#F472B6" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="-34" y="-6" width="68" height="10" rx="4" fill="#67E8F9" fill-opacity="0.88"/>
    <!-- Glass specular glare -->
    <path d="M-46,-28 A52,52 0 0 1 -10,-52" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.82"/>
  </g>
</svg>
