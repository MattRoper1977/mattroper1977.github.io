<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="pr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283C74"/>
      <stop offset="55%" stop-color="#354C8F"/>
      <stop offset="100%" stop-color="#243568"/>
    </linearGradient>
    <radialGradient id="pr-burst" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#283C74" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#pr-bg)"/>
  <rect width="640" height="360" fill="url(#pr-burst)"/>
  <!-- Crisp observatory puzzle grid -->
  <g stroke="#93C5FD" stroke-opacity="0.26" stroke-width="1.5">
    <path d="M80,45 H560 M80,105 H560 M80,165 H560 M80,225 H560 M80,285 H560 M80,345 H560"/>
    <path d="M80,45 V345 M140,45 V345 M200,45 V345 M260,45 V345 M320,45 V345 M380,45 V345 M440,45 V345 M500,45 V345 M560,45 V345"/>
  </g>
  <!-- Laser beams (glow + bright white core) -->
  <g stroke-linecap="round">
    <!-- Red beam: emitter to splitter -->
    <line x1="95" y1="195" x2="320" y2="195" stroke="#FB5A6E" stroke-width="18" stroke-opacity="0.38"/>
    <line x1="95" y1="195" x2="320" y2="195" stroke="#FF6B81" stroke-width="8"/>
    <line x1="95" y1="195" x2="320" y2="195" stroke="#FFF1F2" stroke-width="3"/>
    <!-- Cyan beam: top emitter to splitter -->
    <line x1="320" y1="45" x2="320" y2="195" stroke="#38BDF8" stroke-width="18" stroke-opacity="0.38"/>
    <line x1="320" y1="45" x2="320" y2="195" stroke="#38BDF8" stroke-width="8"/>
    <line x1="320" y1="45" x2="320" y2="195" stroke="#E0F2FE" stroke-width="3"/>
    <!-- Split violet beam: splitter to mirror 1 to target 1 -->
    <line x1="320" y1="195" x2="480" y2="195" stroke="#C084FC" stroke-width="18" stroke-opacity="0.4"/>
    <line x1="320" y1="195" x2="480" y2="195" stroke="#D8B4FE" stroke-width="8"/>
    <line x1="320" y1="195" x2="480" y2="195" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="480" y1="195" x2="480" y2="95" stroke="#C084FC" stroke-width="18" stroke-opacity="0.4"/>
    <line x1="480" y1="195" x2="480" y2="95" stroke="#D8B4FE" stroke-width="8"/>
    <line x1="480" y1="195" x2="480" y2="95" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Split gold beam: splitter down to mirror 2 to target 2 -->
    <line x1="320" y1="195" x2="320" y2="295" stroke="#FBBF24" stroke-width="18" stroke-opacity="0.4"/>
    <line x1="320" y1="195" x2="320" y2="295" stroke="#FDE047" stroke-width="8"/>
    <line x1="320" y1="195" x2="320" y2="295" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="320" y1="295" x2="525" y2="295" stroke="#FBBF24" stroke-width="18" stroke-opacity="0.4"/>
    <line x1="320" y1="295" x2="525" y2="295" stroke="#FDE047" stroke-width="8"/>
    <line x1="320" y1="295" x2="525" y2="295" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Obstacles (solid dark indigo blocks) -->
  <rect x="195" y="95" width="48" height="48" rx="8" fill="#4F66A8" stroke="#93C5FD" stroke-width="3"/>
  <rect x="405" y="232" width="44" height="44" rx="8" fill="#4F66A8" stroke="#93C5FD" stroke-width="3"/>
  <!-- Laser emitters -->
  <circle cx="95" cy="195" r="24" fill="#FB5A6E" stroke="#FFE4E6" stroke-width="4"/>
  <circle cx="95" cy="195" r="10" fill="#FFF1F2"/>
  <circle cx="320" cy="45" r="22" fill="#38BDF8" stroke="#E0F2FE" stroke-width="4"/>
  <circle cx="320" cy="45" r="9" fill="#FFFFFF"/>
  <!-- Big hero central glass crystal prism -->
  <g transform="translate(320,195)">
    <polygon points="0,-54 52,0 0,54 -52,0" fill="#E0F2FE" fill-opacity="0.32" stroke="#FFFFFF" stroke-width="4.5"/>
    <polygon points="0,-34 32,0 0,34 -32,0" fill="#BAE6FD" fill-opacity="0.65" stroke="#7DD3FC" stroke-width="3"/>
    <polygon points="0,-54 52,0 0,0" fill="#FFFFFF" fill-opacity="0.35"/>
  </g>
  <!-- Angled mirrors -->
  <g transform="translate(480,195) rotate(-45)">
    <rect x="-34" y="-8" width="68" height="16" rx="6" fill="#E2E8F0" stroke="#38BDF8" stroke-width="3.5"/>
  </g>
  <g transform="translate(320,295) rotate(45)">
    <rect x="-32" y="-8" width="64" height="16" rx="6" fill="#E2E8F0" stroke="#FBBF24" stroke-width="3.5"/>
  </g>
  <!-- Glowing diamond targets (goals) -->
  <g transform="translate(480,95)">
    <circle r="32" fill="#D8B4FE" fill-opacity="0.35" stroke="#E9D5FF" stroke-width="4"/>
    <polygon points="0,-18 18,0 0,18 -18,0" fill="#F3E8FF" stroke="#C084FC" stroke-width="3"/>
  </g>
  <g transform="translate(525,295)">
    <circle r="32" fill="#FDE047" fill-opacity="0.35" stroke="#FEF9C3" stroke-width="4"/>
    <polygon points="0,-18 18,0 0,18 -18,0" fill="#FEF9C3" stroke="#F59E0B" stroke-width="3"/>
  </g>
</svg>
