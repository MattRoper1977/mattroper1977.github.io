<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="wc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C3B78"/>
      <stop offset="55%" stop-color="#B4535E"/>
      <stop offset="100%" stop-color="#F59E56"/>
    </linearGradient>
    <radialGradient id="wc-blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="45%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#wc-sky)"/>
  <!-- Distant skyline silhouette -->
  <path d="M0,210 H80 V165 H130 V210 H480 V155 H545 V210 H640 V360 H0 Z" fill="#3B2E5E" fill-opacity="0.55"/>
  <!-- Isometric demolition site hazard apron -->
  <polygon points="45,255 320,175 595,255 320,348" fill="#F87171"/>
  <g stroke="#FEE2E2" stroke-opacity="0.45" stroke-width="10">
    <line x1="120" y1="235" x2="255" y2="330"/>
    <line x1="200" y1="210" x2="365" y2="335"/>
    <line x1="280" y1="190" x2="455" y2="310"/>
    <line x1="365" y1="195" x2="525" y2="285"/>
  </g>
  <!-- Safe green containment zone (goal!) -->
  <polygon points="135,255 320,202 505,255 320,316" fill="#15803D" stroke="#6EE7B7" stroke-width="7"/>
  <!-- Hero 6-floor concrete tower cracking and tipping cleanly inside the green zone -->
  <g transform="translate(320,178) rotate(8)">
    <!-- Upper tilting concrete floors -->
    <rect x="-74" y="-138" width="148" height="176" rx="5" fill="#CBD5E1" stroke="#475569" stroke-width="4"/>
    <rect x="34" y="-138" width="40" height="176" fill="#94A3B8"/>
    <!-- Structural steel beams & floor lines -->
    <g stroke="#334155" stroke-width="3.5">
      <line x1="-74" y1="-102" x2="74" y2="-102"/>
      <line x1="-74" y1="-66" x2="74" y2="-66"/>
      <line x1="-74" y1="-30" x2="74" y2="-30"/>
      <line x1="-74" y1="6" x2="74" y2="6"/>
    </g>
    <!-- Lit blueprint windows -->
    <g fill="#38BDF8">
      <rect x="-58" y="-128" width="24" height="18" rx="2"/>
      <rect x="-22" y="-128" width="24" height="18" rx="2"/>
      <rect x="-58" y="-92" width="24" height="18" rx="2"/>
      <rect x="-22" y="-92" width="24" height="18" rx="2"/>
      <rect x="-58" y="-56" width="24" height="18" rx="2"/>
      <rect x="-22" y="-56" width="24" height="18" rx="2"/>
      <rect x="-58" y="-20" width="24" height="18" rx="2"/>
      <rect x="-22" y="-20" width="24" height="18" rx="2"/>
    </g>
    <!-- Diagonal structural fracture cracks -->
    <polyline points="-74,10 -24,-18 16,4 74,-26" fill="none" stroke="#F97316" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- Shattered base pillars + explosive blast starburst -->
  <circle cx="290" cy="238" r="82" fill="url(#wc-blast)"/>
  <polygon points="290,170 308,216 358,200 324,238 366,272 310,262 292,302 272,260 220,270 256,236 226,198 274,216" fill="#FDE047" stroke="#F97316" stroke-width="4"/>
  <!-- Placed red charge puck + glowing fuse on right pillar -->
  <g transform="translate(384,228)">
    <circle r="19" fill="#EF4444" stroke="#FEF08A" stroke-width="4"/>
    <circle r="7" fill="#FEF9C3"/>
  </g>
  <!-- Flying concrete rubble cubes -->
  <rect x="192" y="168" width="22" height="18" rx="3" transform="rotate(-24 192 168)" fill="#E2E8F0" stroke="#475569" stroke-width="2.5"/>
  <rect x="434" y="156" width="24" height="20" rx="3" transform="rotate(28 434 156)" fill="#CBD5E1" stroke="#475569" stroke-width="2.5"/>
  <rect x="462" y="210" width="16" height="14" rx="2" transform="rotate(15 462 210)" fill="#FDBA74"/>
</svg>
