<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="mv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E568C"/>
      <stop offset="55%" stop-color="#C97363"/>
      <stop offset="100%" stop-color="#F6B56A"/>
    </linearGradient>
    <linearGradient id="mv-beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <!-- Warm Twilight Sunlit Canyon Sky -->
  <rect width="640" height="360" fill="url(#mv-sky)"/>
  <!-- Distant sunlit mesa ridge -->
  <polygon points="150,210 240,148 395,148 490,210 490,360 150,360" fill="#B45348" fill-opacity="0.65"/>
  <!-- Steep Terracotta Sandstone Canyon Walls Left & Right -->
  <polygon points="0,42 152,102 224,242 204,360 0,360" fill="#9A3412" stroke="#FDBA74" stroke-width="3.5"/>
  <polygon points="0,126 118,162 174,268 150,360 0,360" fill="#C2410C"/>
  <polygon points="640,34 494,96 426,238 446,360 640,360" fill="#9A3412" stroke="#FDBA74" stroke-width="3.5"/>
  <polygon points="640,124 522,166 472,268 496,360 640,360" fill="#C2410C"/>
  <!-- Canyon Floor & Glowing Emerald Circular Landing Zone (Zero Text!) -->
  <polygon points="148,266 492,266 560,360 80,360" fill="#78350F"/>
  <g transform="translate(416,308)">
    <ellipse rx="96" ry="30" fill="#34D399" fill-opacity="0.34" stroke="#6EE7B7" stroke-width="5.5"/>
    <ellipse rx="58" ry="18" fill="#10B981" fill-opacity="0.55" stroke="#ECFDF5" stroke-width="4" stroke-dasharray="14 9"/>
    <ellipse rx="20" ry="7" fill="#FEF08A"/>
  </g>
  <!-- Rising Coral-Orange Rescue Signal Smoke Plumes beside Landing Zone -->
  <g fill="#FB923C" fill-opacity="0.72">
    <circle cx="516" cy="296" r="14"/><circle cx="526" cy="274" r="18"/>
    <circle cx="542" cy="248" r="22"/><circle cx="562" cy="218" r="26"/>
  </g>
  <!-- Golden Searchlight Cone from Rescue Helicopter onto Landing Pad -->
  <polygon points="274,178 362,318 476,304 300,164" fill="url(#mv-beam)"/>
  <!-- Hero White & Orange Rescue Helicopter Banking into Canyon! -->
  <g transform="translate(248,144) rotate(12)">
    <!-- Spinning overhead rotor blur disc -->
    <ellipse cx="4" cy="-52" rx="126" ry="12" fill="#E0F2FE" fill-opacity="0.52" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="-4" y="-52" width="16" height="22" fill="#475569"/>
    <!-- Tail boom & tail rotor -->
    <polygon points="-44,-8 -134,-20 -134,-2 -44,12" fill="#F8FAFC" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-138,-38 -118,-38 -124,-6 -142,-6" fill="#F97316" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="-132" cy="-16" r="16" fill="#E0F2FE" fill-opacity="0.65" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Fuselage cabin (Original orange/white rescue livery — no Red Cross!) -->
    <path d="M-52,-18 C-46,-42 46,-42 84,-10 C96,0 94,22 72,26 H-44 C-56,26 -60,2 -52,-18 Z" fill="#F8FAFC" stroke="#1E293B" stroke-width="4"/>
    <!-- Bright orange rescue chevron stripe -->
    <polygon points="-48,2 78,2 70,18 -46,18" fill="#F97316"/>
    <rect x="-24" y="-22" width="32" height="20" rx="5" fill="#F97316"/>
    <!-- Sleek cyan cockpit windscreen -->
    <path d="M22,-28 C52,-28 74,-14 82,0 H22 Z" fill="#38BDF8" stroke="#E0F2FE" stroke-width="3"/>
    <!-- Landing skids -->
    <line x1="-22" y1="26" x2="-28" y2="46" stroke="#334155" stroke-width="6"/>
    <line x1="42" y1="26" x2="46" y2="46" stroke="#334155" stroke-width="6"/>
    <path d="M-46,46 H68 Q82,46 86,36" fill="none" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
