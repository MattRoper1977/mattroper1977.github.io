<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="nm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B4D9E"/>
      <stop offset="52%" stop-color="#E57A8D"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="nm-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <!-- Golden-Hour Sunset Coastal Sky & Warm Setting Sun -->
  <rect width="640" height="360" fill="url(#nm-sky)"/>
  <circle cx="486" cy="146" r="56" fill="#FEF08A" stroke="#FFEDD5" stroke-width="6"/>
  <!-- Sparkling Meridian Bay Ocean on Right -->
  <rect x="250" y="182" width="390" height="90" fill="url(#nm-sea)"/>
  <g stroke="#FEF08A" stroke-width="5" stroke-linecap="round" stroke-opacity="0.72">
    <line x1="432" y1="196" x2="540" y2="196"/><line x1="452" y1="212" x2="522" y2="212"/><line x1="468" y1="228" x2="508" y2="228"/>
  </g>
  <!-- Coastal City Skyline & Suspension Bridge Silhouette -->
  <g fill="#4C3E82">
    <rect x="18" y="88" width="44" height="114" rx="4"/>
    <rect x="70" y="54" width="54" height="148" rx="4"/>
    <rect x="132" y="96" width="48" height="106" rx="4"/>
    <rect x="188" y="72" width="52" height="130" rx="4"/>
    <rect x="248" y="114" width="44" height="88" rx="4"/>
  </g>
  <!-- Lit Pastel Skyline Windows -->
  <g fill="#FEF08A">
    <rect x="82" y="70" width="12" height="12" rx="2"/><rect x="102" y="70" width="12" height="12" rx="2"/>
    <rect x="82" y="94" width="12" height="12" rx="2"/><rect x="102" y="94" width="12" height="12" rx="2"/>
    <rect x="200" y="90" width="12" height="12" rx="2"/><rect x="218" y="90" width="12" height="12" rx="2"/>
    <rect x="200" y="114" width="12" height="12" rx="2"/><rect x="218" y="114" width="12" height="12" rx="2"/>
  </g>
  <!-- Sleek Suspension Bridge across Bay -->
  <g stroke="#F8FAFC" stroke-width="4" fill="none">
    <line x1="354" y1="126" x2="354" y2="196"/><line x1="564" y1="126" x2="564" y2="196"/>
    <path d="M294,186 Q354,132 459,176 Q564,132 630,186"/>
  </g>
  <!-- Sweeping Sunlit Oceanfront Coastal Boulevard -->
  <polygon points="0,204 420,204 640,360 0,360" fill="#475569"/>
  <polygon points="0,204 420,204 446,220 0,220" fill="#6EE7B7"/>
  <path d="M180,214 L320,360" stroke="#FEF08A" stroke-width="7" stroke-dasharray="22 18" stroke-linecap="round"/>
  <!-- Breezy Coastal Palm Tree on Left Promenade -->
  <g transform="translate(88,218)">
    <path d="M0,10 Q-14,-44 10,-92" fill="none" stroke="#78350F" stroke-width="12" stroke-linecap="round"/>
    <path d="M10,-92 Q-34,-108 -54,-82 M10,-92 Q-18,-126 16,-124 M10,-92 Q52,-112 66,-82 M10,-92 Q44,-84 52,-56" fill="none" stroke="#16A34A" stroke-width="11" stroke-linecap="round"/>
  </g>
  <!-- Hero Relaxed Electric-Turquoise Coastal Cruiser Coupe! -->
  <g transform="translate(336,278)">
    <ellipse cx="0" cy="42" rx="126" ry="22" fill="#1E293B" fill-opacity="0.4"/>
    <!-- Smooth sports coupe body (Side-3/4 view — relaxed cruise!) -->
    <path d="M-118,22 L-108,-6 L-56,-14 L-18,-48 L62,-48 L96,-14 L124,0 L122,26 Z" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Tinted sunset glass cabin -->
    <polygon points="-46,-14 -14,-40 54,-40 82,-14" fill="#1E293B" stroke="#A5F3FC" stroke-width="3"/>
    <!-- Warm accent side stripe & glowing headlight beam -->
    <rect x="-92" y="2" width="186" height="9" rx="4.5" fill="#FEF08A"/>
    <polygon points="122,2 212,-14 212,26 122,16" fill="#FEF08A" fill-opacity="0.34"/>
    <!-- Stylish alloy wheels -->
    <circle cx="-68" cy="24" r="24" fill="#1E293B" stroke="#E2E8F0" stroke-width="4.5"/>
    <circle cx="-68" cy="24" r="10" fill="#67E8F9"/>
    <circle cx="72" cy="24" r="24" fill="#1E293B" stroke="#E2E8F0" stroke-width="4.5"/>
    <circle cx="72" cy="24" r="10" fill="#67E8F9"/>
  </g>
</svg>
