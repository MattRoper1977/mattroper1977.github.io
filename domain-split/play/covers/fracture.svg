<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="fe-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#354B8E"/>
      <stop offset="50%" stop-color="#5B55A8"/>
      <stop offset="100%" stop-color="#2D6291"/>
    </linearGradient>
    <radialGradient id="fe-rift" cx="0.5" cy="0.5" r="0.48">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#354B8E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#fe-sky)"/>
  <rect width="640" height="360" fill="url(#fe-rift)"/>
  <!-- Glowing diagonal dimensional fracture crack -->
  <polyline points="210,16 266,102 238,148 318,204 290,262 364,348" fill="none" stroke="#67E8F9" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.45"/>
  <polyline points="210,16 266,102 238,148 318,204 290,262 364,348" fill="none" stroke="#FEF9C3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left floating fractured emerald realm island -->
  <g transform="translate(136,222)">
    <polygon points="-98,-12 72,-28 96,12 42,78 -62,56" fill="#475569" stroke="#CBD5E1" stroke-width="3"/>
    <polygon points="-98,-12 72,-28 96,12 -74,24" fill="#22C55E" stroke="#BBF7D0" stroke-width="3"/>
    <!-- Floating crystal pylon -->
    <polygon points="-24,-78 -6,-36 -24,-10 -42,-36" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Right floating fractured foundry realm island -->
  <g transform="translate(504,218)">
    <polygon points="-96,-10 92,-30 104,18 46,82 -68,62" fill="#6D28D9" stroke="#DDD6FE" stroke-width="3"/>
    <polygon points="-96,-10 92,-30 104,18 -78,26" fill="#F59E0B" stroke="#FEF3C7" stroke-width="3"/>
    <!-- Floating forge crystal shard -->
    <polygon points="24,-84 44,-40 24,-12 4,-40" fill="#FDE047" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Glowing golden mending beams stitching islands together -->
  <g stroke="#FEF08A" stroke-width="5" stroke-dasharray="10 8" stroke-linecap="round">
    <line x1="216" y1="214" x2="410" y2="208"/>
    <line x1="204" y1="246" x2="424" y2="242"/>
  </g>
  <!-- Hero Radiant Relic Broadsword & Glowing Anvil Core in centre -->
  <g transform="translate(320,176)">
    <circle r="76" fill="#FEF08A" fill-opacity="0.28"/>
    <!-- Glowing hexagonal forge core behind blade -->
    <polygon points="0,-64 56,-32 56,32 0,64 -56,32 -56,-32" fill="#38BDF8" fill-opacity="0.32" stroke="#BAE6FD" stroke-width="4.5"/>
    <!-- Massive Forged Relic Sword upright -->
    <polygon points="0,-124 22,-78 16,38 -16,38 -22,-78" fill="#E0F2FE" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="0,-116 10,-78 6,34 -6,34 -10,-78" fill="#38BDF8"/>
    <!-- Golden crossguard & hilt -->
    <polygon points="-52,32 52,32 38,54 -38,54" fill="#F59E0B" stroke="#FEF9C3" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="-10" y="54" width="20" height="44" rx="5" fill="#78350F" stroke="#FDE047" stroke-width="3"/>
    <polygon points="0,92 18,108 0,124 -18,108" fill="#FDE047" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Center gem in crossguard -->
    <polygon points="0,28 14,43 0,58 -14,43" fill="#67E8F9" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
</svg>
