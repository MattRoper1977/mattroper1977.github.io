<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ns-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283978"/>
      <stop offset="52%" stop-color="#3E4998"/>
      <stop offset="100%" stop-color="#283C7A"/>
    </linearGradient>
    <radialGradient id="ns-neb" cx="0.5" cy="0.5" r="0.52">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.58"/>
      <stop offset="55%" stop-color="#C084FC" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#283978" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ns-bg)"/>
  <rect width="640" height="360" fill="url(#ns-neb)"/>
  <!-- 360-degree twin-stick arena radar rings -->
  <g fill="none" stroke="#93C5FD" stroke-opacity="0.32" stroke-width="2.2">
    <circle cx="320" cy="180" r="88"/>
    <circle cx="320" cy="180" r="158" stroke-dasharray="14 10"/>
    <circle cx="320" cy="180" r="236"/>
  </g>
  <!-- Bright stars -->
  <g fill="#E0F2FE">
    <circle cx="84" cy="64" r="3.5"/><circle cx="176" cy="48" r="2.5"/><circle cx="548" cy="58" r="4"/>
    <circle cx="576" cy="290" r="3.5"/><circle cx="96" cy="306" r="3"/><circle cx="448" cy="44" r="2.5"/>
  </g>
  <!-- Twin plasma blasts shooting across arena -->
  <g stroke-linecap="round">
    <line x1="348" y1="158" x2="474" y2="96" stroke="#38BDF8" stroke-width="18" stroke-opacity="0.45"/>
    <line x1="348" y1="158" x2="474" y2="96" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="364" y1="184" x2="494" y2="124" stroke="#38BDF8" stroke-width="18" stroke-opacity="0.45"/>
    <line x1="364" y1="184" x2="494" y2="124" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="278" y1="152" x2="176" y2="104" stroke="#FDE047" stroke-width="12" stroke-opacity="0.55"/>
    <line x1="278" y1="152" x2="176" y2="104" stroke="#FFFFFF" stroke-width="4.5"/>
  </g>
  <!-- Impact burst on enemy drone -->
  <polygon points="486,62 496,88 524,92 500,108 506,136 482,118 456,128 468,102 448,82 474,86" fill="#FDE047" stroke="#F97316" stroke-width="3"/>
  <!-- Swarm of jagged coral-orange & magenta enemy wave drones -->
  <g stroke="#FFF1F2" stroke-width="3.5" stroke-linejoin="round">
    <polygon points="534,196 476,172 490,200 476,228" fill="#FB7185"/>
    <polygon points="444,284 402,248 408,274 388,292" fill="#F97316"/>
    <polygon points="154,96 206,118 192,94 206,70" fill="#E879F9"/>
    <polygon points="134,242 192,226 178,252 190,278" fill="#F97316"/>
    <polygon points="274,64 300,104 274,94 248,104" fill="#FB7185"/>
  </g>
  <!-- Glowing emerald upgrade core gems -->
  <g transform="translate(226,282)">
    <circle r="24" fill="#34D399" fill-opacity="0.34"/>
    <polygon points="0,-16 14,0 0,16 -14,0" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <g transform="translate(396,62)">
    <circle r="20" fill="#FDE047" fill-opacity="0.34"/>
    <polygon points="0,-14 12,0 0,14 -12,0" fill="#FACC15" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Hero Cyber Delta Twin-Stick Starfighter in centre -->
  <g transform="translate(314,186) rotate(-26)">
    <circle r="66" fill="#38BDF8" fill-opacity="0.26"/>
    <!-- Thruster flames -->
    <polygon points="-46,-18 -84,-12 -46,-4" fill="#F97316"/>
    <polygon points="-46,4 -84,12 -46,18" fill="#F97316"/>
    <polygon points="-46,-14 -70,-10 -46,-6" fill="#FEF08A"/>
    <polygon points="-46,6 -70,10 -46,14" fill="#FEF08A"/>
    <!-- Sleek Delta hull -->
    <polygon points="66,0 -44,-50 -24,0 -44,50" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="44,0 -22,-26 -10,0 -22,26" fill="#E0F2FE"/>
    <polygon points="26,0 -2,-10 -2,10" fill="#0284C7"/>
  </g>
</svg>
