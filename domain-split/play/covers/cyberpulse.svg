<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#35569E"/>
      <stop offset="55%" stop-color="#4F73BD"/>
      <stop offset="100%" stop-color="#3860A3"/>
    </linearGradient>
    <radialGradient id="cp-glow" cx="0.48" cy="0.54" r="0.52">
      <stop offset="0%" stop-color="#A5F3FC" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#F472B6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#27407D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cp-parry" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="50%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#cp-bg)"/>
  <rect width="640" height="360" fill="url(#cp-glow)"/>
  <!-- Neon megacity corridor towers -->
  <g fill="#2E4A8A" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="2">
    <rect x="18" y="42" width="74" height="230" rx="4"/>
    <rect x="82" y="96" width="54" height="176" rx="4"/>
    <rect x="540" y="34" width="84" height="238" rx="4"/>
    <rect x="494" y="88" width="56" height="184" rx="4"/>
  </g>
  <g stroke-linecap="round">
    <line x1="42" y1="68" x2="42" y2="210" stroke="#38BDF8" stroke-width="5"/>
    <line x1="66" y1="102" x2="66" y2="225" stroke="#F472B6" stroke-width="4"/>
    <line x1="566" y1="60" x2="566" y2="218" stroke="#FB7185" stroke-width="5"/>
    <line x1="594" y1="90" x2="594" y2="205" stroke="#38BDF8" stroke-width="4"/>
  </g>
  <!-- Wet reflective cyber highway floor -->
  <polygon points="0,255 640,255 640,360 0,360" fill="#2D5494"/>
  <g stroke="#7DD3FC" stroke-opacity="0.42" stroke-width="2.5">
    <line x1="230" y1="255" x2="55" y2="360"/>
    <line x1="320" y1="255" x2="320" y2="360"/>
    <line x1="410" y1="255" x2="585" y2="360"/>
    <line x1="0" y1="292" x2="640" y2="292"/>
    <line x1="0" y1="330" x2="640" y2="330"/>
  </g>
  <!-- Rain streaks -->
  <g stroke="#BAE6FD" stroke-opacity="0.32" stroke-width="2" stroke-linecap="round">
    <line x1="154" y1="26" x2="136" y2="74"/><line x1="258" y1="18" x2="240" y2="68"/>
    <line x1="376" y1="22" x2="358" y2="70"/><line x1="468" y1="36" x2="452" y2="82"/>
    <line x1="192" y1="120" x2="176" y2="164"/><line x1="442" y1="145" x2="426" y2="188"/>
  </g>
  <!-- Null Warden crimson armored threat upper-right -->
  <g transform="translate(462,126)">
    <circle r="64" fill="#FB7185" fill-opacity="0.28"/>
    <polygon points="0,-54 56,-14 40,42 -40,42 -56,-14" fill="#9F1239" stroke="#FDA4AF" stroke-width="4"/>
    <polygon points="0,-32 34,-4 22,26 -22,26 -34,-4" fill="#F43F5E"/>
    <polygon points="-24,-6 24,-6 14,10 -14,10" fill="#FEF08A"/>
  </g>
  <!-- Incoming red laser bolts + deflected gold ricochet -->
  <g stroke-linecap="round">
    <line x1="418" y1="148" x2="316" y2="194" stroke="#FB7185" stroke-width="16" stroke-opacity="0.45"/>
    <line x1="418" y1="148" x2="316" y2="194" stroke="#FFF1F2" stroke-width="5.5"/>
    <line x1="316" y1="194" x2="388" y2="70" stroke="#FDE047" stroke-width="14" stroke-opacity="0.48"/>
    <line x1="316" y1="194" x2="388" y2="70" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <!-- Huge luminous golden-cyan crescent PARRY arc -->
  <path d="M254,116 A102,102 0 0 1 304,296" fill="none" stroke="#38BDF8" stroke-width="26" stroke-linecap="round" stroke-opacity="0.34"/>
  <path d="M254,116 A102,102 0 0 1 304,296" fill="none" stroke="url(#cp-parry)" stroke-width="13" stroke-linecap="round"/>
  <path d="M262,130 A92,92 0 0 1 298,282" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Impact parry starburst -->
  <polygon points="318,164 328,186 352,192 328,202 318,226 308,202 284,192 308,186" fill="#FFFFFF"/>
  <!-- Hero sleek cyan striker banking -->
  <g transform="translate(206,222) rotate(-18)">
    <polygon points="-92,10 -44,2 -44,24" fill="#FB7185" fill-opacity="0.88"/>
    <polygon points="-80,22 -40,14 -40,30" fill="#FDE047"/>
    <polygon points="74,0 -44,-44 -20,0 -44,44" fill="#38BDF8" stroke="#F0F9FF" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="56,0 -20,-22 -8,0 -20,22" fill="#BAE6FD"/>
    <polygon points="34,0 2,-10 2,10" fill="#FFFFFF"/>
  </g>
</svg>
