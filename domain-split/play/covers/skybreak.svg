<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="sv-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Vivid Sunlit Azure Sky & Sparkling Ocean -->
  <rect width="640" height="236" fill="url(#sv-sky)"/>
  <!-- Hostile Crimson RADAR CEILING Band across Upper Sky! -->
  <rect x="0" y="0" width="640" height="96" fill="#EF4444" fill-opacity="0.28"/>
  <line x1="0" y1="96" x2="640" y2="96" stroke="#EF4444" stroke-width="10" stroke-opacity="0.45"/>
  <line x1="0" y1="96" x2="640" y2="96" stroke="#FFF1F2" stroke-width="4.5" stroke-dasharray="18 12"/>
  <!-- Red radar sweep arcs in danger zone above ceiling -->
  <g fill="none" stroke="#FDA4AF" stroke-width="3.5" stroke-opacity="0.7">
    <path d="M446,96 A74,74 0 0 1 594,96"/>
    <path d="M478,96 A42,42 0 0 1 562,96"/>
  </g>
  <!-- Ocean Horizon + Whitecaps -->
  <rect x="0" y="232" width="640" height="128" fill="url(#sv-sea)"/>
  <g fill="none" stroke="#E0F2FE" stroke-width="4" stroke-linecap="round" stroke-opacity="0.68">
    <path d="M42,272 Q96,264 150,272"/><path d="M214,316 Q284,306 354,316"/>
    <path d="M438,294 Q504,286 570,294"/>
  </g>
  <!-- Armored Grey Offshore Cruiser Ship on Right Horizon (Target!) -->
  <g transform="translate(520,236)">
    <polygon points="-86,0 92,0 74,22 -72,22" fill="#475569" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="-32" y="-26" width="54" height="26" rx="4" fill="#64748B" stroke="#E2E8F0" stroke-width="2.5"/>
    <line x1="0" y1="-26" x2="0" y2="-54" stroke="#E2E8F0" stroke-width="4"/>
    <!-- Glowing Lock-On Target Diamond over Cruiser -->
    <polygon points="0,-46 28,-18 0,10 -28,-18" fill="none" stroke="#FEF08A" stroke-width="4.5"/>
  </g>
  <!-- Rival Crimson Ace Jet High in Sky -->
  <g transform="translate(454,132) rotate(14) scale(0.58)">
    <polygon points="-64,0 54,-36 32,0 54,36" fill="#EF4444" stroke="#FFF1F2" stroke-width="4"/>
  </g>
  <!-- Curving White-Cyan Missile Contrail from Hero Jet toward Cruiser! -->
  <path d="M294,186 Q396,174 504,218" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="16 10" stroke-linecap="round"/>
  <circle cx="436" cy="196" r="10" fill="#FEF08A"/>
  <!-- Hero Swept-Wing White & Cyan Fighter Jet Skimming Low Under Radar! -->
  <g transform="translate(226,186) rotate(-6)">
    <!-- Blazing Twin Golden Afterburners -->
    <polygon points="-78,-14 -162,-4 -78,6" fill="#F97316"/>
    <polygon points="-78,-8 -134,-4 -78,2" fill="#FEF08A"/>
    <!-- Sleek Swept-Wing Fighter Silhouette -->
    <polygon points="104,0 -66,-68 -36,-10 -86,-22 -74,0 -86,22 -36,10 -66,68" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="4" stroke-linejoin="round"/>
    <!-- Cyan squadron wing stripes -->
    <polygon points="56,0 -34,-44 -20,-8 -34,44" fill="#38BDF8"/>
    <!-- Tinted gold fighter canopy -->
    <ellipse cx="32" cy="0" rx="28" ry="10" fill="#0284C7" stroke="#FEF08A" stroke-width="3.5"/>
  </g>
</svg>
