<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ar-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B3FA0"/>
      <stop offset="56%" stop-color="#D95D86"/>
      <stop offset="100%" stop-color="#F59E56"/>
    </linearGradient>
    <linearGradient id="ar-court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- Warm Coral-Sunset Arena Sky + Rich Emerald-Teal Court -->
  <rect width="640" height="184" fill="url(#ar-sky)"/>
  <rect x="0" y="176" width="640" height="184" fill="url(#ar-court)"/>
  <!-- Bold angled emerald court white markings -->
  <polygon points="56,176 584,176 640,360 0,360" fill="#10B981" fill-opacity="0.55"/>
  <path d="M98,176 L18,360 M542,176 L622,360 M320,176 V360 M52,256 H588" stroke="#ECFDF5" stroke-width="5" fill="none"/>
  <!-- Close-up Foreground Tennis Net Mesh stretching low across scene -->
  <rect x="0" y="196" width="640" height="58" fill="#0F172A" fill-opacity="0.22"/>
  <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2">
    <path d="M40,196 V254 M90,196 V254 M140,196 V254 M190,196 V254 M240,196 V254 M290,196 V254 M340,196 V254 M390,196 V254 M440,196 V254 M490,196 V254 M540,196 V254 M590,196 V254"/>
    <path d="M0,215 H640 M0,235 H640"/>
  </g>
  <line x1="0" y1="196" x2="640" y2="196" stroke="#FFFFFF" stroke-width="10"/>
  <!-- Pulsing Concentric Golden BOUNCE RING Target on Emerald Floor (Right!) -->
  <g transform="translate(468,302)">
    <ellipse rx="94" ry="34" fill="#FEF08A" fill-opacity="0.28" stroke="#FDE047" stroke-width="5" stroke-dasharray="14 9"/>
    <ellipse rx="56" ry="20" fill="#FDE047" fill-opacity="0.45" stroke="#FFFFFF" stroke-width="4.5"/>
    <ellipse rx="20" ry="7" fill="#FFFFFF"/>
  </g>
  <!-- Blazing Fiery Amber Smash Streak plunging down into Bounce Ring! -->
  <path d="M238,116 L466,298" fill="none" stroke="#F97316" stroke-width="28" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M238,116 L466,298" fill="none" stroke="#FEF08A" stroke-width="10" stroke-linecap="round"/>
  <!-- Smash Impact Starburst right over the net! -->
  <polygon points="246,48 262,92 310,88 272,118 298,158 252,138 228,176 226,130 180,128 220,102 204,58 238,86" fill="#FEF08A" stroke="#F97316" stroke-width="4"/>
  <!-- Dynamic Tilted Coral-Red Smash Racket Overhead Left -->
  <g transform="translate(154,112) rotate(36)">
    <rect x="-10" y="42" width="20" height="76" rx="7" fill="#1E293B" stroke="#FFE4E6" stroke-width="3"/>
    <ellipse cx="0" cy="-22" rx="48" ry="62" fill="#F43F5E" fill-opacity="0.32" stroke="#FB7185" stroke-width="12"/>
    <ellipse cx="0" cy="-22" rx="48" ry="62" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <g stroke="#FFE4E6" stroke-opacity="0.68" stroke-width="2">
      <line x1="-22" y1="-78" x2="-22" y2="34"/><line x1="0" y1="-84" x2="0" y2="40"/><line x1="22" y1="-78" x2="22" y2="34"/>
      <line x1="-44" y1="-44" x2="44" y2="-44"/><line x1="-48" y1="-22" x2="48" y2="-22"/><line x1="-44" y1="0" x2="44" y2="0"/>
    </g>
  </g>
  <!-- Hero Huge Close-Up Smashing Lime Tennis Ball! -->
  <g transform="translate(278,146)">
    <circle r="44" fill="#BEF264" stroke="#3F6212" stroke-width="4"/>
    <path d="M-28,-28 A42,42 0 0 1 -28,28 M28,-28 A42,42 0 0 0 28,28" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round"/>
  </g>
</svg>
