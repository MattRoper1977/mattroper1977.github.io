<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="lp-desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2ECE0"/>
      <stop offset="100%" stop-color="#DDD4C0"/>
    </linearGradient>
    <linearGradient id="lp-hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  <!-- Crisp Bright Streetwear Print Studio Tabletop -->
  <rect width="640" height="360" fill="url(#lp-desk)"/>
  <!-- Subtle cutting-mat print studio grid -->
  <g stroke="#94A3B8" stroke-opacity="0.28" stroke-width="1.8">
    <path d="M0,72 H640 M0,144 H640 M0,216 H640 M0,288 H640"/>
    <path d="M80,0 V360 M160,0 V360 M240,0 V360 M320,0 V360 M400,0 V360 M480,0 V360 M560,0 V360"/>
  </g>
  <!-- Slate Print Press Platen Frame -->
  <rect x="86" y="28" width="412" height="304" rx="18" fill="#334155" stroke="#94A3B8" stroke-width="5"/>
  <!-- Hero Bold Cobalt-Blue Pullover Hoodie Flat on Press Platen! -->
  <g transform="translate(292,190)">
    <!-- Hood -->
    <path d="M-56,-116 C-56,-156 56,-156 56,-116 Z" fill="#1D4ED8" stroke="#DBEAFE" stroke-width="4"/>
    <!-- Sleeves & Hoodie Torso -->
    <path d="M-104,-112 L-168,-34 L-134,8 L-96,-38 V118 H96 V-38 L134,8 L168,-34 L104,-112 Z" fill="url(#lp-hoodie)" stroke="#EFF6FF" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Drawstrings -->
    <line x1="-18" y1="-108" x2="-22" y2="-62" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round"/>
    <line x1="18" y1="-108" x2="22" y2="-62" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round"/>
    <!-- Front pocket seam -->
    <path d="M-64,62 H64 L78,108 H-78 Z" fill="#1E3A8A" fill-opacity="0.55" stroke="#93C5FD" stroke-width="3"/>
    <!-- Crisp Stencil Mask Sheet Peeling Back to Reveal Bold Streetwear Graphic! -->
    <rect x="-74" y="-58" width="148" height="114" rx="10" fill="#6EE7B7" fill-opacity="0.88" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Fresh Crisp Printed Sunlit Yellow & Coral Graphic Revealed Through Stencil! -->
    <polygon points="0,-42 46,0 0,42 -46,0" fill="#FDE047" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="18" fill="#FB7185"/>
    <!-- Crisp Curled Peel-Back Corner on Upper-Left of Stencil -->
    <polygon points="-74,-58 -26,-58 -74,-10" fill="#A7F3D0" stroke="#059669" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-26,-58 -26,-10 -74,-10" fill="#FEF9C3" stroke="#059669" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <!-- Fresh Glossy Ink Stripe Rolled on Right -->
  <rect x="356" y="136" width="124" height="58" rx="8" fill="#FB7185" fill-opacity="0.65"/>
  <!-- Hero Tactile Coral-and-Wood Ink Brayer Roller Mid-Roll (Right!) -->
  <g transform="translate(514,224) rotate(-26)">
    <!-- Wooden handle -->
    <rect x="-14" y="42" width="28" height="86" rx="12" fill="#D97706" stroke="#FEF3C7" stroke-width="4"/>
    <!-- Metal yoke arms -->
    <path d="M-56,0 V24 Q-56,42 0,42 Q56,42 56,24 V0" fill="none" stroke="#CBD5E1" stroke-width="9" stroke-linecap="round"/>
    <!-- Chunky Ink-Coated Roller Cylinder -->
    <rect x="-72" y="-32" width="144" height="44" rx="14" fill="#F43F5E" stroke="#FFF1F2" stroke-width="4.5"/>
    <rect x="-60" y="-22" width="120" height="10" rx="5" fill="#FDA4AF"/>
  </g>
</svg>
