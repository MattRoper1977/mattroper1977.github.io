<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="td-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27466E"/>
      <stop offset="100%" stop-color="#1E3556"/>
    </linearGradient>
    <linearGradient id="td-board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <!-- Manager's Operations Room Desk -->
  <rect width="640" height="360" fill="url(#td-bg)"/>
  <!-- Hero Manager's Illuminated Tactical Pitch Clipboard (Left-Center!) -->
  <g transform="translate(274,186) rotate(-3)">
    <!-- Clipboard frame & metallic clip -->
    <rect x="-214" y="-142" width="428" height="284" rx="20" fill="#334155" stroke="#CBD5E1" stroke-width="5"/>
    <rect x="-56" y="-158" width="112" height="30" rx="10" fill="#F59E0B" stroke="#FEF9C3" stroke-width="4"/>
    <!-- Crisp Emerald Tactical Pitch Board -->
    <rect x="-194" y="-118" width="388" height="240" rx="10" fill="url(#td-board)" stroke="#ECFDF5" stroke-width="4"/>
    <!-- White tactical pitch markings -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="3.5">
      <line x1="0" y1="-118" x2="0" y2="122"/>
      <circle cx="0" cy="2" r="42"/>
      <rect x="-194" y="-56" width="54" height="116"/>
      <rect x="140" y="-56" width="54" height="116"/>
    </g>
    <!-- Bold White & Gold Tactical Attacking Formation Arrows! -->
    <g fill="none" stroke="#FEF08A" stroke-width="6.5" stroke-dasharray="12 9" stroke-linecap="round">
      <path d="M-84,-64 Q24,-96 128,-54"/>
      <path d="M-24,4 L126,4"/>
      <path d="M-84,68 Q24,98 128,56"/>
    </g>
    <g fill="#FEF08A">
      <polygon points="142,-48 118,-66 124,-40"/>
      <polygon points="144,4 120,-10 120,18"/>
      <polygon points="142,50 124,42 118,68"/>
    </g>
    <!-- Glowing Cyan Manager Player Tokens in Tactical Formation (Zero Numbers!) -->
    <g fill="#38BDF8" stroke="#FFFFFF" stroke-width="4.5">
      <circle cx="-148" cy="4" r="18" fill="#F59E0B"/>
      <circle cx="-84" cy="-64" r="18"/>
      <circle cx="-84" cy="68" r="18"/>
      <circle cx="-24" cy="4" r="20"/>
      <circle cx="52" cy="-58" r="18"/>
      <circle cx="52" cy="62" r="18"/>
    </g>
  </g>
  <!-- Gleaming Silver & Gold League Dynasty Shield + Star Form Badges (Right!) -->
  <g transform="translate(544,180)">
    <circle r="76" fill="#FEF08A" fill-opacity="0.24"/>
    <path d="M-54,-66 H54 V12 C54,54 0,84 0,84 C0,84 -54,54 -54,12 Z" fill="#F59E0B" stroke="#FEF9C3" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-36,-48 H36 V8 C36,38 0,60 0,60 C0,60 -36,38 -36,8 Z" fill="#1E3A8A" stroke="#FDE047" stroke-width="3.5"/>
    <!-- Crown & gold stars -->
    <polygon points="-24,-14 -30,-34 -10,-22 0,-38 10,-22 30,-34 24,-14" fill="#FDE047"/>
    <polygon points="0,-2 6,12 22,12 10,20 14,34 0,25 -14,34 -10,20 -22,12 -6,12" fill="#FFFFFF"/>
  </g>
</svg>
