<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="st-cork" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AE7A"/>
      <stop offset="55%" stop-color="#C29662"/>
      <stop offset="100%" stop-color="#AA7E4E"/>
    </linearGradient>
  </defs>
  <!-- Warm Detective Evidence Corkboard + Crisp Slate Border Frame -->
  <rect width="640" height="360" fill="#475569"/>
  <rect x="22" y="20" width="596" height="320" rx="10" fill="url(#st-cork)" stroke="#78350F" stroke-width="7"/>
  <!-- Subtle cork texture dots -->
  <g fill="#78350F" fill-opacity="0.18">
    <circle cx="76" cy="62" r="3"/><circle cx="290" cy="48" r="3.5"/><circle cx="548" cy="64" r="3"/>
    <circle cx="88" cy="306" r="3.5"/><circle cx="332" cy="316" r="3"/><circle cx="576" cy="298" r="3"/>
  </g>
  <!-- Clue Card 1 (Top-Left: Ferry Boat Polaroid - zero text!) -->
  <g transform="translate(154,126) rotate(-7)">
    <rect x="-74" y="-66" width="148" height="142" rx="6" fill="#FAF7F0" stroke="#94A3B8" stroke-width="3"/>
    <rect x="-60" y="-52" width="120" height="92" rx="3" fill="#3B82F6"/>
    <!-- Ferry boat icon -->
    <polygon points="-44,12 44,12 32,30 -32,30" fill="#F8FAFC"/>
    <rect x="-28" y="-12" width="56" height="24" rx="4" fill="#E2E8F0"/>
    <rect x="-12" y="-28" width="16" height="16" fill="#EF4444"/>
    <path d="M-54,32 Q-26,22 0,32 T54,32" fill="none" stroke="#BAE6FD" stroke-width="5"/>
    <!-- Red pin -->
    <circle cx="0" cy="-58" r="10" fill="#EF4444" stroke="#FFF1F2" stroke-width="3"/>
  </g>
  <!-- Clue Card 2 (Bottom-Center: Radio Static Oscilloscope Waveform!) -->
  <g transform="translate(316,256) rotate(4)">
    <rect x="-88" y="-62" width="176" height="126" rx="6" fill="#FAF7F0" stroke="#94A3B8" stroke-width="3"/>
    <rect x="-74" y="-48" width="148" height="82" rx="4" fill="#1E293B"/>
    <polyline points="-66,-6 -46,-6 -34,-34 -22,22 -8,-40 6,24 20,-26 34,12 46,-14 66,-6" fill="none" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-66" y1="-6" x2="66" y2="-6" stroke="#F43F5E" stroke-width="2.5" stroke-dasharray="6 6"/>
    <!-- Gold pin -->
    <circle cx="0" cy="-54" r="10" fill="#F59E0B" stroke="#FEF9C3" stroke-width="3"/>
  </g>
  <!-- Clue Card 3 (Top-Right: Culprit Suspect Card Circled in Crimson!) -->
  <g transform="translate(486,144) rotate(6)">
    <rect x="-76" y="-76" width="152" height="156" rx="6" fill="#FAF7F0" stroke="#94A3B8" stroke-width="3"/>
    <rect x="-62" y="-62" width="124" height="106" rx="4" fill="#CBD5E1"/>
    <!-- Mysterious Culprit Silhouette -->
    <circle cx="0" cy="-22" r="24" fill="#334155"/>
    <path d="M-40,42 C-40,12 40,12 40,42 Z" fill="#334155"/>
    <!-- Bold red marker circle around suspect -->
    <ellipse cx="0" cy="-6" rx="54" ry="48" fill="none" stroke="#EF4444" stroke-width="7" stroke-dasharray="280 24"/>
    <!-- Red pin -->
    <circle cx="0" cy="-68" r="11" fill="#EF4444" stroke="#FFF1F2" stroke-width="3"/>
  </g>
  <!-- Brass Key Evidence Tag pinned lower-left -->
  <g transform="translate(114,268) rotate(-18)">
    <rect x="-46" y="-28" width="92" height="56" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
    <circle cx="-18" cy="0" r="13" fill="none" stroke="#B45309" stroke-width="6"/>
    <path d="M-5,0 H28 M16,0 V11 M26,0 V11" stroke="#B45309" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-22" r="8" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
  <!-- Bold Taut Crimson Red Investigator Strings Linking ALL Clues! -->
  <g fill="none" stroke="#DC2626" stroke-width="6" stroke-linecap="round">
    <line x1="160" y1="68" x2="492" y2="76"/>
    <line x1="160" y1="68" x2="320" y2="202"/>
    <line x1="320" y1="202" x2="492" y2="76"/>
    <line x1="120" y1="246" x2="320" y2="202"/>
  </g>
  <!-- Bright highlights on pins where strings knot -->
  <g fill="#FEF08A">
    <circle cx="160" cy="68" r="5"/><circle cx="320" cy="202" r="5"/><circle cx="492" cy="76" r="5.5"/>
  </g>
</svg>
