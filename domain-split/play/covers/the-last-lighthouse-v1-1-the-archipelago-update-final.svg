<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ll-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#294D74"/>
      <stop offset="60%" stop-color="#3F7498"/>
      <stop offset="100%" stop-color="#4A86A6"/>
    </linearGradient>
    <linearGradient id="ll-beam" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FDE047" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <!-- Stormy yet luminous coastal sky & rolling ocean -->
  <rect width="640" height="225" fill="url(#ll-sky)"/>
  <!-- Storm clouds upper right -->
  <g fill="#2C4F73" fill-opacity="0.72">
    <ellipse cx="456" cy="54" rx="108" ry="34"/><ellipse cx="556" cy="68" rx="92" ry="30"/>
    <ellipse cx="322" cy="42" rx="84" ry="26"/>
  </g>
  <!-- Diagonal storm rain streaks -->
  <g stroke="#BAE6FD" stroke-opacity="0.34" stroke-width="2.2" stroke-linecap="round">
    <line x1="286" y1="68" x2="262" y2="124"/><line x1="364" y1="54" x2="340" y2="112"/>
    <line x1="448" y1="74" x2="424" y2="130"/><line x1="538" y1="62" x2="514" y2="120"/>
    <line x1="594" y1="110" x2="572" y2="162"/>
  </g>
  <!-- Rolling Archipelago Sea -->
  <rect x="0" y="216" width="640" height="144" fill="#1E557A"/>
  <path d="M0,248 Q80,232 160,248 T320,248 T480,248 T640,248 V360 H0 Z" fill="#256791"/>
  <path d="M0,298 Q95,280 190,298 T380,298 T570,298 L640,292 V360 H0 Z" fill="#1C4E73"/>
  <!-- Sweeping HUGE Radiant Golden Lighthouse Beam guiding ship safely! -->
  <polygon points="154,104 640,148 640,336 154,124" fill="url(#ll-beam)"/>
  <!-- Jagged Storm Reef Rocks (Obstacles!) -->
  <g fill="#334155" stroke="#94A3B8" stroke-width="3" stroke-linejoin="round">
    <polygon points="274,264 304,202 332,264"/>
    <polygon points="308,266 332,226 356,266"/>
    <polygon points="528,312 560,250 594,312"/>
  </g>
  <!-- Crisp foam caps around reef rocks -->
  <path d="M262,268 Q312,256 364,268" fill="none" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round"/>
  <!-- Left Rocky Headland Islet + Hero Red-and-White Striped Lighthouse -->
  <path d="M0,360 L0,246 Q116,214 218,264 L234,360 Z" fill="#475569" stroke="#CBD5E1" stroke-width="3.5"/>
  <g transform="translate(136,166)">
    <!-- Striped Lighthouse Tower -->
    <polygon points="-32,88 -20,-48 20,-48 32,88" fill="#F8FAFC" stroke="#1E293B" stroke-width="3.5"/>
    <polygon points="-29,56 29,56 26,24 -26,24" fill="#EF4444"/>
    <polygon points="-24,-4 24,-4 22,-32 -22,-32" fill="#EF4444"/>
    <!-- Gallery deck & glowing golden lantern room -->
    <rect x="-28" y="-56" width="56" height="10" rx="4" fill="#1E293B"/>
    <rect x="-18" y="-86" width="36" height="30" rx="4" fill="#FEF08A" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="0" cy="-71" r="14" fill="#FFFFFF"/>
    <!-- Conical red lighthouse roof -->
    <polygon points="-24,-86 24,-86 0,-114" fill="#DC2626" stroke="#FEE2E2" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Illuminated Safe Sailing Ship Gliding Safely Along the Golden Beam! -->
  <g transform="translate(466,246)">
    <!-- Boat hull -->
    <polygon points="-58,0 64,0 44,28 -44,28" fill="#92400E" stroke="#FEF3C7" stroke-width="3.5" stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="0" y2="-88" stroke="#F8FAFC" stroke-width="6" stroke-linecap="round"/>
    <!-- Billowing cream sails lit golden by the lighthouse beam -->
    <path d="M4,-82 Q44,-46 42,-8 L4,-8 Z" fill="#FEF9C3" stroke="#F59E0B" stroke-width="3"/>
    <path d="M-4,-70 Q-36,-40 -34,-8 L-4,-8 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>
    <!-- Bright foam wake behind ship -->
    <path d="M-56,30 Q-84,36 -108,28" fill="none" stroke="#E0F2FE" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
