<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="nt-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283E7D"/>
      <stop offset="100%" stop-color="#3E61A8"/>
    </linearGradient>
    <linearGradient id="nt-pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E4E7A"/>
      <stop offset="50%" stop-color="#295285"/>
      <stop offset="100%" stop-color="#5B3675"/>
    </linearGradient>
  </defs>
  <!-- Stadium neon dome backdrop -->
  <rect width="640" height="156" fill="url(#nt-sky)"/>
  <path d="M0,156 Q320,74 640,156" fill="none" stroke="#7DD3FC" stroke-width="5" stroke-opacity="0.5"/>
  <!-- Cyber painted-tile turf pitch -->
  <rect x="0" y="150" width="640" height="210" fill="url(#nt-pitch)"/>
  <!-- Glowing painted cyan (left) & magenta (right) territory tiles -->
  <g fill="#38BDF8" fill-opacity="0.45" stroke="#BAE6FD" stroke-width="2">
    <polygon points="40,224 146,224 118,274 8,274"/>
    <polygon points="154,224 260,224 238,274 128,274"/>
    <polygon points="10,284 122,284 94,344 -20,344"/>
    <polygon points="132,284 244,284 222,344 106,344"/>
  </g>
  <g fill="#F472B6" fill-opacity="0.42" stroke="#FBCFE8" stroke-width="2">
    <polygon points="384,224 490,224 518,274 408,274"/>
    <polygon points="498,224 604,224 636,274 526,274"/>
    <polygon points="412,284 524,284 552,344 436,344"/>
  </g>
  <!-- Neon goal frame on right -->
  <g transform="translate(546,162)">
    <polygon points="-58,-72 68,-52 68,66 -58,46" fill="#0F172A" fill-opacity="0.3" stroke="#67E8F9" stroke-width="7" stroke-linejoin="round"/>
    <g stroke="#BAE6FD" stroke-opacity="0.48" stroke-width="2">
      <line x1="-26" y1="-67" x2="-26" y2="51"/><line x1="6" y1="-62" x2="6" y2="56"/><line x1="38" y1="-57" x2="38" y2="61"/>
      <line x1="-58" y1="-32" x2="68" y2="-12"/><line x1="-58" y1="8" x2="68" y2="28"/>
    </g>
  </g>
  <!-- Flaming shot streak into goal -->
  <path d="M276,244 Q394,142 528,146" fill="none" stroke="#FACC15" stroke-width="18" stroke-linecap="round" stroke-opacity="0.55"/>
  <path d="M276,244 Q394,142 528,146" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Diving rival coral-magenta hover car -->
  <g transform="translate(466,256) rotate(-14)">
    <polygon points="-44,-14 36,-18 52,0 36,16 -44,14" fill="#F43F5E" stroke="#FFE4E6" stroke-width="3"/>
    <polygon points="-14,-12 18,-12 26,0 18,12 -14,12" fill="#1E293B"/>
  </g>
  <!-- Hero Rocket-Powered Cyan Hover Car blasting forward -->
  <g transform="translate(216,254) rotate(-12)">
    <!-- Roaring golden-orange rocket exhaust plume -->
    <polygon points="-86,-14 -164,-2 -86,18" fill="#F97316"/>
    <polygon points="-86,-8 -136,0 -86,10" fill="#FEF08A"/>
    <!-- Hover cushion glow -->
    <ellipse cx="0" cy="34" rx="84" ry="16" fill="#67E8F9" fill-opacity="0.52"/>
    <!-- Sleek aerodynamic hover chassis -->
    <polygon points="-88,16 -76,-14 18,-26 94,-4 86,20 -82,22" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- Windshield canopy -->
    <polygon points="-24,-18 28,-22 52,-6 -10,-4" fill="#1E293B" stroke="#BAE6FD" stroke-width="2.5"/>
    <!-- Neon racing stripe & hover vents -->
    <rect x="-66" y="4" width="136" height="8" rx="4" fill="#FDE047"/>
    <ellipse cx="-46" cy="24" rx="18" ry="7" fill="#E0F2FE"/>
    <ellipse cx="46" cy="24" rx="18" ry="7" fill="#E0F2FE"/>
  </g>
  <!-- Huge glowing hexagonal Energy Football flying toward goal -->
  <g transform="translate(388,168)">
    <circle r="54" fill="#FEF08A" fill-opacity="0.34"/>
    <circle r="38" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="4.5"/>
    <polygon points="0,-16 14,-6 9,12 -9,12 -14,-6" fill="#F59E0B"/>
    <path d="M0,-16 V-37 M14,-6 L34,-12 M9,12 L24,28 M-9,12 L-24,28 M-14,-6 L-34,-12" stroke="#0EA5E9" stroke-width="3.5"/>
  </g>
</svg>
