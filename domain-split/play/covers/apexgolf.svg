<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ag-rough" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16803C"/>
      <stop offset="100%" stop-color="#156C35"/>
    </linearGradient>
    <linearGradient id="ag-fairway" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <!-- Bright Sunlit Top-Down Aerial Golf Hole Map -->
  <rect width="640" height="360" fill="url(#ag-rough)"/>
  <!-- Curving Lush Fairway -->
  <path d="M64,340 C56,220 146,162 276,144 C382,128 456,52 536,68 C606,82 598,192 522,228 C448,262 346,232 276,262 C214,288 186,348 142,360 Z" fill="url(#ag-fairway)" stroke="#86EFAC" stroke-width="5"/>
  <!-- Bright Sky-Blue Water Hazard Pond (Upper Left) -->
  <path d="M58,84 C74,34 196,26 246,66 C284,96 244,144 176,146 C98,148 44,128 58,84 Z" fill="#38BDF8" stroke="#BAE6FD" stroke-width="5"/>
  <path d="M104,82 Q146,72 188,84 M126,108 Q166,100 204,110" fill="none" stroke="#E0F2FE" stroke-width="4" stroke-linecap="round"/>
  <!-- Curving Warm Sand Bunker (Lower Right) -->
  <path d="M372,262 C412,234 494,244 514,284 C528,314 468,334 414,324 C368,314 346,280 372,262 Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="4.5"/>
  <!-- Sunlit Putting Green & Red Flag Pin (Top Right Goal!) -->
  <ellipse cx="496" cy="134" rx="76" ry="56" fill="#86EFAC" stroke="#DCFCE7" stroke-width="5"/>
  <circle cx="508" cy="138" r="10" fill="#1E293B" stroke="#FFFFFF" stroke-width="2.5"/>
  <line x1="508" y1="138" x2="508" y2="54" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
  <polygon points="508,56 562,74 508,92" fill="#EF4444" stroke="#FFF1F2" stroke-width="3" stroke-linejoin="round"/>
  <!-- Top-Down Tree Canopies framing edges -->
  <g fill="#166534" stroke="#4ADE80" stroke-width="3">
    <circle cx="332" cy="48" r="28"/><circle cx="364" cy="60" r="22"/>
    <circle cx="294" cy="316" r="26"/><circle cx="584" cy="296" r="30"/>
  </g>
  <!-- Bold Cyan Wind Arrow Indicator showing wind pushing shot! -->
  <g transform="translate(274,104) rotate(14)">
    <line x1="-44" y1="0" x2="36" y2="0" stroke="#E0F2FE" stroke-width="10" stroke-linecap="round"/>
    <polygon points="48,0 24,-18 24,18" fill="#E0F2FE" stroke="#0284C7" stroke-width="3"/>
    <path d="M-38,-14 H10 M-30,14 H16" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- Graceful Dotted Shot Curve bending with Wind toward Flag Pin -->
  <path d="M148,274 Q264,126 502,138" fill="none" stroke="#FEF08A" stroke-width="11" stroke-linecap="round" stroke-opacity="0.45"/>
  <path d="M148,274 Q264,126 502,138" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="13 10" stroke-linecap="round"/>
  <!-- Predicted landing dispersion circle near pin -->
  <circle cx="502" cy="138" r="28" fill="#FEF08A" fill-opacity="0.25" stroke="#FEF08A" stroke-width="3.5" stroke-dasharray="7 6"/>
  <!-- Hero Big Dimpled Golf Ball on Tee Box (Bottom-Left) -->
  <g transform="translate(142,276)">
    <ellipse cx="6" cy="34" rx="34" ry="12" fill="#14532D" fill-opacity="0.4"/>
    <circle r="34" fill="#FFFFFF" stroke="#94A3B8" stroke-width="3"/>
    <g fill="#CBD5E1">
      <circle cx="-12" cy="-10" r="4"/><circle cx="4" cy="-14" r="4"/><circle cx="16" cy="-4" r="4"/>
      <circle cx="-16" cy="6" r="4"/><circle cx="0" cy="4" r="4"/><circle cx="14" cy="14" r="4"/>
      <circle cx="-6" cy="18" r="3.5"/>
    </g>
  </g>
</svg>
