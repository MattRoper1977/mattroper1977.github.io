<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="hh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="hh-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
  </defs>
  <!-- Bright sunny sky + sunlit rolling hills -->
  <rect width="640" height="145" fill="url(#hh-sky)"/>
  <circle cx="566" cy="54" r="32" fill="#FDE047" stroke="#FEF9C3" stroke-width="6"/>
  <path d="M0,126 Q180,82 360,118 T640,104 V360 H0 Z" fill="url(#hh-hill)"/>
  <!-- Low-poly sunlit meadow facets -->
  <polygon points="0,195 220,140 380,225 140,360 0,360" fill="#22C55E" fill-opacity="0.45"/>
  <polygon points="380,225 640,155 640,360 340,360" fill="#15803D" fill-opacity="0.28"/>
  <!-- Stylized pine trees on crest -->
  <g>
    <polygon points="70,84 44,132 96,132" fill="#15803D"/>
    <polygon points="115,72 86,126 144,126" fill="#166534"/>
    <polygon points="488,78 462,126 514,126" fill="#15803D"/>
  </g>
  <!-- Striped sheep wooden pen (upper-left goal) -->
  <g transform="translate(154,116)">
    <rect x="0" y="18" width="128" height="46" rx="6" fill="#E0F2FE" fill-opacity="0.45" stroke="#92400E" stroke-width="6"/>
    <rect x="40" y="-4" width="48" height="22" rx="4" fill="#1E3A8A"/>
    <line x1="52" y1="-4" x2="52" y2="18" stroke="#FFFFFF" stroke-width="5"/>
    <line x1="68" y1="-4" x2="68" y2="18" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <!-- Spotted sheep wooden pen (upper-right goal) -->
  <g transform="translate(364,120)">
    <rect x="0" y="18" width="128" height="46" rx="6" fill="#FFEDD5" fill-opacity="0.45" stroke="#92400E" stroke-width="6"/>
    <rect x="40" y="-4" width="48" height="22" rx="4" fill="#9A3412"/>
    <circle cx="52" cy="7" r="4.5" fill="#FED7AA"/>
    <circle cx="64" cy="4" r="4" fill="#FED7AA"/>
    <circle cx="74" cy="11" r="4.5" fill="#FED7AA"/>
  </g>
  <!-- Cute chunky blocky sheep (striped + spotted) trotting uphill -->
  <!-- Striped sheep 1 -->
  <g transform="translate(274,210)">
    <ellipse cx="0" cy="24" rx="30" ry="10" fill="#14532D" fill-opacity="0.35"/>
    <rect x="-28" y="-14" width="56" height="34" rx="10" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="-14" y="-14" width="10" height="34" fill="#1E3A8A"/>
    <rect x="6" y="-14" width="10" height="34" fill="#1E3A8A"/>
    <rect x="-36" y="-8" width="18" height="20" rx="6" fill="#334155"/>
    <circle cx="-30" cy="-1" r="2.5" fill="#FFFFFF"/>
  </g>
  <!-- Spotted sheep 2 -->
  <g transform="translate(446,228)">
    <ellipse cx="0" cy="24" rx="30" ry="10" fill="#14532D" fill-opacity="0.35"/>
    <rect x="-28" y="-14" width="56" height="34" rx="10" fill="#FFF7ED" stroke="#7C2D12" stroke-width="2.5"/>
    <circle cx="-12" cy="-2" r="7" fill="#7C2D12"/>
    <circle cx="10" cy="5" r="8" fill="#7C2D12"/>
    <circle cx="8" cy="-8" r="5" fill="#9A3412"/>
    <rect x="18" y="-8" width="18" height="20" rx="6" fill="#334155"/>
    <circle cx="30" cy="-1" r="2.5" fill="#FFFFFF"/>
  </g>
  <!-- Spotted sheep 3 -->
  <g transform="translate(378,274)">
    <ellipse cx="0" cy="22" rx="28" ry="9" fill="#14532D" fill-opacity="0.35"/>
    <rect x="-26" y="-12" width="52" height="30" rx="9" fill="#FFF7ED" stroke="#7C2D12" stroke-width="2.5"/>
    <circle cx="-8" cy="0" r="6.5" fill="#7C2D12"/>
    <circle cx="11" cy="-2" r="6" fill="#9A3412"/>
    <rect x="16" y="-7" width="16" height="18" rx="5" fill="#334155"/>
  </g>
  <!-- Hero energetic Hill Hound border collie + bandana + bark sound arcs -->
  <g transform="translate(152,272)">
    <ellipse cx="4" cy="36" rx="46" ry="14" fill="#14532D" fill-opacity="0.4"/>
    <!-- Tail wagging -->
    <path d="M-42,6 Q-72,-12 -58,-34" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>
    <circle cx="-58" cy="-34" r="7" fill="#F8FAFC"/>
    <!-- Body -->
    <rect x="-44" y="-16" width="84" height="44" rx="16" fill="#1E293B"/>
    <ellipse cx="14" cy="14" rx="22" ry="14" fill="#F8FAFC"/>
    <!-- Legs striding -->
    <rect x="-36" y="22" width="14" height="24" rx="6" fill="#F8FAFC"/>
    <rect x="16" y="22" width="14" height="24" rx="6" fill="#F8FAFC"/>
    <!-- Gold-coral bandana -->
    <polygon points="10,-12 44,-12 30,22" fill="#FBBF24" stroke="#EA580C" stroke-width="2.5"/>
    <!-- Head & perky ears -->
    <g transform="translate(36,-24)">
      <polygon points="-16,-16 -24,-42 -2,-24" fill="#1E293B"/>
      <polygon points="10,-16 20,-42 26,-16" fill="#1E293B"/>
      <rect x="-24" y="-22" width="52" height="40" rx="14" fill="#1E293B"/>
      <rect x="8" y="-8" width="28" height="22" rx="9" fill="#F8FAFC"/>
      <circle cx="32" cy="-2" r="5" fill="#0F172A"/>
      <circle cx="8" cy="-8" r="4.5" fill="#FFFFFF"/>
      <circle cx="9" cy="-8" r="2.2" fill="#0F172A"/>
      <ellipse cx="4" cy="4" rx="6" ry="4" fill="#F59E0B"/>
    </g>
    <!-- Crisp white bark arcs -->
    <path d="M84,-34 A22,22 0 0 1 84,-4" fill="none" stroke="#FEF9C3" stroke-width="5" stroke-linecap="round"/>
    <path d="M98,-46 A36,36 0 0 1 98,8" fill="none" stroke="#FDE047" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
