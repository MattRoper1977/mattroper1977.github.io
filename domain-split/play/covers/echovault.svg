<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ev-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25426E"/>
      <stop offset="55%" stop-color="#2C5D80"/>
      <stop offset="100%" stop-color="#283F70"/>
    </linearGradient>
    <radialGradient id="ev-sonar" cx="0.28" cy="0.68" r="0.68">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.72"/>
      <stop offset="48%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#25426E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#ev-bg)"/>
  <rect width="640" height="360" fill="url(#ev-sonar)"/>
  <!-- Perspective illuminated wireframe stone vault arches -->
  <g fill="none" stroke="#99F6E4" stroke-linecap="round">
    <path d="M90,340 V120 A230,115 0 0 1 550,120 V340" stroke-width="5" stroke-opacity="0.48"/>
    <path d="M160,320 V146 A160,82 0 0 1 480,146 V320" stroke-width="4" stroke-opacity="0.62"/>
    <path d="M222,300 V168 A98,52 0 0 1 418,168 V300" stroke-width="3.5" stroke-opacity="0.78"/>
    <line x1="90" y1="340" x2="222" y2="300" stroke-width="3" stroke-opacity="0.45"/>
    <line x1="550" y1="340" x2="418" y2="300" stroke-width="3" stroke-opacity="0.45"/>
    <line x1="222" y1="300" x2="418" y2="300" stroke-width="3" stroke-opacity="0.55"/>
  </g>
  <!-- Concentric expanding cyan & magenta SONAR sound wave rings -->
  <g fill="none" transform="translate(182,248)">
    <circle r="58" stroke="#FFFFFF" stroke-width="6.5"/>
    <circle r="112" stroke="#67E8F9" stroke-width="6" stroke-opacity="0.92"/>
    <circle r="172" stroke="#38BDF8" stroke-width="5.5" stroke-dasharray="28 14" stroke-opacity="0.86"/>
    <circle r="236" stroke="#F472B6" stroke-width="5" stroke-dasharray="22 16" stroke-opacity="0.78"/>
    <circle r="304" stroke="#C084FC" stroke-width="4" stroke-dasharray="18 18" stroke-opacity="0.65"/>
  </g>
  <!-- Hero Foreground Acoustic Ping Emitter Orb -->
  <g transform="translate(182,248)">
    <circle r="32" fill="#67E8F9" fill-opacity="0.45"/>
    <circle r="22" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4.5"/>
    <circle r="9" fill="#FFFFFF"/>
  </g>
  <!-- Glowing Golden Resonance Core revealed in vault centre-right (goal!) -->
  <g transform="translate(362,186)">
    <circle r="48" fill="#FEF08A" fill-opacity="0.34"/>
    <polygon points="0,-38 28,0 0,38 -28,0" fill="#FBBF24" stroke="#FEF9C3" stroke-width="4"/>
    <polygon points="0,-20 14,0 0,20 -14,0" fill="#FFFFFF"/>
  </g>
  <!-- Lurking Crimson Spiked Vault Sentinel revealed by outer ping (obstacle) -->
  <g transform="translate(494,204)">
    <circle r="42" fill="#FB7185" fill-opacity="0.3"/>
    <polygon points="0,-36 14,-14 38,-16 20,4 32,28 6,16 -12,34 -14,10 -38,6 -16,-10" fill="#F43F5E" stroke="#FFE4E6" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="-8" cy="-4" r="5" fill="#FEF08A"/>
    <circle cx="10" cy="-4" r="5" fill="#FEF08A"/>
  </g>
</svg>
