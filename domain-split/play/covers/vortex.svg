<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="vx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#353182"/>
      <stop offset="50%" stop-color="#583E9C"/>
      <stop offset="100%" stop-color="#284A8A"/>
    </linearGradient>
    <radialGradient id="vx-core" cx="0.52" cy="0.46" r="0.52">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="28%" stop-color="#67E8F9" stop-opacity="0.88"/>
      <stop offset="65%" stop-color="#E879F9" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#353182" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#vx-bg)"/>
  <rect width="640" height="360" fill="url(#vx-core)"/>
  <!-- Spiraling radial tunnel ribs -->
  <g stroke="#BAE6FD" stroke-opacity="0.36" stroke-width="2.5">
    <line x1="332" y1="166" x2="40" y2="0"/><line x1="332" y1="166" x2="600" y2="0"/>
    <line x1="332" y1="166" x2="640" y2="210"/><line x1="332" y1="166" x2="580" y2="360"/>
    <line x1="332" y1="166" x2="90" y2="360"/><line x1="332" y1="166" x2="0" y2="176"/>
  </g>
  <!-- Concentric SPINNING circular neon tunnel rings -->
  <g fill="none" transform="translate(332,166)">
    <circle r="246" stroke="#F472B6" stroke-width="14" stroke-dasharray="94 34"/>
    <circle r="190" stroke="#38BDF8" stroke-width="12" stroke-dasharray="78 28" transform="rotate(24)"/>
    <circle r="140" stroke="#FDE047" stroke-width="10" stroke-dasharray="60 22" transform="rotate(52)"/>
    <circle r="96" stroke="#34D399" stroke-width="8.5" stroke-dasharray="44 18" transform="rotate(78)"/>
    <circle r="58" stroke="#E0F2FE" stroke-width="7"/>
    <circle r="28" fill="#FFFFFF" fill-opacity="0.88"/>
  </g>
  <!-- Spinning Coral-Amber Rotor Obstacle Blade blocking half of tunnel -->
  <g transform="translate(332,166) rotate(-24)">
    <path d="M46,-14 L182,-38 L182,38 L46,14 Z" fill="#FB7185" fill-opacity="0.9" stroke="#FFF1F2" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-46,-14 L-182,-38 L-182,38 L-46,14 Z" fill="#F97316" fill-opacity="0.9" stroke="#FFEDD5" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- Glowing emerald safe boost ring window -->
  <circle cx="332" cy="108" r="24" fill="#6EE7B7" fill-opacity="0.35" stroke="#A7F3D0" stroke-width="4.5"/>
  <!-- Curving cyan-gold boost jet trail hugging bottom wall -->
  <path d="M126,318 Q210,298 274,254" fill="none" stroke="#FACC15" stroke-width="24" stroke-linecap="round" stroke-opacity="0.68"/>
  <path d="M144,310 Q216,294 274,254" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- Hero Banking Vortex Starship -->
  <g transform="translate(278,252) rotate(-32)">
    <polygon points="62,0 -44,-40 -22,0 -44,40" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="44,0 -18,-18 -6,0 -18,18" fill="#FEF08A"/>
    <polygon points="24,0 -2,-8 -2,8" fill="#FFFFFF"/>
  </g>
</svg>
