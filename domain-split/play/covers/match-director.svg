<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="md-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#283D74"/>
      <stop offset="55%" stop-color="#35558C"/>
      <stop offset="100%" stop-color="#1E355E"/>
    </linearGradient>
  </defs>
  <!-- Broadcast Control Studio Booth -->
  <rect width="640" height="360" fill="url(#md-bg)"/>
  <!-- Big Illuminated Stadium Broadcast Scoreboard Screen (Upper Half) -->
  <rect x="64" y="28" width="512" height="168" rx="16" fill="#1E293B" stroke="#67E8F9" stroke-width="6"/>
  <!-- Mini glowing green pitch preview left side of screen -->
  <rect x="86" y="48" width="214" height="128" rx="8" fill="#16A34A" stroke="#DCFCE7" stroke-width="3"/>
  <line x1="193" y1="48" x2="193" y2="176" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="193" cy="112" r="24" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Tactical glowing player dots on screen -->
  <circle cx="134" cy="84" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="152" cy="142" r="8" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="246" cy="94" r="8" fill="#FB7185" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="232" cy="140" r="8" fill="#FDE047" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Rising Colorful Team Score Bars right side of screen (zero text!) -->
  <rect x="328" y="48" width="224" height="128" rx="8" fill="#263B6B"/>
  <rect x="348" y="68" width="164" height="24" rx="8" fill="#38BDF8" stroke="#E0F2FE" stroke-width="2.5"/>
  <rect x="348" y="102" width="132" height="24" rx="8" fill="#FB7185" stroke="#FFE4E6" stroke-width="2.5"/>
  <rect x="348" y="136" width="184" height="24" rx="8" fill="#FBBF24" stroke="#FEF9C3" stroke-width="2.5"/>
  <!-- Foreground Angled Director's Broadcast Control Desk -->
  <polygon points="32,226 608,226 640,360 0,360" fill="#475569" stroke="#CBD5E1" stroke-width="5"/>
  <!-- Glowing Colorful Director Switch Buttons left side -->
  <g stroke="#FFFFFF" stroke-width="3">
    <rect x="78" y="252" width="44" height="32" rx="8" fill="#38BDF8"/>
    <rect x="136" y="252" width="44" height="32" rx="8" fill="#34D399"/>
    <rect x="194" y="252" width="44" height="32" rx="8" fill="#FB7185"/>
    <rect x="78" y="298" width="44" height="32" rx="8" fill="#FBBF24"/>
    <rect x="136" y="298" width="102" height="32" rx="8" fill="#6366F1"/>
  </g>
  <!-- Dual Mixing Fader Sliders center -->
  <g>
    <rect x="284" y="250" width="14" height="82" rx="7" fill="#1E293B"/>
    <rect x="274" y="268" width="34" height="20" rx="6" fill="#FDE047" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="342" y="250" width="14" height="82" rx="7" fill="#1E293B"/>
    <rect x="332" y="294" width="34" height="20" rx="6" fill="#67E8F9" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Hero Gleaming Golden Referee/Host Whistle right side of desk + sound rings -->
  <g transform="translate(476,282) rotate(-14)">
    <!-- Whistle body -->
    <circle cx="-12" cy="8" r="36" fill="#F59E0B" stroke="#FEF9C3" stroke-width="4.5"/>
    <circle cx="-12" cy="8" r="14" fill="#B45309"/>
    <path d="M-4,-28 L66,-28 L66,-2 L16,12 Z" fill="#FBBF24" stroke="#FEF9C3" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Lanyard ring -->
    <circle cx="-54" cy="14" r="12" fill="none" stroke="#E2E8F0" stroke-width="5"/>
    <!-- Crisp blast sound arcs -->
    <path d="M84,-34 A24,24 0 0 1 84,4" fill="none" stroke="#FEF08A" stroke-width="6" stroke-linecap="round"/>
    <path d="M102,-46 A38,38 0 0 1 102,16" fill="none" stroke="#67E8F9" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
