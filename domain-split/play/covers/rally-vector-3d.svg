<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="rv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="rv-road" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Crisp sunlit alpine sky + snowy mountains -->
  <rect width="640" height="145" fill="url(#rv-sky)"/>
  <polygon points="0,145 125,52 245,145" fill="#64748B"/>
  <polygon points="125,52 94,90 156,90" fill="#F8FAFC"/>
  <polygon points="190,145 365,36 530,145" fill="#475569"/>
  <polygon points="365,36 322,82 408,82" fill="#F8FAFC"/>
  <polygon points="450,145 585,62 640,108 640,145" fill="#64748B"/>
  <!-- Alpine green hillsides -->
  <rect x="0" y="135" width="640" height="225" fill="#65A30D"/>
  <polygon points="0,135 640,135 640,215 0,185" fill="#84CC16" fill-opacity="0.55"/>
  <!-- Sweeping rally curve + red/white curbs -->
  <path d="M-20,360 C110,245 270,170 435,155 L525,155 C395,215 395,275 565,360 Z" fill="url(#rv-road)"/>
  <!-- Left racing curb -->
  <path d="M-10,348 C115,235 275,168 430,154" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M-10,348 C115,235 275,168 430,154" fill="none" stroke="#EF4444" stroke-width="14" stroke-dasharray="28 24"/>
  <!-- Right racing curb -->
  <path d="M555,355 C398,272 402,216 520,155" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <path d="M555,355 C398,272 402,216 520,155" fill="none" stroke="#EF4444" stroke-width="14" stroke-dasharray="28 24"/>
  <!-- Dashed predictive racing line -->
  <path d="M275,265 Q335,195 470,156" fill="none" stroke="#FDA4AF" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/>
  <!-- Faceted pine trees -->
  <g>
    <polygon points="88,100 58,162 118,162" fill="#15803D"/>
    <polygon points="148,112 124,162 172,162" fill="#166534"/>
    <polygon points="552,96 520,164 584,164" fill="#15803D"/>
    <polygon points="602,118 574,178 630,178" fill="#166534"/>
  </g>
  <!-- Gravel/dust drift spray plumes -->
  <g fill="#FEF3C7" fill-opacity="0.82">
    <circle cx="144" cy="296" r="24"/>
    <circle cx="176" cy="306" r="28"/>
    <circle cx="212" cy="314" r="22"/>
    <circle cx="118" cy="308" r="17"/>
  </g>
  <!-- Hero boxy crimson & white rally car drifting sideways -->
  <g transform="translate(278,248) rotate(-18)">
    <!-- Shadow -->
    <ellipse cx="6" cy="48" rx="94" ry="26" fill="#0F172A" fill-opacity="0.45"/>
    <!-- Dark angled rally wheels -->
    <rect x="-86" y="14" width="32" height="36" rx="7" fill="#0F172A"/>
    <rect x="54" y="14" width="32" height="36" rx="7" fill="#0F172A"/>
    <!-- Main car chassis -->
    <rect x="-92" y="-12" width="184" height="52" rx="10" fill="#DC2626" stroke="#FEE2E2" stroke-width="3"/>
    <!-- White racing stripes -->
    <rect x="-18" y="-12" width="36" height="52" fill="#F8FAFC"/>
    <!-- Cabin & dark windscreen -->
    <polygon points="-64,-12 -46,-54 46,-54 64,-12" fill="#1E293B" stroke="#E2E8F0" stroke-width="3"/>
    <polygon points="-46,-54 46,-54 38,-40 -38,-40" fill="#EF4444"/>
    <!-- Rear wing spoiler -->
    <rect x="-78" y="-26" width="156" height="12" rx="4" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.5"/>
    <!-- Tail lights & glowing exhaust pop -->
    <rect x="-82" y="4" width="30" height="13" rx="4" fill="#FDE047"/>
    <rect x="52" y="4" width="30" height="13" rx="4" fill="#FDE047"/>
    <circle cx="-48" cy="36" r="9" fill="#FB923C"/>
  </g>
</svg>
