<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="at-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="at-court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Sunny Stadium Sky + Royal Blue Hard Court -->
  <rect width="640" height="122" fill="url(#at-sky)"/>
  <rect x="0" y="96" width="640" height="28" fill="#1E3A8A"/>
  <rect x="0" y="122" width="640" height="238" fill="#2563EB"/>
  <!-- Perspective Royal-Blue Hard Tennis Court & Crisp White Lines -->
  <polygon points="154,132 486,132 598,354 42,354" fill="url(#at-court)" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="200" y1="132" x2="112" y2="354" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="440" y1="132" x2="528" y2="354" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="168" y1="186" x2="472" y2="186" stroke="#FFFFFF" stroke-width="3.5"/>
  <line x1="138" y1="266" x2="502" y2="266" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="320" y1="186" x2="320" y2="266" stroke="#FFFFFF" stroke-width="3.5"/>
  <!-- Crisp Horizontal White Tennis Net -->
  <rect x="108" y="176" width="424" height="36" fill="#0F172A" fill-opacity="0.24"/>
  <g stroke="#E2E8F0" stroke-opacity="0.52" stroke-width="1.6">
    <path d="M138,176 V212 M172,176 V212 M206,176 V212 M240,176 V212 M274,176 V212 M308,176 V212 M342,176 V212 M376,176 V212 M410,176 V212 M444,176 V212 M478,176 V212 M512,176 V212"/>
    <path d="M108,188 H532 M108,200 H532"/>
  </g>
  <line x1="104" y1="176" x2="536" y2="176" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- Tactical Called Target Zone Diamond in Far Right Corner (Goal!) -->
  <g transform="translate(432,158)">
    <polygon points="0,-20 38,0 0,20 -38,0" fill="#FDE047" fill-opacity="0.48" stroke="#FEF9C3" stroke-width="4"/>
    <circle r="8" fill="#FFFFFF"/>
  </g>
  <!-- Planned Tactical Dotted Shot Arc curving cleanly over net to corner -->
  <path d="M214,258 C226,112 354,84 430,154" fill="none" stroke="#FEF08A" stroke-width="12" stroke-linecap="round" stroke-opacity="0.45"/>
  <path d="M214,258 C226,112 354,84 430,154" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Hero Tennis Racket Swinging at Baseline Bottom-Left -->
  <g transform="translate(166,274) rotate(-32)">
    <!-- Handle -->
    <rect x="-10" y="34" width="20" height="72" rx="7" fill="#1E293B" stroke="#E0F2FE" stroke-width="3"/>
    <path d="M-10,36 L-28,6 M10,36 L28,6" stroke="#38BDF8" stroke-width="8" stroke-linecap="round"/>
    <!-- Racket Head & Strings -->
    <ellipse cx="0" cy="-26" rx="46" ry="58" fill="#0EA5E9" fill-opacity="0.28" stroke="#38BDF8" stroke-width="11"/>
    <ellipse cx="0" cy="-26" rx="46" ry="58" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <g stroke="#E0F2FE" stroke-opacity="0.65" stroke-width="2">
      <line x1="-22" y1="-78" x2="-22" y2="26"/><line x1="0" y1="-84" x2="0" y2="32"/><line x1="22" y1="-78" x2="22" y2="26"/>
      <line x1="-42" y1="-50" x2="42" y2="-50"/><line x1="-46" y1="-26" x2="46" y2="-26"/><line x1="-42" y1="-2" x2="42" y2="-2"/>
    </g>
  </g>
  <!-- Hero Crisp Lime-Yellow Tennis Ball mid-flight -->
  <g transform="translate(274,148)">
    <circle r="34" fill="#D9F99D" fill-opacity="0.34"/>
    <circle r="24" fill="#BEF264" stroke="#3F6212" stroke-width="3"/>
    <path d="M-16,-16 A24,24 0 0 1 -16,16 M16,-16 A24,24 0 0 0 16,16" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
