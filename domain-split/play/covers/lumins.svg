<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="lm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#264778"/>
      <stop offset="58%" stop-color="#356896"/>
      <stop offset="100%" stop-color="#22456E"/>
    </linearGradient>
    <radialGradient id="lm-exit" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="52%" stop-color="#FBBF24" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#264778" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#lm-bg)"/>
  <!-- Glowing background cavern crystals -->
  <g fill="#67E8F9" fill-opacity="0.34" stroke="#BAE6FD" stroke-width="2.5">
    <polygon points="94,132 114,68 134,132"/>
    <polygon points="122,136 138,88 154,136"/>
    <polygon points="502,126 522,62 542,126"/>
  </g>
  <!-- Left & Right Rocky Cavern Cliffs with Deep Chasm between -->
  <polygon points="0,204 196,204 214,360 0,360" fill="#3B5582" stroke="#93C5FD" stroke-width="4"/>
  <rect x="0" y="196" width="202" height="18" rx="6" fill="#4ADE80"/>
  <polygon points="418,162 640,162 640,360 398,360" fill="#3B5582" stroke="#93C5FD" stroke-width="4"/>
  <rect x="412" y="154" width="228" height="18" rx="6" fill="#4ADE80"/>
  <!-- Carved tunnel cutout through right cliff wall -->
  <path d="M406,272 H514 A30,30 0 0 1 514,332 H406 Z" fill="#1E355E" stroke="#F472B6" stroke-width="4" stroke-dasharray="10 8"/>
  <!-- Hazard spikes at bottom of chasm -->
  <g fill="#FB7185" stroke="#FFF1F2" stroke-width="3">
    <polygon points="222,356 248,314 274,356"/>
    <polygon points="274,356 300,314 326,356"/>
    <polygon points="326,356 352,314 378,356"/>
  </g>
  <!-- Hero Newly Built Stepped Luminous Emerald Light-Bridge spanning chasm! -->
  <g fill="#34D399" stroke="#ECFDF5" stroke-width="3.5">
    <rect x="184" y="194" width="46" height="16" rx="5"/>
    <rect x="226" y="182" width="46" height="16" rx="5"/>
    <rect x="268" y="170" width="46" height="16" rx="5"/>
    <rect x="310" y="158" width="46" height="16" rx="5"/>
    <rect x="352" y="148" width="66" height="16" rx="5" fill="#6EE7B7"/>
  </g>
  <!-- Warm Swirling Golden Exit Portal on right ledge (Goal!) -->
  <g transform="translate(544,116)">
    <circle r="66" fill="url(#lm-exit)"/>
    <ellipse rx="34" ry="44" fill="#FEF08A" stroke="#FFFFFF" stroke-width="5"/>
    <ellipse rx="18" ry="26" fill="#FFFFFF"/>
  </g>
  <!-- Cute Glowing Little Lumins Marching Safely Across the Light-Bridge! -->
  <!-- Lumin 1 (Left ledge stepping onto bridge) -->
  <g transform="translate(136,174)">
    <circle r="28" fill="#67E8F9" fill-opacity="0.34"/>
    <circle r="20" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="4" cy="-3" r="4" fill="#0F172A"/><circle cx="12" cy="-3" r="4" fill="#0F172A"/>
    <circle cx="6" cy="-4" r="1.5" fill="#FFFFFF"/><circle cx="14" cy="-4" r="1.5" fill="#FFFFFF"/>
  </g>
  <!-- Lumin 2 (Mid-bridge marching happily) -->
  <g transform="translate(248,158)">
    <circle r="28" fill="#6EE7B7" fill-opacity="0.36"/>
    <circle r="20" fill="#34D399" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="4" cy="-3" r="4" fill="#0F172A"/><circle cx="12" cy="-3" r="4" fill="#0F172A"/>
  </g>
  <!-- Lumin 3 (Hero Builder Lumin placing final glowing bridge plank!) -->
  <g transform="translate(342,128)">
    <circle r="36" fill="#FEF08A" fill-opacity="0.4"/>
    <circle r="24" fill="#FBBF24" stroke="#FFFFFF" stroke-width="4"/>
    <!-- Little glowing light halo -->
    <ellipse cx="0" cy="-32" rx="16" ry="5" fill="none" stroke="#FEF9C3" stroke-width="4"/>
    <circle cx="5" cy="-4" r="4.5" fill="#0F172A"/><circle cx="14" cy="-4" r="4.5" fill="#0F172A"/>
  </g>
  <!-- Lumin 4 (Floating down with glowing cyan Updraft umbrella!) -->
  <g transform="translate(464,234)">
    <path d="M-26,-24 A26,22 0 0 1 26,-24 Z" fill="#67E8F9" stroke="#FFFFFF" stroke-width="3.5"/>
    <line x1="0" y1="-24" x2="0" y2="-4" stroke="#E0F2FE" stroke-width="3.5"/>
    <circle cy="8" r="17" fill="#F472B6" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="-4" cy="6" r="3.5" fill="#0F172A"/><circle cx="6" cy="6" r="3.5" fill="#0F172A"/>
  </g>
</svg>
