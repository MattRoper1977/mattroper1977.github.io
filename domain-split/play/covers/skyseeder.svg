<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ss-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E6FB0"/>
      <stop offset="56%" stop-color="#56B4EC"/>
      <stop offset="100%" stop-color="#CBE8FA"/>
    </linearGradient>
    <radialGradient id="ss-beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#F5BD41" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#56B4EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ss-wind" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.78"/>
      <stop offset="55%" stop-color="#67E8F9" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.88"/>
    </linearGradient>
  </defs>
  <!-- Uplifting Sunlit Sky & Soft Horizon Cloud Bank -->
  <rect width="640" height="360" fill="url(#ss-sky)"/>
  <g fill="#FFFFFF" fill-opacity="0.72">
    <ellipse cx="74" cy="332" rx="112" ry="42"/>
    <ellipse cx="236" cy="344" rx="126" ry="38"/>
    <ellipse cx="446" cy="338" rx="134" ry="42"/>
    <ellipse cx="598" cy="328" rx="98" ry="44"/>
    <ellipse cx="146" cy="54" rx="54" ry="18" fill-opacity="0.55"/>
    <ellipse cx="364" cy="44" rx="46" ry="15" fill-opacity="0.5"/>
  </g>
  <!-- Distant Floating Grey Rock Islet Left Background -->
  <g transform="translate(86,216)">
    <polygon points="-46,0 44,-8 52,12 18,46 -32,34" fill="#8C99A6" stroke="#CBD5E1" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="-46,0 44,-8 22,12 -36,12" fill="#A7B4C0"/>
  </g>
  <!-- High Floating Summit Island + Glowing Golden Summit Beacon (Upper Right Goal!) -->
  <g transform="translate(524,126)">
    <circle cx="0" cy="-26" r="82" fill="url(#ss-beacon)"/>
    <!-- Floating stone island -->
    <polygon points="-76,34 72,22 86,44 38,94 -46,84" fill="#7D8C99" stroke="#CBD5E1" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-76,34 72,22 52,48 -62,48" fill="#34D399"/>
    <!-- Stone Beacon Pedestal -->
    <rect x="-18" y="-2" width="36" height="36" rx="5" fill="#CBD5E1" stroke="#475569" stroke-width="3"/>
    <!-- Radiant Golden Diamond Summit Beacon + Target Ring -->
    <circle cx="0" cy="-34" r="44" fill="none" stroke="#FEF08A" stroke-width="4.5" stroke-dasharray="12 8"/>
    <polygon points="0,-68 28,-34 0,0 -28,-34" fill="#F5BD41" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
    <polygon points="0,-46 14,-34 0,-20 -14,-34" fill="#FFFFFF"/>
  </g>
  <!-- Hero Floating Grey Rock Island Blooming with Green Grass & Sprouting Trees (Lower Center-Left!) -->
  <g transform="translate(246,268)">
    <!-- Faceted grey floating rock underside -->
    <polygon points="-134,-8 128,-22 146,12 68,78 -86,66" fill="#7D8C99" stroke="#CBD5E1" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-134,-8 -14,-16 42,64 -86,66" fill="#64748B" fill-opacity="0.55"/>
    <!-- Barren grey stone rim on far left transitioning into lush blooming green meadow! -->
    <polygon points="-134,-8 128,-22 146,12 -112,18" fill="#A7B4C0"/>
    <ellipse cx="26" cy="-4" rx="108" ry="24" fill="#22C55E" stroke="#BBF7D0" stroke-width="3.5"/>
    <ellipse cx="34" cy="-6" rx="76" ry="15" fill="#4ADE80"/>
    <!-- Sprouting Stylized Green Layered Trees! -->
    <g transform="translate(-32,-16)">
      <rect x="-5" y="4" width="10" height="22" rx="3" fill="#78350F"/>
      <polygon points="0,-34 26,8 -26,8" fill="#15803D" stroke="#DCFCE7" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-50 20,-12 -20,-12" fill="#34D399" stroke="#ECFDF5" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(36,-22)">
      <rect x="-6" y="6" width="12" height="26" rx="3" fill="#78350F"/>
      <polygon points="0,-42 30,10 -30,10" fill="#16A34A" stroke="#DCFCE7" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-60 22,-14 -22,-14" fill="#4ADE80" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(94,-12)">
      <rect x="-4" y="4" width="8" height="16" rx="2" fill="#78350F"/>
      <polygon points="0,-24 18,6 -18,6" fill="#22C55E" stroke="#DCFCE7" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-34 14,-8 -14,-8" fill="#6EE7B7"/>
    </g>
  </g>
  <!-- Spiralling Chevron Wind Thermal Ribbon rising from Trees to Summit Beacon! -->
  <path d="M358,248 C416,226 364,174 416,136 C446,114 470,108 492,98" fill="none" stroke="url(#ss-wind)" stroke-width="26" stroke-linecap="round" stroke-opacity="0.46"/>
  <path d="M358,248 C416,226 364,174 416,136 C446,114 470,108 492,98" fill="none" stroke="#E0F2FE" stroke-width="6" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Crisp Upward Wind Thermal Chevrons along the Spiral Ribbon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="374,234 388,214 406,228"/>
    <polyline points="374,184 392,166 408,184"/>
    <polyline points="416,134 438,124 446,146"/>
  </g>
  <!-- Falling Glowing Golden-Mint Seeds Dropping from Paper Plane onto Island! -->
  <g>
    <line x1="212" y1="146" x2="212" y2="214" stroke="#FEF08A" stroke-width="4" stroke-dasharray="6 7" stroke-linecap="round"/>
    <circle cx="212" cy="166" r="14" fill="#FEF08A" fill-opacity="0.4"/>
    <circle cx="212" cy="166" r="8" fill="#FDE047" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="242" cy="198" r="14" fill="#6EE7B7" fill-opacity="0.45"/>
    <circle cx="242" cy="198" r="8" fill="#34D399" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="182" cy="212" r="12" fill="#FEF08A" fill-opacity="0.42"/>
    <circle cx="182" cy="212" r="7" fill="#FDE047" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
  <!-- Sweeping Cream Glide Trail behind Paper-Plane Glider -->
  <path d="M36,78 Q106,104 176,120" fill="none" stroke="#FFFBEB" stroke-width="7" stroke-dasharray="14 10" stroke-linecap="round" stroke-opacity="0.88"/>
  <!-- Hero Crisp Folded Paper-Plane Glider Diving Over Island! -->
  <g transform="translate(216,122) rotate(16)">
    <!-- Soft sky shadow glow -->
    <ellipse cx="-6" cy="28" rx="64" ry="14" fill="#0C4A6E" fill-opacity="0.22"/>
    <!-- Left/Upper Cream Folded Paper Wing -->
    <polygon points="82,0 -62,-44 -28,-4" fill="#F2E4C8" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- Right/Lower Warm Terracotta-Coral Folded Wing -->
    <polygon points="82,0 -62,44 -28,4" fill="#E36D4B" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- Crisp Folded Center Keel & Spine Highlight -->
    <polygon points="82,0 -44,0 -62,14" fill="#C25235"/>
    <polygon points="84,0 -52,-8 -40,0 -52,8" fill="#FFFFFF"/>
  </g>
</svg>
