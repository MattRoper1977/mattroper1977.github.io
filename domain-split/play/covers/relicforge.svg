<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="rf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#314C7D"/>
      <stop offset="56%" stop-color="#4F588F"/>
      <stop offset="100%" stop-color="#785269"/>
    </linearGradient>
    <radialGradient id="rf-spark" cx="0.54" cy="0.48" r="0.45">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#314C7D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#rf-bg)"/>
  <rect width="640" height="360" fill="url(#rf-spark)"/>
  <!-- Foundry arena floor grid -->
  <polygon points="0,256 640,256 640,360 0,360" fill="#2A3F6E"/>
  <g stroke="#93C5FD" stroke-opacity="0.35" stroke-width="2">
    <line x1="0" y1="290" x2="640" y2="290"/><line x1="0" y1="328" x2="640" y2="328"/>
    <line x1="160" y1="256" x2="70" y2="360"/><line x1="320" y1="256" x2="320" y2="360"/><line x1="480" y1="256" x2="570" y2="360"/>
  </g>
  <!-- Heavy Coral-Armored Vault Guard Boss Robot on right losing its arm -->
  <g transform="translate(486,188)">
    <ellipse cx="0" cy="88" rx="68" ry="18" fill="#1E293B" fill-opacity="0.45"/>
    <rect x="-54" y="-58" width="108" height="96" rx="16" fill="#E11D48" stroke="#FFE4E6" stroke-width="4"/>
    <rect x="-36" y="-42" width="72" height="24" rx="8" fill="#1E293B"/>
    <rect x="-26" y="-36" width="52" height="12" rx="5" fill="#FDE047"/>
    <circle cx="0" cy="8" r="18" fill="#FB923C" stroke="#FEF9C3" stroke-width="3.5"/>
    <!-- Legs -->
    <rect x="-40" y="38" width="26" height="44" rx="7" fill="#9F1239"/>
    <rect x="14" y="38" width="26" height="44" rx="7" fill="#9F1239"/>
    <!-- Sparking broken shoulder socket -->
    <circle cx="-58" cy="-26" r="18" fill="#FDE047"/>
    <circle cx="-58" cy="-26" r="9" fill="#FFFFFF"/>
  </g>
  <!-- Magnetic Golden Salvage Beam pulling detached robot claw-arm to Hero -->
  <path d="M238,166 Q326,104 388,154" fill="none" stroke="#FBBF24" stroke-width="14" stroke-dasharray="12 10" stroke-linecap="round"/>
  <path d="M238,166 Q326,104 388,154" fill="none" stroke="#FEF9C3" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Popped-off Glowing Mechanical Robot Arm + Shield Module mid-air -->
  <g transform="translate(352,132) rotate(-26)">
    <circle r="44" fill="#FEF08A" fill-opacity="0.34"/>
    <rect x="-38" y="-14" width="66" height="28" rx="9" fill="#F59E0B" stroke="#FEF9C3" stroke-width="4"/>
    <polygon points="24,-22 50,-10 34,0 50,10 24,22" fill="#E2E8F0" stroke="#475569" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="-24" cy="0" r="9" fill="#67E8F9"/>
  </g>
  <!-- Impact blast starburst -->
  <polygon points="416,136 424,158 448,162 426,174 432,196 412,182 392,192 400,170 384,154 406,156" fill="#FEF08A" stroke="#F97316" stroke-width="3"/>
  <!-- Hero Modular Cyan & Gold Mech rebuilding itself on left -->
  <g transform="translate(178,202)">
    <ellipse cx="0" cy="80" rx="58" ry="16" fill="#0F172A" fill-opacity="0.4"/>
    <!-- Legs -->
    <rect x="-34" y="34" width="22" height="42" rx="6" fill="#1E3A8A" stroke="#93C5FD" stroke-width="2.5"/>
    <rect x="12" y="34" width="22" height="42" rx="6" fill="#1E3A8A" stroke="#93C5FD" stroke-width="2.5"/>
    <!-- Modular Chassis -->
    <polygon points="-44,-46 44,-46 34,36 -34,36" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- Helmet head & glowing cyan visor -->
    <rect x="-26" y="-82" width="52" height="36" rx="12" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3.5"/>
    <rect x="-18" y="-70" width="36" height="12" rx="5" fill="#FEF08A"/>
    <!-- Left Aegis Shield -->
    <polygon points="-68,-38 -42,-28 -42,26 -68,16" fill="#67E8F9" stroke="#FFFFFF" stroke-width="3.5"/>
    <!-- Right Arc Carbine blaster -->
    <rect x="38" y="-20" width="54" height="20" rx="6" fill="#F59E0B" stroke="#FEF9C3" stroke-width="3"/>
    <circle cx="94" cy="-10" r="10" fill="#67E8F9"/>
  </g>
</svg>
