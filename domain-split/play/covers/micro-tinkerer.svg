<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="mt-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8C7B6B"/>
      <stop offset="100%" stop-color="#B59F8A"/>
    </linearGradient>
    <linearGradient id="mt-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9935E"/>
      <stop offset="100%" stop-color="#9A683B"/>
    </linearGradient>
    <linearGradient id="mt-torch" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.92"/>
      <stop offset="65%" stop-color="#FEF08A" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Warm Sunlit Giant's Study Room Wall & Wooden Desk/Floor -->
  <rect width="640" height="218" fill="url(#mt-wall)"/>
  <rect x="0" y="218" width="640" height="142" fill="url(#mt-wood)"/>
  <line x1="0" y1="218" x2="640" y2="218" stroke="#784C26" stroke-width="5"/>
  <!-- Colossal Stacked Hardcover Books on Left (Giant Scale!) -->
  <g stroke="#1E293B" stroke-width="3.5">
    <rect x="20" y="138" width="198" height="44" rx="6" fill="#2563EB"/>
    <rect x="20" y="148" width="198" height="24" fill="#FAF7F0"/>
    <rect x="34" y="96" width="176" height="42" rx="6" fill="#DC2626"/>
    <rect x="34" y="106" width="176" height="22" fill="#FEF3C7"/>
    <rect x="52" y="58" width="152" height="38" rx="6" fill="#16A34A"/>
  </g>
  <!-- Giant Yellow Wooden Pencil angled across wooden study floor -->
  <g transform="translate(274,256) rotate(-14)">
    <rect x="-110" y="-14" width="190" height="28" rx="4" fill="#FACC15" stroke="#92400E" stroke-width="3"/>
    <polygon points="80,-14 126,0 80,14" fill="#FED7AA" stroke="#92400E" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="108,-6 126,0 108,6" fill="#334155"/>
    <rect x="-132" y="-14" width="24" height="28" rx="5" fill="#F472B6" stroke="#92400E" stroke-width="3"/>
  </g>
  <!-- Colossal Glowing Black-and-Gold Cylinder Battery Goal on Right (Zero Text!) -->
  <g transform="translate(508,196)">
    <circle r="76" fill="#6EE7B7" fill-opacity="0.32"/>
    <!-- Battery positive silver terminal nub -->
    <rect x="-18" y="-92" width="36" height="16" rx="5" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
    <!-- Copper-gold top third -->
    <rect x="-42" y="-76" width="84" height="54" rx="10" fill="#F59E0B" stroke="#FEF9C3" stroke-width="4"/>
    <!-- Sleek dark slate body -->
    <rect x="-42" y="-26" width="84" height="106" rx="8" fill="#1E293B" stroke="#94A3B8" stroke-width="4"/>
    <!-- Lightning power icon (pure geometry!) -->
    <polygon points="6,-10 -14,26 2,26 -8,62 18,20 2,20" fill="#6EE7B7"/>
  </g>
  <!-- Huge Sweeping Giant Flashlight Torch Beam from Upper Right! -->
  <polygon points="560,0 640,0 640,54 342,360 158,360" fill="url(#mt-torch)"/>
  <ellipse cx="268" cy="316" rx="110" ry="28" fill="#FEF9C3" fill-opacity="0.52"/>
  <!-- Giant Ceramic Coffee Mug Providing Stealth Cover on Left -->
  <g transform="translate(114,252)">
    <path d="M54,-28 A28,28 0 0 1 54,32" fill="none" stroke="#E0F2FE" stroke-width="14" stroke-linecap="round"/>
    <rect x="-54" y="-54" width="108" height="114" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="4"/>
    <rect x="-54" y="-14" width="108" height="28" fill="#38BDF8"/>
  </g>
  <!-- Hero Tiny Agile Micro-Tinkerer Peeking Right Beside Giant Mug Outside Beam! -->
  <g transform="translate(206,294)">
    <ellipse cx="0" cy="24" rx="22" ry="7" fill="#451A03" fill-opacity="0.4"/>
    <!-- Tiny cyan cloak & bright adventure cap -->
    <polygon points="0,-16 20,20 -20,20" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="0" cy="-26" r="14" fill="#FDE68A" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M-14,-28 Q0,-50 18,-28 Z" fill="#F97316" stroke="#FEF9C3" stroke-width="2.5"/>
    <circle cx="6" cy="-26" r="3" fill="#0F172A"/>
  </g>
</svg>
