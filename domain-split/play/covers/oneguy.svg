<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="og-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#404EA0"/>
      <stop offset="56%" stop-color="#6E5CB8"/>
      <stop offset="100%" stop-color="#4878B5"/>
    </linearGradient>
    <radialGradient id="og-core" cx="0.78" cy="0.34" r="0.36">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#313B80" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#og-sky)"/>
  <rect width="640" height="360" fill="url(#og-core)"/>
  <!-- City skyline rooftops silhouette -->
  <path d="M0,256 H86 V194 H154 V246 H266 V178 H332 V256 H468 V188 H544 V248 H640 V360 H0 Z" fill="#27326B" fill-opacity="0.62"/>
  <!-- Neon Runner Rooftop Platforms + Spiked Pit Gap -->
  <rect x="0" y="274" width="218" height="86" fill="#375B9E"/>
  <rect x="0" y="268" width="218" height="12" rx="4" fill="#67E8F9"/>
  <rect x="412" y="252" width="228" height="108" fill="#375B9E"/>
  <rect x="412" y="246" width="228" height="12" rx="4" fill="#67E8F9"/>
  <!-- Glowing Coral Spikes in the gap -->
  <g fill="#FB7185" stroke="#FFF1F2" stroke-width="3" stroke-linejoin="round">
    <polygon points="230,354 256,304 282,354"/>
    <polygon points="282,354 308,304 334,354"/>
    <polygon points="334,354 360,304 386,354"/>
  </g>
  <!-- Sweeping Predictive One-Button Jump Arc -->
  <path d="M98,252 Q264,58 476,162" fill="none" stroke="#67E8F9" stroke-width="14" stroke-linecap="round" stroke-opacity="0.38"/>
  <path d="M98,252 Q264,58 476,162" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Translucent Glowing Magenta GHOST Copy of the Runner trailing behind! -->
  <g transform="translate(212,174) rotate(-14)" opacity="0.72">
    <circle r="44" fill="#E879F9" fill-opacity="0.32"/>
    <path d="M-8,14 L-26,42 M8,14 L26,34" stroke="#F0ABFC" stroke-width="13" stroke-linecap="round"/>
    <rect x="-14" y="-18" width="28" height="38" rx="10" fill="#E879F9" stroke="#FAE8FF" stroke-width="3.5" stroke-dasharray="8 5"/>
    <circle cx="0" cy="-34" r="15" fill="#F0ABFC" stroke="#FFFFFF" stroke-width="3"/>
  </g>
  <!-- Hero Solid Bright Cyan-Gold Runner Leaping Ahead Past His Own Ghost! -->
  <g transform="translate(366,144) rotate(12)">
    <circle r="52" fill="#38BDF8" fill-opacity="0.32"/>
    <!-- Flowing bright yellow scarf -->
    <path d="M-12,-12 Q-52,-18 -78,-2 Q-48,4 -10,4 Z" fill="#FDE047"/>
    <!-- Striding athletic legs -->
    <path d="M-8,18 L-30,44 L-44,36" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10,18 L34,38 L46,52" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pumping arms -->
    <path d="M12,-10 L40,-24" stroke="#FDE047" stroke-width="11" stroke-linecap="round"/>
    <path d="M-12,-8 L-36,12" stroke="#FDE047" stroke-width="11" stroke-linecap="round"/>
    <!-- Torso & head -->
    <rect x="-16" y="-22" width="32" height="44" rx="11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="2" cy="-40" r="18" fill="#F8FAFC" stroke="#38BDF8" stroke-width="4"/>
    <rect x="6" y="-46" width="14" height="8" rx="3" fill="#FACC15"/>
  </g>
  <!-- Radiant Floating Gold Signal Core Target on right -->
  <g transform="translate(524,158)">
    <circle r="44" fill="#FEF08A" fill-opacity="0.36"/>
    <polygon points="0,-32 28,0 0,32 -28,0" fill="#FBBF24" stroke="#FFFFFF" stroke-width="4.5"/>
    <polygon points="0,-16 14,0 0,16 -14,0" fill="#FFFFFF"/>
  </g>
</svg>
