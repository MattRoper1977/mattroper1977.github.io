<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="vf-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="56%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="vf-beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="52%" stop-color="#67E8F9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <!-- Sweeping Panoramic Voxel Horizon Sky -->
  <rect width="640" height="360" fill="url(#vf-sky)"/>
  <!-- Blocky floating voxel clouds -->
  <g fill="#FFFFFF" fill-opacity="0.88">
    <rect x="44" y="42" width="112" height="24" rx="4"/><rect x="68" y="26" width="64" height="20" rx="4"/>
    <rect x="464" y="54" width="128" height="24" rx="4"/><rect x="498" y="38" width="62" height="18" rx="4"/>
  </g>
  <!-- Massive Radiant Vertical BEACON Light Beam shooting into the sky! -->
  <rect x="382" y="0" width="84" height="248" fill="#67E8F9" fill-opacity="0.34"/>
  <rect x="402" y="0" width="44" height="248" fill="url(#vf-beam)"/>
  <rect x="416" y="0" width="16" height="248" fill="#FFFFFF" fill-opacity="0.86"/>
  <!-- Left Floating Voxel Cliff Island with Cascading Cyan Waterfall -->
  <g>
    <rect x="18" y="210" width="176" height="26" fill="#22C55E"/>
    <rect x="18" y="236" width="176" height="62" fill="#64748B"/>
    <rect x="46" y="298" width="118" height="36" fill="#475569"/>
    <!-- Waterfall blocks pouring down -->
    <rect x="128" y="210" width="38" height="150" fill="#38BDF8"/>
    <rect x="140" y="210" width="14" height="150" fill="#BAE6FD" fill-opacity="0.72"/>
  </g>
  <!-- Right Stepped Voxel Mountain Plateau + Glowing Beacon Pyramid -->
  <g>
    <rect x="298" y="276" width="342" height="84" fill="#16A34A"/>
    <rect x="318" y="242" width="290" height="36" fill="#22C55E"/>
    <rect x="336" y="278" width="272" height="82" fill="#8B5A3C"/>
    <!-- Stepped stone Beacon pedestal -->
    <rect x="356" y="220" width="136" height="24" fill="#94A3B8" stroke="#E2E8F0" stroke-width="3"/>
    <rect x="380" y="198" width="88" height="24" fill="#CBD5E1" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Glowing Golden Beacon Core Block -->
    <rect x="402" y="160" width="44" height="44" fill="#FDE047" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <!-- Hero Flying Voxel Explorer soaring across sky toward the Beacon! -->
  <g transform="translate(238,144) rotate(-14)">
    <!-- Wing flight wind ribbons -->
    <path d="M-46,4 L-126,18 M-42,-10 L-114,-4" stroke="#FEF9C3" stroke-width="6" stroke-linecap="round" stroke-opacity="0.82"/>
    <!-- Glider wings -->
    <polygon points="-24,-10 18,-36 34,-10 -24,2" fill="#F97316" stroke="#FEF9C3" stroke-width="3"/>
    <polygon points="-24,10 18,36 34,10 -24,-2" fill="#FB923C" stroke="#FEF9C3" stroke-width="3"/>
    <!-- Chunky Voxel Explorer Body & Head -->
    <rect x="-24" y="-12" width="44" height="24" rx="4" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="18" y="-16" width="26" height="26" rx="4" fill="#FDE68A" stroke="#FFFFFF" stroke-width="3"/>
    <rect x="32" y="-10" width="10" height="8" fill="#1E293B"/>
  </g>
</svg>
