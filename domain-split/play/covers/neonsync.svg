<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="nsy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283C78"/>
      <stop offset="55%" stop-color="#345294"/>
      <stop offset="100%" stop-color="#26407A"/>
    </linearGradient>
    <radialGradient id="nsy-zone" cx="0.5" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#283C78" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#nsy-bg)"/>
  <rect width="640" height="360" fill="url(#nsy-zone)"/>
  <!-- Top-down cyber arena grid lines -->
  <g stroke="#93C5FD" stroke-opacity="0.24" stroke-width="2">
    <path d="M0,90 H640 M0,180 H640 M0,270 H640"/>
    <path d="M128,0 V360 M256,0 V360 M384,0 V360 M512,0 V360"/>
  </g>
  <!-- Hero Central Octagonal 3v3 Capture Zone turning Mint-Teal! -->
  <g transform="translate(320,180)">
    <polygon points="-64,-124 64,-124 124,-64 124,64 64,124 -64,124 -124,64 -124,-64" fill="#2DD4BF" fill-opacity="0.22" stroke="#5EEAD4" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="-44,-88 44,-88 88,-44 88,44 44,88 -44,88 -88,44 -88,-44" fill="none" stroke="#FEF08A" stroke-width="4" stroke-dasharray="16 12"/>
  </g>
  <!-- Glowing Golden-Cyan Synergy Tether Triangle linking the 3 Cyan Teammates! -->
  <polygon points="246,136 392,148 310,248" fill="#67E8F9" fill-opacity="0.22" stroke="#FEF08A" stroke-width="10" stroke-linejoin="round" stroke-opacity="0.6"/>
  <polygon points="246,136 392,148 310,248" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- 3 Cyan Teammate Heroes holding the zone together -->
  <g transform="translate(246,136)">
    <circle r="32" fill="#38BDF8" fill-opacity="0.35"/>
    <circle r="24" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="4.5"/>
    <polygon points="0,-12 12,8 -12,8" fill="#FEF08A"/>
  </g>
  <g transform="translate(392,148)">
    <circle r="32" fill="#38BDF8" fill-opacity="0.35"/>
    <circle r="24" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="4.5"/>
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#5EEAD4"/>
  </g>
  <g transform="translate(310,248)">
    <circle r="36" fill="#67E8F9" fill-opacity="0.4"/>
    <circle r="26" fill="#38BDF8" stroke="#FFFFFF" stroke-width="5"/>
    <polygon points="0,-14 14,0 0,14 -14,0" fill="#FFFFFF"/>
  </g>
  <!-- Incoming Pink-Coral Rival Trio attacking from perimeter -->
  <g stroke="#FFE4E6" stroke-width="4">
    <line x1="112" y1="88" x2="210" y2="124" stroke="#FB7185" stroke-width="8" stroke-linecap="round"/>
    <circle cx="102" cy="84" r="22" fill="#F43F5E"/>
    <line x1="538" y1="98" x2="430" y2="136" stroke="#FB7185" stroke-width="8" stroke-linecap="round"/>
    <circle cx="546" cy="94" r="22" fill="#F43F5E"/>
    <line x1="528" y1="276" x2="424" y2="238" stroke="#FB7185" stroke-width="8" stroke-linecap="round"/>
    <circle cx="536" cy="280" r="22" fill="#F43F5E"/>
  </g>
</svg>
