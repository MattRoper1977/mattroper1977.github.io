<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="nb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3F528C"/>
      <stop offset="56%" stop-color="#556CA8"/>
      <stop offset="100%" stop-color="#3D528A"/>
    </linearGradient>
    <radialGradient id="nb-blast" cx="0.46" cy="0.44" r="0.46">
      <stop offset="0%" stop-color="#FEF9C3" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#2D3B68" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#nb-bg)"/>
  <rect width="640" height="360" fill="url(#nb-blast)"/>
  <!-- Perspective Industrial Cyber FPS Arena Hall & Amber Pillars -->
  <polygon points="0,248 640,248 640,360 0,360" fill="#354A82"/>
  <g stroke="#7DD3FC" stroke-opacity="0.32" stroke-width="2.5">
    <line x1="210" y1="248" x2="40" y2="360"/><line x1="430" y1="248" x2="600" y2="360"/>
    <line x1="0" y1="296" x2="640" y2="296"/>
  </g>
  <g fill="#475569" stroke="#F59E0B" stroke-width="4">
    <rect x="44" y="34" width="64" height="248" rx="6"/>
    <rect x="532" y="34" width="64" height="248" rx="6"/>
  </g>
  <line x1="76" y1="54" x2="76" y2="256" stroke="#FDE047" stroke-width="6"/>
  <line x1="564" y1="54" x2="564" y2="256" stroke="#FDE047" stroke-width="6"/>
  <!-- Escalating Swarm of Spiky Crimson-Orange Hover Drones -->
  <!-- Background Drone Left -->
  <g transform="translate(178,128) scale(0.76)">
    <polygon points="0,-36 44,0 0,36 -44,0" fill="#F97316" stroke="#FFEDD5" stroke-width="4"/>
    <circle r="14" fill="#FEF08A"/>
  </g>
  <!-- Background Drone Right -->
  <g transform="translate(464,122) scale(0.76)">
    <polygon points="0,-36 44,0 0,36 -44,0" fill="#F43F5E" stroke="#FFF1F2" stroke-width="4"/>
    <circle r="14" fill="#FEF08A"/>
  </g>
  <!-- Center Target Hover Drone locked in Crosshair! -->
  <g transform="translate(308,162)">
    <polygon points="-78,-12 -42,-36 42,-36 78,-12 42,36 -42,36" fill="#E11D48" stroke="#FFE4E6" stroke-width="4.5" stroke-linejoin="round"/>
    <circle r="24" fill="#1E293B" stroke="#FB7185" stroke-width="4"/>
    <circle r="12" fill="#FEF08A"/>
  </g>
  <!-- Blazing Gold-White Laser Shot from Rifle Straight into Crosshair! -->
  <line x1="484" y1="274" x2="314" y2="166" stroke="#FBBF24" stroke-width="22" stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="484" y1="274" x2="314" y2="166" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Hit impact starburst -->
  <polygon points="312,126 322,152 348,158 324,170 328,196 308,178 282,188 294,164 276,144 302,150" fill="#FEF9C3"/>
  <!-- Crisp Glowing Cyan First-Person Crosshair Reticle -->
  <g transform="translate(308,162)" fill="none" stroke="#67E8F9" stroke-width="4.5" stroke-linecap="round">
    <circle r="66" stroke-dasharray="32 20"/>
    <line x1="-88" y1="0" x2="-46" y2="0"/><line x1="46" y1="0" x2="88" y2="0"/>
    <line x1="0" y1="-88" x2="0" y2="-46"/><line x1="0" y1="46" x2="0" y2="88"/>
  </g>
  <!-- Foreground First-Person Sleek Cyan-Gold Pulse Rifle Barrel (Bottom-Right) -->
  <g transform="translate(526,296) rotate(-32)">
    <rect x="-86" y="-26" width="194" height="58" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="5"/>
    <rect x="-74" y="-14" width="136" height="16" rx="5" fill="#F59E0B"/>
    <rect x="-52" y="10" width="94" height="10" rx="4" fill="#67E8F9"/>
    <circle cx="-86" cy="2" r="14" fill="#FEF08A"/>
  </g>
