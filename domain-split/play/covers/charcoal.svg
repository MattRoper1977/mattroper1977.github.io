<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ch-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDD0B6"/>
      <stop offset="100%" stop-color="#C5B493"/>
    </linearGradient>
    <linearGradient id="ch-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A68F6C"/>
      <stop offset="100%" stop-color="#8A7250"/>
    </linearGradient>
  </defs>
  <!-- Warm sunlit art gallery studio -->
  <rect width="640" height="232" fill="url(#ch-wall)"/>
  <rect x="0" y="232" width="640" height="128" fill="url(#ch-floor)"/>
  <!-- Background gallery frames -->
  <rect x="44" y="48" width="96" height="114" rx="6" fill="#FAF7F0" stroke="#927A54" stroke-width="6"/>
  <circle cx="92" cy="104" r="26" fill="#6EE7B7"/>
  <rect x="502" y="48" width="96" height="114" rx="6" fill="#FAF7F0" stroke="#927A54" stroke-width="6"/>
  <polygon points="550,78 574,126 526,126" fill="#F59E0B"/>
  <!-- Smoky charcoal dust trail across studio floor -->
  <g fill="#475569" fill-opacity="0.48">
    <ellipse cx="146" cy="298" rx="44" ry="16"/>
    <ellipse cx="216" cy="284" rx="52" ry="18"/>
    <ellipse cx="288" cy="272" rx="48" ry="17"/>
    <circle cx="176" cy="264" r="14"/><circle cx="242" cy="248" r="18"/>
  </g>
  <!-- Center Wooden Artist Easel + Vivid Framed Canvas -->
  <g transform="translate(316,170)">
    <!-- Easel legs -->
    <line x1="-68" y1="142" x2="-14" y2="-134" stroke="#92400E" stroke-width="14" stroke-linecap="round"/>
    <line x1="68" y1="142" x2="14" y2="-134" stroke="#92400E" stroke-width="14" stroke-linecap="round"/>
    <rect x="-106" y="72" width="212" height="16" rx="6" fill="#B45309"/>
    <!-- Framed vivid colorful artwork on easel -->
    <rect x="-92" y="-106" width="184" height="178" rx="8" fill="#FFFFFF" stroke="#78350F" stroke-width="9"/>
    <rect x="-76" y="-90" width="152" height="146" fill="#E0F2FE"/>
    <circle cx="-26" cy="-34" r="34" fill="#34D399"/>
    <polygon points="28,-66 64,22 -8,22" fill="#F59E0B"/>
    <circle cx="38" cy="-54" r="18" fill="#FB7185"/>
    <!-- Bold Diagonal Charcoal Smudge Streak crossing artwork! -->
    <path d="M-74,38 Q-12,-6 74,-62" fill="none" stroke="#334155" stroke-width="34" stroke-linecap="round" stroke-opacity="0.72"/>
    <path d="M-66,30 Q-6,-12 68,-58" fill="none" stroke="#1E293B" stroke-width="14" stroke-dasharray="18 8" stroke-linecap="round" stroke-opacity="0.78"/>
  </g>
  <!-- Hero Left: Bold Tilted Charcoal Stick smudging canvas -->
  <g transform="translate(178,196) rotate(-36)">
    <rect x="-78" y="-18" width="144" height="36" rx="7" fill="#334155" stroke="#0F172A" stroke-width="4"/>
    <polygon points="66,-18 96,0 66,18" fill="#1E293B"/>
    <rect x="-66" y="-10" width="96" height="8" rx="4" fill="#64748B"/>
  </g>
  <!-- Hero Right: Gleaming Golden-Mint Fixative Spray Can restoring art -->
  <g transform="translate(494,234) rotate(-18)">
    <!-- Sparkling mint restoration mist cone -->
    <polygon points="-24,-54 -152,-124 -138,-22" fill="#6EE7B7" fill-opacity="0.46"/>
    <g fill="#FFFFFF">
      <circle cx="-68" cy="-68" r="6"/><circle cx="-102" cy="-84" r="5"/>
      <circle cx="-94" cy="-50" r="6"/><circle cx="-126" cy="-64" r="4.5"/>
    </g>
    <!-- Spray can body -->
    <rect x="-32" y="-36" width="64" height="106" rx="12" fill="#F59E0B" stroke="#FEF9C3" stroke-width="4"/>
    <rect x="-32" y="-4" width="64" height="44" fill="#34D399"/>
    <path d="M-24,-36 C-24,-56 24,-56 24,-36 Z" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
    <rect x="-12" y="-66" width="24" height="16" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>
    <circle cx="-10" cy="-58" r="4" fill="#0F766E"/>
  </g>
</svg>
