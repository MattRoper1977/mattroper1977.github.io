<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="tf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B3A7D"/>
      <stop offset="56%" stop-color="#6A4882"/>
      <stop offset="100%" stop-color="#9A5952"/>
    </linearGradient>
    <radialGradient id="tf-aura" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.72"/>
      <stop offset="55%" stop-color="#FB923C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B3A7D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#tf-bg)"/>
  <rect width="640" height="360" fill="url(#tf-aura)"/>
  <!-- Gym forge platform floor -->
  <polygon points="40,300 600,300 640,360 0,360" fill="#475569"/>
  <rect x="115" y="294" width="410" height="22" rx="6" fill="#F59E0B" stroke="#FEF3C7" stroke-width="3"/>
  <!-- Giant glowing rhythm-lift timing target ring behind lifter -->
  <g transform="translate(320,178)">
    <circle r="130" fill="none" stroke="#93C5FD" stroke-width="10" stroke-opacity="0.42"/>
    <!-- Bright green sweet-spot arc at top -->
    <path d="M-54,-118 A130,130 0 0 1 54,-118" fill="none" stroke="#34D399" stroke-width="20" stroke-linecap="round"/>
    <path d="M-24,-128 A130,130 0 0 1 24,-128" fill="none" stroke="#FEF08A" stroke-width="14" stroke-linecap="round"/>
    <!-- Inner golden power ring -->
    <circle r="92" fill="none" stroke="#FDE047" stroke-width="5" stroke-dasharray="14 10" stroke-opacity="0.75"/>
    <!-- Sweet spot diamond spark at 12 o'clock -->
    <polygon points="0,-152 14,-128 0,-104 -14,-128" fill="#FFFFFF" stroke="#34D399" stroke-width="3.5"/>
  </g>
  <!-- Ascending energy power chevrons on sides -->
  <g fill="none" stroke="#67E8F9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.82">
    <polyline points="116,246 138,224 160,246"/>
    <polyline points="116,214 138,192 160,214"/>
    <polyline points="480,246 502,224 524,246"/>
    <polyline points="480,214 502,192 524,214"/>
  </g>
  <!-- Stylized heroic Titan lifter hoisting heavy barbell overhead -->
  <g transform="translate(320,214)">
    <!-- Legs planted wide -->
    <polygon points="-38,20 -12,20 -28,84 -58,84" fill="#1E293B" stroke="#93C5FD" stroke-width="2.5"/>
    <polygon points="38,20 12,20 28,84 58,84" fill="#1E293B" stroke="#93C5FD" stroke-width="2.5"/>
    <!-- Broad golden-teal athletic torso -->
    <polygon points="-50,-46 50,-46 34,26 -34,26" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="0,-34 18,-10 0,14 -18,-10" fill="#FDE047"/>
    <!-- Head -->
    <circle cx="0" cy="-68" r="20" fill="#FDBA74" stroke="#FEF3C7" stroke-width="3"/>
    <!-- Powerful raised arms gripping barbell -->
    <path d="M-46,-38 L-86,-96 L-82,-120" fill="none" stroke="#FDBA74" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46,-38 L86,-96 L82,-120" fill="none" stroke="#FDBA74" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Hero Massive Olympic Barbell + Glowing Weight Plates -->
    <rect x="-188" y="-128" width="376" height="14" rx="7" fill="#E2E8F0" stroke="#475569" stroke-width="3"/>
    <!-- Left plates -->
    <rect x="-178" y="-164" width="22" height="86" rx="7" fill="#38BDF8" stroke="#E0F2FE" stroke-width="3"/>
    <rect x="-152" y="-176" width="26" height="110" rx="8" fill="#F59E0B" stroke="#FEF9C3" stroke-width="3.5"/>
    <rect x="-122" y="-158" width="18" height="74" rx="6" fill="#FB7185" stroke="#FFE4E6" stroke-width="3"/>
    <!-- Right plates -->
    <rect x="156" y="-164" width="22" height="86" rx="7" fill="#38BDF8" stroke="#E0F2FE" stroke-width="3"/>
    <rect x="126" y="-176" width="26" height="110" rx="8" fill="#F59E0B" stroke="#FEF9C3" stroke-width="3.5"/>
    <rect x="104" y="-158" width="18" height="74" rx="6" fill="#FB7185" stroke="#FFE4E6" stroke-width="3"/>
  </g>
</svg>
