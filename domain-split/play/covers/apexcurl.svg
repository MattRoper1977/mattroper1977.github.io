<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ac-ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="48%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="ac-granite" cx="0.35" cy="0.32" r="0.65">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="55%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
  </defs>
  <!-- Frosty Bright Glacier-White & Pale-Ice Curling Sheet -->
  <rect width="640" height="360" fill="url(#ac-ice)"/>
  <!-- Side Rink Boards & Center Tee Lines -->
  <polygon points="0,0 74,0 24,360 0,360" fill="#1E3A8A"/>
  <polygon points="640,0 566,0 616,360 640,360" fill="#1E3A8A"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="60" y1="122" x2="580" y2="122" stroke="#EF4444" stroke-width="3" stroke-opacity="0.45"/>
  <!-- Giant Iconic Concentric Curling HOUSE Target Rings (Upper Center!) -->
  <g transform="translate(320,122)">
    <ellipse rx="188" ry="80" fill="#2563EB" stroke="#FFFFFF" stroke-width="5"/>
    <ellipse rx="134" ry="57" fill="#FFFFFF"/>
    <ellipse rx="82" ry="35" fill="#EF4444"/>
    <ellipse rx="32" ry="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4"/>
  </g>
  <!-- Rival Red-Handle Stone sitting near edge of House -->
  <g transform="translate(418,104) scale(0.54)">
    <ellipse cx="0" cy="22" rx="68" ry="30" fill="#334155" stroke="#CBD5E1" stroke-width="5"/>
    <ellipse cx="0" cy="10" rx="64" ry="26" fill="#64748B"/>
    <rect x="-24" y="-12" width="54" height="16" rx="8" fill="#EF4444" stroke="#FFFFFF" stroke-width="4"/>
  </g>
  <!-- Curving Cyan Curl Trajectory Arc into the Golden Button! -->
  <path d="M224,264 C202,196 244,142 316,124" fill="none" stroke="#0EA5E9" stroke-width="11" stroke-dasharray="14 10" stroke-linecap="round"/>
  <circle cx="320" cy="122" r="14" fill="#FEF08A" stroke="#F59E0B" stroke-width="4"/>
  <!-- Sparkling Swept Ice Shimmer right in front of Hero Stone -->
  <g fill="#FFFFFF">
    <polygon points="282,190 287,202 299,207 287,212 282,224 277,212 265,207 277,202"/>
    <circle cx="256" cy="176" r="6"/><circle cx="316" cy="196" r="5"/>
  </g>
  <!-- Hero Glossy Granite Curling Stone with Bright Gold Handle Sliding Smoothly! -->
  <g transform="translate(226,268)">
    <ellipse cx="6" cy="36" rx="84" ry="32" fill="#0284C7" fill-opacity="0.32"/>
    <ellipse cx="0" cy="18" rx="82" ry="34" fill="url(#ac-granite)" stroke="#E2E8F0" stroke-width="4.5"/>
    <!-- Bright yellow striking band around middle of granite stone -->
    <path d="M-80,14 Q0,38 80,14 L80,26 Q0,50 -80,26 Z" fill="#FACC15"/>
    <ellipse cx="0" cy="0" rx="72" ry="28" fill="#94A3B8" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Curved Golden Curling Handle -->
    <path d="M-24,-4 C-24,-28 24,-28 44,-14" fill="none" stroke="#F59E0B" stroke-width="18" stroke-linecap="round"/>
    <path d="M-24,-4 C-24,-28 24,-28 44,-14" fill="none" stroke="#FEF08A" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- Crisp Angled Curling Broom actively Sweeping Ice Ahead of Stone! -->
  <g transform="translate(366,222) rotate(-32)">
    <!-- Broom handle -->
    <rect x="-8" y="-140" width="16" height="156" rx="6" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="3.5"/>
    <!-- Broom pad head -->
    <rect x="-44" y="10" width="88" height="26" rx="10" fill="#F43F5E" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="-36" y="26" width="72" height="10" rx="4" fill="#FEF08A"/>
  </g>
</svg>
