<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="tr-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="tr-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <!-- Breezy Coastal Sky with Gathering Storm Cloud on Far Left -->
  <rect width="640" height="168" fill="url(#tr-sky)"/>
  <g fill="#334155" fill-opacity="0.72">
    <ellipse cx="90" cy="48" rx="96" ry="38"/><ellipse cx="176" cy="56" rx="74" ry="28"/>
  </g>
  <polyline points="118,86 102,118 120,118 106,148" fill="none" stroke="#FDE047" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sparkling Turquoise Sea on Right -->
  <rect x="330" y="152" width="310" height="208" fill="url(#tr-sea)"/>
  <g fill="none" stroke="#E0F2FE" stroke-width="4" stroke-linecap="round" stroke-opacity="0.72">
    <path d="M474,186 Q506,178 538,186 T602,186"/>
    <path d="M510,236 Q544,228 578,236 T634,236"/>
    <path d="M538,292 Q574,284 612,292"/>
  </g>
  <!-- Green Coastal Headland & Golden Sand Dunes Sweeping Forward -->
  <path d="M0,148 Q186,124 388,162 L494,360 H0 Z" fill="#22C55E"/>
  <path d="M126,360 C176,262 276,204 364,162 L442,166 C394,224 416,282 544,360 Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="4"/>
  <!-- Prickly Green Gorse Bush & Dark Bog Mud Hazard on Trail -->
  <g transform="translate(274,274)">
    <ellipse cx="0" cy="24" rx="54" ry="18" fill="#57534E" stroke="#A8A29E" stroke-width="3"/>
    <polygon points="-34,12 -18,-18 -2,2 14,-24 32,12" fill="#15803D" stroke="#FACC15" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <!-- Shimmering Floating Cyan-Gold Rescue Tuning Ring (Goal!) Ahead on Trail -->
  <g transform="translate(418,176)">
    <ellipse rx="56" ry="56" fill="#67E8F9" fill-opacity="0.26"/>
    <ellipse rx="44" ry="52" fill="#E0F2FE" fill-opacity="0.24" stroke="#0284C7" stroke-width="14"/>
    <ellipse rx="44" ry="52" fill="none" stroke="#67E8F9" stroke-width="7"/>
    <ellipse rx="32" ry="38" fill="none" stroke="#FEF08A" stroke-width="5.5" stroke-dasharray="16 10"/>
  </g>
  <!-- Hero Trail Runner in Bright Coral Jacket & Cyan Pack Leaping Past Gorse! -->
  <g transform="translate(198,214)">
    <ellipse cx="8" cy="78" rx="46" ry="12" fill="#78350F" fill-opacity="0.32"/>
    <!-- Backpack -->
    <rect x="-42" y="-32" width="26" height="44" rx="9" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="3"/>
    <!-- Striding trail legs + hiking boots -->
    <path d="M-8,20 L-44,54 L-66,48" fill="none" stroke="#1E293B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10,20 L46,42 L38,74" fill="none" stroke="#1E293B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Coral outdoor jacket -->
    <polygon points="-22,-36 22,-30 16,24 -22,20" fill="#F97316" stroke="#FFEDD5" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Pumping arms -->
    <path d="M12,-22 L48,-30" stroke="#F97316" stroke-width="13" stroke-linecap="round"/>
    <path d="M-16,-16 L-44,8" stroke="#F97316" stroke-width="13" stroke-linecap="round"/>
    <!-- Head & bobble beanie -->
    <circle cx="8" cy="-54" r="18" fill="#FDBA74" stroke="#FFF7ED" stroke-width="3"/>
    <path d="M-10,-58 A18,16 0 0 1 26,-58 Z" fill="#FACC15" stroke="#FEF9C3" stroke-width="2.5"/>
    <circle cx="8" cy="-76" r="6" fill="#FEF9C3"/>
  </g>
</svg>
