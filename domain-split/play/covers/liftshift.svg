<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ls-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D4270"/>
      <stop offset="55%" stop-color="#3A5488"/>
      <stop offset="100%" stop-color="#2A3E68"/>
    </linearGradient>
    <radialGradient id="ls-glow" cx="0.5" cy="0.45" r="0.54">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2D4270" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Bright Gadget Mill Blueprint Interior -->
  <rect width="640" height="360" fill="url(#ls-bg)"/>
  <rect width="640" height="360" fill="url(#ls-glow)"/>
  <!-- Subtle background mill gears -->
  <g fill="none" stroke="#93C5FD" stroke-opacity="0.22">
    <circle cx="96" cy="96" r="46" stroke-width="10" stroke-dasharray="14 10"/>
    <circle cx="548" cy="272" r="52" stroke-width="10" stroke-dasharray="14 10"/>
  </g>
  <!-- Five Colour-Coded Gadget Mill Floors (Left & Right Landings with Exact Shape Glyphs — Zero Text!) -->
  <!-- Floor 5 (Top — Sky Rig: Gold #F5BF42 + Star) -->
  <g>
    <rect x="24" y="64" width="204" height="14" rx="4" fill="#F5BF42"/>
    <rect x="412" y="64" width="204" height="14" rx="4" fill="#F5BF42"/>
    <rect x="42" y="20" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#F5BF42" stroke-width="3.5"/>
    <polygon points="64,27 68,36 78,36 70,42 73,51 64,46 55,51 58,42 50,36 60,36" fill="#F5BF42"/>
  </g>
  <!-- Floor 4 (Coil Loft: Sky Cyan #4CC9F0 + Diamond) -->
  <g>
    <rect x="24" y="130" width="204" height="14" rx="4" fill="#4CC9F0"/>
    <rect x="412" y="130" width="204" height="14" rx="4" fill="#4CC9F0"/>
    <rect x="42" y="86" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#4CC9F0" stroke-width="3.5"/>
    <polygon points="64,93 76,106 64,119 52,106" fill="#4CC9F0"/>
  </g>
  <!-- Floor 3 (Gear Bay: Coral Red #FF6B6B + Hexagon) -->
  <g>
    <rect x="24" y="196" width="204" height="14" rx="4" fill="#FF6B6B"/>
    <rect x="412" y="196" width="204" height="14" rx="4" fill="#FF6B6B"/>
    <rect x="42" y="152" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#FF6B6B" stroke-width="3.5"/>
    <polygon points="64,159 75,165 75,179 64,185 53,179 53,165" fill="#FF6B6B"/>
  </g>
  <!-- Floor 2 (Spring Mill: Emerald Mint #2CE6A6 + Triangle) -->
  <g>
    <rect x="24" y="262" width="204" height="14" rx="4" fill="#2CE6A6"/>
    <rect x="412" y="262" width="204" height="14" rx="4" fill="#2CE6A6"/>
    <rect x="42" y="218" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#2CE6A6" stroke-width="3.5"/>
    <polygon points="64,225 77,249 51,249" fill="#2CE6A6"/>
  </g>
  <!-- Floor 1 (Bottom — Base Forge: Lavender #B388FF + Square) -->
  <g>
    <rect x="24" y="328" width="204" height="16" rx="4" fill="#B388FF"/>
    <rect x="412" y="328" width="204" height="16" rx="4" fill="#B388FF"/>
    <rect x="42" y="284" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#B388FF" stroke-width="3.5"/>
    <rect x="52" y="293" width="24" height="22" rx="3" fill="#B388FF"/>
  </g>
  <!-- Right Floor Mirror Glyph Badges (matching shapes on right bays) -->
  <g>
    <rect x="554" y="20" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#F5BF42" stroke-width="3.5"/>
    <polygon points="576,27 580,36 590,36 582,42 585,51 576,46 567,51 570,42 562,36 572,36" fill="#F5BF42"/>
    <rect x="554" y="86" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#4CC9F0" stroke-width="3.5"/>
    <polygon points="576,93 588,106 576,119 564,106" fill="#4CC9F0"/>
    <rect x="554" y="152" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#FF6B6B" stroke-width="3.5"/>
    <polygon points="576,159 587,165 587,179 576,185 565,179 565,165" fill="#FF6B6B"/>
    <rect x="554" y="218" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#2CE6A6" stroke-width="3.5"/>
    <polygon points="576,225 589,249 563,249" fill="#2CE6A6"/>
    <rect x="554" y="284" width="44" height="40" rx="9" fill="#1E2B4A" stroke="#B388FF" stroke-width="3.5"/>
    <rect x="564" y="293" width="24" height="22" rx="3" fill="#B388FF"/>
  </g>
  <!-- Central Steel Lift Shaft Frame -->
  <rect x="228" y="14" width="184" height="332" rx="10" fill="#1E2F54" stroke="#94A3B8" stroke-width="5"/>
  <!-- Shaft guide rails -->
  <line x1="242" y1="22" x2="242" y2="338" stroke="#64748B" stroke-width="3.5"/>
  <line x1="398" y1="22" x2="398" y2="338" stroke="#64748B" stroke-width="3.5"/>
  <!-- Overhead Golden Spoked Pulley Wheel + Taut Pulley Cable Rope! -->
  <g transform="translate(328,54)">
    <!-- Pulley rope running cleanly straight down left (x=-44 -> 284) to Cab and right (x=+44 -> 372) to Counterweight -->
    <path d="M-44,0 V106 M44,0 V174" stroke="#FEF3C7" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M-44,0 A44,32 0 0 1 44,0" fill="none" stroke="#FEF3C7" stroke-width="6.5"/>
    <!-- Twin spoked brass sheaves / big overhead pulley wheel -->
    <circle cx="-14" cy="2" r="30" fill="#475569" stroke="#F5BF42" stroke-width="7"/>
    <line x1="-38" y1="2" x2="10" y2="2" stroke="#FDE047" stroke-width="4.5"/>
    <line x1="-14" y1="-22" x2="-14" y2="26" stroke="#FDE047" stroke-width="4.5"/>
    <circle cx="-14" cy="2" r="9" fill="#FEF9C3" stroke="#B45309" stroke-width="3.5"/>
    <circle cx="32" cy="4" r="14" fill="#475569" stroke="#F5BF42" stroke-width="5"/>
    <circle cx="32" cy="4" r="5" fill="#FEF9C3"/>
  </g>
  <!-- Hero Counterweight Block descending cleanly on Right Rope (Zero Overlap with Cab!) -->
  <g transform="translate(372,256)">
    <rect x="-20" y="-28" width="40" height="56" rx="7" fill="#64748B" stroke="#FF6B6B" stroke-width="4"/>
    <rect x="-14" y="-14" width="28" height="10" rx="3" fill="#FF6B6B"/>
    <rect x="-14" y="4" width="28" height="10" rx="3" fill="#FF6B6B"/>
    <polyline points="-10,42 0,54 10,42" fill="none" stroke="#FF6B6B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Hero Illuminated Counterweight Lift Cab Gliding Upward on Left Rope! -->
  <g transform="translate(288,196)">
    <!-- Upward motion glow chevron above cab -->
    <polyline points="-12,-54 0,-66 12,-54" fill="none" stroke="#2CE6A6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Warm lit lift cab box -->
    <rect x="-44" y="-44" width="88" height="90" rx="10" fill="#FEF3C7" stroke="#F5BF42" stroke-width="6"/>
    <!-- Cab header arch -->
    <rect x="-44" y="-44" width="88" height="18" rx="6" fill="#F5BF42"/>
    <circle cx="0" cy="-35" r="5" fill="#2CE6A6"/>
    <!-- Warm lit interior -->
    <rect x="-32" y="-18" width="64" height="52" rx="4" fill="#FDE68A" stroke="#D97706" stroke-width="3"/>
    <!-- Happy little riding robot already aboard -->
    <g transform="translate(4,14)">
      <rect x="-14" y="-22" width="28" height="24" rx="6" fill="#64748B" stroke="#1E293B" stroke-width="3"/>
      <rect x="-10" y="-16" width="20" height="8" rx="3" fill="#1E293B"/>
      <circle cx="-4" cy="-12" r="2.5" fill="#4CC9F0"/>
      <circle cx="4" cy="-12" r="2.5" fill="#4CC9F0"/>
      <rect x="-10" y="2" width="7" height="7" rx="2" fill="#334155"/>
      <rect x="3" y="2" width="7" height="7" rx="2" fill="#334155"/>
    </g>
  </g>
  <!-- Hero Adorable Little Robot Waiting on Floor 2 (Emerald Landing Left) to Ride Up to Gold Star Floor! -->
  <g transform="translate(166,232)">
    <!-- Floating Destination Thought Bubble Badge showing Gold Star (Floor 5!) -->
    <g transform="translate(0,-68)">
      <circle r="22" fill="#1E2B4A" stroke="#F5BF42" stroke-width="4.5"/>
      <polygon points="0,-13 4,-4 14,-4 6,2 9,13 0,7 -9,13 -6,2 -14,-4 -4,-4" fill="#FDE047"/>
      <polygon points="-5,20 5,20 0,30" fill="#F5BF42"/>
    </g>
    <!-- Cute Chunky Iron Bot waiting eagerly by shaft door -->
    <line x1="0" y1="-26" x2="0" y2="-35" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-37" r="5" fill="#2CE6A6"/>
    <rect x="-20" y="18" width="14" height="12" rx="4" fill="#334155"/>
    <rect x="6" y="18" width="14" height="12" rx="4" fill="#334155"/>
    <rect x="-28" y="-26" width="56" height="46" rx="12" fill="#7788A6" stroke="#FFFFFF" stroke-width="4"/>
    <rect x="-34" y="-12" width="8" height="16" rx="3" fill="#FF6B4A"/>
    <rect x="26" y="-12" width="8" height="16" rx="3" fill="#FF6B4A"/>
    <rect x="-18" y="-16" width="38" height="16" rx="6" fill="#1E293B"/>
    <circle cx="-4" cy="-8" r="4.5" fill="#67E8F9"/>
    <circle cx="10" cy="-8" r="4.5" fill="#67E8F9"/>
    <!-- Waving little arm toward lift -->
    <path d="M28,2 L44,-14" stroke="#E2E8F0" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
