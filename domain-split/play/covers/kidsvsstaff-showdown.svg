<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ks-stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C2E85"/>
      <stop offset="55%" stop-color="#753E9E"/>
      <stop offset="100%" stop-color="#3B2A70"/>
    </linearGradient>
    <radialGradient id="ks-spark" cx="0.5" cy="0.46" r="0.46">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#4C2E85" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Vibrant TV Game Show Studio Stage -->
  <rect width="640" height="360" fill="url(#ks-stage)"/>
  <rect width="640" height="360" fill="url(#ks-spark)"/>
  <!-- Crisscrossing TV stage spotlights -->
  <polygon points="90,0 280,360 110,360" fill="#67E8F9" fill-opacity="0.22"/>
  <polygon points="550,0 530,360 360,360" fill="#FDBA74" fill-opacity="0.22"/>
  <!-- Illuminated semicircular studio stage floor -->
  <ellipse cx="320" cy="340" rx="340" ry="72" fill="#2E1E5C" stroke="#E879F9" stroke-width="5"/>
  <!-- Left Podium: Electric Cyan KIDS Team Buzzer Podium -->
  <g transform="translate(154,234)">
    <!-- Buzzer Dome glowing cyan -->
    <path d="M-46,-46 A46,34 0 0 1 46,-46 Z" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4.5"/>
    <ellipse cx="0" cy="-46" rx="54" ry="12" fill="#E0F2FE" stroke="#0284C7" stroke-width="3.5"/>
    <!-- Podium Desk -->
    <polygon points="-66,-34 66,-34 54,84 -54,84" fill="#0284C7" stroke="#67E8F9" stroke-width="5" stroke-linejoin="round"/>
    <!-- Playful Star Crest on Kids Podium (zero text!) -->
    <polygon points="0,-10 9,10 30,10 13,23 19,43 0,31 -19,43 -13,23 -30,10 -9,10" fill="#FEF08A" stroke="#FFFFFF" stroke-width="3"/>
    <!-- Excited buzzer ring sparks above dome -->
    <path d="M-42,-82 L-56,-98 M0,-94 V-114 M42,-82 L56,-98" stroke="#67E8F9" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Right Podium: Warm Coral-Orange STAFF Team Buzzer Podium -->
  <g transform="translate(486,234)">
    <!-- Buzzer Dome glowing coral-orange -->
    <path d="M-46,-46 A46,34 0 0 1 46,-46 Z" fill="#FB923C" stroke="#FFFFFF" stroke-width="4.5"/>
    <ellipse cx="0" cy="-46" rx="54" ry="12" fill="#FFEDD5" stroke="#EA580C" stroke-width="3.5"/>
    <!-- Podium Desk -->
    <polygon points="-66,-34 66,-34 54,84 -54,84" fill="#EA580C" stroke="#FDBA74" stroke-width="5" stroke-linejoin="round"/>
    <!-- Stylized Mortarboard Cap Icon on Staff Podium (zero text!) -->
    <polygon points="0,-6 36,12 0,28 -36,12" fill="#FEF08A" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-20,20 V34 Q0,44 20,34 V20" fill="#FDE047" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="36" y1="12" x2="36" y2="38" stroke="#FEF9C3" stroke-width="4" stroke-linecap="round"/>
    <!-- Buzzer sparks above dome -->
    <path d="M-42,-82 L-56,-98 M0,-94 V-114 M42,-82 L56,-98" stroke="#FDBA74" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Center Dazzling Golden Showdown Lightning Bolt splitting the stage -->
  <g transform="translate(320,174)">
    <circle r="68" fill="#FEF08A" fill-opacity="0.34"/>
    <polygon points="18,-102 -36,4 4,4 -22,102 42,-12 2,-12" fill="#FDE047" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  </g>
</svg>
