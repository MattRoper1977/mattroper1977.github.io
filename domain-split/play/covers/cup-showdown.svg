<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="cs-pitch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <radialGradient id="cs-clash" cx="0.5" cy="0.52" r="0.45">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#15803D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Vibrant Sunlit Emerald Arena Pitch Floor -->
  <rect width="640" height="360" fill="url(#cs-pitch)"/>
  <!-- Pitch mowing stripes & center circle -->
  <g fill="#4ADE80" fill-opacity="0.24">
    <rect x="0" y="0" width="90" height="360"/><rect x="180" y="0" width="90" height="360"/>
    <rect x="360" y="0" width="90" height="360"/><rect x="540" y="0" width="100" height="360"/>
  </g>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5"/>
  <circle cx="320" cy="188" r="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="5"/>
  <rect width="640" height="360" fill="url(#cs-clash)"/>
  <!-- Crackling Squad Energy Lightning Arcs converging on Center Football -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="148,224 214,198 232,216 296,192" stroke="#38BDF8" stroke-width="14" stroke-opacity="0.55"/>
    <polyline points="148,224 214,198 232,216 296,192" stroke="#FFFFFF" stroke-width="5"/>
    <polyline points="492,224 426,198 408,216 344,192" stroke="#FB7185" stroke-width="14" stroke-opacity="0.55"/>
    <polyline points="492,224 426,198 408,216 344,192" stroke="#FFFFFF" stroke-width="5"/>
    <polyline points="320,88 308,132 332,144 320,176" stroke="#FDE047" stroke-width="14" stroke-opacity="0.6"/>
    <polyline points="320,88 308,132 332,144 320,176" stroke="#FFFFFF" stroke-width="5"/>
  </g>
  <!-- Three Geometric Class Squad Shields (Blue, Red, Gold-White - zero flags/text!) -->
  <!-- Squad 1: Away Blue Shield (Left) -->
  <g transform="translate(132,226)">
    <path d="M-50,-52 H50 V6 C50,42 0,66 0,66 C0,66 -50,42 -50,6 Z" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="5.5" stroke-linejoin="round"/>
    <polygon points="0,-30 22,4 0,36 -22,4" fill="#E0F2FE"/>
  </g>
  <!-- Squad 2: Away Red Shield (Right) -->
  <g transform="translate(508,226)">
    <path d="M-50,-52 H50 V6 C50,42 0,66 0,66 C0,66 -50,42 -50,6 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="5.5" stroke-linejoin="round"/>
    <polygon points="0,-28 24,22 -24,22" fill="#FEF08A"/>
  </g>
  <!-- Squad 3: Home Gold-White Shield (Top Center) -->
  <g transform="translate(320,76)">
    <path d="M-44,-44 H44 V4 C44,36 0,56 0,56 C0,56 -44,36 -44,4 Z" fill="#F8FAFC" stroke="#F59E0B" stroke-width="5.5" stroke-linejoin="round"/>
    <polygon points="0,-26 8,-6 28,-6 12,6 18,26 0,14 -18,26 -12,6 -28,-6 -8,-6" fill="#F59E0B"/>
  </g>
  <!-- Hero Center Blazing Clash Starburst & Football -->
  <polygon points="320,118 338,158 382,148 358,184 394,212 346,214 334,258 308,220 262,232 284,192 252,162 298,162" fill="#FDE047" stroke="#F97316" stroke-width="4"/>
  <g transform="translate(320,192)">
