<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="ws-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="65%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="ws-track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <!-- Bright championship stadium sky -->
  <rect width="640" height="175" fill="url(#ws-sky)"/>
  <!-- Stadium sweeping stand bowl -->
  <path d="M0,126 Q320,86 640,126 V176 H0 Z" fill="#1E40AF"/>
  <path d="M0,146 Q320,112 640,146" fill="none" stroke="#93C5FD" stroke-width="5"/>
  <path d="M0,164 Q320,134 640,164" fill="none" stroke="#38BDF8" stroke-width="6"/>
  <!-- Stadium floodlight pylons -->
  <circle cx="96" cy="46" r="16" fill="#FEF9C3"/>
  <circle cx="544" cy="46" r="16" fill="#FEF9C3"/>
  <!-- Emerald infield strip + vibrant terracotta athletics track -->
  <rect x="0" y="172" width="640" height="30" fill="#22C55E"/>
  <rect x="0" y="198" width="640" height="162" fill="url(#ws-track)"/>
  <!-- Perspective track lane lines -->
  <g stroke="#FFF7ED" stroke-width="4" stroke-opacity="0.88">
    <line x1="0" y1="224" x2="640" y2="224"/>
    <line x1="0" y1="258" x2="640" y2="258"/>
    <line x1="0" y1="298" x2="640" y2="298"/>
    <line x1="0" y1="342" x2="640" y2="342"/>
  </g>
  <!-- Crisp white finish line & fluttering finish tape -->
  <line x1="396" y1="198" x2="466" y2="360" stroke="#FFFFFF" stroke-width="10"/>
  <path d="M358,214 Q418,228 484,218" fill="none" stroke="#FEF08A" stroke-width="9" stroke-linecap="round"/>
  <rect x="352" y="198" width="10" height="72" rx="4" fill="#F8FAFC"/>
  <rect x="478" y="206" width="10" height="76" rx="4" fill="#F8FAFC"/>
  <!-- Speed lines behind sprinter -->
  <g stroke="#FEF08A" stroke-width="5.5" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="88" y1="202" x2="176" y2="202"/>
    <line x1="64" y1="236" x2="162" y2="236"/>
    <line x1="104" y1="270" x2="188" y2="270"/>
  </g>
  <!-- Hero Dynamic Sprinter bursting through finish tape -->
  <g transform="translate(292,238)">
    <ellipse cx="6" cy="72" rx="64" ry="14" fill="#7C2D12" fill-opacity="0.45"/>
    <!-- Back leg & front driving leg -->
    <path d="M-8,12 L-56,42 L-82,66" fill="none" stroke="#1E293B" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12,12 L52,32 L38,68" fill="none" stroke="#1E293B" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Sprint jersey leaning forward -->
    <polygon points="-24,-42 28,-30 14,22 -28,12" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="-14,-34 14,-28 6,8 -18,2" fill="#FDE047"/>
    <!-- Pumping arms -->
    <path d="M12,-28 L54,-14 L78,-34" fill="none" stroke="#FDBA74" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-16,-28 L-56,-8 L-72,-28" fill="none" stroke="#FDBA74" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Head -->
    <circle cx="24" cy="-58" r="20" fill="#FDBA74" stroke="#FFF7ED" stroke-width="3"/>
  </g>
  <!-- Radiant Gold Medal on Cyan Ribbon upper-right -->
  <g transform="translate(526,112)">
    <circle r="60" fill="#FEF08A" fill-opacity="0.34"/>
    <polygon points="-28,-88 0,-20 28,-88 10,-88 0,-46 -10,-88" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="2.5"/>
    <circle r="38" fill="#F59E0B" stroke="#FEF9C3" stroke-width="5"/>
    <circle r="28" fill="#FDE047"/>
    <polygon points="0,-18 5,-5 19,-5 8,3 12,16 0,8 -12,16 -8,3 -19,-5 -5,-5" fill="#FFFFFF"/>
  </g>
</svg>
