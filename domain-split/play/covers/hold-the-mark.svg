<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="hm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283F73"/>
      <stop offset="55%" stop-color="#35568E"/>
      <stop offset="100%" stop-color="#29487A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#hm-bg)"/>
  <!-- Crisp blueprint defense grid -->
  <g stroke="#93C5FD" stroke-opacity="0.24" stroke-width="1.8">
    <path d="M0,72 H640 M0,144 H640 M0,216 H640 M0,288 H640"/>
    <path d="M80,0 V360 M160,0 V360 M240,0 V360 M320,0 V360 M400,0 V360 M480,0 V360 M560,0 V360"/>
  </g>
  <!-- Winding sunlit sand S-path for enemy glitches -->
  <path d="M36,286 H204 C252,286 252,180 302,180 H386 C434,180 434,114 522,114" fill="none" stroke="#B45309" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36,286 H204 C252,286 252,180 302,180 H386 C434,180 434,114 522,114" fill="none" stroke="#FDE68A" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36,286 H204 C252,286 252,180 302,180 H386 C434,180 434,114 522,114" fill="none" stroke="#F59E0B" stroke-width="4" stroke-dasharray="14 14" stroke-linecap="round"/>
  <!-- Tower 1: Mint Ring Slow Tower + expanding cyan-mint ripple -->
  <g transform="translate(182,164)">
    <circle r="72" fill="#5EEAD4" fill-opacity="0.22" stroke="#5EEAD4" stroke-width="3.5" stroke-dasharray="10 8"/>
    <circle r="34" fill="#1E3A6D" stroke="#5EEAD4" stroke-width="5.5"/>
    <circle r="18" fill="none" stroke="#CCFBF1" stroke-width="8"/>
  </g>
  <!-- Tower 2: Amber Star Splash Tower firing golden bolt -->
  <line x1="358" y1="274" x2="278" y2="210" stroke="#FDE047" stroke-width="14" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="358" y1="274" x2="278" y2="210" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(358,274)">
    <circle r="36" fill="#1E3A6D" stroke="#FBBF24" stroke-width="5.5"/>
    <polygon points="0,-24 7,-7 24,-7 10,4 15,21 0,11 -15,21 -10,4 -24,-7 -7,-7" fill="#FDE047" stroke="#FEF9C3" stroke-width="2"/>
  </g>
  <!-- Tower 3: Periwinkle Square Bastion Tower upper-center -->
  <line x1="344" y1="88" x2="364" y2="178" stroke="#93C5FD" stroke-width="12" stroke-linecap="round" stroke-opacity="0.52"/>
  <line x1="344" y1="88" x2="364" y2="178" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(344,88)">
    <rect x="-32" y="-32" width="64" height="64" rx="14" fill="#1E3A6D" stroke="#93C5FD" stroke-width="5.5"/>
    <rect x="-17" y="-17" width="34" height="34" rx="6" fill="#60A5FA" stroke="#EFF6FF" stroke-width="3"/>
  </g>
  <!-- Jagged Crimson Glitch Enemies marching down path -->
  <g fill="#F43F5E" stroke="#FFF1F2" stroke-width="3.5" stroke-linejoin="round">
    <polygon points="108,266 134,286 108,306 88,286"/>
    <polygon points="178,264 204,286 178,308 158,286"/>
    <polygon points="274,186 300,208 274,230 250,208"/>
    <polygon points="366,158 392,180 366,202 342,180"/>
  </g>
  <!-- Splash starburst impact on path -->
  <polygon points="278,184 286,202 306,206 288,216 292,236 276,222 258,232 266,214 252,198 270,200" fill="#FEF08A"/>
  <!-- Hero Protected Mark Crest at Goal (zero letters: geometric emblem!) -->
  <g transform="translate(524,114)">
    <circle r="66" fill="#5EEAD4" fill-opacity="0.28"/>
    <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#1E3A6D" stroke="#5EEAD4" stroke-width="6.5"/>
    <circle r="28" fill="none" stroke="#FEF9C3" stroke-width="6.5"/>
    <polygon points="0,-16 14,0 0,16 -14,0" fill="#FBBF24"/>
  </g>
</svg>
