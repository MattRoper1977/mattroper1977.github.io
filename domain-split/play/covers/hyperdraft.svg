<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="hd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E46AA"/>
      <stop offset="52%" stop-color="#8A54B8"/>
      <stop offset="100%" stop-color="#3D6BB0"/>
    </linearGradient>
    <linearGradient id="hd-funnel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <!-- High-Voltage Electric Speed Arena -->
  <rect width="640" height="360" fill="url(#hd-bg)"/>
  <!-- Angled sweeping banked asphalt highway -->
  <polygon points="0,192 640,74 640,360 0,360" fill="#3E5494"/>
  <g stroke="#F472B6" stroke-width="5" stroke-opacity="0.65">
    <line x1="0" y1="192" x2="640" y2="74"/>
    <line x1="0" y1="344" x2="640" y2="218"/>
  </g>
  <!-- Hero Massive Glowing Golden-Cyan VACUUM DRAFT FUNNEL CONE between cars! -->
  <polygon points="444,142 518,178 278,312 186,214" fill="url(#hd-funnel)"/>
  <!-- Vacuum funnel vortex rings & electric capacitor bolts -->
  <g fill="none" stroke="#E0F2FE" stroke-width="4.5" stroke-opacity="0.85">
    <ellipse cx="420" cy="186" rx="22" ry="42" transform="rotate(-24 420 186)"/>
    <ellipse cx="348" cy="222" rx="30" ry="56" transform="rotate(-24 348 222)"/>
  </g>
  <!-- Crackling Yellow Capacitor Lightning Bolts charging Hero Car! -->
  <g fill="none" stroke="#FEF08A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="434,158 378,186 392,202 326,222"/>
    <polyline points="462,188 408,224 422,238 352,262"/>
  </g>
  <!-- Lead Rival Crimson-Orange Supercar Ahead Upper-Right -->
  <g transform="translate(492,144) rotate(-14)">
    <polygon points="-66,18 -52,-16 56,-22 80,-2 68,22 -64,24" fill="#F97316" stroke="#FEF3C7" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="-24,-16 26,-20 44,-4 -14,-2" fill="#1E293B"/>
    <rect x="-72" y="-24" width="24" height="12" rx="4" fill="#EF4444" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>
  <!-- Hero Electric-Blue Wedge Hypercar Supercharged & Slingshotting Out! -->
  <g transform="translate(226,258) rotate(-14)">
    <!-- Blazing twin boost exhaust flames -->
    <polygon points="-88,-10 -174,0 -88,18" fill="#F43F5E"/>
    <polygon points="-88,-4 -142,2 -88,12" fill="#FEF08A"/>
    <!-- Supercar wedge chassis -->
    <polygon points="-92,20 -78,-18 28,-32 104,-6 92,24 -86,28" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="-32,-20 34,-26 62,-8 -14,-4" fill="#1E293B" stroke="#67E8F9" stroke-width="3"/>
    <!-- Glowing yellow charged capacitor core stripe on hood -->
    <polygon points="36,-10 92,-4 86,8 28,4" fill="#FDE047"/>
    <!-- Sharp wheels -->
    <circle cx="-54" cy="26" r="20" fill="#0F172A" stroke="#67E8F9" stroke-width="4"/>
    <circle cx="58" cy="24" r="20" fill="#0F172A" stroke="#67E8F9" stroke-width="4"/>
  </g>
</svg>
