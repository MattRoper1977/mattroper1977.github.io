<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="gp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4255A6"/>
      <stop offset="56%" stop-color="#7F67BA"/>
      <stop offset="100%" stop-color="#E08296"/>
    </linearGradient>
    <radialGradient id="gp-anchor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#323F84" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#gp-sky)"/>
  <!-- Distant neon skyline silhouettes -->
  <path d="M0,295 H74 V216 H134 V268 H198 V186 H262 V274 H392 V204 H456 V266 H532 V176 H604 V295 H640 V360 H0 Z" fill="#3B478C" fill-opacity="0.68"/>
  <!-- Glowing Magenta Energy Floor below -->
  <rect x="0" y="318" width="640" height="42" fill="#9D174D"/>
  <line x1="0" y1="318" x2="640" y2="318" stroke="#F472B6" stroke-width="8"/>
  <line x1="0" y1="318" x2="640" y2="318" stroke="#FCE7F3" stroke-width="3"/>
  <!-- Sweeping pendulum swing arc trail -->
  <path d="M108,218 C178,298 318,288 418,202 C464,162 508,128 558,118" fill="none" stroke="#67E8F9" stroke-width="14" stroke-linecap="round" stroke-opacity="0.38"/>
  <path d="M108,218 C178,298 318,288 418,202 C464,162 508,128 558,118" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="14 10" stroke-linecap="round"/>
  <!-- Overhead Neon Grapple Anchor Hook Ring -->
  <g transform="translate(318,76)">
    <circle r="68" fill="url(#gp-anchor)"/>
    <circle r="30" fill="#1E3A8A" stroke="#FDE047" stroke-width="7"/>
    <circle r="14" fill="#FEF9C3"/>
  </g>
  <!-- Next overhead anchor ahead on far right -->
  <g transform="translate(558,86)">
    <circle r="22" fill="#1E3A8A" stroke="#67E8F9" stroke-width="5"/>
    <circle r="8" fill="#E0F2FE"/>
  </g>
  <!-- Taut Glowing Grapple Rope connecting anchor to courier -->
  <line x1="318" y1="76" x2="394" y2="210" stroke="#FBBF24" stroke-width="12" stroke-linecap="round" stroke-opacity="0.45"/>
  <line x1="318" y1="76" x2="394" y2="210" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Collectible Golden Speed-Sparks along high release arc -->
  <g fill="#FEF08A" stroke="#F59E0B" stroke-width="2.5">
    <polygon points="468,142 475,158 492,165 475,172 468,188 461,172 444,165 461,158"/>
    <polygon points="524,112 530,124 542,130 530,136 524,148 518,136 506,130 518,124"/>
  </g>
  <!-- Hero Agile Cyan Neon Courier swinging dynamically upward! -->
  <g transform="translate(396,218) rotate(-26)">
    <circle r="48" fill="#38BDF8" fill-opacity="0.28"/>
    <!-- Flowing scarf trail -->
    <path d="M-12,-14 Q-58,-6 -88,16 Q-56,16 -10,4 Z" fill="#F472B6" stroke="#FCE7F3" stroke-width="2.5"/>
    <!-- Legs tucked mid-swing -->
    <path d="M-8,18 L-28,44 L-12,56" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M8,18 L24,42 L44,36" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Torso & raised grapple arm -->
    <rect x="-15" y="-20" width="30" height="44" rx="11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3.5"/>
    <path d="M0,-14 L4,-46" stroke="#E0F2FE" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-36" r="16" fill="#F8FAFC" stroke="#38BDF8" stroke-width="3.5"/>
    <rect x="4" y="-42" width="12" height="7" rx="3" fill="#FDE047"/>
  </g>
</svg>
