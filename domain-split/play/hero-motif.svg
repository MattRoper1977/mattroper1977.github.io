<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" fill="none">
  <defs>
    <radialGradient id="aura-cyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#5ef2d6" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#090c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura-violet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="58%" stop-color="#7c3aed" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura-gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#090c12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="plate-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3139"/>
      <stop offset="52%" stop-color="#152234"/>
      <stop offset="100%" stop-color="#1e1b38"/>
    </linearGradient>
    <linearGradient id="rim-mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5ef2d6" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#5ef2d6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="prism-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7efce4"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="prism-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="prism-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="violet-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="play-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ef7dd"/>
      <stop offset="100%" stop-color="#2ad1b2"/>
    </linearGradient>
  </defs>

  <!-- Ambient Seamless Glows (Zero hard box!) -->
  <circle cx="510" cy="185" r="245" fill="url(#aura-cyan)"/>
  <circle cx="255" cy="335" r="235" fill="url(#aura-violet)"/>
  <circle cx="405" cy="280" r="165" fill="url(#aura-gold)"/>

  <!-- Precision Isometric Light Rays -->
  <g stroke-linecap="round">
    <line x1="88" y1="428" x2="294" y2="309" stroke="#5ef2d6" stroke-opacity="0.2" stroke-width="1.5"/>
    <line x1="452" y1="448" x2="688" y2="312" stroke="#a78bfa" stroke-opacity="0.24" stroke-width="1.5"/>
    <line x1="158" y1="168" x2="366" y2="48" stroke="#5ef2d6" stroke-opacity="0.18" stroke-width="1.5"/>
    <line x1="560" y1="112" x2="695" y2="34" stroke="#fbbf24" stroke-opacity="0.26" stroke-width="2"/>
  </g>

  <!-- Layer 1 (Bottom-Left): Tactical Strategy & Radar Deck -->
  <g transform="translate(198 368) rotate(-11)">
    <rect x="-124" y="-68" width="248" height="148" rx="22" fill="#05080f" fill-opacity="0.62"/>
    <rect x="-132" y="-76" width="248" height="148" rx="22" fill="url(#plate-dark)" stroke="#334155" stroke-width="1.75"/>
    <path d="M-110 -75 H94" stroke="#f8fafc" stroke-opacity="0.18" stroke-width="1.2"/>
    <rect x="-108" y="-54" width="54" height="6" rx="3" fill="#fbbf24" fill-opacity="0.75"/>
    <!-- Hex / Radar Rings -->
    <circle cx="-26" cy="8" r="38" stroke="#fbbf24" stroke-opacity="0.28" stroke-width="1.6" stroke-dasharray="5 5"/>
    <circle cx="-26" cy="8" r="22" stroke="#5ef2d6" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M-26 8 L4 -12" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="4" cy="-12" r="5" fill="#fbbf24"/>
    <circle cx="-26" cy="8" r="5.5" fill="#5ef2d6"/>
    <!-- Mini Stat Bars -->
    <rect x="34" y="-22" width="56" height="8" rx="4" fill="#334155"/>
    <rect x="34" y="-22" width="40" height="8" rx="4" fill="#5ef2d6"/>
    <rect x="34" y="-4" width="56" height="8" rx="4" fill="#334155"/>
    <rect x="34" y="-4" width="32" height="8" rx="4" fill="#a78bfa"/>
    <rect x="34" y="14" width="56" height="8" rx="4" fill="#334155"/>
    <rect x="34" y="14" width="46" height="8" rx="4" fill="#fbbf24"/>
  </g>

  <!-- Layer 2 (Center-Left): Isometric Voxel & World Builder Stage -->
  <g transform="translate(348 276) rotate(-5)">
    <rect x="-126" y="-72" width="256" height="154" rx="24" fill="#05080f" fill-opacity="0.68"/>
    <rect x="-134" y="-80" width="256" height="154" rx="24" fill="url(#plate-dark)" stroke="#475569" stroke-width="1.75"/>
    <path d="M-110 -79 H98" stroke="#f8fafc" stroke-opacity="0.22" stroke-width="1.2"/>
    <rect x="-110" y="-58" width="62" height="6" rx="3" fill="#a78bfa" fill-opacity="0.8"/>
    <!-- Isometric Stepped Voxel Towers -->
    <!-- Base Cube 1 -->
    <g transform="translate(-48 16)">
      <polygon points="0,-24 28,-10 0,4 -28,-10" fill="url(#prism-top)"/>
      <polygon points="-28,-10 0,4 0,32 -28,18" fill="url(#prism-left)"/>
      <polygon points="28,-10 0,4 0,32 28,18" fill="url(#prism-right)"/>
    </g>
    <!-- Tall Violet Spire Cube -->
    <g transform="translate(-4 -6)">
      <polygon points="0,-32 28,-18 0,-4 -28,-18" fill="url(#violet-top)"/>
      <polygon points="-28,-18 0,-4 0,38 -28,24" fill="#7c3aed"/>
      <polygon points="28,-18 0,-4 0,38 28,24" fill="#5b21b6"/>
    </g>
    <!-- Front Mint Cube -->
    <g transform="translate(32 20)">
      <polygon points="0,-20 24,-8 0,4 -24,-8" fill="url(#prism-top)"/>
      <polygon points="-24,-8 0,4 0,26 -24,14" fill="url(#prism-left)"/>
      <polygon points="24,-8 0,4 0,26 24,14" fill="url(#prism-right)"/>
    </g>
    <!-- Glowing Trajectory Arc -->
    <path d="M-76 28 C -42 -42, 34 -52, 76 -4" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
    <circle cx="76" cy="-4" r="6" fill="#fbbf24"/>
  </g>

  <!-- Layer 3 (Top-Right Focal Marquee): Luminous Launch Core -->
  <g transform="translate(534 166) rotate(3)">
    <rect x="-132" y="-78" width="268" height="164" rx="26" fill="#04070d" fill-opacity="0.78"/>
    <rect x="-140" y="-86" width="268" height="164" rx="26" fill="url(#plate-hero)" stroke="url(#rim-mint)" stroke-width="2.4"/>
    <path d="M-112 -85 H100" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.4"/>
    <!-- Header Pill Dots -->
    <rect x="-114" y="-62" width="58" height="7" rx="3.5" fill="#5ef2d6" fill-opacity="0.65"/>
    <circle cx="94" cy="-58" r="5" fill="#fbbf24"/>
    <circle cx="76" cy="-58" r="5" fill="#a78bfa" fill-opacity="0.8"/>

    <!-- Orbital Velocity Rings -->
    <ellipse cx="-6" cy="2" rx="78" ry="30" transform="rotate(-15 -6 2)" stroke="#5ef2d6" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M-80 22 A 78 30 -15 0 1 66 -18" stroke="#5ef2d6" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="66" cy="-18" r="6.5" fill="#5ef2d6"/>
    <circle cx="-78" cy="20" r="5" fill="#c084fc"/>

    <!-- Central Glowing Play Medallion -->
    <circle cx="-6" cy="2" r="46" fill="#5ef2d6" fill-opacity="0.14" stroke="#5ef2d6" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="-6" cy="2" r="33" fill="url(#play-core)"/>
    <path d="M-15 -13 L 11 2 L -15 17 Z" fill="#06201b" stroke="#06201b" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- Floating Ambient Sparkles -->
  <g fill="#f8fafc">
    <circle cx="432" cy="84" r="3" fill="#5ef2d6"/>
    <circle cx="678" cy="276" r="3.5" fill="#fbbf24"/>
    <circle cx="132" cy="252" r="3" fill="#a78bfa"/>
    <path d="M276 118 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#5ef2d6" fill-opacity="0.85"/>
    <path d="M624 358 l2.5 6.5 6.5 2.5 -6.5 2.5 -2.5 6.5 -2.5 -6.5 -6.5 -2.5 6.5 -2.5 z" fill="#c084fc" fill-opacity="0.85"/>
  </g>
</svg>
