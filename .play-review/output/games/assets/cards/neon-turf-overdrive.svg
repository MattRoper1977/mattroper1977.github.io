<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Neon Turf: Overdrive</title>
  <desc id="desc">A dark arena floor drawn in perspective, its grid squares half painted cyan and half painted pink where two hover cars have driven. The cars converge on a glowing gold ball at the centre line, and a goal frame stands at the far end.</desc>
  <defs>
    <linearGradient id="ntsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1030"/>
      <stop offset="1" stop-color="#050612"/>
    </linearGradient>
    <linearGradient id="ntfloor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2A78" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#050612" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#28F4FF" stop-opacity="0.30"/>
    </linearGradient>
    <radialGradient id="ntball" cx="36%" cy="32%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFD85A"/>
      <stop offset="1" stop-color="#FF9B42"/>
    </radialGradient>
  </defs>

  <rect width="120" height="96" fill="url(#ntsky)"/>

  <!-- arena floor in perspective -->
  <path d="M0 96 L34 42 L86 42 L120 96 Z" fill="#081026"/>
  <path d="M0 96 L34 42 L86 42 L120 96 Z" fill="url(#ntfloor)"/>
  <g stroke="#28F4FF" stroke-opacity="0.30" stroke-width="0.5" fill="none">
    <path d="M34 42 L0 96"/><path d="M47 42 L26 96"/><path d="M60 42 L60 96"/>
    <path d="M73 42 L94 96"/><path d="M86 42 L120 96"/>
    <path d="M31 50 H89"/><path d="M26 62 H94"/><path d="M19 77 H101"/>
  </g>
  <!-- centre line -->
  <path d="M26 62 H94" stroke="#F4FBFF" stroke-opacity="0.5" stroke-width="0.7"/>

  <!-- painted turf: claimed squares each side -->
  <g opacity="0.6">
    <path d="M26 62 L19 77 L44 77 L47 62 Z" fill="#FF2A78" fill-opacity="0.5"/>
    <path d="M47 62 L44 77 L69 77 L73 62 Z" fill="#28F4FF" fill-opacity="0.42"/>
    <path d="M31 50 L26 62 L47 62 L49 50 Z" fill="#FF2A78" fill-opacity="0.32"/>
  </g>

  <!-- goal frame at the far end -->
  <g stroke="#FFD85A" stroke-width="1" fill="none" opacity="0.85">
    <path d="M50 42 v-8 h20 v8"/>
  </g>

  <!-- the ball on the centre line -->
  <circle cx="60" cy="59" r="5.4" fill="url(#ntball)"/>
  <circle cx="60" cy="59" r="8.6" fill="none" stroke="#FFD85A" stroke-opacity="0.45" stroke-width="0.6"/>

  <!-- hover cars converging -->
  <g stroke="#BFF6FF" stroke-width="0.5">
    <path d="M36 70 l9 -3 l3 4.5 l-9 3.4 z" fill="#FF2A78"/>
    <ellipse cx="41" cy="75.4" rx="6" ry="1.4" fill="#FF2A78" fill-opacity="0.28" stroke="none"/>
  </g>
  <g stroke="#BFF6FF" stroke-width="0.5">
    <path d="M78 68 l-9 -2.6 l-2.6 4.2 l9 3 z" fill="#28F4FF"/>
    <ellipse cx="73" cy="73.2" rx="6" ry="1.4" fill="#28F4FF" fill-opacity="0.28" stroke="none"/>
  </g>

  <!-- boost trails -->
  <path d="M33 72 l-7 2.4" stroke="#FF6AA8" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M81 66.6 l7 2.2" stroke="#7EFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
</svg>
