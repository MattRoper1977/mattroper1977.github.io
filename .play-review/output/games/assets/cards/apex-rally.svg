<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Apex Rally</title>
  <desc id="desc">A duel across the court: two players trading a rally, the exchange traced between them, with a charge meter and its sweet-spot band.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1531"/><stop offset="1" stop-color="#1A2850"/></linearGradient>
    <linearGradient id="charge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72E1B2"/><stop offset=".55" stop-color="#FFB45C"/><stop offset="1" stop-color="#FF737C"/></linearGradient>
  </defs>
  <rect width="120" height="96" rx="10" fill="url(#bg)"/>
  <path d="M24 82 38 26h44l14 56Z" fill="#16234A" stroke="#8FA6D8" stroke-width="1.6"/>
  <path d="M60 26v56M31 54h58" fill="none" stroke="#5E76AC" stroke-width="1"/>
  <path d="M31 54h58" stroke="#0A1330" stroke-width="4.5"/><path d="M31 53h58" stroke="#DDE7FF" stroke-width="1.1"/>
  <path d="M46 72c9-9 3-17 12-22 9-5 6 10 15 4" fill="none" stroke="#FF737C" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="46" cy="72" r="2.6" fill="#FF737C" opacity=".45"/><circle cx="58" cy="50" r="2.2" fill="#FF737C" opacity=".7"/>
  <circle cx="73" cy="54" r="4" fill="#FFD65C" stroke="#FFF" stroke-width="1.3"/>
  <g fill="#DDE7FF"><ellipse cx="45" cy="79" rx="5" ry="2.2" opacity=".22"/><ellipse cx="76" cy="34" rx="4" ry="1.8" opacity=".22"/></g>
  <path d="M45 79v-8" stroke="#72E1B2" stroke-width="3.4" stroke-linecap="round"/><circle cx="45" cy="68" r="3.4" fill="#72E1B2"/>
  <path d="M76 34v-6" stroke="#9D8CFF" stroke-width="3" stroke-linecap="round"/><circle cx="76" cy="26" r="3" fill="#9D8CFF"/>
  <rect x="24" y="87" width="72" height="5" rx="2.5" fill="#26375B"/>
  <rect x="24" y="87" width="47" height="5" rx="2.5" fill="url(#charge)"/>
  <rect x="72" y="86" width="10" height="7" rx="3.5" fill="none" stroke="#FFF" stroke-width="1.2" opacity=".8"/>
  <text x="8" y="15" font-family="system-ui,sans-serif" font-size="7" font-weight="900" fill="#FFF">READ THE COURT</text>
  <text x="8" y="22" font-family="system-ui,sans-serif" font-size="4.6" font-weight="700" fill="#FF737C">DUEL THE BASELINE</text>
</svg>
