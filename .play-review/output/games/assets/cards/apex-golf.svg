<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Apex Golf card artwork</title>
  <desc id="desc">A top-down patterned golf hole with a called score of three and a Call Rating of ninety-five.</desc>
  <defs>
    <pattern id="rough" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#173a25"/><path d="M3 18V0M12 18V0" stroke="#245a34" stroke-width="3"/></pattern>
    <pattern id="fairway" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="28" height="28" fill="#5aa565"/><rect width="9" height="28" fill="#438d50"/></pattern>
    <pattern id="green" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#70b970"/><circle cx="5" cy="5" r="2" fill="#3d8748"/><circle cx="16" cy="15" r="2" fill="#3d8748"/></pattern>
    <pattern id="sand" width="20" height="12" patternUnits="userSpaceOnUse"><rect width="20" height="12" fill="#d7bc75"/><path d="M0 4H20M0 9H20" stroke="#9f8348"/></pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202a49"/><stop offset="1" stop-color="#111629"/></linearGradient>
  </defs>
  <rect width="1200" height="630" rx="40" fill="#111629"/>
  <rect x="34" y="34" width="1132" height="562" rx="30" fill="url(#panel)" stroke="#7C5CFC" stroke-width="4"/>
  <g transform="translate(54 74)">
    <rect width="742" height="482" rx="28" fill="url(#rough)" stroke="#344263" stroke-width="4"/>
    <path d="M80 344C190 300 260 370 360 304S540 205 654 152L698 211C571 263 512 322 397 370S214 390 96 420Z" fill="url(#fairway)" stroke="#b8a7ff" stroke-opacity=".45" stroke-width="3"/>
    <ellipse cx="650" cy="177" rx="78" ry="63" fill="url(#green)" stroke="#f7f4e8" stroke-opacity=".5" stroke-width="3"/>
    <ellipse cx="571" cy="233" rx="52" ry="23" fill="url(#sand)" stroke="#8d733c" stroke-width="3"/>
    <path d="M267 0H347V165C324 178 291 181 267 166Z" fill="#2e83b8" stroke="#b3e5ff" stroke-width="3"/>
    <path d="M278 30q14-13 28 0t28 0M278 62q14-13 28 0t28 0M278 94q14-13 28 0t28 0M278 126q14-13 28 0t28 0" fill="none" stroke="#b3e5ff" stroke-width="4" opacity=".7"/>
    <circle cx="88" cy="385" r="17" fill="#f7f4e8" stroke="#111629" stroke-width="4"/>
    <path d="M88 385C180 356 237 362 327 329" fill="none" stroke="#ffcf5a" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 14"/>
    <path d="m327 329-28-6 13 24Z" fill="#ffcf5a"/>
    <circle cx="650" cy="177" r="13" fill="#0b0f1d" stroke="#f7f4e8" stroke-width="4"/>
    <path d="M650 177V83" stroke="#f7f4e8" stroke-width="5"/>
    <path d="m653 86 57 20-57 20Z" fill="#7C5CFC"/>
    <g fill="#f7f4e8" font-family="system-ui, sans-serif" font-weight="900" font-size="22">
      <text x="42" y="42">WHOLE HOLE · READ VIEW</text><text x="574" y="452">WIND 2.1 m/s →</text>
    </g>
  </g>
  <g transform="translate(830 74)" font-family="system-ui, sans-serif">
    <text x="0" y="55" fill="#ffcf5a" font-size="22" font-weight="900" letter-spacing="5">READ IT · CALL IT</text>
    <text x="0" y="132" fill="#f7f4e8" font-size="68" font-weight="950">APEX</text>
    <text x="0" y="194" fill="#b8a7ff" font-size="68" font-weight="950">GOLF</text>
    <rect y="238" width="286" height="102" rx="18" fill="#171f38" stroke="#344263" stroke-width="3"/>
    <text x="24" y="274" fill="#aab5ce" font-size="18" font-weight="800">YOUR CALL</text>
    <text x="24" y="325" fill="#f7f4e8" font-size="58" font-weight="950">3</text>
    <rect y="360" width="286" height="122" rx="18" fill="#7C5CFC"/>
    <text x="24" y="397" fill="#f7f4e8" font-size="18" font-weight="850">CALL RATING</text>
    <text x="22" y="463" fill="#fff" font-size="70" font-weight="950">95</text>
  </g>
