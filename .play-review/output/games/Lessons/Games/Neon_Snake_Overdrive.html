<style>
  :root{ --accent:#10b981; }
  *{ box-sizing:border-box; }
  body{
    margin:0; overflow:hidden; color:#fff;
    background:#0b0f19;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none;

  #canvas-container{ position:fixed; inset:0; z-index:1; }

  /* HUD */

/* Tier 1 §2.5: 44px minimum touch targets (measured 42px options, 34px save at 390x844) */

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const GRID = 16;
const BASE_SPEED = 160, MIN_SPEED = 75, SPEEDUP_EVERY = 4, SPEEDUP_FACTOR = 0.9;
const SCORE_KEY = 'neonSnakeScores_v1';
const FADE_STEPS = 6;            // head→tail gradient resolution

const SKINS = {
  green: { color: 0x10b981, css: '#10b981', rgb: '16,185,129' },
  blue:  { color: 0x3b82f6, css: '#3b82f6', rgb: '59,130,246' },
  pink:  { color: 0xec4899, css: '#ec4899', rgb: '236,72,153' },
};

/* ============================================================
   STATE
   ============================================================ */
let gameState = 'menu';
let snake = [], dir = { x: 1, z: 0 }, nextDir = { x: 1, z: 0 }, food = { x: 0, z: 0 };
let score = 0, best = 0, timeLimit = 60, timeLeft = 60, foodEaten = 0, gameSpeed = BASE_SPEED;
let pendingScored = false, selectedSkin = 'green';
let tickTimer = null, clockTimer = null;

/* ============================================================
   THREE.JS
   ============================================================ */
let scene, camera, renderer;
let snakeMeshes = [], foodMesh, foodSprite, headSprite, headLight, gridHelper;
let baseCam = { x: 0, y: 0, z: 0 };
let headTarget = { x: GRID / 2, z: GRID / 2 };
let particles = [];

const segGeo  = new THREE.BoxGeometry(0.85, 0.85, 0.85);
const partGeo = new THREE.BoxGeometry(0.16, 0.16, 0.16);
const pMatEat   = new THREE.MeshBasicMaterial({ color: 0xff5a5a, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false });
const pMatDeath = new THREE.MeshBasicMaterial({ color: 0xffffff, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false });
const foodMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xef4444, emissiveIntensity: 0.7, roughness: 0.2 });

let headMat, bodyMats = [];      // bodyMats[0] brightest → fades toward tail
let glowTex;

function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(255,255,255,0.55)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const t = new THREE.Texture(c); t.needsUpdate = true; return t;
}
function makeGlowSprite(colorHex, scale, opacity) {
  const m = new THREE.SpriteMaterial({ map: glowTex, color: colorHex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity });
  const s = new THREE.Sprite(m); s.scale.set(scale, scale, scale); scene.add(s); return s;
}

function buildSnakeMaterials() {
  const c = new THREE.Color(SKINS[selectedSkin].color);
  if (headMat) { headMat.emissive.setHex(SKINS[selectedSkin].color); }
  else headMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: SKINS[selectedSkin].color, emissiveIntensity: 1.0, roughness: 0.12 });
  bodyMats.forEach(m => m.dispose());
  bodyMats = [];
  for (let i = 0; i < FADE_STEPS; i++) {
    const f = 1 - i / FADE_STEPS;                 // 1 near head → ~0 at tail
    bodyMats.push(new THREE.MeshStandardMaterial({
      color: c.clone().multiplyScalar(0.4 + 0.6 * f),
      emissive: c, emissiveIntensity: 0.2 + 0.35 * f, roughness: 0.3
    }));
  }
}

function init3D() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070a12);
  scene.fog = new THREE.FogExp2(0x070a12, 0.03);

  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
  baseCam = { x: GRID / 2, y: 14, z: GRID + 4 };
  camera.position.set(baseCam.x, baseCam.y, baseCam.z);
  camera.lookAt(GRID / 2, 0, GRID / 2);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.22));
  const dl = new THREE.DirectionalLight(0xffffff, 0.6);
  dl.position.set(GRID / 2, 22, GRID / 2 + 6);
  scene.add(dl);

  headLight = new THREE.PointLight(SKINS[selectedSkin].color, 1.7, 8);
  headLight.position.set(GRID / 2, 1.2, GRID / 2);
  scene.add(headLight);

  // floor under the grid so the board reads as a surface, not a void
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(GRID * 1.6, GRID * 1.6),
    new THREE.MeshStandardMaterial({ color: 0x0a0f1c, roughness: 0.55, metalness: 0.35 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(GRID / 2 - 0.5, -0.04, GRID / 2 - 0.5);
  scene.add(floor);

  gridHelper = new THREE.GridHelper(GRID, GRID, SKINS[selectedSkin].color, 0x1b2435);
  gridHelper.position.set(GRID / 2 - 0.5, 0, GRID / 2 - 0.5);
  scene.add(gridHelper);

  glowTex = makeGlowTexture();
  buildSnakeMaterials();

  foodMesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 20, 20), foodMat);
  scene.add(foodMesh);
  foodSprite = makeGlowSprite(0xff4d4d, 2.4, 0.85);
  headSprite = makeGlowSprite(SKINS[selectedSkin].color, 2.8, 0.7);

  addEventListener('resize', onResize);
  animate();
}

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const t = Date.now();

  if (gameState === 'playing') {
    foodMesh.position.y = 0.5 + Math.sin(t * 0.005) * 0.12;
    foodMesh.rotation.y += 0.03;
  }
  foodSprite.position.set(food.x, foodMesh.position.y, food.z);

  // smooth the head glow toward its grid target so movement reads fluid
  headSprite.position.x += (headTarget.x - headSprite.position.x) * 0.35;
  headSprite.position.z += (headTarget.z - headSprite.position.z) * 0.35;
  headSprite.position.y = 0.5;
  headSprite.material.opacity = 0.55 + Math.sin(t * 0.008) * 0.18;
  headLight.position.x += (headTarget.x - headLight.position.x) * 0.35;
  headLight.position.z += (headTarget.z - headLight.position.z) * 0.35;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.position.x += p.userData.v.x; p.position.y += p.userData.v.y; p.position.z += p.userData.v.z;
    p.userData.v.y -= 0.012; p.userData.life -= 0.04;
    const s = Math.max(0, p.userData.life); p.scale.set(s, s, s);
    if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
  }

  FX.update();
  renderer.render(scene, camera);
}

/* ============================================================
   FX
   ============================================================ */
const FX = {
  trauma: 0, flashEl: null,
  init() { this.flashEl = document.getElementById('flash'); },
  shake(a) { this.trauma = Math.min(1, this.trauma + a); },
  flash(col, str) { this.flashEl.style.background = col; this.flashEl.style.opacity = str; },
  update() {
    if (this.trauma > 0) {
      const s = this.trauma * this.trauma;
      camera.position.x = baseCam.x + (Math.random() * 2 - 1) * 0.7 * s;
      camera.position.y = baseCam.y + (Math.random() * 2 - 1) * 0.7 * s;
      this.trauma = Math.max(0, this.trauma - 0.025);
    } else { camera.position.x = baseCam.x; camera.position.y = baseCam.y; }
    const op = parseFloat(this.flashEl.style.opacity) || 0;
    if (op > 0) this.flashEl.style.opacity = Math.max(0, op - 0.05);
  }
};
function burst(x, z, mat, n) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, mat);
    m.position.set(x, 0.45, z);
    m.userData.v = { x: (Math.random() - 0.5) * 0.34, y: Math.random() * 0.34 + 0.05, z: (Math.random() - 0.5) * 0.34 };
    m.userData.life = 1;
    scene.add(m); particles.push(m);
  }
}

/* ============================================================
   AUDIO
   ============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type = 'square', vol = 0.14, slideTo = null) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo !== null) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur);
}
const sfxEat   = () => { tone(620, 0.07, 'square', 0.13); setTimeout(() => tone(880, 0.07, 'square', 0.12), 55); };
const sfxTurn  = () => tone(240, 0.025, 'sine', 0.05);
const sfxDie   = () => tone(300, 0.5, 'sawtooth', 0.16, 60);
const sfxLevel = () => { tone(520, 0.06, 'triangle', 0.1); setTimeout(() => tone(780, 0.09, 'triangle', 0.1), 60); };

/* ============================================================
   HIGH SCORES
   ============================================================ */
function loadScores() { try { return JSON.parse(localStorage.getItem(SCORE_KEY)) || []; } catch (e) { return []; } }
function saveScores(l) { try { localStorage.setItem(SCORE_KEY, JSON.stringify(l)); } catch (e) {} }
function topScores() { return loadScores().sort((a, b) => b.score - a.score).slice(0, 5); }
function bestScore() { const t = topScores(); return t.length ? t[0].score : 0; }
function renderScores() {
  const el = document.getElementById('menu-scores'), list = topScores();
  if (!list.length) { el.innerHTML = '<li class="empty">No scores yet — be the first.</li>'; return; }
  el.innerHTML = list.map((s, i) =>
    `<li class="${i === 0 ? 'top' : ''}"><span>${String(i + 1).padStart(2, '0')}. ${escapeHtml(s.name)}</span><span>${s.score}</span></li>`).join('');
}

/* ============================================================
   GAMEPLAY
   ============================================================ */
function resetRound() {
  snakeMeshes.forEach(m => scene.remove(m)); snakeMeshes = [];
  particles.forEach(p => scene.remove(p)); particles = [];

  snake = [{ x: 5, z: 8 }, { x: 4, z: 8 }, { x: 3, z: 8 }];
  dir = { x: 1, z: 0 }; nextDir = { x: 1, z: 0 };
  score = 0; foodEaten = 0; gameSpeed = BASE_SPEED; pendingScored = false;

  timeLimit = parseInt(document.getElementById('timer-setting').value, 10);
  timeLeft = timeLimit; best = bestScore();

  updateHUD();
  snake.forEach(p => addSegment(p.x, p.z));
  recolorSnake();
  headTarget = { x: snake[0].x, z: snake[0].z };
  headSprite.position.set(snake[0].x, 0.5, snake[0].z);
  headLight.position.set(snake[0].x, 1.2, snake[0].z);
  generateFood();
}

function addSegment(x, z) {
  const m = new THREE.Mesh(segGeo, bodyMats[bodyMats.length - 1]);
  m.position.set(x, 0.43, z);
  scene.add(m); snakeMeshes.push(m);
}

function recolorSnake() {
  for (let i = 0; i < snakeMeshes.length; i++) {
    snakeMeshes[i].material = i === 0 ? headMat : bodyMats[Math.min(FADE_STEPS - 1, Math.floor((i - 1) / 2))];
  }
}

function generateFood() {
  if (snake.length >= GRID * GRID) { endGame('Board cleared!'); return; }
  let ok = false;
  while (!ok) {
    food.x = Math.floor(Math.random() * GRID); food.z = Math.floor(Math.random() * GRID);
    ok = !snake.some(s => s.x === food.x && s.z === food.z);
  }
  foodMesh.position.set(food.x, 0.5, food.z);
  foodSprite.position.set(food.x, 0.5, food.z);
}

function tick() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, z: snake[0].z + dir.z };
  if (head.x < 0 || head.x >= GRID || head.z < 0 || head.z >= GRID) { endGame('Hit the wall'); return; }
  if (snake.some(s => s.x === head.x && s.z === head.z)) { endGame('Bit yourself'); return; }

  snake.unshift(head);
  addSegment(head.x, head.z);
  snakeMeshes.unshift(snakeMeshes.pop());   // newest mesh → front (head index 0)

  headTarget = { x: head.x, z: head.z };

  if (head.x === food.x && head.z === food.z) {
    score += 10; foodEaten++;
    burst(food.x, food.z, pMatEat, 14);
    FX.shake(0.18); FX.flash(SKINS[selectedSkin].css, 0.2);
    sfxEat(); haptic(30);
    if (foodEaten % SPEEDUP_EVERY === 0 && gameSpeed > MIN_SPEED) {
      gameSpeed = Math.max(MIN_SPEED, Math.round(gameSpeed * SPEEDUP_FACTOR));
      startTickLoop(); sfxLevel();
    }
    generateFood(); updateHUD();
  } else {
    snake.pop(); scene.remove(snakeMeshes.pop());
  }
  recolorSnake();
}

function startTickLoop() { clearInterval(tickTimer); tickTimer = setInterval(tick, gameSpeed); }
function startClock() {
  clearInterval(clockTimer);
  if (timeLimit === 0) return;
  clockTimer = setInterval(() => { timeLeft--; updateHUD(); if (timeLeft <= 0) endGame("Time's up"); }, 1000);
}
function updateHUD() {
  document.getElementById('score-val').innerText = score;
  document.getElementById('best-val').innerText = best;
  document.getElementById('timer-val').innerText = timeLimit === 0 ? '∞' : timeLeft;
}

/* ============================================================
   STATE TRANSITIONS
   ============================================================ */
const show = id => document.getElementById(id).classList.remove('hidden-screen');
const hide = id => document.getElementById(id).classList.add('hidden-screen');

function startGame() {
  initAudio(); resetRound(); gameState = 'playing';
  hide('menu-screen'); hide('over-screen'); hide('pause-screen');
  startTickLoop(); startClock();
}
function pauseGame() {
  if (gameState !== 'playing') return;
  gameState = 'paused'; clearInterval(tickTimer); clearInterval(clockTimer); show('pause-screen');
}
function resumeGame() {
  if (gameState !== 'paused') return;
  gameState = 'playing'; hide('pause-screen'); startTickLoop(); startClock();
}
function endGame(reason) {
  if (gameState === 'over') return;
  gameState = 'over'; clearInterval(tickTimer); clearInterval(clockTimer);
  FX.shake(0.9); FX.flash('#ffffff', 0.6); sfxDie(); haptic([80, 40, 120]);
  best = bestScore();
  const isBest = score > 0 && score >= best;
  document.getElementById('over-score').innerText = score;
  document.getElementById('over-reason').innerText = reason;
  window.__mbmAnnounce('Game over: ' + reason + '. Score ' + score + (isBest ? ', a new best.' : '.'));
  document.getElementById('new-best').classList.toggle('hidden', !isBest);
  document.getElementById('initials-block').style.display = score > 0 ? 'flex' : 'none';
  document.getElementById('initials').value = '';
  const sb = document.getElementById('save-score'); sb.disabled = false;
  pendingScored = score > 0;
  show('over-screen');
}
function logScore() {
  if (!pendingScored) return;
  const name = (document.getElementById('initials').value || 'AAA').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || 'AAA';
  const list = loadScores(); list.push({ name, score }); saveScores(list);
  pendingScored = false; document.getElementById('save-score').disabled = true;
  best = bestScore(); updateHUD(); renderScores();
}
function toMenu() {
  gameState = 'menu'; clearInterval(tickTimer); clearInterval(clockTimer);
  best = bestScore(); updateHUD(); renderScores();
  hide('pause-screen'); hide('over-screen'); show('menu-screen');
}

/* ============================================================
   INPUT
   ============================================================ */
function steer(x, z) {
  if (gameState !== 'playing') return;
  if ((x !== 0 && dir.x === -x) || (z !== 0 && dir.z === -z)) return;
  if (nextDir.x === x && nextDir.z === z) return;
  nextDir = { x, z }; sfxTurn(); haptic(8);
}
function haptic(p) { if (navigator.vibrate) navigator.vibrate(p); }

addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': e.preventDefault(); steer(0, -1); break;
    case 'ArrowDown': case 's': case 'S': e.preventDefault(); steer(0, 1); break;
    case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); steer(-1, 0); break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); steer(1, 0); break;
    case 'p': case 'P': gameState === 'playing' ? pauseGame() : resumeGame(); break;
  }
});
function bindPad(id, x, z) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); steer(x, z); }, { passive: false });
  el.addEventListener('mousedown', e => { e.preventDefault(); steer(x, z); });
}
bindPad('pad-up', 0, -1); bindPad('pad-down', 0, 1); bindPad('pad-left', -1, 0); bindPad('pad-right', 1, 0);

let touchStart = null;
const cc = document.getElementById('canvas-container');
cc.addEventListener('touchstart', e => { const t = e.touches[0]; touchStart = { x: t.clientX, y: t.clientY }; }, { passive: true });
cc.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
cc.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0], dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  if (Math.abs(dx) < 26 && Math.abs(dy) < 26) { touchStart = null; return; }
  if (Math.abs(dx) > Math.abs(dy)) steer(dx > 0 ? 1 : -1, 0); else steer(0, dy > 0 ? 1 : -1);
  touchStart = null;
}, { passive: true });

/* Skin selection */
function setSkinUI() {
  document.querySelectorAll('.skin-opt').forEach(btn => {
    const k = btn.dataset.skin, on = k === selectedSkin;
    btn.style.borderColor = on ? SKINS[k].css : '#334155';
    btn.style.background = on ? `rgba(${SKINS[k].rgb},0.18)` : 'rgba(30,41,59,.5)';
    btn.style.color = on ? SKINS[k].css : '#cbd5e1';
  });
}
document.querySelectorAll('.skin-opt').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedSkin = btn.dataset.skin;
    setSkinUI();
    buildSnakeMaterials();
    headLight.color.setHex(SKINS[selectedSkin].color);
    headSprite.material.color.setHex(SKINS[selectedSkin].color);
    if (gridHelper) gridHelper.material.color.setHex(SKINS[selectedSkin].color);
    document.documentElement.style.setProperty('--accent', SKINS[selectedSkin].css);
  });
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('pause-btn').addEventListener('click', () => { if (gameState === 'playing') pauseGame(); });
document.getElementById('resume-btn').addEventListener('click', resumeGame);
document.getElementById('quit-btn').addEventListener('click', toMenu);
document.getElementById('over-menu-btn').addEventListener('click', toMenu);
document.getElementById('save-score').addEventListener('click', logScore);
document.getElementById('initials').addEventListener('keydown', e => { if (e.key === 'Enter') logScore(); });

function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }

/* ============================================================
   BOOT
   ============================================================ */
FX.init();
init3D();
setSkinUI();
document.documentElement.style.setProperty('--accent', SKINS[selectedSkin].css);
best = bestScore();
updateHUD();
renderScores();
</script>
