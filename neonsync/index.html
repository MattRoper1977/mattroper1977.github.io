function damage(w,src,tgt,amount){if(!tgt.alive||tgt.protect>0)return 0;var a=Math.max(0,amount),take=Math.min(tgt.shield,a);tgt.shield-=take;a-=take;if(a>0)tgt.hp-=a;if(src){src.damage+=amount;src.ult=clamp(src.ult+amount*.17,0,hero(src.hero).ult.charge);tgt.lastHit=src.id}if(tgt.hp<=0){tgt.alive=false;tgt.hp=0;tgt.respawn=C.RESPAWN;tgt.cc=tgt.lock=0;if(src){src.elims++;src.ult=clamp(src.ult+9,0,hero(src.hero).ult.charge)}w.events.push({type:'ko',source:src?src.id:null,target:tgt.id,time:w.time})}return amount}

function addEffect(w,e){e.age=0;e.dead=false;w.effects.push(e);return e}
function queueHit(w,src,target,amount,label){return addEffect(w,{type:'hit',team:src.team,source:src.id,target:target.id,amount:amount,delay:C.TELEGRAPH_MIN,label:label,telegraphRendered:true})}
function primary(w,u,target){var h=hero(u.hero);if(!u.alive||u.lock>0||u.cool.primary>0||!target)return false;if(dist(u,target)>h.primary.range)return false;u.cool.primary=h.primary.cooldown*(u.zone>0?.9:1);if(u.hero==='vibe'&&target.team===u.team){addEffect(w,{type:'healHit',team:u.team,source:u.id,target:target.id,amount:h.primary.heal,delay:C.TELEGRAPH_MIN,label:h.primary.name,telegraphRendered:true})}else if(target.team!==u.team){var amount=h.primary.damage;if(u.hero==='prism')amount=lerp(h.primary.damage,h.primary.rampDamage,clamp(u.tempo/h.primary.rampSeconds,0,1));queueHit(w,u,target,amount,h.primary.name)}return true}
function castA1(w,u){var h=hero(u.hero);if(!u.alive||u.cc>0||u.cool.a1>0)return false;u.cool.a1=h.a1.cooldown;if(u.hero==='vibe'){addEffect(w,{type:'track',team:u.team,source:u.id,x:u.x,y:u.y,r:h.a1.radius,duration:h.a1.duration})}else if(u.hero==='prism'){addEffect(w,{type:'wall',team:u.team,source:u.id,x:u.x+Math.cos(u.aim)*65,y:u.y+Math.sin(u.aim)*65,angle:u.aim,hp:h.a1.hp,duration:h.a1.duration})}else{var dx=Math.cos(u.aim),dy=Math.sin(u.aim),d=h.a1.range;u.x=clamp(u.x+dx*d,24,C.W-24);u.y=clamp(u.y+dy*d,24,C.H-24);addEffect(w,{type:'trail',team:u.team,source:u.id,x1:u.px,y1:u.py,x2:u.x,y2:u.y,width:42,duration:h.a1.trailDuration});u.protect=Math.max(u.protect,.16)}return true}
function castA2(w,u){var h=hero(u.hero);if(!u.alive||u.cc>0||u.cool.a2>0)return false;u.cool.a2=h.a2.cooldown;if(u.hero==='vibe'){addEffect(w,{type:'cone',team:u.team,source:u.id,x:u.x,y:u.y,angle:u.aim,r:h.a2.range,duration:C.TELEGRAPH_MIN,shield:h.a2.shield})}else if(u.hero==='prism'){var tx=clamp(u.x+Math.cos(u.aim)*h.a2.range,24,C.W-24),ty=clamp(u.y+Math.sin(u.aim)*h.a2.range,24,C.H-24);u.x=tx;u.y=ty;for(var i=0;i<w.units.length;i++){var q=w.units[i];if(q.team!==u.team&&q.alive&&dist(u,q)<44)q.cc=Math.max(q.cc,h.a2.knockdown)}}else{addEffect(w,{type:'disarm',team:u.team,source:u.id,x:u.x+Math.cos(u.aim)*110,y:u.y+Math.sin(u.aim)*110,r:h.a2.radius,duration:C.TELEGRAPH_MIN,lockout:h.a2.lockout})}return true}
function castUlt(w,u){var h=hero(u.hero);if(!u.alive||u.cc>0||u.ult<h.ult.charge)return false;u.ult=0;if(u.hero==='vibe')addEffect(w,{type:'stage',team:u.team,source:u.id,x:u.x,y:u.y,r:h.ult.radius,duration:h.ult.duration});else if(u.hero==='prism')addEffect(w,{type:'lattice',team:u.team,source:u.id,x:u.x+Math.cos(u.aim)*120,y:u.y+Math.sin(u.aim)*120,r:150,duration:h.ult.duration});else addEffect(w,{type:'overclock',team:u.team,source:u.id,duration:h.ult.duration});w.events.push({type:'ult',unit:u.id,hero:u.hero,time:w.time});return true}
function botThink(w,u,dt){if(!u.bot||!u.alive)return;u.reaction-=dt;if(u.reaction>0)return;u.reaction=C.BOT_REACTION+random(w)*.12;var target=nearestEnemy(w,u),ally=lowestAlly(w,u),px=C.POINT_X,py=C.POINT_Y;if(u.hero==='vibe'){px=ally.x;py=ally.y;if(ally.hp<ally.maxHp*.72&&dist(u,ally)<hero(u.hero).primary.range)primary(w,u,ally);else if(target)primary(w,u,target);if(u.cool.a1<=0&&ally.hp<ally.maxHp*.62)castA1(w,u)}else if(u.hero==='prism'){if(target&&dist(target,{x:C.POINT_X,y:C.POINT_Y})<180){px=C.POINT_X;py=C.POINT_Y;primary(w,u,target);if(u.cool.a1<=0)castA1(w,u)}else{px=C.POINT_X;py=C.POINT_Y}}else{if(target){var side=u.team===0?1:-1;px=target.x+Math.cos(w.time*.8+u.id)*130;py=target.y+side*Math.sin(w.time*.8+u.id)*130;u.aim=Math.atan2(target.y-u.y,target.x-u.x)+(random(w)-.5)*C.BOT_AIM_ERROR;primary(w,u,target);if(u.cool.a1<=0&&dist(u,target)>150)castA1(w,u)}}var n=norm(px-u.x,py-u.y);u.moveX=n.x;u.moveY=n.y;if(target&&!u.blind)u.aim=Math.atan2(target.y-u.y,target.x-u.x)+(random(w)-.5)*C.BOT_AIM_ERROR;if(u.ult>=hero(u.hero).ult.charge&&target&&dist(u,target)<220)castUlt(w,u)}
function effectStep(w,e,dt){e.age+=dt;if(e.type==='hit'&&e.age>=e.delay){var s=w.units[e.source],t=w.units[e.target];if(e.telegraphRendered&&e.delay>=C.TELEGRAPH_MIN)damage(w,s,t,e.amount);e.dead=true}else if(e.type==='healHit'&&e.age>=e.delay){heal(w.units[e.source],w.units[e.target],e.amount);e.dead=true}else if(e.type==='track'){for(var i=0;i<w.units.length;i++){var u=w.units[i];if(u.alive&&u.team===e.team&&dist(u,e)<e.r){heal(w.units[e.source],u,25*dt);u.zone=.2}}if(e.age>=e.duration)e.dead=true}else if(e.type==='trail'){for(i=0;i<w.units.length;i++){u=w.units[i];if(u.alive&&u.team===e.team&&segmentDistance(u.x,u.y,e.x1,e.y1,e.x2,e.y2)<e.width){u.trail=.2;u.zone=.2}}if(e.age>=e.duration)e.dead=true}else if(e.type==='stage'){for(i=0;i<w.units.length;i++){u=w.units[i];if(!u.alive||dist(u,e)>e.r)continue;if(u.team===e.team){u.cc=0;u.zone=.2}else if(Math.floor(e.age*2)!==Math.floor((e.age-dt)*2))damage(w,w.units[e.source],u,14)}if(e.age>=e.duration)e.dead=true}else if(e.type==='lattice'){for(i=0;i<w.units.length;i++){u=w.units[i];if(u.alive&&u.team!==e.team&&dist(u,e)<e.r)damage(w,w.units[e.source],u,30*dt)}if(e.age>=e.duration)e.dead=true}else if(e.type==='overclock'){for(i=0;i<w.units.length;i++){u=w.units[i];if(u.alive&&u.team===e.team)u.zone=.2}if(e.age>=e.duration)e.dead=true}else if(e.type==='disarm'&&e.age>=e.duration){for(i=0;i<w.units.length;i++){u=w.units[i];if(u.alive&&u.team!==e.team&&dist(u,e)<e.r)u.lock=Math.max(u.lock,e.lockout)}e.dead=true}else if(e.type==='cone'&&e.age>=e.duration){for(i=0;i<w.units.length;i++){u=w.units[i];if(!u.alive)continue;var d=dist(u,e),ang=Math.atan2(u.y-e.y,u.x-e.x),da=Math.atan2(Math.sin(ang-e.angle),Math.cos(ang-e.angle));if(d<e.r&&Math.abs(da)<.65){if(u.team===e.team)u.shield=Math.max(u.shield,e.shield);else{var n=norm(u.x-e.x,u.y-e.y);u.x=clamp(u.x+n.x*72,22,C.W-22);u.y=clamp(u.y+n.y*72,22,C.H-22)}}}e.dead=true}else if(e.type==='wall'&&e.age>=e.duration)e.dead=true}
function segmentDistance(px,py,ax,ay,bx,by){var dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(l2<=0)return hypot(px-ax,py-ay);var t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);return hypot(px-(ax+t*dx),py-(ay+t*dy))}

 for(i=0;i<w.effects.length;i++)effectStep(w,w.effects[i],dt);w.effects=w.effects.filter(function(e){return!e.dead});var ps=pointState(w);if(ps===0||ps===1)w.score[ps]=Math.min(100,w.score[ps]+C.CAPTURE_RATE*dt);if(w.score[0]>=100||w.score[1]>=100)w.winner=w.score[0]>=100?0:1;else if(w.left<=0){if(ps===-1){w.overtime=true;w.pointR=Math.max(62,w.pointR-C.OVERTIME_SHRINK*dt)}else w.winner=w.score[0]===w.score[1]?(ps===1?1:0):(w.score[0]>w.score[1]?0:1)}return w}
function drive(w,seconds,renderHz,onStep){var acc=0,t=0,fd=1/renderHz,guard=0;while(t<seconds-1e-12&&guard++<1000000){var frame=Math.min(fd,seconds-t);acc+=frame;t+=frame;var n=0;while(acc+C.DT*1e-7>=C.DT&&n++<C.MAX_SUBSTEPS){stepWorld(w,C.DT);acc-=C.DT;if(onStep)onStep(w)}}return w}
function pointerMap(clientX,clientY,rect,canvas){return{x:(clientX-rect.left)*(canvas.width/rect.width),y:(clientY-rect.top)*(canvas.height/rect.height)}}
