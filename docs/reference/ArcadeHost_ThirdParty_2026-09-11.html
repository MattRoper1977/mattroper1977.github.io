<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arcade Game</title>
  <style>
    :root {
      --hud-height: 38px;
      --hud-bg: #0d1117;
      --hud-border: #21262d;
      --hud-text: #c9d1d9;
      --hud-accent: #38bdf8;
      --hud-warn: #f43f5e;
      --canvas-bg: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--hud-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: var(--hud-text);
    }

    #arcade-wrapper {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* --- TOP HUD BAR --- */
    #arcade-hud {
      height: var(--hud-height);
      background: var(--hud-bg);
      border-bottom: 1px solid var(--hud-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 1000;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-btn {
      background: #161b22;
      border: 1px solid var(--hud-border);
      color: var(--hud-text);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, border-color 0.15s;
    }

    .hud-btn:hover {
      background: #21262d;
      border-color: #30363d;
      color: #fff;
    }

    .hud-btn:active {
      transform: translateY(1px);
    }

    .hud-btn.active {
      border-color: var(--hud-accent);
      color: var(--hud-accent);
    }

    /* --- LETTERBOX CANVAS CONTAINER --- */
    #viewport-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--canvas-bg);
      position: relative;
      touch-action: none; /* Prevents mobile rubber-banding and gesture zooms */
      overflow: hidden;
    }

    canvas#game-canvas {
      display: block;
      /* Letterbox fitting: scales automatically within container preserving aspect */
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }

    /* --- CARTRIDGE MODAL (SAVE / RESTORE) --- */
    #cartridge-modal {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: #161b22;
      border: 1px solid var(--hud-border);
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      margin-bottom: 8px;
      font-size: 16px;
      color: #fff;
    }

    .modal-card p {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .cartridge-input {
      width: 100%;
      height: 70px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      color: var(--hud-accent);
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      resize: none;
      user-select: text;
      -webkit-user-select: text;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .cartridge-input:focus {
      outline: 1px solid var(--hud-accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

<div id="arcade-wrapper">
  <!-- HUD Header -->
  <header id="arcade-hud">
    <div class="hud-group">
      <button id="btn-exit" class="hud-btn" title="Exit to Hub">⌂ Menu</button>
      <button id="btn-pause" class="hud-btn" title="Pause Game (Esc)">❚❚ Pause</button>
      <button id="btn-restart" class="hud-btn" title="Quick Reset">↺ Reset</button>
    </div>

    <div class="hud-group">
      <button id="btn-fps" class="hud-btn" title="Toggle Framerate Cap">60 FPS</button>
      <button id="btn-audio" class="hud-btn" title="Hardware Audio Killswitch">🔊 Sound</button>
      <button id="btn-cartridge" class="hud-btn" title="Pocket Save Cartridge">💾 Cartridge</button>
    </div>
  </header>

  <!-- Canvas Letterbox Container -->
  <main id="viewport-container">
    <canvas id="game-canvas"></canvas>
  </main>

  <!-- Pocket Cartridge Modal -->
  <div id="cartridge-modal">
    <div class="modal-card">
      <h3>Pocket Save Cartridge</h3>
      <p>Copy your progress code to keep your save safe from browser wipes, or paste a code to restore a run instantly.</p>

      <textarea id="cartridge-data" class="cartridge-input" placeholder="Paste your cartridge string here..."></textarea>

      <div class="modal-actions">
        <button id="btn-cartridge-copy" class="hud-btn">📋 Copy Code</button>
        <button id="btn-cartridge-load" class="hud-btn" style="color:var(--hud-accent)">📥 Restore</button>
        <button id="btn-cartridge-close" class="hud-btn">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
/**
 * ARCADE HOST ENGINE
 * Encapsulates audio, canvas scaling, state compression, and input sandboxing.
 */
class ArcadeHost {
  constructor(options = {}) {
    this.canvas = document.getElementById('game-canvas');
    this.container = document.getElementById('viewport-container');
    this.modal = document.getElementById('cartridge-modal');
    this.cartridgeInput = document.getElementById('cartridge-data');

    // Logical dimensions (Game space)
    this.logicalWidth = options.width || 960;
    this.logicalHeight = options.height || 540;
    this.targetFps = 60;
    this.isPaused = false;
    this.isMuted = false;

    // Hooks provided by the actual game
    this.onTick = options.onTick || (() => {});
    this.onRender = options.onRender || (() => {});
    this.onReset = options.onReset || (() => {});
    this.serializeState = options.serializeState || (() => ({}));
    this.deserializeState = options.deserializeState || (() => {});

    this.initAudio();
    this.initCanvasScaling();
    this.initInputGuards();
    this.initUI();
    this.startLoop();
  }

  /* -------------------------------------------------------------
     1. HARDWARE-SAFE WEB AUDIO SYSTEM
     ------------------------------------------------------------- */
  initAudio() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    this.audioCtx = new AudioContextClass();

    // Master Gain node as hardware cut-off
    this.masterGain = this.audioCtx.createGain();
    this.masterGain.connect(this.audioCtx.destination);

    // Auto-unlock policy on first interaction anywhere
    const unlock = () => {
      if (this.audioCtx.state === 'suspended' && !this.isMuted) {
        this.audioCtx.resume();
      }
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
  }

  toggleAudio() {
    this.isMuted = !this.isMuted;
    const btn = document.getElementById('btn-audio');

    if (this.isMuted) {
      this.masterGain.gain.setValueAtTime(0, this.audioCtx.currentTime);
      // Suspend completely to free hardware oscillators and save CPU
      this.audioCtx.suspend();
      btn.textContent = '🔇 Muted';
      btn.classList.add('active');
    } else {
      this.audioCtx.resume();
      this.masterGain.gain.setValueAtTime(1, this.audioCtx.currentTime);
      btn.textContent = '🔊 Sound';
      btn.classList.remove('active');
    }
  }

  /* -------------------------------------------------------------
     2. CANVAS SCALING & ANTI-MELT RESOLUTION MANAGEMENT
     ------------------------------------------------------------- */
  initCanvasScaling() {
    const resize = () => {
      const rect = this.container.getBoundingClientRect();
      const containerAspect = rect.width / rect.height;
      const gameAspect = this.logicalWidth / this.logicalHeight;

      let renderW, renderH;
      if (containerAspect > gameAspect) {
        renderH = rect.height;
        renderW = renderH * gameAspect;
      } else {
        renderW = rect.width;
        renderH = renderW / gameAspect;
      }

      // CLAMP DPR: Never exceed 1.5x on high-DPI displays (prevents GPU cook on 3x phones/Chromebooks)
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);

      this.canvas.width = Math.floor(this.logicalWidth * dpr);
      this.canvas.height = Math.floor(this.logicalHeight * dpr);

      // Display size maintains letterbox styling
      this.canvas.style.width = `${renderW}px`;
      this.canvas.style.height = `${renderH}px`;

      // Normalize canvas context coordinate space directly to logical dimensions
      const ctx = this.canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };

    window.addEventListener('resize', resize);
    screen.orientation?.addEventListener('change', resize);
    resize();
  }

  /**
   * Translates client pointer coordinates directly to internal game coordinates.
   * Handles letterbox offsets and clamped resolution shifts cleanly.
   */
  screenToCanvas(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.logicalWidth / rect.width;
    const scaleY = this.logicalHeight / rect.height;

    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY,
      inside: (
        clientX >= rect.left &&
        clientX <= rect.right &&
        clientY >= rect.top &&
        clientY <= rect.bottom
      )
    };
  }

  /* -------------------------------------------------------------
     3. NATIVE POCKET CARTRIDGE STATE ENGINE (Zero dependencies)
     ------------------------------------------------------------- */
  async generateCartridge() {
    try {
      const stateObj = {
        meta: { ts: Date.now(), v: 1 },
        payload: this.serializeState()
      };
      const jsonStr = JSON.stringify(stateObj);

      // Compress state via native browser CompressionStream (gzip)
      const stream = new Blob([jsonStr]).stream();
      const compressedStream = stream.pipeThrough(new CompressionStream('deflate-raw'));
      const buffer = await new Response(compressedStream).arrayBuffer();

      // Pack into safe string
      const bytes = new Uint8Array(buffer);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return 'MBM$' + btoa(binary);
    } catch (err) {
      console.warn('CompressionStream fallback:', err);
      return 'MBM$' + btoa(JSON.stringify(this.serializeState()));
    }
  }

  async restoreCartridge(code) {
    try {
      if (!code.startsWith('MBM$')) throw new Error('Invalid cartridge format');
      const base64Data = code.slice(4);
      const binary = atob(base64Data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      let jsonStr;
      try {
        const stream = new Blob([bytes]).stream();
        const decompressedStream = stream.pipeThrough(new DecompressionStream('deflate-raw'));
        jsonStr = await new Response(decompressedStream).text();
      } catch {
        // Fallback for non-deflated states
        jsonStr = binary;
      }

      const parsed = JSON.parse(jsonStr);
      this.deserializeState(parsed.payload || parsed);
      return true;
    } catch (err) {
      alert('Corrupt or invalid Cartridge Code.');
      return false;
    }
  }

  /* -------------------------------------------------------------
     4. INPUT GUARDS & PREVENT-DEFAULT TRAPS
     ------------------------------------------------------------- */
  initInputGuards() {
    const blockedKeys = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];

    window.addEventListener('keydown', (e) => {
      // Allow full typing without interception if modal is open
      if (this.modal.style.display === 'flex') return;

      if (e.code === 'Escape') {
        this.togglePause();
        return;
      }

      // Stop canvas gameplay arrows/space from scrolling host document
      if (blockedKeys.includes(e.code)) {
        e.preventDefault();
      }
    }, { passive: false });

    // Handle tab switching / device sleep: auto-pause to avoid death on tab-return
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && !this.isPaused) {
        this.togglePause(true);
      }
    });
  }

  /* -------------------------------------------------------------
     5. HUD UI & CONTROLS
     ------------------------------------------------------------- */
  initUI() {
    document.getElementById('btn-exit').addEventListener('click', () => {
      if (confirm('Return to Arcade Hub? Any unsaved progress will be reset.')) {
        window.location.href = '../';
      }
    });

    document.getElementById('btn-pause').addEventListener('click', () => this.togglePause());
    document.getElementById('btn-restart').addEventListener('click', () => {
      if (confirm('Restart current stage?')) this.onReset();
    });

    document.getElementById('btn-audio').addEventListener('click', () => this.toggleAudio());

    // Framerate Eco Throttle (60fps vs 30fps for Celeron battery saving)
    const fpsBtn = document.getElementById('btn-fps');
    fpsBtn.addEventListener('click', () => {
      this.targetFps = this.targetFps === 60 ? 30 : 60;
      fpsBtn.textContent = `${this.targetFps} FPS`;
      fpsBtn.classList.toggle('active', this.targetFps === 30);
    });

    // Pocket Cartridge UI hooks
    const cartBtn = document.getElementById('btn-cartridge');
    cartBtn.addEventListener('click', async () => {
      this.togglePause(true);
      this.cartridgeInput.value = await this.generateCartridge();
      this.modal.style.display = 'flex';
    });

    document.getElementById('btn-cartridge-close').addEventListener('click', () => {
      this.modal.style.display = 'none';
    });

    document.getElementById('btn-cartridge-copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText(this.cartridgeInput.value);
      alert('Cartridge code copied to clipboard!');
    });

    document.getElementById('btn-cartridge-load').addEventListener('click', async () => {
      const ok = await this.restoreCartridge(this.cartridgeInput.value.trim());
      if (ok) {
        this.modal.style.display = 'none';
        this.togglePause(false);
      }
    });
  }

  togglePause(forceState = null) {
    this.isPaused = forceState !== null ? forceState : !this.isPaused;
    const btn = document.getElementById('btn-pause');
    btn.textContent = this.isPaused ? '▶ Resume' : '❚❚ Pause';
    btn.classList.toggle('active', this.isPaused);
  }

  /* -------------------------------------------------------------
     6. MAIN RUNTIME LOOP (With frame delta and FPS cap)
     ------------------------------------------------------------- */
  startLoop() {
    let lastTime = performance.now();
    const ctx = this.canvas.getContext('2d');

    const loop = (currentTime) => {
      requestAnimationFrame(loop);

      const delta = (currentTime - lastTime) / 1000;
      const interval = 1 / this.targetFps;

      if (delta >= interval) {
        lastTime = currentTime - (delta % interval);

        if (!this.isPaused) {
          this.onTick(delta);
        }

        // Always render to allow pause overlay displays
        ctx.save();
        this.onRender(ctx, this.logicalWidth, this.logicalHeight, this.isPaused);
        ctx.restore();
      }
    };

    requestAnimationFrame(loop);
  }
}
</script>

<!-- How to Hook Your Game Engine into the Shell -->
<script>
  // Game state
  let player = { x: 480, y: 270, score: 0, level: 1 };
  let audioBeep = null;

  const arcade = new ArcadeHost({
    width: 960,
    height: 540,

    // 1. Tick logic
    onTick: (dt) => {
      player.x = (player.x + 40 * dt) % 960;
    },

    // 2. Render logic
    onRender: (ctx, width, height, isPaused) => {
      // Clear viewport
      ctx.fillStyle = '#0b0f19';
      ctx.fillRect(0, 0, width, height);

      // Draw game entities
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(player.x, player.y, 40, 40);

      ctx.fillStyle = '#ffffff';
      ctx.font = '16px monospace';
      ctx.fillText(`SCORE: ${player.score}  |  STAGE: ${player.level}`, 20, 30);

      // Pause Banner
      if (isPaused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = '#f43f5e';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', width / 2, height / 2);
      }
    },

    // 3. Reset hook
    onReset: () => {
      player.x = 480;
      player.y = 270;
      player.score = 0;
    },

    // 4. Cartridge Save: Export minimal payload
    serializeState: () => ({
      px: Math.round(player.x),
      py: Math.round(player.y),
      s: player.score,
      lvl: player.level
    }),

    // 5. Cartridge Restore: Rehydrate payload
    deserializeState: (data) => {
      player.x = data.px || 0;
      player.y = data.py || 0;
      player.score = data.s || 0;
      player.level = data.lvl || 1;
    }
  });

  // Safe sound generation plugged into arcade.masterGain
  function playSynthPing() {
    if (arcade.isMuted) return;
    const osc = arcade.audioCtx.createOscillator();
    const noteGain = arcade.audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, arcade.audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, arcade.audioCtx.currentTime + 0.15);

    noteGain.gain.setValueAtTime(0.3, arcade.audioCtx.currentTime);
    noteGain.gain.linearRampToValueAtTime(0.01, arcade.audioCtx.currentTime + 0.15);

    osc.connect(noteGain);
    noteGain.connect(arcade.masterGain); // Routed through Master Killswitch

    osc.start();
    osc.stop(arcade.audioCtx.currentTime + 0.15);
  }

  // Touch/Mouse Input using normalizer
  window.addEventListener('pointerdown', (e) => {
    const coords = arcade.screenToCanvas(e.clientX, e.clientY);
    if (coords.inside && !arcade.isPaused) {
      player.x = coords.x - 20;
      player.y = coords.y - 20;
      player.score += 10;
      playSynthPing();
    }
  });
</script>
