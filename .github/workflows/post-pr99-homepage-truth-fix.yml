name: Post-PR99 homepage truth repair
on:
  push:
    branches: [fix/post-pr99-homepage-account-mailing-truth]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[homepage-truth-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-pr99-homepage-account-mailing-truth
          fetch-depth: 0
      - name: Replace stale pre-account homepage copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            "There is no account and no mailing list. If you want to see what gets built next, these are the places I actually post.":
            "Accounts are optional and built for adults and teachers who want their Made by Matt favourites available on another device. Teacher updates are also optional and use a separate double-opt-in mailing list.",
            "Everything here is free to use — no trials, no locked features, nothing to sign up for. There is no account, so there is nothing to forget the password to.":
            "Everything here is free to use — no trials and no locked features. An adult/teacher account is optional and is only for useful account-backed features such as carrying your saved Made by Matt shortcuts between devices.",
            "Lessons, registers and pupil records stay in your browser on your device — nothing about your class is ever sent anywhere. Three things do reach the internet. One happens on its own — an anonymous visit counter, on this page and the stats page. Two happen only if you choose them: sending the contact form, and pressing play on a video.":
            "Lessons, registers and pupil records stay in your browser on your device — they are not uploaded into your account. Some optional services do use the internet: the anonymous visit counter, the contact form, videos you choose to play, adult/teacher account identity and saved hub shortcuts, and the separate teacher mailing list."
          }
          for old,new in replacements.items():
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one stale copy occurrence, found {s.count(old)}: {old[:70]}')
              s=s.replace(old,new)
          start=s.find('<!-- TEACHER UPDATES')
          end=s.find('<div class="dx-about" id="about">', start)
          if start<0 or end<0:
              raise SystemExit(f'teacher-update block boundaries missing: start={start} end={end}')
          replacement='''<!-- TEACHER UPDATES — separate explicit consent; Buttondown is reached only through /mailing-list/. -->
<div class="dx-teach">
<h3>Teacher updates</h3>
<p class="dx-cnote"><b>For teachers and other adults.</b> A weekly Made by Matt update covering what changed on the site and a clearly labelled look at what is coming next.</p>
<p class="dx-cnote"><b>This is separate from an account.</b> Creating an account never subscribes you. Joining the mailing list uses Buttondown double opt-in and you can unsubscribe at any time.</p>
<p><a class="dx-tbtn" href="/mailing-list/">Join teacher updates</a> <a class="dx-chip" href="/account/">Account</a></p>
<p class="dx-cnote" style="font-size:.82rem">Under 18? Please don't use the mailing list or create an account — ask a teacher or another adult. Everything public on the site stays free without either.</p>
</div>

'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -q 'href="/mailing-list/"' index.html
          grep -q 'href="/account/"' index.html
          ! grep -q 'There is no account and no mailing list' index.html
          ! grep -q 'madebymatt.uk - teacher updates opt-in' index.html
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: align homepage with production accounts and mailing [homepage-truth-fixed]"
          git push origin HEAD:fix/post-pr99-homepage-account-mailing-truth
