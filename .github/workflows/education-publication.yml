name: Education publication
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      builder_ref:
        description: Reviewed Site builder revision used by a project repository
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: education-pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Select the existing education publication
        id: target
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          targets={'MattRoper1977/mattroper1977.github.io':'site','MattRoper1977/Lessons':'lessons','MattRoper1977/Matt-s-Apps-':'apps'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('kind='+targets[os.environ['REPOSITORY']]+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: ${{ inputs.builder_ref || github.sha }}
          path: .sources/Site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          # CARRIER PIN, moved 2026-09-19 by ORDER SX3-PASSES PASS 4 (3b). This
          # fallback is what a SITE-triggered publication builds from; the Lessons
          # caller instead uses its own current commit so lesson work stays live.
          # It was last at eab8daaf, the SX3 release head. 3b adds the three Science
          # pathway landing pages, so the published bytes move: those three, plus
          # resources.json, lesson-order.json and the Site tree's domain-catalogue
          # .json and resource-discovery.json, are admitted by the seven registry
          # entries in this same PR. domain-split-verify.yml is moved to the SAME
          # head here. Both pins are HELD EQUAL TO LESSONS MAIN, which now carries
          # the merged 3b (#593). Pinned below, derived with ls-remote against the
          # ref, never typed.
          # Moved 2026-09-19 (ORDER FINISH S4, PASS 6): the sixth-pin discharge. Pinned to
          # Lessons b32bf1c7, the #594 head (the 3b carrier re-cut that resolved the
          # resource-sizes STOP-R), HELD EQUAL TO LESSONS MAIN. Measured at the move by
          # tools/lessons_pin_lag_control.py against Lessons main 545d9e8b: 2 commits
          # behind by SHA (#590 records, #591 toolchain), 0 published paths moved, so
          # the site-triggered and Lessons-triggered publishers build the same bytes.
          # Derived with git log --grep '(#594)' against origin/main, never typed.
          # Moved 2026-09-20 (ORDER FINISH-2 §5, the one Site window): b32bf1c7 -> Lessons
          # main 6bb8238f, HELD EQUAL TO LESSONS MAIN at the move (the #411 method), derived
          # with git rev-parse origin/main on the Lessons checkout, never typed. Measured by
          # tools/lessons_pin_lag_control.py at the move: 0 commits behind, 0 published paths
          # moved. The F3 and HUM-D5 Lessons merges that follow this window move 21 published
          # paths and add 1750; the registry's transition pairs and ARRIVING markers admit
          # both byte-states, so both publishers stay green until the next pin move.
          # Moved 2026-09-20 (ORDER FINISH-3): 6bb8238f -> Lessons main 5e496ba5f00fc08e02c13dd33c4f6a7eb2e07d77, the
          # squash merge of #600 (the 13 HUM-D5 packs, 1750 files, and the manifest pin).
          # Derived with git rev-parse origin/main on the Lessons checkout, never typed.
          # This discharges the EQUAL declaration that tools/lessons_pin_lag_control.py
          # reported RED before this PR: at 6bb8238f the pin was 3 commits behind main
          # with 1771 published paths moved. It moves WITH its Apps companion below (L31).
          # Moved 2026-09-21 (SCI-COMPLETE PASS F): 6fd6564f -> Lessons main 0d4817decd981b8f88b7080d9e58b89a48d31710, the squash merge of #630.
          # Derived with git rev-parse on the Lessons checkout, never typed. This pin moves WITH
          # its Apps companion below (L31).
          # Moved 2026-09-22 (STOP-R2 explicit document tags, the one Site window) WITH the Apps
          # companion below and WITH both domain-split-verify.yml pins, per STANDING RULE L31 and
          # the EQUAL declaration this fallback carries: 0d4817de -> 1e668ee4, the squash merge of
          # Lessons #642. CORRECTION: the first cut of this window moved only the two
          # domain-split-verify.yml pins. tools/verify_split_live_publication.py reads the
          # publication subject pins from THIS file, so AGX-1 built the candidate from the old
          # Lessons tree against the new admission record and went red on
          # "Education file admission blocked publication: MISSING ... Summer_1 ...".
          # A Site pin pair is four lines, not two. Derived from domain-split-verify.yml in this
          # same tree by the window runner, never typed.
          # Moved 2026-09-22 (title derivation, the one Site window) WITH both domain-split-verify.yml
          # pins, per STANDING RULE L31 and correction #22 -- a Site pin pair is FOUR lines, and
          # tools/verify_split_live_publication.py::sources reads the publication subject pins from
          # THIS file: 1e668ee4 -> Lessons main 4f19ac9e, the squash merge of #644. Derived with git
          # rev-parse on the Lessons checkout, never typed. HELD EQUAL to Lessons main; P5 measured
          # at the move: EQUAL-declared pins agree at 4f19ac9eca88.
          # Moved 2026-09-22 (STOP-RESP-2 step 3, the sixth-pin discharge): 4f19ac9e -> b5b873616790c88e12ae9977b8462466b3af371a,
          # the squash merge of Lessons #647 -- the Summer 1 responsive re-delivery with its L33
          # carrier folded in. #647 moved 27 published paths plus the derived size table, all of
          # which Site #430 and #431 admit, so this discharges the EQUAL declaration this pin
          # carries. It moves WITH its Apps companion below, per STANDING RULE L31. Derived with
          # git rev-parse on the Lessons checkout, never typed.
          # Moved 2026-09-22 (the Science hub generation order, Matt's ruling on the S02 STOP; the
          # EQUAL window of that fold): the Lessons pin b5b87361 -> b1c70b0e007d7292e0b5bb55546e1d1781acde71, the squash
          # merge of Lessons #655. #655 moved 3 published paths (Lessons/Science_Teesside/index.html,
          # Lessons/assets/catalogue/science-hub-bindings.json, Lessons/data/resource-sizes.json --
          # repo-qualified, because s10 refuses an unqualified path that names no Site file), all of
          # which Site #433 admits, and its publication
          # built them to exactly the admitted pending digests; so this discharges the EQUAL
          # declaration this pin carries. It moves WITH its Apps companion below, per STANDING RULE
          # L31. Derived with git rev-parse on the Lessons checkout, never typed.
          # Moved 2026-09-23 (PASS C Autumn 2 batch 1, rulings S1 and S3; the EQUAL window of that
          # fold): the Lessons pin b1c70b0e -> be82fe867fb9e1c3e4e89f9d3648f32123464a40, the squash merge of
          # Lessons #662. #662 moved 16 published paths (the 11 transplanted Science decks, three
          # Launch pack manifests, and the derived lesson order and size table), all of which Site
          # #436 admits, and its publication run 35823783961 built them to exactly the admitted
          # pending digests; so this discharges the EQUAL declaration this pin carries. It moves WITH
          # its Apps companion below, per STANDING RULE L31. Derived with git rev-parse on the
          # Lessons checkout, never typed.
          # Moved 2026-09-23 (the Science hub follow-on after PASS C batch 1, route C; its EQUAL
          # window): the Lessons pin be82fe86 -> 3560dc0e87cdf77398a73332a39bace7ff22ad0a, the squash merge of
          # Lessons #663. #663 moved 3 published paths (the Science hub page, its bindings and the
          # derived size table), all of which Site #437 admits, and its publication run 35829540162
          # built them to exactly the admitted pending digests; so this discharges the EQUAL
          # declaration this pin carries. It moves WITH its Apps companion below, per STANDING RULE
          # L31. Derived with git rev-parse on the Lessons checkout, never typed.
          # Moved 2026-09-23 (HUB1 v2's EQUAL window): the Lessons pin 3560dc0e -> 6d5a05ad5723096b70c0c68ff2442239dc5b8e14, the squash
          # merge of Lessons #667 (which also carries D3 #666 and the docs-only #669, neither of which moves a
          # published path). #667 moved 6 published paths, all of which Site #440 admits, and its publication
          # run 35855223506 built them to exactly the admitted pending digests; so this discharges the EQUAL
          # declaration this pin carries. It moves WITH its Apps companion below, per STANDING RULE L31.
          # Derived with git rev-parse on the Lessons checkout, never typed.
          # Moved 2026-09-25 (Q12's EQUAL window, ORDER RS1-G3 section 1): the Lessons pin 6d5a05ad -> 7aed39b3e2e6c38fc162a4639aba80deaaa44e23, the squash
          # merge of Lessons #673 (the Science hub links its science-shelf stylesheet again; carrier at Site #444). Between the
          # old and new pins only #672 (a pure carrier, no published path) and #673 land; #673 moved 2 published paths (the
          # Science hub page and its size-table row), both admitted by Site #444, and its publication run 36133728912 built them to
          # exactly the admitted pending digests; so this discharges the EQUAL declaration this pin carries. It moves WITH its
          # Apps companion below, per STANDING RULE L31. Derived with git rev-parse on the Lessons checkout, never typed.
          # Moved 2026-09-25 (LAND-A2 Science window W2, ruling R6): the Lessons pin 7aed39b3 -> c0b9b51f76d26c03f3de13951e85fa38497a509e, the squash
          # merge of Lessons #677 (the 21 Autumn 2 Science lessons). Between the old and new pins #674 (a pure carrier) and #676
          # (docs only) move no published path, #671 moves none (its staff layer is never served), and #677 moves 218 (210 added, 8
          # changed) and, through the Site's build of them, 3 education-site files, all admitted by Site #448 (210 as ARRIVING, 11 as
          # transition pairs); its publication run 36190411317 built them to exactly the admitted pending digests; so this
          # discharges the EQUAL declaration this pin carries. It moves WITH its Apps companion below, per
          # STANDING RULE L31. Derived with git rev-parse on the Lessons checkout, never typed.
          ref: ${{ github.repository == 'MattRoper1977/Lessons' && github.sha || 'c0b9b51f76d26c03f3de13951e85fa38497a509e' }}
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          # Pinned 2026-09-16 (CX2 §5 EDU-D3, documented pin move under SW2_LEDGER.md §0): Apps main, the one
          # Apps revision the Lessons catalogue controls accept at the moved Lessons pin (its gate's canonical
          # files exist together only from this commit). It carries the SW2 A Apps front door; the Apps hub and
          # the tokens stylesheet are the measured output differences, confined to the Apps tree, and the
          # registry keeps the served rollback beside this candidate. Held EQUAL to domain-split-verify.yml.
          # The Apps caller instead builds its own current source commit.
          # Moved 2026-09-20 (ORDER FINISH-2 §5) WITH the Lessons pin above, because the two
          # move together or not at all: verify_catalogue_contract_controls.py builds its
          # Apps fixture from this checkout and runs the LESSONS gate copy against it, so a
          # Lessons pin whose gate copy has moved and an Apps pin whose copy has not is red
          # ("Unmodified Apps fixture retains its complete cross-estate checks"). Measured:
          # Lessons 6bb8238f + Apps a7d330b8 PASS 273; Lessons 6bb8238f + Apps dfca094b FAIL;
          # Site main's own pair (b32bf1c7 + dfca094b) PASS 274, so this red is this PR's.
          # a7d330b8 is the Apps #119 companion head, the Apps arm of the Lessons commit
          # the pin above now names; both gate copies are byte-identical at 1796ab50.
          # Moved 2026-09-20 (ORDER FINISH-3) WITH the Lessons pin above, per STANDING RULE
          # L31: a Site pin pair is ALWAYS a Lessons pin and ITS Apps companion, never a
          # Lessons pin beside the previous Apps main. a7d330b8 -> Apps main 2a9cb8e8ce81d94e030c901d8bf069eb41e19a3e,
          # the squash merge of #122, which is the Apps arm of the same commit: both gate
          # copies are byte-identical there, gateSha256 e91a97bb. Verified locally before
          # push with verify_catalogue_contract_controls.py (280 controls, 0 FAIL).
          # Moved 2026-09-21 (SCI-COMPLETE PASS F) WITH the Lessons pin above, per STANDING RULE L31:
          # a946c586 -> Apps main 4e98e48f866010f93443ba7da0b1734cad83a124, the squash merge of #150, the Apps arm of the
          # same commit: both gate copies are byte-identical there, gateSha256 75954e5d.
          # Moved 2026-09-22 (STOP-R2 explicit document tags) WITH the Lessons pin above and WITH
          # both domain-split-verify.yml pins, per STANDING RULE L31: 4e98e48f -> ad806305, the
          # squash merge of Apps #162, the Apps arm of the same act; both gate copies are
          # byte-identical there. Held EQUAL to domain-split-verify.yml. Derived from that file in
          # this same tree by the window runner, never typed.
          # Moved 2026-09-22 (title derivation) WITH the Lessons pin above, per STANDING RULE L31:
          # ad806305 -> Apps main ecc78fff, the squash merge of #164, the Apps arm of the same act;
          # both gate copies byte-identical there, gateSha256 cd3202d0 (measured at both target
          # commits, not carried from the tree -- it is a run-computed witness, not a stored pin).
          # Moved 2026-09-22 (STOP-RESP-2 step 3) WITH the Lessons pin above, per L31: ecc78fff ->
          # 86933c995419987ff281d3f1513712b2b4f34dfc, the squash merge of Apps #169 -- the last of the three gate-copy
          # companions this fold needed, each one cut after the Site merge it depended on. Derived
          # with git rev-parse on the Apps checkout, never typed.
          # Moved 2026-09-22 (the Science hub fold's EQUAL window) WITH the Lessons pin above, per
          # L31: the Apps pin 86933c99 -> 7a69b63d632ab2efdbe4780fc063667027003607, the squash merge of Apps #172,
          # the gate-copy companion cut after Site #433 merged. Both gate copies byte-identical
          # there at 243f6ce1e9a6. Derived with git rev-parse on the Apps checkout, never typed.
          # Moved 2026-09-23 (PASS C Autumn 2 batch 1's EQUAL window) WITH the Lessons pin above, per
          # L31: the Apps pin 7a69b63d -> 96d1ef19c2653c79522c42c459d5bcb60aa42fdf, the squash merge of Apps #176,
          # the gate-copy companion cut after Site #436 merged. Both gate copies byte-identical
          # there at 26363228459d. Derived with git rev-parse on the Apps checkout, never typed.
          # Moved 2026-09-23 (the hub follow-on's EQUAL window) WITH the Lessons pin above, per L31:
          # the Apps pin 96d1ef19 -> 3b90f1a86c74b79ddf85bfccb50dd2f85459a63c, the squash merge of Apps #177, the
          # gate-copy companion cut after Site #437 merged. Both gate copies byte-identical there at
          # f7187d3d479a. Derived with git rev-parse on the Apps checkout, never typed.
          # Moved 2026-09-23 (HUB1 v2's EQUAL window) WITH the Lessons pin above, per L31: the Apps pin
          # 3b90f1a8 -> 2fd5621e985d257b272d46d4f368bc023f010bce, the squash merge of Apps #180 (Apps #179, D3's gate-copy companion,
          # is in its history). Both gate copies byte-identical there at 4a7e791e2ffd. Derived with git
          # rev-parse on the Apps checkout, never typed.
          # Moved 2026-09-25 (Q12's EQUAL window) WITH the Lessons pin above, per L31: the Apps pin
          # 2fd5621e -> 045088e8ca2a1032207f88eeb3180a812bb21cf1, the squash merge of Apps #184 (Apps #183, the gate-copy companion of the
          # HUB1 v2 pure carrier, is in its history). Both gate copies byte-identical there at df52ea19df0f. Derived with git
          # rev-parse on the Apps checkout, never typed.
          # Moved 2026-09-25 (LAND-A2 Science window W2) WITH the Lessons pin above, per L31: the Apps pin
          # 045088e8 -> 1ad001c5d395acc3bcaa95e9024c7be46adc170e, the squash merge of Apps #187 (Apps #185 and #182, earlier gate-copy
          # companions, are in its history; none moves a published path). Both gate copies byte-identical there at 093c83fde6b7.
          # Derived with git rev-parse on the Apps checkout, never typed.
          ref: ${{ github.repository == 'MattRoper1977/Matt-s-Apps-' && github.sha || '1ad001c5d395acc3bcaa95e9024c7be46adc170e' }}
          path: .sources/Apps
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install lxml==6.0.1
      - name: Build and verify separated publication trees
        run: |
          python .sources/Site/domain-split/build_publications.py --lessons .sources/Lessons
          python .sources/Site/domain-split/build_education.py --lessons .sources/Lessons --apps .sources/Apps
          python .sources/Site/domain-split/check_publications.py
          python .sources/Site/domain-split/check_education_separation.py --self-test
          python .sources/Site/domain-split/check_education_separation.py
          python .sources/Site/domain-split/verify_education_tree_has_no_games.py --output .sources/Site/domain-split/output
          python .sources/Site/domain-split/check_education_support.py
          node .sources/Site/domain-split/check_game_saves.cjs
      - name: Prove all-file admission before packaging any education tree
        run: |
          python .sources/Site/domain-split/check_education_publication_admission.py --output .sources/Site/domain-split/output --lessons .sources/Lessons --apps .sources/Apps --build-control
      - name: Save the reviewed education output
        uses: actions/upload-artifact@v4
        with:
          name: education-${{ steps.target.outputs.kind }}-review
          path: .sources/Site/domain-split/output/education-${{ steps.target.outputs.kind }}
          include-hidden-files: true
          retention-days: 30
      - name: Read Pages configuration without changing it
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            const ready = result.data.build_type === 'workflow';
            core.setOutput('ready', String(ready));
            if (!ready) core.notice('Review saved. The owner must select GitHub Actions in this repository’s Pages settings before activation.');
      - name: Require the separate games domain before education cutover
        if: steps.pages.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://madebymatt-play.uk/data/domain-catalogue.json',timeout=25) as r:d=json.load(r)
          assert d.get('games') and d.get('staff') is not None and 'education' not in d
          with urllib.request.urlopen('https://madebymatt-play.uk/game-saves/',timeout=25) as r:s=r.read().decode()
          assert 'save-import' in s
          print('Independent games and save import are available over HTTPS.')
          PY
      - name: Package the education Pages output
        if: steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .sources/Site/domain-split/output/education-${{ steps.target.outputs.kind }}
  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
