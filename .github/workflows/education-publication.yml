name: Education publication
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      builder_ref:
        description: Reviewed Site builder revision used by a project repository
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: education-pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Select the existing education publication
        id: target
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          targets={'MattRoper1977/mattroper1977.github.io':'site','MattRoper1977/Lessons':'lessons','MattRoper1977/Matt-s-Apps-':'apps'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('kind='+targets[os.environ['REPOSITORY']]+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: ${{ inputs.builder_ref || github.sha }}
          path: .sources/Site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          # Re-pinned 2026-09-19 (ORDER SX3-PASSES): CARRIER PIN MOVE under release-red
          # precedence. This fallback is what a SITE-triggered publication builds, and it
          # had been left at b54c9006 while Site #408 re-froze check_education_separation
          # .py's baseline_sha to d0dc6b3e. b54c9006 produces ec7dc075, so the Site's own
          # main push went red at step 9 -- run 35445543208 on Site main 0cd8f842 -- and
          # Lessons FieldOps P2 followed it, its serve proof reporting
          # "[RED] site: exact-source publication 35445543208 failed".
          # Pinned to Lessons main eab8daaf, the SX3 release head, which produces
          # d0dc6b3e. Derived with rev-parse, never transcribed.
          # domain-split-verify.yml pins 4506bb96, the same content one commit earlier:
          # the commit between them touches three files -- education-pages.yml,
          # tools/verify_cross_estate_unification.py and
          # tools/catalogue/STATIC_CHECK_RESULTS.json -- none of which appears in the
          # 4036-entry all-file admission registry, so both build identical education
          # trees and agree on d0dc6b3e. PASS 6 aligns the two pins on the same SHA.
          # The Lessons caller uses its current commit so lesson work stays live.
          ref: ${{ github.repository == 'MattRoper1977/Lessons' && github.sha || 'eab8daaf08848c4468e3dcee6d4beeb2fc4f5e72' }}
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          # Pinned 2026-09-16 (CX2 §5 EDU-D3, documented pin move under SW2_LEDGER.md §0): Apps main, the one
          # Apps revision the Lessons catalogue controls accept at the moved Lessons pin (its gate's canonical
          # files exist together only from this commit). It carries the SW2 A Apps front door; the Apps hub and
          # the tokens stylesheet are the measured output differences, confined to the Apps tree, and the
          # registry keeps the served rollback beside this candidate. Held EQUAL to domain-split-verify.yml.
          # The Apps caller instead builds its own current source commit.
          ref: ${{ github.repository == 'MattRoper1977/Matt-s-Apps-' && github.sha || 'dfca094b0e538ad02a7bb9edde5db00f45f84e3b' }}
          path: .sources/Apps
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install lxml==6.0.1
      - name: Build and verify separated publication trees
        run: |
          python .sources/Site/domain-split/build_publications.py --lessons .sources/Lessons
          python .sources/Site/domain-split/build_education.py --lessons .sources/Lessons --apps .sources/Apps
          python .sources/Site/domain-split/check_publications.py
          python .sources/Site/domain-split/check_education_separation.py --self-test
          python .sources/Site/domain-split/check_education_separation.py
          python .sources/Site/domain-split/verify_education_tree_has_no_games.py --output .sources/Site/domain-split/output
          python .sources/Site/domain-split/check_education_support.py
          node .sources/Site/domain-split/check_game_saves.cjs
      - name: Prove all-file admission before packaging any education tree
        run: |
          python .sources/Site/domain-split/check_education_publication_admission.py --output .sources/Site/domain-split/output --lessons .sources/Lessons --apps .sources/Apps --build-control
      - name: Save the reviewed education output
        uses: actions/upload-artifact@v4
        with:
          name: education-${{ steps.target.outputs.kind }}-review
          path: .sources/Site/domain-split/output/education-${{ steps.target.outputs.kind }}
          include-hidden-files: true
          retention-days: 30
      - name: Read Pages configuration without changing it
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            const ready = result.data.build_type === 'workflow';
            core.setOutput('ready', String(ready));
            if (!ready) core.notice('Review saved. The owner must select GitHub Actions in this repository’s Pages settings before activation.');
      - name: Require the separate games domain before education cutover
        if: steps.pages.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://madebymatt-play.uk/data/domain-catalogue.json',timeout=25) as r:d=json.load(r)
          assert d.get('games') and d.get('staff') is not None and 'education' not in d
          with urllib.request.urlopen('https://madebymatt-play.uk/game-saves/',timeout=25) as r:s=r.read().decode()
          assert 'save-import' in s
          print('Independent games and save import are available over HTTPS.')
          PY
      - name: Package the education Pages output
        if: steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .sources/Site/domain-split/output/education-${{ steps.target.outputs.kind }}
  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
