name: Education publication
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      builder_ref:
        description: Reviewed Site builder revision used by a project repository
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: education-pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Select the existing education publication
        id: target
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          targets={'MattRoper1977/mattroper1977.github.io':'site','MattRoper1977/Lessons':'lessons','MattRoper1977/Matt-s-Apps-':'apps'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('kind='+targets[os.environ['REPOSITORY']]+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: ${{ inputs.builder_ref || github.sha }}
          path: .sources/Site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          # Pinned reviewed companion source, 2026-09-05. The Lessons caller
          # uses its own current commit, so subsequent lesson work stays live.
          ref: ${{ github.repository == 'MattRoper1977/Lessons' && github.sha || 'fcff2d8cf961db96c6ac863abf8d78f48f7591e9' }}
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          # Pinned reviewed companion source, 2026-09-05. The Apps caller
          # instead builds its own current source commit.
          ref: ${{ github.repository == 'MattRoper1977/Matt-s-Apps-' && github.sha || 'f1824201f1086ad1db84139ee0e29ba7957ca4f2' }}
          path: .sources/Apps
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install lxml==6.0.1
      - name: Build and verify separated publication trees
        run: |
          python .sources/Site/domain-split/build_publications.py --lessons .sources/Lessons
          python .sources/Site/domain-split/build_education.py --lessons .sources/Lessons --apps .sources/Apps
          python .sources/Site/domain-split/check_publications.py
          node .sources/Site/domain-split/check_game_saves.cjs
      - name: Save the reviewed education output
        uses: actions/upload-artifact@v4
        with:
          name: education-${{ steps.target.outputs.kind }}-review
          path: .sources/Site/domain-split/output/education-${{ steps.target.outputs.kind }}
          include-hidden-files: true
          retention-days: 30
      - name: Read Pages configuration without changing it
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            const ready = result.data.build_type === 'workflow';
            core.setOutput('ready', String(ready));
            if (!ready) core.notice('Review saved. The owner must select GitHub Actions in this repository’s Pages settings before activation.');
      - name: Require the separate games domain before education cutover
        if: steps.pages.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://madebymatt-play.uk/data/domain-catalogue.json',timeout=25) as r:d=json.load(r)
          assert d.get('games') and d.get('staff') is not None and 'education' not in d
          with urllib.request.urlopen('https://madebymatt-play.uk/game-saves/',timeout=25) as r:s=r.read().decode()
          assert 'save-import' in s
          print('Independent games and save import are available over HTTPS.')
          PY
      - name: Package the education Pages output
        if: steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .sources/Site/domain-split/output/education-${{ steps.target.outputs.kind }}
  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
