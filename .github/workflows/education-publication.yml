name: Education publication
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      builder_ref:
        description: Reviewed Site builder revision used by a project repository
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: education-pages-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.pages.outputs.ready }}
    steps:
      - name: Select the existing education publication
        id: target
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          targets={'MattRoper1977/mattroper1977.github.io':'site','MattRoper1977/Lessons':'lessons','MattRoper1977/Matt-s-Apps-':'apps'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('kind='+targets[os.environ['REPOSITORY']]+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/mattroper1977.github.io
          ref: ${{ inputs.builder_ref || github.sha }}
          path: .sources/Site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          # CARRIER PIN, moved 2026-09-19 by ORDER SX3-PASSES PASS 4 (3b). This
          # fallback is what a SITE-triggered publication builds from; the Lessons
          # caller instead uses its own current commit so lesson work stays live.
          # It was last at eab8daaf, the SX3 release head. 3b adds the three Science
          # pathway landing pages, so the published bytes move: those three, plus
          # resources.json, lesson-order.json and the Site tree's domain-catalogue
          # .json and resource-discovery.json, are admitted by the seven registry
          # entries in this same PR. domain-split-verify.yml is moved to the SAME
          # head here. Both pins are HELD EQUAL TO LESSONS MAIN, which now carries
          # the merged 3b (#593). Pinned below, derived with ls-remote against the
          # ref, never typed.
          # Moved 2026-09-19 (ORDER FINISH S4, PASS 6): the sixth-pin discharge. Pinned to
          # Lessons b32bf1c7, the #594 head (the 3b carrier re-cut that resolved the
          # resource-sizes STOP-R), HELD EQUAL TO LESSONS MAIN. Measured at the move by
          # tools/lessons_pin_lag_control.py against Lessons main 545d9e8b: 2 commits
          # behind by SHA (#590 records, #591 toolchain), 0 published paths moved, so
          # the site-triggered and Lessons-triggered publishers build the same bytes.
          # Derived with git log --grep '(#594)' against origin/main, never typed.
          # Moved 2026-09-20 (ORDER FINISH-2 §5, the one Site window): b32bf1c7 -> Lessons
          # main 6bb8238f, HELD EQUAL TO LESSONS MAIN at the move (the #411 method), derived
          # with git rev-parse origin/main on the Lessons checkout, never typed. Measured by
          # tools/lessons_pin_lag_control.py at the move: 0 commits behind, 0 published paths
          # moved. The F3 and HUM-D5 Lessons merges that follow this window move 21 published
          # paths and add 1750; the registry's transition pairs and ARRIVING markers admit
          # both byte-states, so both publishers stay green until the next pin move.
          # Moved 2026-09-20 (ORDER FINISH-3): 6bb8238f -> Lessons main 5e496ba5f00fc08e02c13dd33c4f6a7eb2e07d77, the
          # squash merge of #600 (the 13 HUM-D5 packs, 1750 files, and the manifest pin).
          # Derived with git rev-parse origin/main on the Lessons checkout, never typed.
          # This discharges the EQUAL declaration that tools/lessons_pin_lag_control.py
          # reported RED before this PR: at 6bb8238f the pin was 3 commits behind main
          # with 1771 published paths moved. It moves WITH its Apps companion below (L31).
          ref: ${{ github.repository == 'MattRoper1977/Lessons' && github.sha || '5e496ba5f00fc08e02c13dd33c4f6a7eb2e07d77' }}
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          # Pinned 2026-09-16 (CX2 §5 EDU-D3, documented pin move under SW2_LEDGER.md §0): Apps main, the one
          # Apps revision the Lessons catalogue controls accept at the moved Lessons pin (its gate's canonical
          # files exist together only from this commit). It carries the SW2 A Apps front door; the Apps hub and
          # the tokens stylesheet are the measured output differences, confined to the Apps tree, and the
          # registry keeps the served rollback beside this candidate. Held EQUAL to domain-split-verify.yml.
          # The Apps caller instead builds its own current source commit.
          # Moved 2026-09-20 (ORDER FINISH-2 §5) WITH the Lessons pin above, because the two
          # move together or not at all: verify_catalogue_contract_controls.py builds its
          # Apps fixture from this checkout and runs the LESSONS gate copy against it, so a
          # Lessons pin whose gate copy has moved and an Apps pin whose copy has not is red
          # ("Unmodified Apps fixture retains its complete cross-estate checks"). Measured:
          # Lessons 6bb8238f + Apps a7d330b8 PASS 273; Lessons 6bb8238f + Apps dfca094b FAIL;
          # Site main's own pair (b32bf1c7 + dfca094b) PASS 274, so this red is this PR's.
          # a7d330b8 is the Apps #119 companion head, the Apps arm of the Lessons commit
          # the pin above now names; both gate copies are byte-identical at 1796ab50.
          # Moved 2026-09-20 (ORDER FINISH-3) WITH the Lessons pin above, per STANDING RULE
          # L31: a Site pin pair is ALWAYS a Lessons pin and ITS Apps companion, never a
          # Lessons pin beside the previous Apps main. a7d330b8 -> Apps main 2a9cb8e8ce81d94e030c901d8bf069eb41e19a3e,
          # the squash merge of #122, which is the Apps arm of the same commit: both gate
          # copies are byte-identical there, gateSha256 e91a97bb. Verified locally before
          # push with verify_catalogue_contract_controls.py (280 controls, 0 FAIL).
          ref: ${{ github.repository == 'MattRoper1977/Matt-s-Apps-' && github.sha || '2a9cb8e8ce81d94e030c901d8bf069eb41e19a3e' }}
          path: .sources/Apps
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python -m pip install lxml==6.0.1
      - name: Build and verify separated publication trees
        run: |
          python .sources/Site/domain-split/build_publications.py --lessons .sources/Lessons
          python .sources/Site/domain-split/build_education.py --lessons .sources/Lessons --apps .sources/Apps
          python .sources/Site/domain-split/check_publications.py
          python .sources/Site/domain-split/check_education_separation.py --self-test
          python .sources/Site/domain-split/check_education_separation.py
          python .sources/Site/domain-split/verify_education_tree_has_no_games.py --output .sources/Site/domain-split/output
          python .sources/Site/domain-split/check_education_support.py
          node .sources/Site/domain-split/check_game_saves.cjs
      - name: Prove all-file admission before packaging any education tree
        run: |
          python .sources/Site/domain-split/check_education_publication_admission.py --output .sources/Site/domain-split/output --lessons .sources/Lessons --apps .sources/Apps --build-control
      - name: Save the reviewed education output
        uses: actions/upload-artifact@v4
        with:
          name: education-${{ steps.target.outputs.kind }}-review
          path: .sources/Site/domain-split/output/education-${{ steps.target.outputs.kind }}
          include-hidden-files: true
          retention-days: 30
      - name: Read Pages configuration without changing it
        id: pages
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
            const ready = result.data.build_type === 'workflow';
            core.setOutput('ready', String(ready));
            if (!ready) core.notice('Review saved. The owner must select GitHub Actions in this repository’s Pages settings before activation.');
      - name: Require the separate games domain before education cutover
        if: steps.pages.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json,urllib.request
          with urllib.request.urlopen('https://madebymatt-play.uk/data/domain-catalogue.json',timeout=25) as r:d=json.load(r)
          assert d.get('games') and d.get('staff') is not None and 'education' not in d
          with urllib.request.urlopen('https://madebymatt-play.uk/game-saves/',timeout=25) as r:s=r.read().decode()
          assert 'save-import' in s
          print('Independent games and save import are available over HTTPS.')
          PY
      - name: Package the education Pages output
        if: steps.pages.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .sources/Site/domain-split/output/education-${{ steps.target.outputs.kind }}
  deploy:
    if: needs.build.outputs.ready == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
