name: MBM audience discovery closeout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbm-audience-discovery-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install Playwright Chromium
        # The copy gate is static, but the search-prominence gate is not and
        # cannot be: whether a control is above the fold at 390px, whether
        # anything covers it, and whether typing reaches the network are
        # runtime facts. A source grep for the search script called all seven
        # of these pages covered while none of them rendered a box.
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Generated audience HTML is byte-for-byte reproducible
        id: s01-generated-audience-html-is-byte-for-byte
        if: always()
        run: python3 tools/render_audience_homepages.py --check

      - name: Generated discovery hubs are byte-for-byte reproducible
        id: s02-generated-discovery-hubs-are-byte-for-by
        if: always()
        run: python3 tools/render_discovery_hubs.py --check

      - name: Search index regenerates from its sources
        id: s03-search-index-regenerates-from-its-source
        if: always()
        run: python3 tools/build_mbm_search_index.py --check

      - name: Education hub metadata and derived status
        id: s04-education-hub-metadata-and-derived-statu
        if: always()
        run: python3 tools/verify_education_hub.py --as-of 2026-08-09 --self-test

      - name: Audience accents meet contrast
        id: s05-audience-accents-meet-contrast
        if: always()
        run: python3 tools/check_audience_accents.py

      - name: Audience architecture, labels and privacy contract hold
        id: s06-audience-architecture-labels-and-privacy
        if: always()
        run: python3 tools/verify_games_audience_faces.py

      # G2. This gate existed, was complete, and had never run — no workflow
      # referenced it. It binds /stats/'s privacy sentence to the one config key
      # that can falsify it: set features.analytics.goatcounter and
      # mbm-features.js appends a remote counter script whose country resolution
      # is done from the IP server-side, at which point the page is lying. The
      # claim is matched by its own text rather than by a line number, and the
      # behavioural half loads the page and watches for the request, so it is not
      # string-matching a config. Wired only after being red-proved end to end
      # against a tree with the key set: exit 1, failing on THE RULE by name.
      - name: /stats/ privacy claim is bound to the config that can falsify it
        id: s07-stats-privacy-claim-is-bound-to-the-conf
        if: always()
        run: node tools/verify_stats_claim.mjs

      # H6. This gate had never run. Run by hand it reported a 0x0 swatch on
      # /tools/ — a layout race in the gate, not a defect in the page: at this
      # gate's viewport the swatch measures 44x44 in every state. Settled, given
      # a fail-closed assertion that distinguishes "never reached layout" from
      # "too small", and wired, because a fixed gate left unwired is the same
      # defect it was recorded under.
      - name: Six reading swatches on every engine, each a real 44px target
        id: s08-six-reading-swatches-on-every-engine-eac
        if: always()
        run: node tools/verify_highlumen_behaviour.mjs

      # G2, second instance, and this one is this branch's own. P2 shipped
      # verify_audience_copy.mjs — the gate that asserts each rewritten audience
      # page serves its own opening and closing block, that no two share one, and
      # that no closing block restates a guard belonging in the boundaries note —
      # and wired it to nothing. The headline content change of this branch had a
      # guard sitting unrun beside it, which is the exact defect G2 is about.
      - name: Each audience page serves its own copy, and no closing block restates a guard
        id: s09-each-audience-page-serves-its-own-copy-a
        if: always()
        run: node tools/verify_audience_copy.mjs

      - name: No served surface states a catalogue count its source disagrees with
        id: s10-no-served-surface-states-a-catalogue-cou
        if: always()
        # The third species of the second-literal trap already in this estate's
        # register: a gate holding its own copy of a value · a control retyping
        # a token · now a catalogue count copied into prose.
        # /for/schools-semh/ served "511 canonical internal destinations" against
        # an index of 715. The rule is DELETE the numeral, not update it: 715
        # buys accuracy until the 716th entry lands.
        run: node tools/verify_catalogue_counts.mjs

      - name: Search is findable, lazy, and fenced on the pupil page
        id: s11-search-is-findable-lazy-and-fenced-on-th
        if: always()
        run: node tools/verify_search_prominence.mjs

      - name: Design inheritance holds across audience surfaces
        id: s12-design-inheritance-holds-across-audience
        if: always()
        run: python3 tools/verify_design_inheritance.py

      # N2. This suite used to be a sequential step chain: one failing gate
      # skipped every gate after it, so a single red cost twenty-one signals and
      # the estate could not tell a new regression from the standing one. Each
      # gate now runs under `if: always()`, and THIS step is what makes the job
      # red. Deliberately not `continue-on-error`, which hides reds rather than
      # isolating them.
      - name: Aggregate - one failure costs one signal, not the suite
        if: always()
        shell: bash
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEP_OUTCOMES" > step-outcomes.json
          python3 - <<'AGG'
          import json
          d = json.load(open('step-outcomes.json'))
          rows = [(k, v.get('outcome')) for k, v in d.items()
                  if isinstance(v, dict) and v.get('outcome')]
          bad = [(k, o) for k, o in rows if o != 'success']
          print(f"{len(rows)} gate step(s) reported")
          for k, o in rows:
              print(f"  {o.upper():<9} {k}")
          if bad:
              print("")
              print(f"{len(bad)} of {len(rows)} did not pass - and skipped is not passed:")
              for k, o in bad:
                  print(f"  {o.upper():<9} {k}")
              raise SystemExit(1)
          print("")
          print("every gate in this job reported PASS")
          AGG

  gate-controls:
    name: Gates are proven red, not just green
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A gate that has never failed is not evidence. Each control perturbs the
      # tree and asserts the matching verifier notices, then restores it.
      - name: Renderer notices a hand-edited generated page
        id: s01-renderer-notices-a-hand-edited-generated
        if: always()
        run: |
          set -euo pipefail
          python3 tools/render_audience_homepages.py --check
          sed -i 's/Start with the teaching task./Start with the teaching task!/' for/teachers/index.html
          if python3 tools/render_audience_homepages.py --check; then
            echo "renderer did not notice a hand-edited generated page"; exit 1
          fi
          git checkout -- for/teachers/index.html

      - name: Accent gate notices a contrast regression
        id: s02-accent-gate-notices-a-contrast-regressio
        if: always()
        run: |
          set -euo pipefail
          python3 tools/check_audience_accents.py
          # Derive the tone to replace instead of naming it. A control that
          # hard-codes a colour stops firing the moment the palette moves,
          # which is how a gate quietly becomes decorative.
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("data/audience-homepages.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          current = data["audiences"]["teachers"]["accent"]
          path.write_text(
              path.read_text(encoding="utf-8").replace(
                  f'"accent": "{current}"', '"accent": "#F2C48A"', 1
              ),
              encoding="utf-8",
          )
          PY
          if python3 tools/check_audience_accents.py; then
            echo "accent gate did not notice a below-AA accent"; exit 1
          fi
          git checkout -- data/audience-homepages.json

      - name: Design gate notices a duplicate mark above the heading
        id: s03-design-gate-notices-a-duplicate-mark-abo
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          path = "for/teachers/index.html"
          markup = open(path).read()
          i = markup.find("<h1")
          open(path, "w").write(
              markup[:i]
              + '<img src="/assets/brand/micro_mark.svg" alt="" width="48" height="48">'
              + markup[i:]
          )
          PY
          if python3 tools/verify_design_inheritance.py --report 2>&1 \
             | grep -q "small duplicate brand mark sits above the page heading"; then
            echo "control detected"
          else
            echo "design gate did not notice a duplicate mark above the heading"; exit 1
          fi
          git checkout -- for/teachers/index.html

      - name: Audience verifier proves its own seven controls
        id: s04-audience-verifier-proves-its-own-seven-c
        if: always()
        run: python3 tools/verify_games_audience_faces.py --self-test

      - name: Search index check reads git, not the working tree
        id: s05-search-index-check-reads-git-not-the-wor
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/mbm-search-index.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["entries"][0]["title"] = "DELIBERATELY WRONG"
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          # The reference is the committed blob, so a corrupted worktree file
          # must not change the verdict.
          out=$(python3 tools/build_mbm_search_index.py --check 2>&1 || true)
          git checkout -- data/mbm-search-index.json
          if grep -q "DIFFERS" <<<"$out"; then
            echo "check read the working tree instead of the blob"; exit 1
          fi
          echo "control detected: reference is git"

      - name: An undeclared diff aborts the write
        id: s06-an-undeclared-diff-aborts-the-write
        if: always()
        run: |
          set -euo pipefail
          # Perturb only the editorial file's bytes, so every category still
          # reproduces and the run reaches the write gate. Mutating a source
          # manifest instead would fail --check first and never exercise it.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("data/mbm-search-editorial.json")
          t = p.read_text(encoding="utf-8")
          p.write_text(t.replace('"schemaVersion": 1,',
                                 '"schemaVersion": 1,\n  "_controlProbe": "transient",', 1),
                       encoding="utf-8")
          PY
          out=$(python3 tools/build_mbm_search_index.py --write 2>&1 || true)
          git checkout -- data/mbm-search-editorial.json
          if grep -q "write aborted" <<<"$out"; then
            echo "control detected: undeclared diff refused"
          else
            echo "write was not refused"; echo "$out" | head -10; exit 1
          fi
          git diff --quiet data/mbm-search-index.json || { echo "index was modified"; exit 1; }

      - name: A removed entry is the loudest failure, both ways
        id: s07-a-removed-entry-is-the-loudest-failure-b
        if: always()
        run: |
          set -euo pipefail
          # Sabotage the source: delete one unpinned game from the snapshot
          # manifest. The identity classification must scream REMOVED on
          # --check, and --write must refuse it twice - once undeclared, and
          # once even when it is declared with the generic --expect-diff,
          # because a removal only writes under its own --expect-removed flag.
          python3 - <<'PY'
          import json, pathlib
          ed = json.loads(pathlib.Path("data/mbm-search-editorial.json").read_text(encoding="utf-8"))
          pinned = set(ed["gameIdOverrides"])
          p = pathlib.Path("data/source-manifests/games.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          victim = next(g for g in d["games"] if g["href"] not in pinned)
          d["games"] = [g for g in d["games"] if g is not victim]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("control victim:", victim["href"])
          PY
          out=$(python3 tools/build_mbm_search_index.py --check 2>&1 || true)
          if ! grep -q "REMOVED" <<<"$out"; then
            echo "check did not scream about a removed entry"; echo "$out" | tail -5; exit 1
          fi
          key=$(grep -oP '(?<=- REMOVED )\S+' <<<"$out" | head -1)
          out=$(python3 tools/build_mbm_search_index.py --write 2>&1 || true)
          if ! grep -q "write aborted" <<<"$out"; then
            echo "undeclared removal was not refused"; exit 1
          fi
          out=$(python3 tools/build_mbm_search_index.py --write --expect-diff "entries.$key" 2>&1 || true)
          if ! grep -q "write aborted" <<<"$out"; then
            echo "a removal rode in under --expect-diff"; exit 1
          fi
          git checkout -- data/source-manifests/games.json
          git diff --quiet data/mbm-search-index.json || { echo "index was modified"; exit 1; }
          echo "control detected: removal screams on check and only writes under --expect-removed"

      - name: External link classification controls
        id: s08-external-link-classification-controls
        if: always()
        run: python3 tools/check_education_hub_links.py --self-test

      - name: Skipped-job guard controls
        id: s09-skipped-job-guard-controls
        if: always()
        run: python3 tools/check_no_skipped_jobs.py --self-test

      - name: Workflows reference no path that does not exist
        id: s10-workflows-reference-no-path-that-does-no
        if: always()
        run: |
          set -euo pipefail
          python3 tools/check_workflow_paths.py --self-test
          python3 tools/check_workflow_paths.py

      - name: Install the browser the proof drives
        id: s11-install-the-browser-the-proof-drives
        if: always()
        # TWO runtimes, deliberately. verify_audience_discovery_browser.py is
        # Python and needs the pip package; the count and prominence controls
        # below are Node and need the npm one. Installing only the first is
        # what made the prominence control fail with ERR_MODULE_NOT_FOUND —
        # and, before it was hardened, what would have made that read as a
        # passing red control on a machine where the gate never ran at all.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          # R10: ONE install line for this job. acorn used to be installed again
          # at the hasTouch step, which PRUNES playwright - harmless only while
          # nothing after that step drove a browser. The surface-floor control now
          # does, so both packages are installed once, here.
          npm i --no-save playwright@1.56.1 acorn@8.18.0
          npx playwright install --with-deps chromium

      # This job carries no `paths:` filter, which is why the hud scriptLine
      # check is run from here rather than from verify-games-audience-faces.yml.
      # That workflow filters on a path list, and neither the tool nor
      # data/hud-coverage.json is on it - a gate added there would have matched
      # nothing and run zero times, which is exactly how Lessons PR #114 ran no
      # checks at all. A filter that has to be remembered is a filter that will
      # be forgotten.
      # F2. The two *_surfaces.js gates queried '#allGrid' and '#sportsRail',
      # ids that have never existed on /games/. They failed every run — loudly,
      # not blind — but on a selector rather than on the shelf, which is the
      # same as not testing it. The repair lives in tools/lib/shelf-probe.js and
      # these controls prove it on a page served from this repo: the same bytes
      # Pages serves, because there is no build step. Scenario 3 is the one that
      # matters — it shows the old `rendered === expected` passing on 0 === 0,
      # and the new guard refusing it.
      # Z2. A game's declared accent must equal its shelf card hue. Derived from
      # the manifest, nothing pinned. The Velodrome split is asserted too, so it
      # stays a decision rather than becoming drift somebody later "tidies".
      - name: Each game's accent is its shelf card hue
        id: s12-each-game-s-accent-is-its-shelf-card-hue
        if: always()
        run: node tools/verify_accent_parity.mjs

      - name: ...and the parity gate notices a game drifting from its card
        id: s13-and-the-parity-gate-notices-a-game-drift
        if: always()
        run: |
          set -e
          cp apexcurl/index.html /tmp/ac.bak
          sed -i "s/const ACCENT='#00F0B4'/const ACCENT='#39C6EF'/" apexcurl/index.html
          out=$(node tools/verify_accent_parity.mjs 2>&1 || true)
          cp /tmp/ac.bak apexcurl/index.html
          echo "$out" | grep -q 'accent parity:' || { echo "the gate did not run - this control proves nothing"; echo "$out"; exit 1; }
          echo "$out" | grep -q 'script accent equals the shelf card hue' \
            || { echo "it failed, but not on the assertion it names"; echo "$out"; exit 1; }
          echo "$out" | grep -q '\[FAIL\]' || { echo "parity accepted a drifted accent"; exit 1; }
          node tools/verify_accent_parity.mjs

      - name: ...and it notices the deliberate split being tidied away
        id: s14-and-it-notices-the-deliberate-split-bein
        if: always()
        run: |
          set -e
          cp apexvelodrome/index.html /tmp/av.bak
          python3 - <<'PY'
          s = open('apexvelodrome/index.html', encoding='utf-8').read()
          a = s.replace("'#5fb6ff'", 'ACCENT')
          assert a != s, 'control did not mutate anything - it would prove nothing'
          open('apexvelodrome/index.html', 'w', encoding='utf-8').write(a)
          PY
          out=$(node tools/verify_accent_parity.mjs 2>&1 || true)
          cp /tmp/av.bak apexvelodrome/index.html
          echo "$out" | grep -q 'accent parity:' || { echo "the gate did not run"; echo "$out"; exit 1; }
          echo "$out" | grep -q 'the declared split survives' \
            || { echo "it failed, but not on the assertion it names"; echo "$out"; exit 1; }
          node tools/verify_accent_parity.mjs

      # Z1. The takes gate resolves its content from the COMMITTED BLOB and
      # compares it to a hash pinned in data/takes-pin.json. Fetch depth matters:
      # `git show HEAD:` needs the blob, which a depth-1 checkout still has.
      # G2. The gate above had never run, so "it passes" was a claim and not a
      # result. This is its external control: a scratch tree with the counter key
      # set and the claim left standing must exit non-zero AND fail on THE RULE
      # by name — not merely fail, and not fail because playwright is missing.
      - name: The /stats/ privacy gate fails on the rule it names
        id: s15-the-stats-privacy-gate-fails-on-the-rule
        if: always()
        run: |
          set -euo pipefail
          S=$(mktemp -d)
          for d in stats assets data; do [ -d "$d" ] && cp -r "$d" "$S/"; done
          python3 - "$S" <<'PY2'
          import json, sys
          c = json.load(open('site.json'))
          c.setdefault('features', {}).setdefault('analytics', {})['goatcounter'] = 'madebymatt'
          json.dump(c, open(sys.argv[1] + '/site.json', 'w'), indent=2)
          PY2
          out=$(node tools/verify_stats_claim.mjs "$S" 2>&1) && rc=0 || rc=$?
          rm -rf "$S"
          if [ "$rc" = "2" ]; then
            echo "the gate was INCONCLUSIVE (playwright missing) — that is not a red"; echo "$out" | tail -5; exit 1
          fi
          if [ "$rc" = "0" ]; then
            echo "the gate passed with the counter key set — it cannot fail"; echo "$out" | tail -20; exit 1
          fi
          grep -q 'FAIL.*THE RULE: a non-empty goatcounter key may not coexist with the claim' <<<"$out" \
            || { echo "it failed, but not on the assertion it names"; echo "$out" | tail -20; exit 1; }
          echo "control detected — red on THE RULE, exit $rc"
          node tools/verify_stats_claim.mjs > /dev/null

      - name: The audience-copy gate fails on the uniqueness assertion it names
        id: s16-the-audience-copy-gate-fails-on-the-uniq
        if: always()
        run: |
          set -euo pipefail
          cp data/audience-homepages.json /tmp/adh.bak
          python3 - <<'PY2'
          import json, collections
          p = 'data/audience-homepages.json'
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          d['audiences']['partners']['closing'] = d['audiences']['councils']['closing']
          json.dump(d, open(p, 'w'), ensure_ascii=False, indent=2)
          open(p, 'a').write('\n')
          PY2
          python3 tools/render_audience_homepages.py > /dev/null
          out=$(node tools/verify_audience_copy.mjs 2>&1) && rc=0 || rc=$?
          cp /tmp/adh.bak data/audience-homepages.json
          python3 tools/render_audience_homepages.py > /dev/null
          if [ "$rc" = "0" ]; then
            echo "two pages shared a closing block and the gate passed"; echo "$out" | tail -20; exit 1
          fi
          grep -q 'FAIL.*every rewritten page has its own closing' <<<"$out" \
            || { echo "it failed, but not on the assertion it names"; echo "$out" | tail -20; exit 1; }
          echo "control detected — red on the uniqueness limb, exit $rc"
          node tools/verify_audience_copy.mjs > /dev/null
          python3 tools/render_audience_homepages.py --check

      - name: Matt's takes are what the pin says they are
        id: s17-matt-s-takes-are-what-the-pin-says-they
        if: always()
        run: node tools/verify_takes_pin.mjs

      - name: ...and a changed take goes red even if another gate is taught to accept it
        id: s18-and-a-changed-take-goes-red-even-if-anot
        if: always()
        run: |
          set -e
          git config user.email ci@local; git config user.name ci
          BASE=$(git rev-parse HEAD)
          python3 - <<'PY'
          s = open('games/index.html', encoding='utf-8').read()
          a = s.replace("The eight I'd put in front of anyone first", 'Eight favourites, one line each', 1)
          assert a != s, 'control did not mutate anything - it would prove nothing'
          open('games/index.html', 'w', encoding='utf-8').write(a)
          g = open('tools/verify_games_audience_faces.py').read()
          b = g.replace("The eight I'd put in front of anyone first", 'Eight favourites, one line each', 1)
          assert b != g, 'control did not update the other gate - it would prove nothing'
          open('tools/verify_games_audience_faces.py', 'w').write(b)
          PY
          git commit -q -am "control: mutate a take and teach the other gate to accept it"
          out=$(node tools/verify_takes_pin.mjs 2>&1 || true)
          git reset -q --hard "$BASE"
          echo "$out" | grep -q 'takes pin:' || { echo "the gate did not run at all - this control proves nothing"; echo "$out"; exit 1; }
          echo "$out" | grep -q 'is unchanged from the pin' || { echo "it failed, but not on the assertion it names"; echo "$out"; exit 1; }
          echo "$out" | grep -q '\[FAIL\]' || { echo "the pin accepted a changed take"; exit 1; }
          node tools/verify_takes_pin.mjs

      # G3. The pin now also covers the LOCKED CHOOSER COPY. The control that
      # already guarded that copy deletes a different sentence — it proves the
      # guard can fire, not that the guard's expectation is immune to being
      # co-updated. This one mutates the promise and requires the pin to name the
      # region that moved, in a scratch worktree so the real tree is never at risk.
      - name: The pin notices the locked chooser promise moving by one comma
        id: s19-the-pin-notices-the-locked-chooser-promi
        if: always()
        run: |
          set -euo pipefail
          W=$(mktemp -d)
          git worktree add -q --detach "$W" HEAD
          cleanup() { git worktree remove --force "$W" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          python3 - "$W" <<'PY2'
          import sys
          p = sys.argv[1] + '/index.html'
          s = open(p, encoding='utf-8').read()
          o = "Choosing one does not create an account, change permissions or hide public content."
          n = "Choosing one does not create an account, change permissions, or hide public content."
          assert s.count(o) == 1, f"locked promise not found exactly once ({s.count(o)})"
          open(p, 'w', encoding='utf-8').write(s.replace(o, n, 1))
          PY2
          git -C "$W" add -A
          git -C "$W" -c user.email=ci@local -c user.name=ci commit -q -m scratch
          # Run the WORKTREE'S OWN copy. verify_takes_pin.mjs derives ROOT from its
          # own file location and runs `git show HEAD:` there, so invoking the main
          # tree's copy would read the main tree's HEAD and pass on an unmutated
          # blob — a vacuous control. This was caught by testing the control.
          out=$(cd "$W" && node tools/verify_takes_pin.mjs 2>&1) && rc=0 || rc=$?
          if [ "$rc" = "0" ]; then
            echo "the locked promise moved and the pin passed"; echo "$out" | tail -20; exit 1
          fi
          grep -q 'FAIL.*chooserPromise' <<<"$out" \
            || { echo "it failed, but not on the region it names"; echo "$out" | tail -20; exit 1; }
          echo "control detected — red on chooserPromise, exit $rc"
          node tools/verify_takes_pin.mjs > /dev/null

      - name: The swatch gate refuses a control that never reached layout
        id: s20-the-swatch-gate-refuses-a-control-that-n
        if: always()
        run: |
          set -euo pipefail
          cp tools/index.html /tmp/tools.bak
          python3 - <<'PY2'
          s = open('tools/index.html', encoding='utf-8').read()
          s = s.replace('</head>', '<style>.mbm-sw{display:none!important}</style></head>', 1)
          open('tools/index.html', 'w', encoding='utf-8').write(s)
          PY2
          out=$(node tools/verify_highlumen_behaviour.mjs 2>&1) && rc=0 || rc=$?
          cp /tmp/tools.bak tools/index.html
          if [ "$rc" = "0" ]; then
            echo "every swatch was display:none and the gate passed"; echo "$out" | tail -20; exit 1
          fi
          # N3/R5. The gate used to call this "the control never reached layout"
          # inside an "under 44px" message. It now separates them, because a null
          # measurement is not a failing measurement: 0x0 means NOT MEASURED and
          # saying "under 44px" sends the reader to the CSS for a size bug that
          # does not exist. This control tracks that rename AND pins the
          # distinction, so the two can never be conflated again.
          if ! grep -q 'MEASUREMENT INVALID' <<<"$out"; then
            echo "it failed, but not on the fail-closed assertion it names"; echo "$out" | tail -20; exit 1
          fi
          if grep -q 'UNDER 44PX' <<<"$out"; then
            echo "it reported a swatch with NO layout box as a SIZE — the conflation R5 forbids"
            echo "$out" | tail -20; exit 1
          fi
          echo "control detected — MEASUREMENT INVALID on not-in-layout, and no size claimed, exit $rc"
          node tools/verify_highlumen_behaviour.mjs > /dev/null

      # N3.5. The companion control. The first proves a NULL box is reported as
      # MEASUREMENT INVALID; this proves a REAL box that is merely too small is
      # reported as a SIZE. Two causes, two messages, and each control asserts
      # the other message is ABSENT — which is what stops them being conflated
      # again the next time someone edits either branch.
      - name: ...and it reports a too-small swatch as a size, not as unmeasurable
        id: s22b-swatch-under-44-reports-a-size
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp tools/index.html /tmp/tools40.bak
          python3 - <<'PY2'
          s = open('tools/index.html', encoding='utf-8').read()
          s = s.replace('</head>', '<style>.mbm-sw{width:40px!important;height:40px!important}</style></head>', 1)
          open('tools/index.html', 'w', encoding='utf-8').write(s)
          PY2
          out=$(node tools/verify_highlumen_behaviour.mjs 2>&1) && rc=0 || rc=$?
          cp /tmp/tools40.bak tools/index.html
          if [ "$rc" = "0" ]; then
            echo "every swatch was 40px and the gate passed"; echo "$out" | tail -20; exit 1
          fi
          if ! grep -q 'UNDER 44PX' <<<"$out"; then
            echo "it failed, but not on the size assertion it names"; echo "$out" | tail -20; exit 1
          fi
          if grep -q 'MEASUREMENT INVALID' <<<"$out"; then
            echo "a swatch with a real 40px box was reported as unmeasurable"; echo "$out" | tail -20; exit 1
          fi
          echo "control detected — UNDER 44PX on a real 40px box, not reported as invalid, exit $rc"
          node tools/verify_highlumen_behaviour.mjs > /dev/null

      - name: A published game is in the sitemap
