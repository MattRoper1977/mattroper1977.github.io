      - name: Aggregate - one failure costs one signal, not the suite
        if: always()
        shell: bash
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          printf '%s' "$STEP_OUTCOMES" > step-outcomes.json
          python3 - <<'AGG'
          import json
          d = json.load(open('step-outcomes.json'))
          rows = [(k, v.get('outcome')) for k, v in d.items()
                  if isinstance(v, dict) and v.get('outcome')]
          bad = [(k, o) for k, o in rows if o != 'success']
          print(f"{len(rows)} gate step(s) reported")
          for k, o in rows:
              print(f"  {o.upper():<9} {k}")
          if bad:
