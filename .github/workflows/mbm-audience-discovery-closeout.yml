      # S1'.3 / A1. verify_surfaces.js S2 asserted only NAMED games: a render that
      # dropped fifty cards while keeping Neon Sync, Biopunk Hive and Neon Breach
      # passed every assertion it had. S2f adds a floor DERIVED from the served
      # manifest, per selector. This control proves that floor reds on its own
      # message - the existing S2c control fires on the named-games assertion, and
