name: MBM audience discovery closeout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbm-audience-discovery-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Static gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generated audience HTML is byte-for-byte reproducible
        run: python3 tools/render_audience_homepages.py --check

      - name: Generated discovery hubs are byte-for-byte reproducible
        run: python3 tools/render_discovery_hubs.py --check

      - name: Search index regenerates from its sources
        run: python3 tools/build_mbm_search_index.py --check

      - name: Education hub metadata and derived status
        run: python3 tools/verify_education_hub.py --as-of 2026-08-09 --self-test

      - name: Audience accents meet contrast
        run: python3 tools/check_audience_accents.py

      - name: Audience architecture, labels and privacy contract hold
        run: python3 tools/verify_games_audience_faces.py

      - name: Design inheritance holds across audience surfaces
        run: python3 tools/verify_design_inheritance.py

  gate-controls:
    name: Gates are proven red, not just green
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A gate that has never failed is not evidence. Each control perturbs the
      # tree and asserts the matching verifier notices, then restores it.
      - name: Renderer notices a hand-edited generated page
        run: |
          set -euo pipefail
          python3 tools/render_audience_homepages.py --check
          sed -i 's/Start with the teaching task./Start with the teaching task!/' for/teachers/index.html
          if python3 tools/render_audience_homepages.py --check; then
            echo "renderer did not notice a hand-edited generated page"; exit 1
          fi
          git checkout -- for/teachers/index.html

      - name: Accent gate notices a contrast regression
        run: |
          set -euo pipefail
          python3 tools/check_audience_accents.py
          # Derive the tone to replace instead of naming it. A control that
          # hard-codes a colour stops firing the moment the palette moves,
          # which is how a gate quietly becomes decorative.
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path("data/audience-homepages.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          current = data["audiences"]["teachers"]["accent"]
          path.write_text(
              path.read_text(encoding="utf-8").replace(
                  f'"accent": "{current}"', '"accent": "#F2C48A"', 1
              ),
              encoding="utf-8",
          )
          PY
          if python3 tools/check_audience_accents.py; then
            echo "accent gate did not notice a below-AA accent"; exit 1
          fi
          git checkout -- data/audience-homepages.json

      - name: Design gate notices a duplicate mark above the heading
        run: |
          set -euo pipefail
          python3 - <<'PY'
          path = "for/teachers/index.html"
          markup = open(path).read()
          i = markup.find("<h1")
          open(path, "w").write(
              markup[:i]
              + '<img src="/assets/brand/micro_mark.svg" alt="" width="48" height="48">'
              + markup[i:]
          )
          PY
          if python3 tools/verify_design_inheritance.py --report 2>&1 \
             | grep -q "small duplicate brand mark sits above the page heading"; then
            echo "control detected"
          else
            echo "design gate did not notice a duplicate mark above the heading"; exit 1
          fi
          git checkout -- for/teachers/index.html

      - name: Audience verifier proves its own seven controls
        run: python3 tools/verify_games_audience_faces.py --self-test

      - name: Search index check reads git, not the working tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/mbm-search-index.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["entries"][0]["title"] = "DELIBERATELY WRONG"
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          # The reference is the committed blob, so a corrupted worktree file
          # must not change the verdict.
          out=$(python3 tools/build_mbm_search_index.py --check 2>&1 || true)
          git checkout -- data/mbm-search-index.json
          if grep -q "DIFFERS" <<<"$out"; then
            echo "check read the working tree instead of the blob"; exit 1
          fi
          echo "control detected: reference is git"

      - name: An undeclared diff aborts the write
        run: |
          set -euo pipefail
          # Perturb only the editorial file's bytes, so every category still
          # reproduces and the run reaches the write gate. Mutating a source
          # manifest instead would fail --check first and never exercise it.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("data/mbm-search-editorial.json")
          t = p.read_text(encoding="utf-8")
          p.write_text(t.replace('"schemaVersion": 1,',
                                 '"schemaVersion": 1,\n  "_controlProbe": "transient",', 1),
                       encoding="utf-8")
          PY
          out=$(python3 tools/build_mbm_search_index.py --write 2>&1 || true)
          git checkout -- data/mbm-search-editorial.json
          if grep -q "write aborted" <<<"$out"; then
            echo "control detected: undeclared diff refused"
          else
            echo "write was not refused"; echo "$out" | head -10; exit 1
          fi
          git diff --quiet data/mbm-search-index.json || { echo "index was modified"; exit 1; }

      - name: A removed entry is the loudest failure, both ways
        run: |
          set -euo pipefail
          # Sabotage the source: delete one unpinned game from the snapshot
          # manifest. The identity classification must scream REMOVED on
          # --check, and --write must refuse it twice - once undeclared, and
          # once even when it is declared with the generic --expect-diff,
          # because a removal only writes under its own --expect-removed flag.
          python3 - <<'PY'
          import json, pathlib
          ed = json.loads(pathlib.Path("data/mbm-search-editorial.json").read_text(encoding="utf-8"))
          pinned = set(ed["gameIdOverrides"])
          p = pathlib.Path("data/source-manifests/games.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          victim = next(g for g in d["games"] if g["href"] not in pinned)
          d["games"] = [g for g in d["games"] if g is not victim]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("control victim:", victim["href"])
          PY
          out=$(python3 tools/build_mbm_search_index.py --check 2>&1 || true)
          if ! grep -q "REMOVED" <<<"$out"; then
            echo "check did not scream about a removed entry"; echo "$out" | tail -5; exit 1
          fi
          key=$(grep -oP '(?<=- REMOVED )\S+' <<<"$out" | head -1)
          out=$(python3 tools/build_mbm_search_index.py --write 2>&1 || true)
          if ! grep -q "write aborted" <<<"$out"; then
            echo "undeclared removal was not refused"; exit 1
          fi
          out=$(python3 tools/build_mbm_search_index.py --write --expect-diff "entries.$key" 2>&1 || true)
          if ! grep -q "write aborted" <<<"$out"; then
            echo "a removal rode in under --expect-diff"; exit 1
          fi
          git checkout -- data/source-manifests/games.json
          git diff --quiet data/mbm-search-index.json || { echo "index was modified"; exit 1; }
          echo "control detected: removal screams on check and only writes under --expect-removed"

      - name: External link classification controls
        run: python3 tools/check_education_hub_links.py --self-test

      - name: Skipped-job guard controls
        run: python3 tools/check_no_skipped_jobs.py --self-test

      - name: Workflows reference no path that does not exist
        run: |
          set -euo pipefail
          python3 tools/check_workflow_paths.py --self-test
          python3 tools/check_workflow_paths.py

      - name: Install the browser the proof drives
        run: |
          set -euo pipefail
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium

      - name: Browser proof controls
        run: python3 tools/verify_audience_discovery_browser.py --self-test

      - name: A re-introduced off-origin boot fetch goes red
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("assets/mbm-account.js")
          t = p.read_text(encoding="utf-8")
          p.write_text(t.replace("  function boot() {",
              "  function boot() {\n    try { fetch('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm').catch(function(){}); } catch(e){}",
              1), encoding="utf-8")
          PY
          python3 -m http.server 4174 --bind 127.0.0.1 >/tmp/ctl.log 2>&1 &
          for _ in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4174/ && break || sleep 1; done
          # --artifacts keeps this deliberate failure out of the committed
          # artifact. It landed there once and had to be reverted by hand; a
          # hazard the harness can remove is better than one it has to police.
          out=$(MBM_BASE_URL=http://127.0.0.1:4174/ python3 tools/verify_audience_discovery_browser.py \
                  --artifacts "${RUNNER_TEMP:-/tmp}/boot-control" 2>&1 || true)
          git checkout -- assets/mbm-account.js
          if grep -q "contacts no third party" <<<"$out"; then
            echo "control detected: off-origin boot fetch caught"
            # /for/pupils/ is expected NOT to fire here: mbm-account.js is never
            # injected on a page carrying data-mbm-adult-features="off", so the
            # control has nothing to break there. That is the pupil guarantee
            # working, and it reads as a pass.
            echo "note: /for/pupils/ does not fire - the account script is never injected there"
          else
            echo "estate-wide boot assertion did not fire"; echo "$out" | tail -20; exit 1
          fi
          # The point of --artifacts is that this can no longer happen; assert
          # it, so a future edit that drops the flag is caught here.
          if ! git diff --quiet audit-output/; then
            echo "a control run modified the committed artifact"; git diff --stat audit-output/; exit 1
          fi

      - name: Browser proof against the checked-out estate
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/serve.log 2>&1 &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break || sleep 1
          done
          MBM_BASE_URL=http://127.0.0.1:4173/ python3 tools/verify_audience_discovery_browser.py

      # An upload path and a tool's output path that drift apart caused both
      # symptoms of this defect: `error` on a stale path turned a working proof
      # red, and `ignore` on a stale path uploaded nothing while reporting
      # success. Choosing between those two settings is treating the symptom -
      # so compare the two paths instead of trusting them to agree.
      - name: The upload path is the path the tool writes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re, sys
          sys.path.insert(0, "tools")
          from verify_audience_discovery_browser import ARTIFACTS, ROOT
          workflow = pathlib.Path(".github/workflows/mbm-audience-discovery-closeout.yml").read_text(encoding="utf-8")
          block = re.search(r"name:\s*browser-proof\s*\n\s*(?:#[^\n]*\n\s*)*path:\s*(\S+)", workflow)
          if not block:
              raise SystemExit("could not find the browser-proof upload path in the workflow")
          declared = (ROOT / block.group(1)).resolve()
          if declared != ARTIFACTS.resolve():
              raise SystemExit(f"upload path {declared} is not where the tool writes ({ARTIFACTS})")
          print(f"upload path agrees with the tool: {block.group(1)}")
          PY

      - name: Upload browser proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-proof
          # Kept in step with the tool by the check above. `error` because a
          # silently empty upload is worse than a red step: if the proof did not
          # run, that is the thing worth knowing.
          path: audit-output/audience-discovery
          if-no-files-found: error

      - name: Locked chooser copy cannot silently disappear
        run: |
          set -euo pipefail
          sed -i 's/, and it is not sent to Supabase, Buttondown or analytics\.//' tools/render_audience_homepages.py
          python3 tools/render_audience_homepages.py
          # Capture first, then match. Under pipefail the verifier's own exit 1
          # - which is the thing being proven - would otherwise fail the `if`.
          out=$(python3 tools/verify_games_audience_faces.py 2>&1 || true)
          if grep -q "locked chooser copy missing" <<<"$out"; then
            echo "control detected"
          else
            echo "locked-copy guard did not fire"; echo "$out" | head -20; exit 1
          fi
          git checkout -- tools/render_audience_homepages.py index.html

      - name: The hasTouch claim in verify_inline_exit.mjs is asserted, not just written
        # That note is load-bearing: it is why /relicforge/ asserts 12 presses
        # and not 8. Until this gate it was only a sentence, and prose is not
        # asserted - it ages while the code beside it stays green. Three times
        # this week: #141's stale F1 table, the /neonmeridian/ 59.5 fps column
        # read as sample quality, and the sentence this note replaced.
        #
        # Parsed, never grepped. The note names hasTouch eleven times in prose;
        # a regex would count its own documentation and call the claim
        # satisfied. The gate's third control proves that specifically - a
        # comment naming hasTouch above a context that omits it still counts as
        # omitting, where a grep would have passed.
        shell: bash
        run: |
          set -euo pipefail
          npm i --no-save acorn@8.18.0 >/dev/null
          node tools/verify_hastouch_claim.mjs

      - name: Design gate notices a missing hero mark
        run: |
          set -euo pipefail
          sed -i 's|<img class="mf-hero-mark"[^>]*>||' for/teachers/index.html
          if python3 tools/verify_design_inheritance.py --report 2>&1 | grep -q "hero mark"; then
            echo "control detected"
          else
            echo "design gate did not notice a missing hero mark"; exit 1
          fi
          git checkout -- for/teachers/index.html

  production:
    name: Routes serve 200 and removed paths 404 - reachability, not deployment
    # Only meaningful against what is actually published, so it runs on main
    # and on demand - never as a proxy for a branch that has not shipped.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Read back the published routes (reachability only)
        run: |
          set -uo pipefail
          base="https://madebymatt.uk"
          routes="/ /main/ /start/ /teach/ /resources/ /education-hub/ \
                  /for/pupils/ /for/teachers/ /for/parents-carers/ /for/schools-semh/ \
                  /for/trusts/ /for/councils-organisations/ /for/partners/"
          # WHAT THIS DOES AND DOES NOT PROVE.
          #
          # It proves the routes are reachable and that two removed paths are
          # gone. It does NOT prove anything about a deployment, and it cannot:
          # the retry ladder below re-checks only routes that are not yet 200,
          # and a route that served 200 before a merge serves 200 after it. On
          # 9 August it printed "all 13 routes 200 ... 1 attempt(s)" 31 seconds
          # before the deployment it appeared to describe existed, and printed
          # the identical line 8m46s after that deployment completed.
          #
          # Deployment provenance is proven by mbm-deployment-provenance.yml,
          # which triggers on the deployment event and compares served bytes
          # against the commit. Read this step as reachability only.
          delays="0 300 300 300"
          attempt=0
          pending="$routes"
          for delay in $delays; do
            [ "$delay" -gt 0 ] && { echo "--- waiting ${delay}s for deployment ---"; sleep "$delay"; }
            attempt=$((attempt + 1))
            echo "--- attempt $attempt at $(date -u +%H:%M:%SZ) ---"
            still=""
            for route in $pending; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base$route")
              printf '  %-34s %s\n' "$route" "$code"
              [ "$code" = "200" ] || still="$still $route"
            done
            pending="$still"
            [ -z "$pending" ] && break
            echo "  still not 200:$pending"
          done

          echo "--- these must NOT be served ---"
          negatives=0
          for route in /__probe_do_not_create__ /.mbm-closeout/patch.xz.b64.00; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base$route")
            printf '  %-34s %s\n' "$route" "$code"
            [ "$code" = "404" ] || negatives=1
          done

          if [ -n "$pending" ]; then
            echo "routes never reached 200 after $attempt attempts:$pending"; exit 1
          fi
          if [ "$negatives" != "0" ]; then
            echo "a path that must be removed is still served"; exit 1
          fi
          echo "all 13 routes 200; both removed paths 404; $attempt attempt(s)"
          echo "reachability only - this proves nothing about which commit is deployed;"
          echo "see mbm-deployment-provenance.yml for that."
