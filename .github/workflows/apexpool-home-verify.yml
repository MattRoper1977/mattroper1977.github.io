name: Apex Sports homepage publication verify

on:
  pull_request:
    paths:
      - 'main/index.html'
      - 'site.json'
      - 'assets/cards/apex-golf-door.svg'
      - 'assets/cards/apex-tennis-door.svg'
      - 'tools/apply_apexpool_home.js'
      - 'tools/apply_apextennis_home.js'
      - 'tools/verify_apexpool_home.py'
      - 'tools/verify_apexpool_home_browser.js'
      - 'tools/verify_apextennis_home.py'
      - 'tools/verify_apextennis_home_browser.js'
      - '.github/workflows/apexpool-home-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: apex-sports-home-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Entry conditions — both games are landed
        shell: bash
        run: |
          set -euo pipefail
          test -f apexgolf/index.html
          test -f apextennis/index.html
          test "$(sha256sum apextennis/index.html | awk '{print $1}')" = "8e109ab55a0fb2a284f2e2e0bb5baa8bf468eaea8e2e89593fd71a20cdfb9b1f"
          grep -q 'apexgolf-build-2026-08-04' apexgolf/index.html

      - name: Capture the measured 12-door main baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apextennis-home
          git show origin/main:site.json > artifacts/apextennis-home/site-before.json
          git show origin/main:index.html > artifacts/apextennis-home/index-before.html
          # THIRD INSTANCE OF THE A-6 SHAPE. This asserted a hardcoded 12 and has
          # been RED ON MAIN'S OWN BASELINE since 6e8ab12 (site#44) took doors to
          # 14 — every PR touching index.html or site.json has failed here since.
          # Re-pinning at 14 would be the same defect one number later: the Apex
          # Golf branch removes a door and takes it to 13, so a re-pin goes red
          # the moment that merges. The pending known change is the proof that
          # pinning is the wrong shape. DERIVE the count; assert STRUCTURE.
          node tools/verify_home_doors_baseline.js artifacts/apextennis-home/site-before.json
          # Non-vacuity: the same invariants must REJECT a deliberately broken
          # baseline, or the green above means nothing.
          node tools/verify_home_doors_baseline.js --self-test

      - name: Static, structure and idempotency gates
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/apply_apextennis_home.js
          node --check tools/verify_apextennis_home_browser.js
          python3 tools/verify_apextennis_home.py main/index.html site.json assets/cards/apex-golf-door.svg assets/cards/apex-tennis-door.svg artifacts/apextennis-home/site-before.json artifacts/apextennis-home/index-before.html | tee artifacts/apextennis-home/static.log
          before_index=$(sha256sum main/index.html | awk '{print $1}')
          before_site=$(sha256sum site.json | awk '{print $1}')
          node tools/apply_apexpool_home.js | tee artifacts/apextennis-home/idempotency.log
          test "$before_index" = "$(sha256sum main/index.html | awk '{print $1}')"
          test "$before_site" = "$(sha256sum site.json | awk '{print $1}')"

      - name: Demonstrate four static failure families
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apextennis-home
          # A mutation fixture written against a literal goes INERT the moment
          # that literal moves: it edits nothing, the validator correctly
          # accepts an unmodified file, and the run fails with a message that
          # blames the validator. That is what happened when the New Release
          # occupant changed — the fixture still searched for the old tenant.
          # An inert fixture proves nothing, so every family is now checked for
          # having actually bitten BEFORE its result is allowed to count.
          reject() {
            local family="$1"
            if cmp -s main/index.html /tmp/apextennis-home/index.html && cmp -s site.json /tmp/apextennis-home/site.json; then
              echo "*** FIXTURE INERT *** ${family} changed nothing, so it proves nothing" >&2
              exit 1
            fi
            if python3 tools/verify_apextennis_home.py /tmp/apextennis-home/index.html /tmp/apextennis-home/site.json assets/cards/apex-golf-door.svg assets/cards/apex-tennis-door.svg artifacts/apextennis-home/site-before.json artifacts/apextennis-home/index-before.html >/tmp/apextennis-home/${family}.log 2>&1; then
              cat /tmp/apextennis-home/${family}.log
              echo "validator accepted ${family} mutation" >&2
              exit 1
            fi
            echo "PASS mutation ${family} rejected" | tee -a artifacts/apextennis-home/nonvacuity.log
          }
          cp main/index.html /tmp/apextennis-home/index.html; cp site.json /tmp/apextennis-home/site.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/apextennis-home/index.html');p.write_text(p.read_text().replace('data-sport-game="Apex Tennis"','data-sport-game="Apex Pool"',1))
          PY
          reject missing-tennis-card

          cp main/index.html /tmp/apextennis-home/index.html; cp site.json /tmp/apextennis-home/site.json
          python3 - <<'PY'
          import json
          p='/tmp/apextennis-home/site.json';d=json.load(open(p));next(x for x in d['doors'] if x['title']=='Apex Tennis')['href']='https://madebymatt.uk/apextennis/';open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          reject absolute-tennis-door

          # FAMILY 3 REPLACED BY RULING C1. This used to delete Apex Golf's door
          # and require rejection — but C1 rules that door REMOVED, so the
          # deletion is now a no-op and the verifier rightly accepts it. A
          # mutation that no longer mutates proves nothing. The ruled invariant
          # is the opposite one: Golf must take NO door, so ADDING one must be
          # rejected. Same family count, testing the contract that is actually
          # in force.
          cp main/index.html /tmp/apextennis-home/index.html; cp site.json /tmp/apextennis-home/site.json
          python3 - <<'PY'
          import json
          p='/tmp/apextennis-home/site.json';d=json.load(open(p))
          kick=next(i for i,x in enumerate(d['doors']) if x['title']=='Apex Kick')
          d['doors'].insert(kick+1,{"zone":"games","title":"Apex Golf","desc":"reinstated door","href":"apexgolf/","countKey":"apex-golf","image":"assets/cards/apex-golf-door.svg","imageAlt":"x","imageW":120,"imageH":96,"badgeIcon":"\U0001F3AE","badgeLabel":"plays"})
          open(p,'w').write(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          reject reinstated-golf-door

          cp main/index.html /tmp/apextennis-home/index.html; cp site.json /tmp/apextennis-home/site.json
          python3 - <<'PY'
          import re
          from pathlib import Path
          # DERIVE the sitting tenant rather than naming one. The ruling this
          # family guards is "Golf and Tennis do not take New Release", which
          # holds whoever the occupant currently is.
          p=Path('/tmp/apextennis-home/index.html');t=p.read_text()
          m=re.search(r'data-release="([^"]+)"',t)
          assert m,'no New Release occupant to take over — the fixture would be inert'
          p.write_text(t.replace(f'data-release="{m.group(1)}"','data-release="Apex Tennis"',1))
          print(f'  fixture: occupant "{m.group(1)}" -> "Apex Tennis"')
          PY
          reject new-release-takeover

      - name: Verify held PR 25 remains untouched
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/MattRoper1977/mattroper1977.github.io/pulls/25 > /tmp/pr25.json
          python3 - <<'PY' | tee artifacts/apextennis-home/pr25.log
          import json
          p=json.load(open('/tmp/pr25.json'))
          assert p['state']=='open',p['state']
          assert p['merged_at'] is None,p['merged_at']
          assert p['head']['sha']=='7c202790115ca5de5f71babb570b806e5e57a4aa',p['head']['sha']
          print('PR #25 open, unmerged and unchanged at 7c202790115ca5de5f71babb570b806e5e57a4aa; it must be re-derived after this homepage change')
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve and run JavaScript-on/off render gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/apextennis-home/server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          APEXTENNIS_HOME_BASE_URL=http://127.0.0.1:4173 APEXTENNIS_HOME_ARTIFACT_DIR=artifacts/apextennis-home \
            node tools/verify_apexpool_home_browser.js | tee artifacts/apextennis-home/browser.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-tennis-homepage-${{ github.run_id }}
          path: artifacts/apextennis-home
          if-no-files-found: error
          retention-days: 30
