name: Echo Vault surfaces

# Part C — the whole-shelf render check, measured against the SERVED page in a
# real browser. The arcade shelf builds every card in JavaScript from
# /Games/games.json, so the shipped markup contains no cards at all and a grep
# would report a confident zero. Counts are derived from the live manifest at
# Games main; nothing is pinned (A-6 register).


# POST-DEPLOY TRIGGER (added 2026-08-27).
#
# This job asks "does the SERVED page match the canonical shelf". Until now it
# fired only on pull_request and on dispatch, so the post-merge green that D6's
# carve-out rested on had nothing scheduled to produce it. The gate was sound;
# the schedule was missing.
#
# It fires on the DEPLOYMENT, not on the push. A push trigger races the Pages
# build: the run reads the previous served page and goes red for a reason that
# is not a defect. In an estate that has learned to reclassify reds away, a
# manufactured flaky red is worse than a silent gate.
#
# Pages here is the built-in branch builder (dynamic/pages/pages-build-deployment),
# not actions/deploy-pages, so GitHub's GITHUB_TOKEN recursion prevention does
# not apply and deployment_status does fire. That is not an assumption:
# mbm-deployment-provenance.yml has consumed this exact event for 400 runs.
#
# deployment_status carries no event-level filters, so the environment/state
# filter lives in the job `if:` below, the same shape provenance uses. No paths
# filter, deliberately: the drift this catches - a failed or skipped deploy -
# happens with no file change at all.

on:
  pull_request:
    paths:
      - 'games/index.html'
      - 'tools/verify_echovault_surfaces.js'
      - '.github/workflows/echovault-surfaces-verify.yml'
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: echovault-surfaces-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  surfaces:
    name: whole-shelf render check against the served page
    # A deployment_status fires for every state (queued, in_progress, failure)
    # and for every environment. Only a successful github-pages deployment
    # means there is a new served page to ask about. pull_request and
    # workflow_dispatch are untouched by this condition.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for the served manifest to carry the entry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location https://madebymatt.uk/Games/games.json -o /tmp/served.json 2>/dev/null; then
              n=$(python3 -c 'import json;print(len(json.load(open("/tmp/served.json"))["games"]))')
              hit=$(python3 -c 'import json;print(sum(1 for g in json.load(open("/tmp/served.json"))["games"] if g.get("href")=="/echovault/"))')
              echo "attempt $attempt: served manifest $n entries, echovault $hit"
              if [ "$hit" = "1" ]; then break; fi
            else
              echo "attempt $attempt: served manifest not reachable yet"
            fi
            sleep 20
          done
          python3 -c 'import json,sys; d=json.load(open("/tmp/served.json")); sys.exit(0 if sum(1 for g in d["games"] if g.get("href")=="/echovault/")==1 else 1)'

      - name: Derive the expected shelf from Games main
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/MattRoper1977/Games/main/games.json -o /tmp/main.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/main.json'))
          g = d['games']
          print('MANIFEST ENTRIES AT Games main (derived):', len(g))
          print('Sports rail (derived):', sum(1 for x in g if x.get('collection') == 'Sports'))
          rf = [x for x in g if x.get('href') == '/echovault/']
          assert len(rf) == 1, f'expected exactly one Echo Vault entry, found {len(rf)}'
          print('Echo Vault hue (derived):', rf[0]['hue'])
          PY

      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Whole-shelf render check
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify_echovault_surfaces.js | tee /tmp/echovault_surfaces.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echovault-surfaces
          path: /tmp/echovault_surfaces.log
          if-no-files-found: warn
