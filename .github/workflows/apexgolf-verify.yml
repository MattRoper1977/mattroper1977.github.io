name: Apex Golf gates

on:
  pull_request:
    paths:
      - 'apexgolf/index.html'
      - 'tools/verify_apexgolf.js'
      - '.github/workflows/apexgolf-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apexgolf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 18 contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the proposed tree
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the pinned real-browser harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run all Apex Golf gates
        env:
          AG_REQUIRE_BROWSER: '1'
        run: node tools/verify_apexgolf.js
