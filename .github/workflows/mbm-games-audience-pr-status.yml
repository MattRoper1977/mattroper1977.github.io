name: MBM Games audience PR status readback

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Capture production workflow and live status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p status
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.request
          repo='MattRoper1977/mattroper1977.github.io'
          target='e4bff239c49012f41067c1313dc7a2f943923282'
          sentinel='mbm-games-audience-faces-2026-08-08'
          token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Made-by-Matt-readback/1'}
          def req(url,json_body=True):
              h=dict(headers)
              if 'api.github.com' not in url:
                  h.pop('Authorization',None);h['Accept']='text/html,*/*';h['Cache-Control']='no-cache, no-store, max-age=0';h['Pragma']='no-cache'
              request=urllib.request.Request(url,headers=h)
              try:
                  with urllib.request.urlopen(request,timeout=45) as response:
                      raw=response.read();status=response.status;final=response.geturl();rh=dict(response.headers.items())
              except urllib.error.HTTPError as exc:
                  raw=exc.read();status=exc.code;final=exc.geturl();rh=dict(exc.headers.items())
              text=raw.decode('utf-8','replace')
              if json_body:
                  try: body=json.loads(text)
                  except json.JSONDecodeError: body=text
              else: body=text
              return {'status':status,'final_url':final,'headers':rh,'raw':raw,'body':body}
          api=f'https://api.github.com/repos/{repo}'
          runs_response=req(f'{api}/actions/runs?branch=main&per_page=100')
          runs=runs_response['body']
          selected=[]
          for run in runs.get('workflow_runs',[]) if isinstance(runs,dict) else []:
              if run.get('name') in {'Verify Games and audience faces','MBM Games audience production closeout','MBM Games audience production completion note'} or run.get('head_sha')==target:
                  item={k:run.get(k) for k in ['id','name','event','status','conclusion','head_sha','head_branch','run_number','run_attempt','created_at','updated_at','html_url']}
                  jobs=req(f"{api}/actions/runs/{run['id']}/jobs?per_page=100")['body']
                  item['jobs']=[{**{k:j.get(k) for k in ['id','name','status','conclusion','started_at','completed_at','html_url']},'steps':[{k:s.get(k) for k in ['name','status','conclusion','number']} for s in j.get('steps',[])]} for j in jobs.get('jobs',[]) if isinstance(jobs,dict)]
                  artifacts=req(f"{api}/actions/runs/{run['id']}/artifacts?per_page=100")['body']
                  item['artifacts']=[{k:a.get(k) for k in ['id','name','size_in_bytes','expired','created_at','expires_at','archive_download_url','digest']} for a in artifacts.get('artifacts',[]) if isinstance(artifacts,dict)]
                  selected.append(item)
          routes=['/','/games/','/start/','/for/pupils/','/for/teachers/','/for/parents-carers/','/for/schools-semh/','/for/trusts/','/for/councils-organisations/','/for/partners/','/Lessons/','/Matt-s-Apps-/','/tools/','/resources/']
          live={}
          for route in routes:
              response=req('https://madebymatt.uk'+route+'?mbm='+target,False)
              raw=response.pop('raw');text=response.pop('body')
              live[route]={**response,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'sentinel':sentinel in text,'choose_view':'Choose your view' in text}
          result={
              'target':target,
              'sentinel':sentinel,
              'actions_api_status':runs_response['status'],
              'runs':selected,
              'live':live,
              'pages':req(f'{api}/pages')['body'],
              'latest_pages_build':req(f'{api}/pages/builds/latest')['body'],
              'comments':req(f'{api}/issues/103/comments?per_page=100')['body'],
          }
          pathlib.Path('status/status.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mbm-games-audience-pr-status-${{ github.run_id }}
          path: status/
          if-no-files-found: error
          retention-days: 7
