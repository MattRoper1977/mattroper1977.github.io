name: Arcade Sports catalogue contract

on:
  pull_request:
    paths:
      - 'games/index.html'
      - 'assets/cards/apex-tennis.svg'
      - 'tools/apply_arcade_sports_catalogue_correction.py'
      - 'tools/verify_arcade_sports.js'
      - 'tools/verify_arcade_sports_browser.js'
      - '.github/workflows/arcade-sports-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcade-sports-catalogue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source contract and non-vacuity
        run: |
          mkdir -p artifacts/arcade-sports
          node tools/verify_arcade_sports.js | tee artifacts/arcade-sports/source.log
          node tools/verify_arcade_sports.js --self-test | tee artifacts/arcade-sports/nonvacuity.log
          before=$(sha256sum games/index.html | awk '{print $1}')
          python3 tools/apply_arcade_sports_catalogue_correction.py | tee artifacts/arcade-sports/idempotency.log
          test "$before" = "$(sha256sum games/index.html | awk '{print $1}')"
      # AGX-1 finding A-6. This step used to fetch the manifest pinned at
      # 900fae5e (Games#11) and assert `length !== 34`. Both ends were frozen,
      # so the whole chain validated the renderer against a snapshot that could
      # never change: once the manifest moved to 35 it would have kept
      # reporting GREEN against a stale world. A green gate against a stale
      # world is worse than a red one. The count is now DERIVED, and the
      # manifest is read at main — never at a pin, never against a literal.
      - name: Fetch the live manifest at main and derive its shape
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/MattRoper1977/Games/main/games.json \
            -o artifacts/arcade-sports/games.json
          node -e "
            const d = require('./artifacts/arcade-sports/games.json');
            const g = d.games;
            if (!Array.isArray(g) || g.length < 1) { console.error('manifest is not a non-empty array'); process.exit(1); }
            const n = g.length;
            const art = g.filter(e => e.art && String(e.art).trim()).length;
            const ids = new Set(g.map(e => e.href));
            const sports = g.filter(e => e.collection === 'Sports').map(e => e.title);
            const physics = g.filter(e => e.tag === 'Physics').length;
            console.log('entries (derived) ', n);
            console.log('art               ', art + '/' + n);
            console.log('duplicate hrefs   ', n - ids.size);
            console.log('Sports            ', sports.join(' · '));
            console.log('Physics (derived) ', physics);
            let bad = 0;
            if (art !== n)        { console.error('FAIL: art is not carried on every entry'); bad = 1; }
            if (ids.size !== n)   { console.error('FAIL: duplicate hrefs'); bad = 1; }
            if (g.some(e => e.tag === 'Sport')) { console.error('FAIL: a Sport chip was minted'); bad = 1; }
            process.exit(bad);
          "
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve and render
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/arcade-sports/server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/games/ >/dev/null && break; sleep 1; done
          ARCADE_BASE_URL=http://127.0.0.1:4173 ARCADE_MANIFEST=artifacts/arcade-sports/games.json \
            ARCADE_ARTIFACT_DIR=artifacts/arcade-sports node tools/verify_arcade_sports_browser.js | tee artifacts/arcade-sports/browser.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-sports-catalogue-${{ github.run_id }}
          path: artifacts/arcade-sports
          if-no-files-found: error
          retention-days: 30
