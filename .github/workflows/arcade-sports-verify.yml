name: Arcade Sports catalogue contract

on:
  pull_request:
    paths:
      - 'games/index.html'
      - 'tools/apply_arcade_sports_catalogue_correction.py'
      - 'tools/verify_arcade_sports.js'
      - 'tools/verify_arcade_sports_browser.js'
      - '.github/workflows/arcade-sports-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcade-sports-catalogue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source contract and non-vacuity
        run: |
          mkdir -p artifacts/arcade-sports
          node tools/verify_arcade_sports.js | tee artifacts/arcade-sports/source.log
          node tools/verify_arcade_sports.js --self-test | tee artifacts/arcade-sports/nonvacuity.log
          before=$(sha256sum games/index.html | awk '{print $1}')
          python3 tools/apply_arcade_sports_catalogue_correction.py | tee artifacts/arcade-sports/idempotency.log
          test "$before" = "$(sha256sum games/index.html | awk '{print $1}')"
      - name: Fetch paired 34-entry manifest branch
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/MattRoper1977/Games/codex/apextennis-arcade-sports/games.json \
            -o artifacts/arcade-sports/games.json
          node -e "const d=require('./artifacts/arcade-sports/games.json');if(d.games.length!==34)process.exit(1)"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve and render
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/arcade-sports/server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/games/ >/dev/null && break; sleep 1; done
          ARCADE_BASE_URL=http://127.0.0.1:4173 ARCADE_MANIFEST=artifacts/arcade-sports/games.json \
            ARCADE_ARTIFACT_DIR=artifacts/arcade-sports node tools/verify_arcade_sports_browser.js | tee artifacts/arcade-sports/browser.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-sports-catalogue-${{ github.run_id }}
          path: artifacts/arcade-sports
          if-no-files-found: error
          retention-days: 30
