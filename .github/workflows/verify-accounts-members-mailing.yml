name: Verify accounts, members and mailing
on:
  pull_request:
    branches: [main]
    paths:
      - 'account/**'
      - 'members/**'
      - 'mailing-list/**'
      - 'privacy/**'
      - 'assets/mbm-account.*'
      - 'assets/mbm-mailing.js'
      - 'assets/mbm-platform.js'
      - 'site.json'
      - 'supabase-schema.sql'
      - 'supabase/**'
      - 'tools/verify_accounts_members_mailing.js'
      - 'tools/test_member_merge.js'
      - 'docs/ACCOUNTS_MAILING_SETUP.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed account and mailing architecture
        run: |
          node tools/verify_accounts_members_mailing.js
          node tools/test_member_merge.js
          node --check assets/mbm-account.js
          node --check assets/mbm-mailing.js
          node --check assets/mbm-platform.js
      - name: One-shot Buttondown delivery probe
        shell: bash
        run: |
          set -euo pipefail
          url=$(node -p "require('./site.json').features.accounts.supabaseUrl")
          key=$(node -p "require('./site.json').features.accounts.supabaseAnonKey")
          email="contactmadebymatt+pr99-final-${GITHUB_RUN_ID}@gmail.com"
          endpoint="$url/functions/v1/subscribe-mailing-list"
          echo "QA_ALIAS=$email"
          request() {
            local out=$1
            curl --silent --show-error --output "$out" --write-out '%{http_code}' \
              -H 'Origin: https://madebymatt.uk' \
              -H "apikey: $key" \
              -H 'Content-Type: application/json' \
              --data "{\"email\":\"$email\",\"consent\":true,\"company\":\"\"}" \
              "$endpoint"
          }
          first_status=$(request /tmp/first.json)
          echo "FIRST_HTTP=$first_status"
          echo -n 'FIRST_BODY='; cat /tmp/first.json; echo
          test "$first_status" = 200
          second_status=$(request /tmp/second.json)
          echo "SECOND_HTTP=$second_status"
          echo -n 'SECOND_BODY='; cat /tmp/second.json; echo
          test "$second_status" = 200
          first=$(cat /tmp/first.json)
          second=$(cat /tmp/second.json)
          node -e 'const a=JSON.parse(process.argv[1]),b=JSON.parse(process.argv[2]); if(a.ok!==true||b.ok!==true) process.exit(1); if(JSON.stringify(a)!==JSON.stringify(b)) { console.error("duplicate reply differed from first-time reply"); process.exit(1); } console.log("PASS provider accepted first + duplicate with indistinguishable public replies");' "$first" "$second"
          bad=$(curl --silent --output /tmp/bad --write-out '%{http_code}' -H 'Origin: https://madebymatt.uk' -H "apikey: $key" -H 'Content-Type: application/json' --data '{"email":"not-an-email","consent":true,"company":""}' "$endpoint")
          test "$bad" = 400
          no=$(curl --silent --output /tmp/no --write-out '%{http_code}' -H 'Origin: https://madebymatt.uk' -H "apikey: $key" -H 'Content-Type: application/json' --data '{"email":"contactmadebymatt+no-consent@gmail.com","consent":false,"company":""}' "$endpoint")
          test "$no" = 400
          echo 'PASS invalid address and missing consent fail closed'
