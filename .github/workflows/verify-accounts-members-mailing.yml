name: Verify accounts, members and mailing
on:
  pull_request:
    branches: [main]
    paths:
      - 'account/**'
      - 'members/**'
      - 'mailing-list/**'
      - 'privacy/**'
      - 'assets/mbm-account.*'
      - 'assets/mbm-mailing.js'
      - 'assets/mbm-platform.js'
      - 'site.json'
      - 'supabase-schema.sql'
      - 'supabase/**'
      - 'tools/verify_accounts_members_mailing.js'
      - 'tools/test_member_merge.js'
      - 'docs/ACCOUNTS_MAILING_SETUP.md'
      - '.github/workflows/verify-accounts-members-mailing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed account and mailing architecture
        run: |
          node tools/verify_accounts_members_mailing.js
          node tools/test_member_merge.js
          node --check assets/mbm-account.js
          node --check assets/mbm-mailing.js
          node --check assets/mbm-platform.js
      - name: One-shot real Buttondown subscribe + duplicate probe
        shell: bash
        run: |
          set -euo pipefail
          url=$(node -p "require('./site.json').features.accounts.supabaseUrl")
          key=$(node -p "require('./site.json').features.accounts.supabaseAnonKey")
          email="contactmadebymatt+pr99-live-${GITHUB_RUN_ID}@gmail.com"
          endpoint="$url/functions/v1/subscribe-mailing-list"
          echo "QA_ALIAS=$email"
          request() {
            curl --silent --show-error --write-out $'\n%{http_code}' \
              -H 'Origin: https://madebymatt.uk' \
              -H "apikey: $key" \
              -H 'Content-Type: application/json' \
              --data "{\"email\":\"$email\",\"consent\":true,\"company\":\"\"}" \
              "$endpoint"
          }
          first=$(request)
          first_code=${first##*$'\n'}
          first_body=${first%$'\n'*}
          echo "FIRST_HTTP=$first_code"
          echo "FIRST_BODY=$first_body"
          test "$first_code" = 200
          second=$(request)
          second_code=${second##*$'\n'}
          second_body=${second%$'\n'*}
          echo "SECOND_HTTP=$second_code"
          echo "SECOND_BODY=$second_body"
          test "$second_code" = 200
          node -e 'const a=JSON.parse(process.argv[1]),b=JSON.parse(process.argv[2]); if(a.ok!==true||b.ok!==true) process.exit(1); if(JSON.stringify(a)!==JSON.stringify(b)){console.error("duplicate reply differs");process.exit(1)} console.log("PASS first + duplicate replies are indistinguishable")' "$first_body" "$second_body"
          bad=$(curl --silent --output /tmp/bad --write-out '%{http_code}' -H 'Origin: https://madebymatt.uk' -H "apikey: $key" -H 'Content-Type: application/json' --data '{"email":"not-an-email","consent":true,"company":""}' "$endpoint")
          test "$bad" = 400
          no=$(curl --silent --output /tmp/no --write-out '%{http_code}' -H 'Origin: https://madebymatt.uk' -H "apikey: $key" -H 'Content-Type: application/json' --data '{"email":"contactmadebymatt+no-consent@gmail.com","consent":false,"company":""}' "$endpoint")
          test "$no" = 400
          echo 'PASS invalid address and missing consent fail closed'
