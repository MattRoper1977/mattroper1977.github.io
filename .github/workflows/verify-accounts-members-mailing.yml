name: Verify accounts, members and mailing
on:
  pull_request:
    branches: [main]
    paths:
      - 'account/**'
      - 'members/**'
      - 'mailing-list/**'
      - 'privacy/**'
      - 'assets/mbm-account.*'
      - 'assets/mbm-mailing.js'
      - 'assets/mbm-platform.js'
      - 'site.json'
      - 'supabase-schema.sql'
      - 'supabase/**'
      - 'tools/verify_accounts_members_mailing.js'
      - 'tools/test_member_merge.js'
      - 'docs/ACCOUNTS_MAILING_SETUP.md'
      - '.github/workflows/verify-accounts-members-mailing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed account and mailing architecture
        run: |
          node tools/verify_accounts_members_mailing.js
          node tools/test_member_merge.js
          node --check assets/mbm-account.js
          node --check assets/mbm-mailing.js
          node --check assets/mbm-platform.js
      - name: One-shot real Buttondown signup proof
        shell: bash
        run: |
          set -euo pipefail
          url=$(node -p "require('./site.json').features.accounts.supabaseUrl")
          key=$(node -p "require('./site.json').features.accounts.supabaseAnonKey")
          email="contactmadebymatt+pr99-firewall-${GITHUB_RUN_ID}@gmail.com"
          echo "QA_ALIAS=$email"
          endpoint="$url/functions/v1/subscribe-mailing-list"
          first=$(curl --silent --show-error --write-out $'\n%{http_code}' -H 'Origin: https://madebymatt.uk' -H "apikey: $key" -H 'Content-Type: application/json' --data "{\"email\":\"$email\",\"consent\":true,\"company\":\"\"}" "$endpoint")
          code=${first##*$'\n'}; body=${first%$'\n'*}
          echo "FIRST_HTTP=$code"; echo "FIRST_BODY=$body"
          test "$code" = 200
          node -e 'const j=JSON.parse(process.argv[1]);if(j.ok!==true||j.state!=="pending_confirmation")process.exit(1)' "$body"
          second=$(curl --silent --show-error --write-out $'\n%{http_code}' -H 'Origin: https://madebymatt.uk' -H "apikey: $key" -H 'Content-Type: application/json' --data "{\"email\":\"$email\",\"consent\":true,\"company\":\"\"}" "$endpoint")
          code2=${second##*$'\n'}; body2=${second%$'\n'*}
          echo "SECOND_HTTP=$code2"; echo "SECOND_BODY=$body2"
          test "$code2" = 200
          test "$body2" = "$body"
          echo 'PASS real signup + duplicate are accepted and indistinguishable'
