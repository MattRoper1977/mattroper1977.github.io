name: Verify accounts, members and mailing
on:
  pull_request:
    branches: [main]
    paths:
      - 'account/**'
      - 'members/**'
      - 'mailing-list/**'
      - 'privacy/**'
      - 'assets/mbm-account.*'
      - 'assets/mbm-mailing.js'
      - 'assets/mbm-platform.js'
      - 'site.json'
      - 'supabase-schema.sql'
      - 'supabase/**'
      - 'tools/verify_accounts_members_mailing.js'
      - 'tools/test_member_merge.js'
      - 'docs/ACCOUNTS_MAILING_SETUP.md'
      - '.github/workflows/verify-accounts-members-mailing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed account and mailing architecture
        run: |
          node tools/verify_accounts_members_mailing.js
          node tools/test_member_merge.js
          node --check assets/mbm-account.js
          node --check assets/mbm-mailing.js
          node --check assets/mbm-platform.js
      - name: One-shot Buttondown unsubscribe readback proof
        shell: bash
        run: |
          set -euo pipefail
          url=$(node -p "require('./site.json').features.accounts.supabaseUrl")
          body=$(curl --fail --silent --show-error -X POST "$url/functions/v1/subscribe-mailing-list")
          echo "$body"
          node -e 'const j=JSON.parse(process.argv[1]);if(!j.ok||j.patchStatus<200||j.patchStatus>=300||j.afterStatus!==200||j.afterType!=="unsubscribed"||j.emailMatches!==true)process.exit(1);console.log("PASS disposable Buttondown subscriber is unsubscribed and read back")' "$body"
