name: Integrate Apex Golf with current site main

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apexgolf-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Merge the governed Golf branch and resolve only the measured overlap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/apexgolf-build
          git merge --no-ff --no-commit origin/codex/apexgolf-build || true

          unresolved=$(git diff --name-only --diff-filter=U || true)
          unexpected=$(printf '%s\n' "$unresolved" | sed '/^$/d;/^sitemap.xml$/d')
          if [ -n "$unexpected" ]; then
            printf 'Unexpected merge conflicts:\n%s\n' "$unexpected"
            exit 1
          fi
          if printf '%s\n' "$unresolved" | grep -qx 'sitemap.xml'; then
            git show origin/codex/apexgolf-build:sitemap.xml > sitemap.xml
            git add sitemap.xml
          fi

          # The Actions token may not publish workflow files. Keep the merge ancestry,
          # omit this one path here, and let the GitHub connector add it in the next commit.
          git rm -f --ignore-unmatch .github/workflows/apexgolf-verify.yml

          python3 - <<'PY'
          from pathlib import Path

          page = Path('games/index.html')
          text = page.read_text()
          replacements = [
              ('/* Sports is a collection rail, not a tag: two named games sit together without changing their chips. */',
               '/* Sports is a collection rail, not a tag: the named Apex games sit together without changing their chips. */'),
              ('@media(min-width:760px){.sports .rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}.sports .gcard{min-width:0}}',
               '@media(min-width:760px){.sports .rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:visible}.sports .gcard{min-width:0}}'),
              ('<p class="sub">Two Apex games, side by side: bend the ball in Apex Kick, then control the cue ball\'s leave in Apex Pool.</p>',
               '<p class="sub">Three Apex games, side by side: bend the ball in Apex Kick, control the cue ball\'s leave in Apex Pool, then call your score in Apex Golf.</p>'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'games/index.html replacement count was {text.count(old)} for {old[:48]!r}')
              text = text.replace(old, new)
          page.write_text(text)

          verify = Path('tools/verify_arcade_sports.js')
          source = verify.read_text()
          case_anchor = "    ['section', 'sports-section-once', (s) => s.replace('id=\"sports\" hidden', 'id=\"sport\" hidden')],\n"
          case_insert = case_anchor + \
              "    ['copy', 'sports-copy-includes-apex-golf', (s) => s.replace('Apex Golf', 'Apex G0lf')],\n" + \
              "    ['columns', 'sports-grid-fits-three', (s) => s.replace('repeat(3,minmax(0,1fr))', 'repeat(2,minmax(0,1fr))')],\n"
          if source.count(case_anchor) != 1:
              raise SystemExit('source verifier case anchor drifted')
          source = source.replace(case_anchor, case_insert)
          check_anchor = "ok('sports-section-once', count('id=\"sports\" hidden') === 1 && count('id=\"sportsRail\"') === 1);\n"
          check_insert = check_anchor + \
              "ok('sports-copy-includes-apex-golf', html.includes('Three Apex games') && html.includes('Apex Golf'));\n" + \
              "ok('sports-grid-fits-three', html.includes('grid-template-columns:repeat(3,minmax(0,1fr))'));\n"
          if source.count(check_anchor) != 1:
              raise SystemExit('source verifier check anchor drifted')
          source = source.replace(check_anchor, check_insert)
          verify.write_text(source)
          PY

          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(grep -o 'https://madebymatt.uk/apexpool/' sitemap.xml | wc -l)" -eq 1
          test "$(grep -o 'https://madebymatt.uk/apexgolf/' sitemap.xml | wc -l)" -eq 1
          test "$(grep -o 'apexgolf-build-2026-08-04' apexgolf/index.html | wc -l)" -eq 2
          grep -q 'Three Apex games' games/index.html
          grep -q 'Apex Golf' games/index.html

          git add -A
          git commit -m "chore: integrate Apex Golf with the Sports collection"
          git push origin "HEAD:${{ github.head_ref }}"
