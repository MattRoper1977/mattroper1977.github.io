name: Add Apex Golf sitemap entry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apexgolf-sitemap.yml'

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Rebase sitemap content on current main and add Golf once
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:sitemap.xml > sitemap.xml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sitemap.xml')
          text = path.read_text()
          url = 'https://madebymatt.uk/apexgolf/'
          if text.count(url) > 1:
              raise SystemExit('duplicate Apex Golf sitemap URL before update')
          if url not in text:
              block = '''  <url>\n    <loc>https://madebymatt.uk/apexgolf/</loc>\n    <lastmod>2026-08-04</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.7</priority>\n  </url>\n'''
              marker = '</urlset>'
              if text.count(marker) != 1:
                  raise SystemExit('unexpected sitemap closing marker count')
              text = text.replace(marker, block + marker)
          if text.count(url) != 1:
              raise SystemExit('Apex Golf sitemap URL is not unique')
          if text.count('https://madebymatt.uk/apexpool/') != 1:
              raise SystemExit('current main Apex Pool sitemap URL was not preserved')
          path.write_text(text)
          PY

      - name: Commit sitemap entry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: add Apex Golf to sitemap"
          git push origin "HEAD:${{ github.head_ref }}"
