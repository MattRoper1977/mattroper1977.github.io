name: MBM Games audience production status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mbm-games-audience-production-status.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Capture push workflow, Pages and live route evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-status
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.request

          repo='MattRoper1977/mattroper1977.github.io'
          merge_sha='e4bff239c49012f41067c1313dc7a2f943923282'
          sentinel='mbm-games-audience-faces-2026-08-08'
          token=os.environ['GH_TOKEN']
          api_headers={
            'Accept':'application/vnd.github+json',
            'Authorization':f'Bearer {token}',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'Made-by-Matt-games-audience-status/1',
          }

          def request(url, *, json_body=True, no_cache=False):
            headers=dict(api_headers)
            if 'api.github.com' not in url:
              headers.pop('Authorization',None)
              headers['Accept']='text/html,*/*'
            if no_cache:
              headers['Cache-Control']='no-cache, no-store, max-age=0'
              headers['Pragma']='no-cache'
            req=urllib.request.Request(url,headers=headers)
            try:
              with urllib.request.urlopen(req,timeout=45) as response:
                raw=response.read();status=response.status;final=response.geturl();rh=dict(response.headers.items())
            except urllib.error.HTTPError as exc:
              raw=exc.read();status=exc.code;final=exc.geturl();rh=dict(exc.headers.items())
            text=raw.decode('utf-8','replace')
            if json_body:
              try: body=json.loads(text)
              except json.JSONDecodeError: body=text
            else:
              body=text
            return {'url':url,'final_url':final,'status':status,'headers':rh,'raw':raw,'body':body}

          api=f'https://api.github.com/repos/{repo}'
          runs_response=request(f'{api}/actions/runs?branch=main&per_page=100')
          runs=runs_response['body']
          relevant=[]
          if isinstance(runs,dict):
            for run in runs.get('workflow_runs',[]):
              if run.get('name')=='Verify Games and audience faces' or run.get('head_sha')==merge_sha:
                item={k:run.get(k) for k in ['id','name','event','status','conclusion','head_sha','head_branch','run_number','run_attempt','created_at','updated_at','html_url']}
                jobs_response=request(f"{api}/actions/runs/{run['id']}/jobs?per_page=100")
                jobs=jobs_response['body']
                item['jobs']=[{
                  **{k:j.get(k) for k in ['id','name','status','conclusion','started_at','completed_at','html_url']},
                  'steps':[{k:s.get(k) for k in ['name','status','conclusion','number']} for s in j.get('steps',[])]
                } for j in (jobs.get('jobs',[]) if isinstance(jobs,dict) else [])]
                artifacts_response=request(f"{api}/actions/runs/{run['id']}/artifacts?per_page=100")
                artifacts=artifacts_response['body']
                item['artifacts']=[{k:a.get(k) for k in ['id','name','size_in_bytes','expired','created_at','expires_at','archive_download_url','digest']} for a in (artifacts.get('artifacts',[]) if isinstance(artifacts,dict) else [])]
                relevant.append(item)

          pages=request(f'{api}/pages')['body']
          latest_build=request(f'{api}/pages/builds/latest')['body']
          deployments=request(f'{api}/deployments?environment=github-pages&per_page=20')['body']

          routes=['/','/games/','/start/','/for/pupils/','/for/teachers/','/for/parents-carers/','/for/schools-semh/','/for/trusts/','/for/councils-organisations/','/for/partners/','/Lessons/','/Matt-s-Apps-/','/tools/','/resources/']
          live={}
          for route in routes:
            url='https://madebymatt.uk'+route+'?mbm='+merge_sha
            response=request(url,json_body=False,no_cache=True)
            raw=response.pop('raw');text=response.pop('body')
            title=''
            if '<title>' in text and '</title>' in text:
              title=text.split('<title>',1)[1].split('</title>',1)[0]
            live[route]={
              **response,
              'bytes':len(raw),
              'sha256':hashlib.sha256(raw).hexdigest(),
              'sentinel':sentinel in text,
              'title':title,
              'choose_view':'Choose your view' in text,
            }

          comments=request(f'{api}/issues/103/comments?per_page=100')['body']
          result={
            'merge_sha':merge_sha,
            'sentinel':sentinel,
            'generated_at':time.time(),
            'actions_api_status':runs_response['status'],
            'runs':relevant,
            'pages':pages,
            'latest_pages_build':latest_build,
            'deployments':deployments,
            'live':live,
            'pr103_comments':comments,
          }
          path=pathlib.Path('production-status/status.json')
          path.write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Upload production status
        uses: actions/upload-artifact@v4
        with:
          name: mbm-games-audience-production-status-${{ github.run_id }}
          path: production-status/
          if-no-files-found: error
          retention-days: 7
