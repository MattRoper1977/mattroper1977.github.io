name: HC3 source-bound save inventory
on:
  pull_request:
    paths: ['tools/hc3_save_inventory.py', 'tools/hc3-inventory/**', '.github/workflows/hc3-save-inventory.yml']
  push:
    branches: [main]
    paths: ['tools/hc3_save_inventory.py', 'tools/hc3-inventory/**', '.github/workflows/hc3-save-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    name: Actual source identities and built route inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: 95146202d7f876800605b489de4231efe28928b9
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install only the existing build-time parsers
        run: |
          npm ci --prefix tools/hc3-inventory --ignore-scripts
          python3 -m pip install lxml==6.0.1
      - name: Prove AST resolution, source identities and publication mismatch controls
        run: python3 tools/hc3_save_inventory.py --self-test
      - name: Build and inventory the exact reviewed receiver composition
        run: |
          mkdir -p audit-output/hc3-inventory
          python3 domain-split/build_publications.py --lessons .sources/Lessons --output .inventory-publication
          cp .inventory-publication/build-report.json audit-output/hc3-inventory/build-report.json
          python3 tools/hc3_save_inventory.py --lessons .sources/Lessons --built .inventory-publication/games --output audit-output/hc3-inventory/inventory.json
      - name: Retain measured identities and unresolved cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hc3-save-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/hc3-inventory/
          if-no-files-found: error
