name: Bootstrap Apex Pool homepage publication
on:
  push:
    branches: ['codex/apexpool-home']
    paths: ['.github/workflows/bootstrap-home.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: node tools/apply_apexpool_home.js
      - run: |
          git config user.name 'Codex'
          git config user.email 'noreply@openai.com'
          git rm .github/workflows/bootstrap-home.yml
          git add index.html site.json
          git commit -m 'Publish Apex Pool on the homepage'
          git push
