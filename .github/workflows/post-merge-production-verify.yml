name: Production verification after merge

# WHY THIS EXISTS, AND WHY IT IS A JOB AND NOT A CHECKLIST
#
# The branch that added /apexcurl/ and /apexvelodrome/ was built in a sandbox
# that gets 403 on CONNECT to madebymatt.uk. Nothing built there could see
# production, so every production statement made during that work was an
# inference from the deployed ref rather than an observation. This job is the
# observation, and it runs where egress is real. It is also not something Matt
# should have to run: it fires on the merge.
#
# THE RETRY IS THE POINT
#
# GitHub Pages deploys AFTER the merge, not with it. A 404 in the first seconds
# means "not yet", not "broken" - and that exact confusion has already been
# mistaken for a broken build in this estate once. So the job attempts, waits,
# retries, and REPORTS EVERY ATTEMPT including the ones that failed, naming the
# attempt on which deployment was first observed. A pass on attempt 4 is a pass
# with a visible deploy lag, not a silent pass.
#
# MERGE ORDER, RECORDED SO IT IS NOT RE-DERIVED
#
#   site #172 FIRST -> prove deployment (this job) -> games #39 SECOND
#
# /games/ fetches /Games/games.json at runtime. Merging the shelf first
# advertises two routes that 404 until the site deploys; merging the site first
# means two live routes are merely unlisted for a while. An advertised 404 is
# the worse failure.

on:
  push:
    branches: [main]
    paths:
      - 'apexcurl/**'
      - 'apexvelodrome/**'
      - 'games/index.html'
      - 'for/pupils/**'
      - 'data/mbm-search-index.json'
      - 'data/source-manifests/games.json'
      - 'assets/brand/mbm-splash.js'
      - '.github/workflows/post-merge-production-verify.yml'
      - 'tools/verify_production_after_merge.mjs'
  workflow_dispatch:
    inputs:
      attempts:
        description: 'Deploy-lag attempts before giving up'
        default: '8'
      wait_seconds:
        description: 'Seconds between attempts'
        default: '30'

permissions:
  contents: read

concurrency:
  group: post-merge-production-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Production serves what was merged
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # N4. The revert target is derived from the merge commit's FIRST
          # PARENT, and a default checkout is depth 1 - which has no parents at
          # all. The emergency rollback path printed "unknown" on the live run
          # and nobody noticed, because it printed something. Depth 2 is exactly
          # what a first-parent lookup needs.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          # BOTH in ONE install. A second `npm i --no-save` PRUNES what the first
          # one put there: adding acorn on its own line removed playwright, and
          # every gate that drives a browser then died with
          # "Cannot find module 'playwright-core'". The repaired step 7 caught
          # that as four NOT-RUN gates rather than reporting it green, which is
          # what it exists for - but the install has to be right.
          # acorn is here because verify_curation_keys.mjs parses the record with
          # it, and without it that gate reports INCONCLUSIVE and judges nothing.
          npm i --no-save playwright@1.56.1 acorn@8.18.0
          npx playwright install --with-deps chromium

      - name: Record what was merged, and derive the revert target
        shell: bash
        run: |
          set -euo pipefail
          # `git rev-parse <missing>` prints its ARGUMENT to stdout and exits
          # non-zero, so the old `|| echo unknown` appended to it rather than
          # replacing it - the run printed the literal "<sha>^1" and "unknown"
          # on two lines. --verify -q prints nothing unless it resolves.
          PARENT="$(git rev-parse --verify -q "${GITHUB_SHA}^1" || true)"
          if [ -z "$PARENT" ]; then
            echo "::error::cannot resolve ${GITHUB_SHA}^1 - the revert target cannot be derived."
            echo "A rollback instruction that names no parent is worse than none. Check fetch-depth."
            exit 1
          fi
          echo "merge commit : ${GITHUB_SHA}"
          echo "first parent : ${PARENT}"
          {
            echo "### Revert target, derived from this merge"
            echo ""
            echo '```'
            echo "merge commit : ${GITHUB_SHA}"
            echo "first parent : ${PARENT}"
            echo "revert       : git revert -m 1 ${GITHUB_SHA}"
            echo '```'
            echo ""
            echo "Derived after the fact from the commit that actually exists."
            echo "A SHA written down before the merge is a guess."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify production
        env:
          MBM_PROD_BASE: https://madebymatt.uk
          MBM_ATTEMPTS: ${{ github.event.inputs.attempts || '8' }}
          MBM_WAIT_MS: '30000'
        shell: bash
        run: |
          set -o pipefail
          node tools/verify_production_after_merge.mjs 2>&1 | tee production.log

      # F2/F3. These five read LIVE production, so on a PR they can only ever
      # report the pre-merge world — which is why they are red on the PR and why
      # that red is not evidence about the merge. Here, after Pages has
      # published, they are being asked the question they were written to ask.
      # `continue-on-error` is deliberate and bounded: the step above is the
      # gate that decides the job, and these run to completion so the summary
      # names EVERY one that is still red rather than stopping at the first.
      # N1/N2. This step ran `set +e` under `continue-on-error: true`. The
      # INTENT was right and is kept: run every gate to completion so the
      # summary names all of them rather than stopping at the first. The
      # IMPLEMENTATION made them decorative — nothing they reported could fail
      # anything — and it swallowed two real findings for as long as it existed:
      # verify_published_live.mjs was invoked with no arguments and died on a
      # Node TypeError, and verify_curation_keys.mjs reported INCONCLUSIVE
      # because acorn was never installed here. Both read as green.
      #
      # Same intent, implemented honestly. Every gate still runs. Each resolves
      # to exactly one of PASS / FAIL / NOT-RUN, and the aggregation at the end
      # fails the step unless every one is PASS. `continue-on-error` is gone:
      # it hides reds rather than isolating them.
      - name: Re-run the production-driven gates against the published site
        if: always()
        shell: bash
        run: |
          : > production-driven.log
          declare -a failed=() notrun=()
          # verify_published_live.mjs is NOT in this list. It needs --shelf and
          # explicit --path arguments plus two extra checkouts, none of which
          # exist here, so the bare invocation never judged anything. It is
          # properly wired, with its arguments, in published-live-verify.yml —
          # which passes on this same commit. A broken duplicate invocation is
          # removed; the gate itself is untouched and still runs there.
          for g in tools/verify_echovault_surfaces.js \
                   tools/verify_relicforge_surfaces.js \
                   tools/verify_curation_keys.mjs \
                   tools/verify_surfaces.js; do
            echo "=== $g" | tee -a production-driven.log
            rc=0
            out="$(node "$g" 2>&1)" || rc=$?
            printf '%s\n' "$out" | tee -a production-driven.log
            if printf '%s' "$out" | grep -qE 'INCONCLUSIVE|did not judge anything|^NOT RUN'; then
              verdict='NOT-RUN'; notrun+=("$g — inconclusive (exit $rc)")
            elif printf '%s' "$out" | grep -qE 'ERR_[A-Z_]+|^[A-Za-z]*Error: |^ +at .*\(node:'; then
              verdict='NOT-RUN'; notrun+=("$g — crashed (exit $rc)")
            elif [ "$rc" -eq 0 ]; then
              verdict='PASS'
            else
              verdict='FAIL'; failed+=("$g — exit $rc")
            fi
            echo "--- $verdict (exit $rc) for $g" | tee -a production-driven.log
          done
          # A zero match must never read as a pass here either.
          if grep -q 'matched nothing' production-driven.log; then
            echo "SELECTOR DRIFT reported against production — see the log" | tee -a production-driven.log
            failed+=("selector drift against production")
          fi
          # A crash is not a pass, and INCONCLUSIVE is not a pass.
          if [ "${#failed[@]}" -ne 0 ] || [ "${#notrun[@]}" -ne 0 ]; then
            echo ""
            echo "PRODUCTION-DRIVEN GATES DID NOT ALL PASS"
            for f in "${failed[@]}"; do echo "  FAIL     $f"; done
            for n in "${notrun[@]}"; do echo "  NOT-RUN  $n"; done
            exit 1
          fi
          echo ""
          echo "all production-driven gates PASSED"

      - name: Publish which production-driven gates cleared
        if: always()
        shell: bash
        run: |
          {
            echo "### Production-driven gates, re-run after the merge"
            echo ""
            echo '```'
            grep -E '^(=== |--- exit |PASS |FAIL |SELECTOR DRIFT)' production-driven.log 2>/dev/null \
              || echo "(no log - the step did not run)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish the attempt log
        if: always()
        shell: bash
        run: |
          {
            echo "### Production verification"
            echo ""
            echo '```'
            cat production.log 2>/dev/null || echo "(no log - the job failed before the script ran)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: production.log
          if-no-files-found: warn
