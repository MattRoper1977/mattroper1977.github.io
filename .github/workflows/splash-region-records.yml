# The generated splash region is pinned by several records. Most are checked by a gate
# that already exists: the 14 route files and data/hud-coverage.json by
# render_maker_splash.py --check, CyberPulse's SPLASH_BYTES by cyberpulse-verify, and the
# Play evidence chain by the publication build.
#
# docs/play-q1/coverage.json had no check at all. It went stale at 7b0ce2d, which
# re-stamped the 14 route files without re-running its writer, and nothing reported it.
# docs/play-q1/README.md restated the same digest by hand and went stale with it.
#
# Deliberately UNCONDITIONAL: no path filter. A path-filtered check reports on nothing
# when the paths are untouched, so if it is ever made required it blocks every unrelated
# pull request on a check that will never run. It is cheap; it runs on everything.
name: Splash region records

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  records-current:
    name: splash-region records current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned 2026-09-17 (CX2 section 7.1, ORDER PQ1-GATE-R6 ruling G1b): Lessons main at #567,
      # the same commit domain-split-verify.yml and education-publication.yml pin today. It is here
      # for one reason only: the coverage writer enumerates its routes from the built Play
      # catalogue, and domain-split/build_publications.py requires --lessons and exits non-zero on
      # an empty tree, so the catalogue cannot be assembled without a Lessons checkout.
      #
      # This job gates SITE-owned rows only (--owner site below), so moving this pin cannot change
      # its result. That is measured, not asserted: PQ1-GATE-R6 Step P3 ran the check with Lessons
      # at this pin and at Lessons main and got identical output, and matrix case M8 edits a
      # Lessons-owned region and confirms this job still passes (M8c is its control: the same edit
      # DOES red the unscoped check, so the writer really did read the mutated file). It is
      # therefore deliberately NOT held equal to the publication pins - those decide published
      # bytes, this one decides nothing and needs no re-pin when Lessons moves.
      #
      # The path is .sources/Lessons and that is load-bearing, not a style choice.
      # domain-split/play/build.py refresh() does NOT take the --lessons argument: it resolves the
      # checkout itself, as <site>/.sources/Lessons when that exists and <site>/../Lessons
      # otherwise, and validate_report then compares HEADs. Under any other path both candidates
      # are absent on a runner and the step dies after build_publications.py has already succeeded.
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: b54c9006e311f151ee53fe268846fab12fbc3e44
          path: .sources/Lessons
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml==6.0.1

      # The coverage writer reads the built catalogue, so the Play publication is
      # assembled first. This is the same build the publication gates use.
      - name: Assemble the Play catalogue the coverage writer reads
        run: |
          set -euo pipefail
          python domain-split/play/prepare.py --lessons .sources/Lessons --output .play-review/output

      - name: The README states no digest and no byte count
        run: |
          set -euo pipefail
          python tools/check_play_q1_readme_digests.py --self-test
          python tools/check_play_q1_readme_digests.py

      - name: The stamped routes and the canonical source are LF
        run: |
          set -euo pipefail
          python tools/check_splash_routes_lf.py --self-test
          python tools/check_splash_routes_lf.py

      # --owner site: this repository owns 35 of the 68 rows and can re-stamp only those. The 33
      # Lessons-owned rows are NOT gated here; gating them would red this job for a change made in
      # a repository it cannot fix. How they get gated is ruled after the Lessons re-stamp lands.
      - name: docs/play-q1/coverage.json matches its own writer (Site-owned rows)
        run: |
          set -euo pipefail
          python tools/play_splash_coverage.py \
            --catalogue .play-review/output/games/data/domain-catalogue.json \
            --site . --lessons .sources/Lessons --check --owner site

  # The Lessons-owned rows, one step behind, in their OWN job. Not folded into the
  # job above: that one gates the 35 rows this repository owns and can re-stamp, and
  # its note said how the other 33 get gated is ruled once the Lessons re-stamp
  # lands. This is that gate. It reads the same writer with --owner lessons against
  # the same pinned Lessons checkout, so it lags deliberately -- a Lessons change is
  # caught here without either estate reddening for a change it cannot fix.
  #
  # Deliberately UNCONDITIONAL, like the job above, and deliberately NOT required:
  # nothing here changes any repository setting, and a new job is non-required until
  # somebody makes it one.
  records-current-lessons:
    name: splash-region records current (Lessons-owned rows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned 2026-09-17 to b54c9006, the same Lessons commit the job above pins and
      # the one the current captures were taken from. UNLIKE that job, this pin IS
      # load-bearing: this job gates the Lessons-owned rows, which are derived from
      # this checkout, so moving the pin moves what is gated. That is deliberate and
      # is what "one step behind" means -- the rows are held to a reviewed Lessons
      # commit, not to whatever Lessons main happens to be mid-flight. It moves when
      # a Lessons re-stamp is reviewed and the coverage record is rewritten, in the
      # same change, never on its own.
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: b54c9006e311f151ee53fe268846fab12fbc3e44
          path: .sources/Lessons
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install lxml==6.0.1

      - name: Assemble the Play catalogue the coverage writer reads
        run: |
          set -euo pipefail
          python domain-split/play/prepare.py --lessons .sources/Lessons --output .play-review/output

      - name: The stamped routes and the canonical source are LF
        run: |
          set -euo pipefail
          python tools/check_splash_routes_lf.py --self-test
          python tools/check_splash_routes_lf.py

      - name: docs/play-q1/coverage.json matches its own writer (Lessons-owned rows)
        run: |
          set -euo pipefail
          python tools/play_splash_coverage.py \
            --catalogue .play-review/output/games/data/domain-catalogue.json \
            --site . --lessons .sources/Lessons --check --owner lessons
