name: Professional site design audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-site-design-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch under review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preservation, platform contract and positive control
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node tools/verify_professional_site.js --base origin/main --self-test
          node --check app.js
          node --check assets/mbm-platform.js
          node --check theme.js
          git diff --check origin/main...HEAD

      - name: Record deterministic source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          {
            echo "sentinel=mbm-site-professional-design-upgrade-2026-08-07"
            echo "head=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            echo "files=$(find . -path './.git' -prune -o -type f -print | wc -l)"
            echo "html=$(find . -path './.git' -prune -o -type f -iname '*.html' -print | wc -l)"
            echo "css=$(find . -path './.git' -prune -o -type f -iname '*.css' -print | wc -l)"
            echo "js=$(find . -path './.git' -prune -o -type f \( -iname '*.js' -o -iname '*.mjs' -o -iname '*.cjs' \) -print | wc -l)"
          } | tee audit-output/repository-state.txt
          find . -path './.git' -prune -o -type f -printf '%P\t%s\n' | sort > audit-output/file-inventory.tsv

      - name: Upload measured inventory
        uses: actions/upload-artifact@v4
        with:
          name: professional-site-audit-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 7

  pr102-delete-session-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 102
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR #102 head
        uses: actions/checkout@v4
        with:
          ref: fix/post-pr99-homepage-account-mailing-truth
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply narrow account deletion cleanup and regression control
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          account_path = Path('assets/mbm-account.js')
          account = account_path.read_text(encoding='utf-8')
          old = """  function deleteAccount() {
            return requireUser().then(function () {
              return sb.functions.invoke('delete-account', { body: { confirm: true } });
            }).then(function (r) {
              if (r.error) throw r.error;
              state.user = null; state.profile = null; state.member = null; writeOfflineIdentity(null); emit(); return true;
            }).catch(function (err) { throw new Error(publicError(err, 'Automatic deletion is not available yet. Please use the deletion contact shown on this page.')); });
          }
          """
          new = """  function deleteAccount() {
            return requireUser().then(function () {
              return sb.functions.invoke('delete-account', { body: { confirm: true } });
            }).then(function (r) {
              if (r.error) throw r.error;
              // The Edge Function has removed the Auth identity and account rows.
              // Also clear Supabase's provider-managed browser session so a reload
              // cannot revive a stale local session after successful deletion.
              return sb.auth.signOut({ scope: 'local' }).catch(function () { return null; });
            }).then(function () {
              state.user = null; state.profile = null; state.member = null; state.recovery = false;
              writeOfflineIdentity(null); emit(); return true;
            }).catch(function (err) { throw new Error(publicError(err, 'Automatic deletion is not available yet. Please use the deletion contact shown on this page.')); });
          }
          """
          if old not in account:
              raise SystemExit('deleteAccount source block no longer matches expected reviewed implementation')
          account_path.write_text(account.replace(old, new, 1), encoding='utf-8')

          gate_path = Path('tools/verify_accounts_members_mailing.js')
          gate = gate_path.read_text(encoding='utf-8')
          anchor = "  need(/SUPABASE_SERVICE_ROLE_KEY/.test(del)&&/auth\\.admin\\.deleteUser/.test(del),'server-side account deletion path missing');\n"
          addition = anchor + "  need(/functions\\.invoke\\(['\\\"]delete-account['\\\"][\\s\\S]{0,700}?auth\\.signOut\\(\\{\\s*scope:\\s*['\\\"]local['\\\"]\\s*\\}\\)/.test(account),'successful account deletion does not clear the provider-managed local session');\n"
          if anchor not in gate:
              raise SystemExit('account verifier delete-path anchor missing')
          gate = gate.replace(anchor, addition, 1)

          positive_anchor = "ok(site.features.mailing.enabled===true,'mailing is enabled after real Buttondown provider proof');\n"
          positive = """const deleteSessionFixture=read('assets/mbm-account.js').replace("return sb.auth.signOut({ scope: 'local' }).catch(function () { return null; });","return Promise.resolve();");
          const deleteSessionPositive=scan({'assets/mbm-account.js':deleteSessionFixture});ok(deleteSessionPositive.some(x=>/provider-managed local session/.test(x)),'positive control: deleted-account session cleanup regression is rejected');
          """ + positive_anchor
          if positive_anchor not in gate:
              raise SystemExit('account verifier positive-control anchor missing')
          gate_path.write_text(gate.replace(positive_anchor, positive, 1), encoding='utf-8')
          PY

      - name: Prove repaired implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node tools/verify_accounts_members_mailing.js
          node tools/test_member_merge.js
          node tools/verify_professional_site.js --base origin/main --self-test
          node --check assets/mbm-account.js
          node --check assets/mbm-mailing.js
          node --check assets/mbm-platform.js
          git diff --check

      - name: Commit permanent repair and remove one-shot infrastructure
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/professional-site-design-audit.yml
          rm -f .github/workflows/pr102-delete-session-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clear provider session after account deletion"
          git push origin HEAD:fix/post-pr99-homepage-account-mailing-truth
