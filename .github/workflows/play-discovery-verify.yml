name: Play discovery review and fresh capture
on:
  pull_request:
    paths: ['domain-split/play/**', '.github/workflows/play-discovery-verify.yml']
  workflow_dispatch:
    inputs:
      capture_new:
        description: Explicitly capture replacement footage after a gameplay change
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: play-discovery-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  review:
    # Runner pin (ruling tx, as tr-1 did for #478's jobs): ubuntu-latest moved to 26.04, where the
    # pinned Playwright cannot install its browser; 24.04 is where it installs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          # Pinned 2026-09-16 (CX2 section 7.1 PLAY-Q1 batch 2) to the Lessons commit the
          # current captures were taken from. This review is frozen to the approved capture
          # source, and batch 2 re-stamped the seven Lessons activity payloads and recaptured
          # their screens, so the pin follows the captures. Only those seven Play payloads
          # differ from the previous pin 9ec70168; no shelf game changed between them.
          # This now LEADS Games/play-publication.json, which still selects 9ec70168 and moves
          # at the Games pin release (blocker B3). Media checks independently match all six
          # captured payload hashes.
          # Moved 2026-10-09 (rulings mx-1, na-1) to Lessons 3d31e441, after names-fix PR 9: the World Cup
          # final and R Gate calibration pages changed (organisation and region off), their two opening
          # screens were recaptured at this commit and their bindings moved with them, so the pin again
          # follows the captures. Only those two Play payloads differ from b54c9006.
          # Moved 2026-11-01 (Play P1 part B) to pin Lessons e82625ea, matching Games/play-publication.json:
          # only Games/Grapple.html changed since 3d31e441 (grapple-f5-2026-10-28), and all 63 opening
          # screens were composited as 640x360 poster frames with Grapple recaptured at this pin.
          ref: e82625ea4ecf47bd9637d213d4a15c25018e91fb
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install review dependencies
        run: |
          python -m pip install lxml==6.0.1
          npm install --no-save --package-lock=false playwright@1.55.0
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps chrome webkit
      - name: Assemble isolated Play review and verify existing save logic
        run: |
          python domain-split/play/prepare.py --lessons .sources/Lessons --output .play-review/output
          node domain-split/check_game_saves.cjs
          node --check domain-split/play/play.js
          # TX play shelf navigation v1: card hrefs on disk, every manifest game once,
          # spotlight == featured flag, no invented category. --self-test plants one
          # defect per limb and requires each to go red.
          python domain-split/play/check_shelf_navigation.py --output .play-review/output --self-test
          node domain-split/play/serve.cjs .play-review/output/games 4173 > .play-review/server.log 2>&1 &
      - name: Capture fresh gameplay through ordinary player inputs
        if: github.event_name == 'workflow_dispatch' && inputs.capture_new
        run: node domain-split/play/capture.cjs
      - name: Preserve capture checkpoint before browser acceptance
        if: always() && github.event_name == 'workflow_dispatch' && inputs.capture_new
        uses: actions/upload-artifact@v4
        with:
          name: play-captures-${{ github.run_id }}
          path: .play-review/capture
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Exercise Play discovery and every initial game surface
        if: always()
        env:
          PLAY_REQUIRE_COMPLETE_DISCOVERY: '1'
        run: node domain-split/play/check.cjs
      - name: Exercise the existing save-transfer browser journey
        if: always()
        run: node domain-split/play/check-save-ui.cjs
      - name: Preserve UI acceptance checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-ui-checkpoint-${{ github.run_id }}
          path: |
            .play-review/qa
            .play-review/save-ui
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Decode and operate accepted previews in Chromium and WebKit
        if: always()
        run: timeout 300 node domain-split/play/check-media.cjs
      - name: Preserve review and source recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-discovery-review-${{ github.run_id }}
          path: .play-review
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
