name: Restore immutable Games logo markup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mbm-games-audience-logo-restore.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.event.pull_request.head.ref == 'codex/mbm-games-audience-faces-2026-08-08'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mbm-games-audience-faces-2026-08-08
          fetch-depth: 0
      - name: Restore the exact pre-upgrade Games logo markup
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:games/index.html > /tmp/games-main.html
          python - <<'PY'
          from pathlib import Path
          import re
          main=Path('/tmp/games-main.html').read_text(encoding='utf-8')
          path=Path('games/index.html');text=path.read_text(encoding='utf-8')
          logo_re=r'<svg class="mono" viewBox="0 0 100 100" aria-hidden="true">.*?</svg>'
          logos=re.findall(logo_re,main,re.S)
          if len(logos)!=2: raise SystemExit(f'expected two baseline logos, found {len(logos)}')
          marker='<img class="mono" src="/assets/brand/micro_mark.svg" alt="">'
          if text.count(marker)!=2: raise SystemExit(f'expected two replacement logos, found {text.count(marker)}')
          for logo in logos:text=text.replace(marker,logo,1)
          path.write_text(text,encoding='utf-8')
          PY
          node tools/verify_professional_site.js --base origin/main --self-test
          git diff --check
      - name: Commit only Games logo restoration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Made by Matt audience release"
          git config user.email "actions@users.noreply.github.com"
          git add games/index.html
          git diff --cached --check
          git commit -m "fix: preserve immutable Games logo markup"
          git push origin HEAD:codex/mbm-games-audience-faces-2026-08-08
