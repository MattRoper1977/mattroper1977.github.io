name: Neon Breach live verification

# The C.4 obligation: name the SERVED hash for the landed game.
#
# The agent container cannot reach the custom domain — the proxy answers 403 on
# CONNECT, and both madebymatt.uk and the github.io host return 000 from there.
# CI is the only channel that can fetch a live path, which is why this exists as
# a workflow rather than a container step.
#
# READ-ONLY against production: it fetches, hashes and compares. It writes
# nothing to any surface.
#
# Pages lag is reported as PENDING, never as a pass. A served copy that has not
# caught up with the tree is a deployment timing fact, not a content match, and
# saying so is the whole point of the gate.

# RETARGETED 2026-08-13 (census ruling). The old push branch was this game's
# launch branch — valid when written, dead the day its PR merged, leaving the
# workflow dispatch-only in practice. It now fires on pushes to main touching
# its subjects, including this file: the retargeting merge is the firing proof.
# Lag is already a recorded timing fact here, not a failure.
# WIDENED 2026-08-14. The retargeting above fixed WHICH BRANCH this fires on and
# left WHAT IT WATCHES too narrow — register species 37: a workflow's path filter
# must include every file its assertions read. #127 re-pointed the surface census
# at data/new-release-occupants.json; that merge changed the record and both
# verifiers and fired nothing, so the evidence had to be hand-dispatched. A gate
# that only runs when someone remembers to press it is not a gate.
#
# Full read set of this workflow, audited rather than guessed:
#   READ DIRECTLY
#     neonbreach/index.html              hashed against the served copy
#     tools/verify_neonbreach.js         run against the SERVED bytes
#     tools/verify_surfaces.js           the surface census
#     data/new-release-occupants.json    the census's declared occupant record
#   ASSERTED IN SERVED FORM (the repo file is the subject of the assertion, so a
#   change to it changes what the step measures — the same reason
#   neonbreach/index.html has always been listed)
#     sitemap.xml                        served sitemap must carry one canonical line
#     games/index.html                   S2/S2c count cards in the served arcade
#   NOT FILTERABLE FROM HERE, and stated rather than left implied
#     MattRoper1977/Games games.json     served at /Games/games.json from the Games
#                                        project site. A shelf change there cannot
#                                        fire a workflow in this repository; the
#                                        census reports the served entry count so
#                                        that lag is visible instead of assumed.
on:
  push:
    branches:
      - main
    paths:
      - 'neonbreach/index.html'
      - 'tools/verify_neonbreach.js'
      - 'tools/verify_surfaces.js'
      - 'data/new-release-occupants.json'
      - 'sitemap.xml'
      - 'games/index.html'
      - '.github/workflows/neonbreach-live-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  live:
    name: Fetch /neonbreach/ as served and compare to the committed tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main (the deployed tree)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record the SHA under test
        shell: bash
        run: echo "main is $(git rev-parse HEAD)"

      - name: GitHub Pages build status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("status ",d.get("status")); print("commit ",d.get("commit")); print("updated",d.get("updated_at")); print("error  ",d.get("error"))' \
            || echo "Pages API unavailable to this token — recorded, not faked."

      - name: HTTP status for the new surface
        shell: bash
        run: |
          set -o pipefail
          fail=0
          for u in https://madebymatt.uk/neonbreach/ https://madebymatt.uk/sitemap.xml ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$u" || echo "000")
            printf '%-46s %s\n' "$u" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - name: SERVED HASH — the C.4 obligation, named
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 60 https://madebymatt.uk/neonbreach/ -o /tmp/neonbreach.live
          LB=$(wc -c < /tmp/neonbreach.live)
          RB=$(wc -c < neonbreach/index.html)
          LS=$(sha256sum /tmp/neonbreach.live | cut -d' ' -f1)
          RS=$(sha256sum neonbreach/index.html | cut -d' ' -f1)
          echo "SERVED_BYTES=$LB"
          echo "SERVED_SHA256=$LS"
          echo "REPO_BYTES=$RB"
          echo "REPO_SHA256=$RS"
          if [ "$LS" = "$RS" ]; then
            echo "PASS served /neonbreach/ is byte-identical to the committed tree"
          else
            echo "PENDING served copy has not caught up with the tree (Pages lag)."
            echo "Recorded as PENDING, not as a pass and not as a content failure."
            exit 78
          fi

      - name: Served copy still satisfies its own contract
        shell: bash
        run: |
          set -euo pipefail
          # The gates are run against the SERVED bytes, not the checked-out
          # ones, so a deploy-time mutation could not slip past unnoticed.
          NB_GAME_FILE=/tmp/neonbreach.live node tools/verify_neonbreach.js
          echo 'The live bytes pass the same contract the committed bytes do.'

      - name: Sitemap as served carries the canonical line
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 https://madebymatt.uk/sitemap.xml -o /tmp/sitemap.live
          N=$(grep -c '<loc>https://madebymatt.uk/neonbreach/</loc>' /tmp/sitemap.live || true)
          echo "served sitemap /neonbreach/ loc lines: $N"
          if [ "$N" -eq 1 ]; then
            echo 'PASS served sitemap carries exactly one canonical line'
          else
            echo 'PENDING served sitemap has not caught up with the tree (Pages lag).'
          fi

      - name: Install the pinned real browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      # REPAIRED 5 Aug 2026. The step this replaces greped the served HTML of
      # /games/ for a slug and printed the result as a measurement. It was not
      # one: the arcade renders its cards client-side from a fetched manifest,
      # so that number reads 0 whatever the manifest contains — a figure that
      # cannot move. Its commentary had also gone stale, still announcing
      # "EXPECTED AT THIS POINT: zero on both ... blocked on the v11-land
      # brief" after both surfaces had landed. Commentary that contradicts
      # reality is the same defect class this programme spent the day
      # retiring, so it does not survive the day.
      #
      # The replacement measures three things from this runner and asserts the
      # RULING rather than a count: the JS-off homepage occupants, the JS-ON
      # rendered arcade cards (with a control that must drop when a ruled game
      # is removed from the manifest), and how /Games/games.json is actually
      # served — which is NOT from this repo. There is no Games/ directory and
      # no submodule here; that path is the MattRoper1977/Games project Pages
      # site mounted under the same custom domain, so a merge in the Games repo
      # reaches visitors only once THAT site rebuilds. The census reports the
      # served entry count so a lag is visible instead of assumed.
      - name: Surface census — JS-off, JS-ON, and the manifest origin
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify_surfaces.js --base=https://madebymatt.uk
