name: Apply Apex Pool sitemap entry

on:
  push:
    branches:
      - codex/apexpool-sitemap
    paths:
      - 'tools/apply_apexpool_sitemap.js'
      - '.github/workflows/apexpool-sitemap-prep.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/apexpool-sitemap
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Insert the canonical URL exactly once
        run: node tools/apply_apexpool_sitemap.js
      - name: Constrain and publish the sitemap-only delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- sitemap.xml
          test "$(git diff --name-only)" = 'sitemap.xml'
          test "$(grep -c '<loc>https://madebymatt.uk/apexpool/</loc>' sitemap.xml)" = '1'
          rm tools/apply_apexpool_sitemap.js .github/workflows/apexpool-sitemap-prep.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: add Apex Pool to sitemap'
          git push origin HEAD:codex/apexpool-sitemap
