name: Fix Games featured-card loading

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mbm-fix-games-top-pick-loading.yml'
      - 'games/index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbm-fix-games-top-pick-loading
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/mbm-games-audience-faces-2026-08-08
          fetch-depth: 0

      - name: Make the eight featured cards deterministic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('games/index.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('function pickCard(g,lead){')
          end = text.index('\nfunction esc(t)', start)
          block = text[start:end]
          old = 'loading="lazy"'
          if block.count(old) != 1:
              raise SystemExit(f'expected one lazy featured-card image, found {block.count(old)}')
          block = block.replace(old, 'loading="eager"', 1)
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
          grep -Fq 'function pickCard(g,lead)' games/index.html
          python - <<'PY'
          from pathlib import Path
          text = Path('games/index.html').read_text(encoding='utf-8')
          block = text[text.index('function pickCard(g,lead){'):text.index('\nfunction esc(t)', text.index('function pickCard(g,lead){'))]
          assert 'loading="eager"' in block
          assert 'loading="lazy"' not in block
          PY
          git diff --check

      - name: Commit only the Games loading correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Made by Matt Games release'
          git config user.email 'actions@users.noreply.github.com'
          git add games/index.html
          git diff --cached --check
          git commit -m 'fix: eagerly load the featured Games artwork'
          git push origin HEAD:codex/mbm-games-audience-faces-2026-08-08
