name: MBM games and audience source snapshot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Capture exact source used for the redesign
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot
          git rev-parse HEAD > snapshot/head.txt
          git ls-files | sort > snapshot/files.txt
          tar --exclude=.git --exclude=snapshot -czf snapshot/source.tar.gz .
          sha256sum snapshot/source.tar.gz > snapshot/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mbm-games-audience-source-${{ github.run_id }}
          path: snapshot/
          if-no-files-found: error
          retention-days: 7
