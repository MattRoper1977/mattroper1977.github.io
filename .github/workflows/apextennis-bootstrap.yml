name: Apex Tennis branch bootstrap

on:
  push:
    branches:
      - codex/apextennis-land
    paths:
      - '.apextennis-upload/READY'
  pull_request:
    branches:
      - main
    paths:
      - '.apextennis-upload/**'
      - '.github/workflows/apextennis-bootstrap.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/apextennis-land
          fetch-depth: 0
      - name: Assemble the reviewed local payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c .apextennis-upload/part-*
          sha256sum .apextennis-upload/part-*
          echo 'cda9f68dbd1af4d941ca757623a3dfaecfde92bda9c14ba4f1f5e49530004317  .apextennis-upload/part-00' > /tmp/expected.sha
          echo 'aa6cc047d7fe4d6fbabfd4884358c51cd0273e2af6d871118a0ffeca785acca1  .apextennis-upload/part-01' >> /tmp/expected.sha
          echo '3be19cc5d97074d49e0c2153e81f14d313405a54856d5ee8951b3a3b09419f53  .apextennis-upload/part-02' >> /tmp/expected.sha
          echo 'e23a48fef6374f2c73fc0ef1cbe462a377ddd91cb2cec62a6752f390e4a47069  .apextennis-upload/part-03' >> /tmp/expected.sha
          sha256sum --check /tmp/expected.sha
          cat .apextennis-upload/part-* | base64 --decode > /tmp/apextennis-payload.tar.gz
          tar -xzf /tmp/apextennis-payload.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          sitemap = Path('sitemap.xml')
          text = sitemap.read_text()
          url = 'https://madebymatt.uk/apextennis/'
          if text.count(url) > 1:
              raise SystemExit('duplicate Apex Tennis sitemap entries')
          if url not in text:
              block = '''  <url>\n    <loc>https://madebymatt.uk/apextennis/</loc>\n    <lastmod>2026-08-04</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'''
              text = text.replace('</urlset>', block + '</urlset>')
              sitemap.write_text(text)
          PY
          rm -rf .apextennis-upload .github/workflows/apextennis-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apextennis/index.html tools/verify_apextennis.js tools/verify_apextennis_browser.js .github/workflows/apextennis-verify.yml sitemap.xml .github/workflows/apextennis-bootstrap.yml .apextennis-upload
          git commit -m 'feat: build Apex Tennis'
          git push origin HEAD:codex/apextennis-land
