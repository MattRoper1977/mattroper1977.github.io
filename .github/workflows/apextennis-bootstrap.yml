name: Apex Tennis branch bootstrap

on:
  push:
    branches:
      - codex/apextennis-land
    paths:
      - '.apextennis-upload/READY'
  pull_request:
    branches:
      - main
    paths:
      - '.apextennis-upload/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/apextennis-land
          fetch-depth: 0
      - name: Assemble the reviewed local payload
        shell: bash
        run: |
          set -euo pipefail
          cat .apextennis-upload/part-* | base64 --decode > /tmp/apextennis-payload.tar.gz
          tar -xzf /tmp/apextennis-payload.tar.gz
          python3 - <<'PY'
          from pathlib import Path
          sitemap = Path('sitemap.xml')
          text = sitemap.read_text()
          url = 'https://madebymatt.uk/apextennis/'
          if text.count(url) > 1:
              raise SystemExit('duplicate Apex Tennis sitemap entries')
          if url not in text:
              block = '''  <url>\n    <loc>https://madebymatt.uk/apextennis/</loc>\n    <lastmod>2026-08-04</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.8</priority>\n  </url>\n'''
              text = text.replace('</urlset>', block + '</urlset>')
              sitemap.write_text(text)
          PY
          rm -rf .apextennis-upload .github/workflows/apextennis-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apextennis/index.html tools/verify_apextennis.js tools/verify_apextennis_browser.js .github/workflows/apextennis-verify.yml sitemap.xml .github/workflows/apextennis-bootstrap.yml .apextennis-upload
          git commit -m 'feat: build Apex Tennis'
          git push origin HEAD:codex/apextennis-land
