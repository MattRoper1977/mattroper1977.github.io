name: Apex Pool verify

on:
  pull_request:
    paths:
      - 'apexpool/**'
      - 'tools/verify_apexpool.js'
      - 'tools/verify_apexpool_browser.js'
      - '.github/workflows/apexpool-verify.yml'
      - 'DONOR_MEASUREMENTS.md'
      - 'APEXPOOL_REPORT.md'
      - 'site.json'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apexpool-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record measured file sizes and donor facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apexpool
          {
            echo "sentinel=apexpool-build-2026-08-04"
            echo "commit=${GITHUB_SHA}"
            wc -c apexkick/index.html apexpool/index.html tools/verify_apexkick.js tools/verify_apexpool.js
            node tools/verify_apexkick.js
            printf 'apexpool_localstorage_writes='; grep -oE 'localStorage\.(setItem|removeItem)\(' apexpool/index.html | wc -l
          } | tee artifacts/apexpool/measurements.txt

      - name: Run deterministic contract harness
        run: node tools/verify_apexpool.js | tee artifacts/apexpool/contract.log

      - name: Install browser verifier
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve repository
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/apexpool/server.log 2>&1 &
          echo $! > artifacts/apexpool/server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/apexpool/ >/dev/null && exit 0
            sleep 1
          done
          cat artifacts/apexpool/server.log
          exit 1

      - name: Run Chromium gates
        env:
          APEXPOOL_BASE_URL: http://127.0.0.1:4173
          APEXPOOL_ARTIFACT_DIR: artifacts/apexpool
        run: node tools/verify_apexpool_browser.js | tee artifacts/apexpool/browser.log

      - name: Upload browser and gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexpool-verification-${{ github.run_id }}
          path: artifacts/apexpool
          if-no-files-found: error
          retention-days: 30
