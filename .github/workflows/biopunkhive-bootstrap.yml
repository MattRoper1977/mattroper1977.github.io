name: Biopunk Hive one-shot reconstruction

on:
  push:
    branches:
      - 'build/biopunkhive-2026-08-04'
    paths:
      - '.github/workflows/biopunkhive-bootstrap.yml'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/biopunkhive-bootstrap.yml'

permissions:
  contents: write

concurrency:
  group: biopunkhive-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: build/biopunkhive-2026-08-04
          fetch-depth: 0

      - name: Reconstruct verified release package
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .biopunk-bootstrap -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 6
          python3 - <<'PY'
          from pathlib import Path
          part = Path('.biopunk-bootstrap/part-05')
          data = part.read_bytes()
          if data.endswith(b'AA==') and not data.endswith(b'AA==\n'):
              part.write_bytes(data + b'\n')
          elif not data.endswith(b'AA==\n'):
              raise SystemExit('unexpected final payload bytes')
          PY
          cat .biopunk-bootstrap/part-* > /tmp/biopunkhive-release.b64
          echo '5e28e755ce4d9c81e49f84325f464dac669a3d3cdfee72914adfe368d629e5fd  /tmp/biopunkhive-release.b64' | sha256sum -c -
          base64 -d /tmp/biopunkhive-release.b64 > /tmp/biopunkhive-release.tgz
          echo 'ac7702025b950b189354e6d1a4a56c5d8a523660df9b6c87ddd17511a443e258  /tmp/biopunkhive-release.tgz' | sha256sum -c -
          tar -xzf /tmp/biopunkhive-release.tgz -C .
          rm -f .github/workflows/biopunkhive-verify.yml

      - name: Generate deterministic delivery identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          source = Path('biopunkhive/index.html')
          data = source.read_bytes()
          expected = 'f129e84bf8718d4b14feb9d3492cc6d534a86d3b0ee5438ed077652b3790080e'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'game hash mismatch: {actual}')
          Path('tools/biopunkhive_index.html.gz.b64').write_bytes(
              base64.encodebytes(gzip.compress(data, compresslevel=9, mtime=0))
          )
          Path('tools/biopunkhive.sha256').write_text(
              f'{actual}  biopunkhive/index.html\n', encoding='utf-8'
          )
          PY

      - name: Add sitemap entry idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('sitemap.xml')
          text = path.read_text(encoding='utf-8')
          loc = '<loc>https://madebymatt.uk/biopunkhive/</loc>'
          count = text.count(loc)
          if count > 1:
              raise SystemExit(f'duplicate Biopunk Hive sitemap entries: {count}')
          if count == 0:
              entry = '''  <url>\n    <loc>https://madebymatt.uk/biopunkhive/</loc>\n    <lastmod>2026-08-04</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.7</priority>\n  </url>\n'''
              if '</urlset>' not in text:
                  raise SystemExit('sitemap closing tag missing')
              text = text.replace('</urlset>', entry + '</urlset>', 1)
              path.write_text(text, encoding='utf-8')
          if path.read_text(encoding='utf-8').count(loc) != 1:
              raise SystemExit('Biopunk Hive sitemap entry is not unique')
          PY

      - name: Publish non-workflow release files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .biopunk-bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: build Biopunk Hive containment lab'
          git push origin HEAD:build/biopunkhive-2026-08-04
