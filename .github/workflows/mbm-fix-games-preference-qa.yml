name: Fix Games audience preference URL check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mbm-fix-games-preference-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbm-fix-games-preference-qa
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/mbm-games-audience-faces-2026-08-08
          fetch-depth: 0

      - name: Normalise the same-origin Continue URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/verify_games_audience_faces.mjs')
          text=path.read_text(encoding='utf-8')
          old="const continueHref=await page.locator('[data-mbm-face-continue] a').getAttribute('href');ensure(count===1&&href==='/for/teachers/',`local audience preference not reflected: count=${count} href=${href}`);ensure(continueHref==='/for/teachers/',`Continue does not point to teacher face: ${continueHref}`);"
          new="const continueHrefRaw=await page.locator('[data-mbm-face-continue] a').getAttribute('href');const continueHref=continueHrefRaw?new URL(continueHrefRaw,base).pathname:null;ensure(count===1&&href==='/for/teachers/',`local audience preference not reflected: count=${count} href=${href}`);ensure(continueHref==='/for/teachers/',`Continue does not point to teacher face: ${continueHrefRaw}`);"
          if text.count(old)!=1:
              raise SystemExit(f'expected one Continue assertion anchor, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check tools/verify_games_audience_faces.mjs
          grep -Fq 'new URL(continueHrefRaw,base).pathname' tools/verify_games_audience_faces.mjs
          git diff --check

      - name: Commit only the verifier correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Made by Matt Games release'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/verify_games_audience_faces.mjs
          git diff --cached --check
          git commit -m 'test: normalise the audience Continue URL'
          git push origin HEAD:codex/mbm-games-audience-faces-2026-08-08
