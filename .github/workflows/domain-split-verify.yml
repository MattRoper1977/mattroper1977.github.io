name: Domain split publication
on:
  pull_request:
    branches: [main]
    paths: ['domain-split/**', 'supabase/**', '.github/workflows/domain-split-verify.yml']
  push:
    branches: [main]
    paths: ['domain-split/**', 'supabase/**', '.github/workflows/domain-split-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: domain-split-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  publications:
    name: Complete separated publications
    runs-on: ubuntu-latest
    # NAV-2 expands the owner/header matrix; the preceding full run took 24m09s.
    # Retain every assertion and allow the complete matrix to finish.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          # Re-pinned 2026-09-19 (ORDER SX3-PASSES): BUILDER-PIN MOVE under
          # release-red precedence, named as such. This pin is documented above
          # as held EQUAL to Lessons main so the site-triggered and
          # Lessons-triggered publishers build the same bytes -- and it had
          # drifted from that invariant, b54c9006 against a main many releases
          # ahead. The drift is not cosmetic: check_education_separation.py
          # holds ONE baseline_sha for the retained usage registry, this job
          # built b54c9006 (retained digest ec7dc075) while the publication
          # carrier built main (d0dc6b3e after this release), and no single
          # value satisfies both. Moving the pin restores the stated invariant
          # and keeps baseline_sha single-valued; widening the fence to a set
          # would have loosened it permanently, because this pin is fixed and
          # the disagreement never collapses on its own.
          #
          # The Lessons #581 head carrying the reviewed evidence re-stamp. That
          # re-stamp is what this pin move made necessary AND possible to see:
          # step 22 runs the Lessons check_catalogue_static.py against this
          # checkout, and at b54c9006 it never saw the release's bytes, so a
          # breach already on Lessons main (20 of 875 hashed entries) went
          # unreported. Derived with rev-parse, never transcribed.
          #
          # FIVE further Lessons pins in this repository still sit on b54c9006
          # and are NOT moved here: education-publication.yml's own fallback
          # (which agx1-live-verify.yml reads), play-discovery-verify.yml,
          # published-completion-verify.yml and splash-region-records.yml twice.
          # That is why the admission registry keeps its transition pairs rather
          # than collapsing to single digests.
          #
          # Pinned 2026-09-19 to Lessons 124f513b, the #581 head carrying the
          # reviewed evidence re-stamp. (tools/census_typed_literals.py reads a
          # 12-line window above the literal, so the naming line belongs here
          # rather than only at the top of this block.)
          # Moved 2026-09-19 (ORDER FINISH S4, PASS 6) with education-publication.yml's
          # fallback to the SAME head: Lessons b32bf1c7, the #594 carrier re-cut, HELD
          # EQUAL TO LESSONS MAIN. tools/lessons_pin_lag_control.py now measures that
          # claim for every Lessons pin in this repository (13 found, not six), and is
          # RED when an EQUAL-declared pin lags a published path: at the move, 2
          # commits behind main 545d9e8b by SHA, 0 published paths moved. Pinned below,
          # derived with git log --grep '(#594)' against origin/main, never typed.
          # Moved 2026-09-20 (ORDER FINISH-2 §5, the one Site window): b32bf1c7 -> Lessons
          # main 6bb8238f, HELD EQUAL TO LESSONS MAIN at the move (the #411 method), derived
          # with git rev-parse origin/main on the Lessons checkout, never typed. Measured by
          # tools/lessons_pin_lag_control.py at the move: 0 commits behind, 0 published paths
          # moved. The F3 and HUM-D5 Lessons merges that follow this window move 21 published
          # paths and add 1750; the registry's transition pairs and ARRIVING markers admit
          # both byte-states, so both publishers stay green until the next pin move.
          # Moved 2026-09-20 (ORDER FINISH-3): 6bb8238f -> Lessons main 5e496ba5f00fc08e02c13dd33c4f6a7eb2e07d77, the
          # squash merge of #600 (the 13 HUM-D5 packs, 1750 files, and the manifest pin).
          # Derived with git rev-parse origin/main on the Lessons checkout, never typed.
          # This discharges the EQUAL declaration that tools/lessons_pin_lag_control.py
          # reported RED before this PR: at 6bb8238f the pin was 3 commits behind main
          # with 1771 published paths moved. It moves WITH its Apps companion below (L31).
          # Moved 2026-09-20 (ORDER HUB-1): 5e496ba5 -> Lessons main 9e8a947ad5ef419a221c3bd83f0ebd5f84940f45, the
          # squash merge of #603 (the Humanities hub: one current card per week from the signed
          # strand record, packs and downloads from the manifests, earlier versions collapsed).
          # Derived with git rev-parse origin/main on the Lessons checkout, never typed. It moves
          # WITH its Apps companion below (L31).
          ref: 9e8a947ad5ef419a221c3bd83f0ebd5f84940f45
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          # Pinned 2026-09-16 (CX2 §5 EDU-D3, documented pin move under SW2_LEDGER.md
          # §0): Apps main. The Lessons catalogue controls above copy the gate's
          # canonical files from this checkout (the tokens stylesheet, the SW2
          # token-inertness check and the LundyLoop live-bytes test), which exist
          # together only from this commit; it carries the SW2 A Apps
          # front door that education_discovery.py now recognises. Held EQUAL to
          # education-publication.yml so this control builds the published bytes.
          # Moved 2026-09-20 (ORDER FINISH-2 §5) WITH the Lessons pin above, because the two
          # move together or not at all: verify_catalogue_contract_controls.py builds its
          # Apps fixture from this checkout and runs the LESSONS gate copy against it, so a
          # Lessons pin whose gate copy has moved and an Apps pin whose copy has not is red
          # ("Unmodified Apps fixture retains its complete cross-estate checks"). Measured:
          # Lessons 6bb8238f + Apps a7d330b8 PASS 273; Lessons 6bb8238f + Apps dfca094b FAIL;
          # Site main's own pair (b32bf1c7 + dfca094b) PASS 274, so this red is this PR's.
          # a7d330b8 is the Apps #119 companion head, the Apps arm of the Lessons commit
          # the pin above now names; both gate copies are byte-identical at 1796ab50.
          # Moved 2026-09-20 (ORDER FINISH-3) WITH the Lessons pin above, per STANDING RULE
          # L31: a Site pin pair is ALWAYS a Lessons pin and ITS Apps companion, never a
          # Lessons pin beside the previous Apps main. a7d330b8 -> Apps main 2a9cb8e8ce81d94e030c901d8bf069eb41e19a3e,
          # the squash merge of #122, which is the Apps arm of the same commit: both gate
          # copies are byte-identical there, gateSha256 e91a97bb. Verified locally before
          # push with verify_catalogue_contract_controls.py (280 controls, 0 FAIL).
          # Moved 2026-09-20 (ORDER HUB-1) WITH the Lessons pin above, per STANDING RULE L31:
          # 2a9cb8e8 -> Apps main f374e8cc52aadb21a6e7088c4b5e1d4b9c702f87, the squash merge of #125, the Apps arm of the
          # same commit: both gate copies are byte-identical there, gateSha256 3539ad6a.
          ref: f374e8cc52aadb21a6e7088c4b5e1d4b9c702f87
          path: .sources/Apps
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install publication HTML parser
        run: python -m pip install lxml==6.0.1
      - name: Build all games with local dependencies
        run: python domain-split/build_publications.py --lessons .sources/Lessons
      - name: Check out the previously released Lessons pin for independent-release controls
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: 1a8e3b29ee4c5d306b9ce0fe0f601dacf3443a98
          path: .sources/Previous-Lessons
          persist-credentials: false
      - name: Prove every registered revision route and reject planted bytes
        run: |
          mkdir -p audit-output/source-revisions
          python domain-split/play/check_source_revision_controls.py --lessons .sources/Lessons --output domain-split/output > audit-output/source-revisions/current.json
          python domain-split/build_publications.py --lessons .sources/Previous-Lessons --output .previous-play-output
          python domain-split/play/check_source_revision_controls.py --lessons .sources/Previous-Lessons --output .previous-play-output > audit-output/source-revisions/previous.json
      - name: Check out the exact reviewed Glitch receiver candidate
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: 95146202d7f876800605b489de4231efe28928b9
          path: .sources/Receiver-Lessons
          persist-credentials: false
      - name: Prove the receiver publication and every registered byte guard
        run: |
          python domain-split/build_publications.py --lessons .sources/Receiver-Lessons --output .receiver-play-output
          python domain-split/play/check_source_revision_controls.py --lessons .sources/Receiver-Lessons --output .receiver-play-output > audit-output/source-revisions/receiver.json
      - name: Verify preview and save-transfer boundaries
        run: |
          python domain-split/check_preview.py
          node --check domain-split/site-runtime.js
          node --check domain-split/game-saves.js
          node domain-split/check_game_saves.cjs
          cmp domain-split/game-saves.html game-saves/index.html
          cmp domain-split/game-saves.js assets/game-saves.js
          cmp domain-split/game-storage-allowlist.json data/game-storage-allowlist.json
      - name: Build education trees from complete source checkouts
        run: |
          python domain-split/build_education.py --self-test
          python domain-split/build_education.py --lessons .sources/Lessons --apps .sources/Apps
      - name: Prove AS1 authoring files cannot leak into education
        run: python tools/as1/education-input-controls.py
      - name: Verify publication separation and retained education
        run: |
          python domain-split/check_publications.py
          python domain-split/check_education_separation.py --self-test
          python domain-split/check_education_separation.py
          python domain-split/verify_education_tree_has_no_games.py --self-test
          python domain-split/verify_education_tree_has_no_games.py --output domain-split/output
          python domain-split/check_education_support.py
          # UX2 B5 (s16): the homepage's audience rows and extra subject tiles follow a planted record
          python domain-split/check_ux2_home.py --self-test
          python domain-split/check_pathway_definitions.py --self-test --lessons .sources/Lessons
      # HC3 §8.2: the one Ko-fi URL the estate links must resolve. ko-fi.com
      # answers 200 for unknown pages too (measured: a nonsense slug came back
      # 200 on the first run), so the status line proves nothing on its own. The
      # page BODY has to carry the account's own handle, and a control page on
      # the same host must not — that is what tells a live profile from a soft
      # 404.
      - name: The configured Ko-fi URL resolves to the account's own page, and a control on the same host does not
        shell: bash
        run: |
          set -uo pipefail
          url="$(python3 -c "import sys; sys.path.insert(0,'domain-split'); from education_support import KOFI; print(KOFI)")"
          handle="${url##*/}"
          ua='Mozilla/5.0 (X11; Linux x86_64) made-by-matt-estate-check'
          real_code=$(curl -sS -o /tmp/kofi-real.html -w '%{http_code}' -L --max-time 30 -A "$ua" "$url" || echo 000)
          ctrl_code=$(curl -sS -o /tmp/kofi-control.html -w '%{http_code}' -L --max-time 30 -A "$ua" "https://ko-fi.com/this-page-does-not-exist-mbm-control-9f3a" || echo 000)
          # Counted in Python, not with grep: grep exits 1 on no match, which under
          # this shell's -e/pipefail ended the step silently before it could report.
          real_hits=$(python3 tools/count_marker.py "$handle" /tmp/kofi-real.html)
          ctrl_hits=$(python3 tools/count_marker.py "$handle" /tmp/kofi-control.html)
          python3 tools/count_marker.py --describe /tmp/kofi-real.html /tmp/kofi-control.html
          echo "configured $url -> HTTP $real_code, handle '$handle' appears $real_hits time(s)"
          echo "control   -> HTTP $ctrl_code, handle appears $ctrl_hits time(s)"
          if [ "$real_code" != "200" ] || [ "$real_hits" -lt 1 ]; then echo "::error::the configured Ko-fi URL did not resolve to a page carrying the account handle"; exit 1; fi
          if [ "$ctrl_hits" -ge 1 ]; then echo "::error::the control page carries the handle too - this measurement cannot tell the account page from any other"; exit 1; fi
      - name: Verify shared usage database and service controls without production traffic
        working-directory: domain-split/analytics-backend
        run: |
          npm ci
          npm test
      - name: Verify current-source lesson discovery and audience preservation
        run: python domain-split/check_lesson_discovery.py --lessons .sources/Lessons
      - name: Install the established education browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2 linkedom@0.18.12
          npx playwright install --with-deps chromium
      - name: Prove the native save handoff and its planted preservation failures
        run: |
          node domain-split/check_stub_handoff.cjs
          python3 domain-split/stub_handoff.py --fixture-output .receiver-play-output
          python3 tools/hc3_handoff_publications.py --control .receiver-play-output
          node domain-split/check_stub_handoff_browser.cjs .receiver-play-output audit-output/hc3-handoff
      - name: Retain native handoff controls on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-split-native-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/hc3-handoff/
          if-no-files-found: warn
      - name: Check lesson catalogue and its preservation controls
        run: |
          python .sources/Lessons/tools/catalogue/check_catalogue_static.py
          node .sources/Lessons/tools/catalogue/check_catalogue_dom.cjs
          python .sources/Lessons/tools/catalogue/verify_catalogue_contract_controls.py --lessons .sources/Lessons --apps .sources/Apps --canonical .
      - name: Mount and exercise the actual education publication
        shell: bash
        env:
          MBM_REQUIRE_TEACHING_PACKS: 'true'
          MBM_EDUCATION_ORIGIN: http://127.0.0.1:4173
          MBM_NAVIGATION_OUTPUT: audit-output/education-navigation
          MBM_PLAY_ORIGIN: http://127.0.0.1:4174
          MBM_USAGE_LESSONS_SOURCE: .sources/Lessons
          MBM_PRIMARY_ORIGIN: http://127.0.0.1:4173
          MBM_PRIMARY_LESSONS_SOURCE: .sources/Lessons
        run: |
          set -euo pipefail
          mkdir -p _navigation-served/Lessons _navigation-served/Matt-s-Apps-
          rsync -a domain-split/output/education-site/ _navigation-served/
          rsync -a domain-split/output/education-lessons/ _navigation-served/Lessons/
          rsync -a domain-split/output/education-apps/ _navigation-served/Matt-s-Apps-/
          python -m http.server 4173 --bind 127.0.0.1 --directory _navigation-served > /tmp/navigation-http.log 2>&1 &
          server=$!
          python -m http.server 4174 --bind 127.0.0.1 --directory domain-split/output/games > /tmp/play-http.log 2>&1 &
          play_server=$!
          trap 'kill "$server" "$play_server" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/Lessons/ >/dev/null; then break; fi
            sleep 1
          done
          browser_status=0
          node domain-split/check_education_navigation.cjs || browser_status=1
          node domain-split/check_resource_discovery.cjs || browser_status=1
          node domain-split/check_print_navigation.cjs || browser_status=1
          node domain-split/check_audience_discovery.cjs || browser_status=1
          node domain-split/check_governors_discovery.cjs || browser_status=1
          node domain-split/check_primary_discovery.cjs || browser_status=1
          node domain-split/check_home_play_discovery.cjs || browser_status=1
          node domain-split/check_usage_discovery.cjs || browser_status=1
          node domain-split/check_shared_navigation.cjs || browser_status=1
          node domain-split/check_completion.cjs || browser_status=1
          # UX2 B5: two-tap reachability of every pre-order href, money/third-party on / and pupil
          # routes, the consent bar driven both ways, Appendix A copy and vocabulary, hrefs, hero,
          # tiles = hub cards, sitemap — then the same gate with every planted mutation, which must go red
          node domain-split/check_ux2_education.cjs || browser_status=1
          node domain-split/check_ux2_education.cjs --red-proof || browser_status=1
          # HC4 §7.1: /stats/on-this-device/ answers and reads one record back on BOTH origins (real → planted → restored)
          node domain-split/check_device_stats_record.cjs _navigation-served domain-split/output/games || browser_status=1
          exit "$browser_status"
      - name: Save navigation and print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-navigation-${{ github.run_id }}
          path: audit-output/education-navigation/
          retention-days: 30
      - name: Save UX2 education gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux2-education-${{ github.run_id }}
          path: audit-output/ux2-education/
          retention-days: 30
      - name: Save resource and app discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-discovery-${{ github.run_id }}
          path: audit-output/resource-discovery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: education-expansion-${{ github.run_id }}
          path: |
            audit-output/audience-discovery/
            audit-output/governors-discovery/
            audit-output/primary-discovery/
            audit-output/education-expansion/
            audit-output/home-play-discovery/
            audit-output/usage-discovery/
            audit-output/print-navigation/
            audit-output/completion/
            audit-output/source-revisions/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: domain-split-publications
          path: domain-split/output
          include-hidden-files: true
          retention-days: 30
