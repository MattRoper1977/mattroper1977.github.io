name: Install corrected full-estate scanner

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: full-estate-scanner-install-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-repair-upgrade-2026-08-07
          fetch-depth: 0

      - name: Recover and verify the corrected scanner payload
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path('tools/.audit-payload')
          parts = sorted(root.glob('scanner-part-*.txt'))
          expected_chunk_hashes = [
              '36414d44bce9d8a72caf81020c6462ca576104b2f355081a222adf413fbd6113',
              '50b3614757620e62043ae40d3f1bf59fdf7c87bc92da5faea3c83815c35bdcdb',
              'c6dbcabe5ad304b43ab664ef78deda787ed96ca212f91815251cffe647a1b191',
              'e5048233eb8159840ea430e466b8a1632c272786b84c46fbf97ac29c22d398c5',
              '9f69a718dbdd4d1d6b6027043ce7d235a87dbd46c98164d5c9e6f7cbb0bd1302',
              '0639acdb50b6fcc1c4b0de11bbb828ca782b00fe2759d1e0df036cd7a26410f5',
              '5f2b38ea14d73629da6f757efcd01bc90fbda25715740ac8dfbe6a43bd268d67',
              '58c7ea6d9ca1e8cc446c8939477e95cf33b5fd06d68a5c209f97a9fdb8b93bbf',
          ]
          if len(parts) != len(expected_chunk_hashes):
              raise SystemExit(f'expected 8 payload chunks, found {len(parts)}')
          chunks = []
          for path, expected_hash in zip(parts, expected_chunk_hashes):
              chunk = path.read_text(encoding='utf-8').strip()
              digest = hashlib.sha256(chunk.encode()).hexdigest()
              if len(chunk) != 1842 or digest != expected_hash:
                  raise SystemExit(f'{path} failed integrity check: length={len(chunk)} sha256={digest}')
              chunks.append(chunk)
          payload = ''.join(chunks)
          if len(payload) != 14736:
              raise SystemExit(f'combined payload length mismatch: {len(payload)}')
          data = gzip.decompress(base64.b64decode(payload))
          digest = hashlib.sha256(data).hexdigest()
          expected = 'eda32791d79ccfe2d6ad6799fc4f8936ddda4c8d6e30cdc2730d6d98c59e2493'
          if digest != expected:
              raise SystemExit(f'scanner payload digest mismatch: {digest}')
          Path('tools/full_estate_audit.py').write_bytes(data)
          print(f'wrote {len(data)} bytes, sha256={digest}')
          PY
          python -m py_compile tools/full_estate_audit.py
          python tools/full_estate_audit.py --self-test
          grep -F 'games_root: Optional[Path]' tools/full_estate_audit.py
          grep -F 'mounts = (("Lessons", "Lessons"), ("Games", "Games"), ("Matt-s-Apps-", "Apps"))' tools/full_estate_audit.py
          git diff --check

      - name: Commit the version-matched scanner
        run: |
          if git diff --quiet -- tools/full_estate_audit.py; then
            echo 'Scanner already matches the corrected bytes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/full_estate_audit.py
          git commit -m 'test: derive authoritative game and dependency coverage'
          git push origin HEAD:codex/full-repair-upgrade-2026-08-07
