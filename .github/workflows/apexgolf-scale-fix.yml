name: Guard Apex Golf phone-scale geometry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apexgolf-scale-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Keep view scale and ellipse radii finite and positive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apexgolf/index.html')
          source = path.read_text()
          old_view = 'function setView(hole){var m=18,sx=(canvas.width-m*2)/hole.world.w,sy=(canvas.height-m*2)/hole.world.h;view.scale=Math.min(sx,sy);view.ox=(canvas.width-hole.world.w*view.scale)/2;view.oy=(canvas.height-hole.world.h*view.scale)/2;}'
          new_view = 'function setView(hole){var m=Math.max(0,Math.min(18,(canvas.width-1)/2,(canvas.height-1)/2)),sx=Math.max(1,canvas.width-m*2)/hole.world.w,sy=Math.max(1,canvas.height-m*2)/hole.world.h,s=Math.min(sx,sy),floor=1/Math.max(hole.world.w,hole.world.h);view.scale=isFinite(s)&&s>0?Math.max(floor,s):floor;view.ox=(canvas.width-hole.world.w*view.scale)/2;view.oy=(canvas.height-hole.world.h*view.scale)/2;}'
          old_ellipse = 'function ellipse(e){var p=W(e);ctx.beginPath();ctx.ellipse(p.x,p.y,e.rx*view.scale,e.ry*view.scale,0,0,Math.PI*2);}'
          new_ellipse = 'function ellipse(e){var p=W(e),rx=Math.max(.001,Math.abs(e.rx*view.scale)),ry=Math.max(.001,Math.abs(e.ry*view.scale));ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,0,0,Math.PI*2);}'

          if source.count(old_view) != 1:
              raise SystemExit(f'setView anchor count was {source.count(old_view)}')
          if source.count(old_ellipse) != 1:
              raise SystemExit(f'ellipse anchor count was {source.count(old_ellipse)}')

          source = source.replace(old_view, new_view).replace(old_ellipse, new_ellipse)
          path.write_text(source)
          PY

          node tools/verify_apexgolf.js --no-browser
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apexgolf/index.html
          git commit -m "fix: guard phone-scale course geometry"
          git push origin "HEAD:${{ github.head_ref }}"
