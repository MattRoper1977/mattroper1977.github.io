name: Verify homepage architecture and audience homepages

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'main/**'
      - 'start/**'
      - 'for/**'
      - 'games/index.html'
      - 'account/**'
      - 'members/**'
      - 'mailing-list/**'
      - 'privacy/**'
      - 'resources/**'
      - 'tools/index.html'
      - 'stats/**'
      - '404.html'
      - 'assets/mbm-audience.css'
      - 'assets/mbm-audience.js'
      - 'assets/mbm-doors.js'
      - 'assets/mbm-platform.css'
      - 'assets/mbm-platform.js'
      - 'data/audience-homepages.json'
      - 'site.json'
      - 'site.webmanifest'
      - 'sitemap.xml'
      - 'audience-sitemap.xml'
      - 'robots.txt'
      - 'tools/render_audience_homepages.py'
      - 'tools/stamp-data.py'
      - 'tools/verify_games_audience_faces.py'
      - 'tools/verify_games_audience_faces.mjs'
      - 'tools/verify_professional_site.js'
      - 'tools/verify_accounts_members_mailing.js'
      - '.github/workflows/verify-games-audience-faces.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'main/**'
      - 'start/**'
      - 'for/**'
      - 'games/index.html'
      - 'account/**'
      - 'members/**'
      - 'mailing-list/**'
      - 'privacy/**'
      - 'resources/**'
      - 'tools/index.html'
      - 'stats/**'
      - '404.html'
      - 'assets/mbm-audience.css'
      - 'assets/mbm-audience.js'
      - 'assets/mbm-doors.js'
      - 'assets/mbm-platform.css'
      - 'assets/mbm-platform.js'
      - 'data/audience-homepages.json'
      - 'site.json'
      - 'site.webmanifest'
      - 'sitemap.xml'
      - 'audience-sitemap.xml'
      - 'robots.txt'
      - 'tools/render_audience_homepages.py'
      - 'tools/stamp-data.py'
      - 'tools/verify_games_audience_faces.py'
      - 'tools/verify_games_audience_faces.mjs'
      - 'tools/verify_professional_site.js'
      - 'tools/verify_accounts_members_mailing.js'
      - '.github/workflows/verify-games-audience-faces.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mbm-homepage-audience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-contract:
    name: Static architecture, preservation and positive controls
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify generated audience homepages are current
        run: python3 tools/render_audience_homepages.py --check
      - name: Verify homepage architecture and seven positive controls
        run: python3 tools/verify_games_audience_faces.py --self-test
      - name: Verify original homepage preservation and professional shell
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          node tools/verify_professional_site.js --base origin/main --self-test
      - name: Verify accounts, Members, Supabase and mailing contracts
        run: |
          node tools/verify_accounts_members_mailing.js
          node tools/test_member_merge.js
      - name: Verify content-hash data stamps
        run: python3 tools/stamp-data.py --check
      - name: Verify script, inline-script and CSS syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/mbm-audience.js
          node --check assets/mbm-doors.js
          node --check assets/mbm-platform.js
          node --check tools/verify_games_audience_faces.mjs
          python3 -m py_compile tools/render_audience_homepages.py tools/verify_games_audience_faces.py
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess, tempfile
          pages=[Path('index.html'),Path('main/index.html'),Path('start/index.html'),Path('games/index.html'),*sorted(Path('for').glob('*/index.html'))]
          with tempfile.TemporaryDirectory() as td:
              td=Path(td)
              for page in pages:
                  html=page.read_text(encoding='utf-8')
                  for i,match in enumerate(re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>',html,re.S|re.I)):
                      attrs=match.group('attrs'); body=match.group('body')
                      if not body.strip() or re.search(r'\bsrc\s*=',attrs,re.I): continue
                      type_match=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
                      script_type=type_match.group(1).lower() if type_match else 'text/javascript'
                      if script_type=='application/ld+json':
                          json.loads(body)
                          continue
                      if script_type not in ('text/javascript','application/javascript','module'):
                          continue
                      target=td/f'{page.parent.name or "root"}-{i}.js'
                      target.write_text(body,encoding='utf-8')
                      subprocess.run(['node','--check',str(target)],check=True)
          for path in [Path('assets/mbm-audience.css'),Path('assets/mbm-platform.css')]:
              text=path.read_text(encoding='utf-8')
              if text.count('{')!=text.count('}'):
                  raise SystemExit(f'unbalanced CSS braces: {path}')
          PY
      - name: Check patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            git fetch origin main
            git diff --check origin/main...HEAD
          else
            git diff --check HEAD^
          fi

  browser-matrix:
    name: Same-origin responsive, visual and journey proof
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - name: Check out canonical Games data
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Games
          ref: main
          path: _sources/Games
          fetch-depth: 1
      - name: Check out canonical Lessons estate
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: main
          path: _sources/Lessons
          fetch-depth: 1
      - name: Check out canonical Apps estate
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Matt-s-Apps-
          ref: main
          path: _sources/Apps
          fetch-depth: 1
      - name: Assemble the real same-origin Made by Matt estate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _served/Games _served/Lessons _served/Matt-s-Apps-
          rsync -a --exclude=.git --exclude=_served --exclude=_sources --exclude=node_modules --exclude=audit-output ./ _served/
          cp _sources/Games/games.json _served/Games/games.json
          rsync -a --exclude=.git _sources/Lessons/ _served/Lessons/
          rsync -a --exclude=.git _sources/Apps/ _served/Matt-s-Apps-/
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('_served/site.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          features=data.setdefault('features',{})
          if isinstance(features.get('accounts'),dict): features['accounts']['enabled']=False
          if isinstance(features.get('mailing'),dict): features['mailing']['enabled']=False
          path.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Install Chromium browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Run viewport matrix, screenshots and flows A–G
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory _served >/tmp/mbm-homepage-http.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          MBM_BASE_URL=http://127.0.0.1:4173/ MBM_FULL_ESTATE=1 node tools/verify_games_audience_faces.mjs
      - name: Print browser summary
        if: always()
        run: test ! -f audit-output/browser-results.json || cat audit-output/browser-results.json
      - name: Upload screenshots and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbm-homepage-audience-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

  live-proof:
    name: Exact production deployment and live browser proof
    if: github.event_name == 'push'
    needs: [static-contract, browser-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Wait for and byte-compare the exact deployed architecture
        shell: bash
        run: |
          set -euo pipefail
          declare -A pages=(
            [index.html]="/"
            [main/index.html]="/main/"
            [start/index.html]="/start/"
            [for/pupils/index.html]="/for/pupils/"
            [for/teachers/index.html]="/for/teachers/"
            [for/parents-carers/index.html]="/for/parents-carers/"
            [for/schools-semh/index.html]="/for/schools-semh/"
            [for/trusts/index.html]="/for/trusts/"
            [for/councils-organisations/index.html]="/for/councils-organisations/"
            [for/partners/index.html]="/for/partners/"
          )
          ready=0
          mkdir -p /tmp/mbm-live
          for _ in $(seq 1 72); do
            failed=0
            for file in "${!pages[@]}"; do
              route=${pages[$file]}
              out="/tmp/mbm-live/${file//\//__}"
              curl -fsS --retry 2 -H 'Cache-Control: no-cache, no-store, max-age=0' "https://madebymatt.uk${route}?mbm=${GITHUB_SHA}" -o "$out" || { failed=1; break; }
              cmp -s "$file" "$out" || { failed=1; break; }
            done
            if [ "$failed" -eq 0 ]; then ready=1; break; fi
            sleep 10
          done
          test "$ready" -eq 1
          for route in / /main/ /start/ /for/pupils/ /for/teachers/ /for/parents-carers/ /for/schools-semh/ /for/trusts/ /for/councils-organisations/ /for/partners/ /games/ /Lessons/ /Matt-s-Apps-/ /tools/ /resources/ /account/ /members/ /mailing-list/ /privacy/; do
            curl -fsS --retry 3 -H 'Cache-Control: no-cache, no-store, max-age=0' "https://madebymatt.uk${route}?mbm=${GITHUB_SHA}" >/dev/null
          done
      - name: Run the full live viewport and journey proof
        run: MBM_BASE_URL=https://madebymatt.uk/ MBM_CACHE_BUST="$GITHUB_SHA" MBM_FULL_ESTATE=1 node tools/verify_games_audience_faces.mjs
      - name: Record production summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Homepage audience production proof"
            echo
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Architecture pages byte-compared: 10"
            echo "- Required live routes probed: 18"
            echo "- Browser evidence: \`audit-output/browser-results.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mbm-homepage-audience-live-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 45
