name: Apex Tennis arcade bootstrap
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apextennis-arcade-bootstrap.yml'
      - '.github/workflows/arcade-sports-verify.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/apextennis-arcade-sports
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Join the existing Sports renderer and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def replace(path,old,new,count=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=count: raise SystemExit(f'{path}: expected {count} copies, got {n}: {old[:80]}')
              p.write_text(s.replace(old,new))
          replace('games/index.html',
            "Three Apex games, side by side: bend the ball in Apex Kick, control the cue ball's leave in Apex Pool, then call your score in Apex Golf.",
            "Four Apex games, side by side: bend the ball in Apex Kick, control the cue ball's leave in Apex Pool, call your score in Apex Golf, then call the point before the serve in Apex Tennis.")
          replace('tools/verify_arcade_sports.js','three-game-sports-copy-preserved','four-game-sports-copy-preserved')
          replace('tools/verify_arcade_sports.js',
            "html.includes('Three Apex games, side by side')&&html.includes('Apex Golf')",
            "html.includes('Four Apex games, side by side')&&html.includes('Apex Golf')&&html.includes('Apex Tennis')")
          replace('tools/apply_arcade_sports_catalogue_correction.py','merged three-game Sports state','merged four-game Sports state')
          replace('tools/apply_arcade_sports_catalogue_correction.py',"'Three Apex games, side by side' in text","'Four Apex games, side by side' in text")
          replace('tools/apply_arcade_sports_catalogue_correction.py','all 33 games in whole shelf','all manifest games in whole shelf')
          p=Path('tools/verify_arcade_sports_browser.js'); s=p.read_text()
          pairs=[
            ('manifest-count-33','manifest-count-34'),
            ('games.length===33','games.length===34'),
            ("['Apex Kick','Apex Pool','Apex Golf']","['Apex Kick','Apex Pool','Apex Golf','Apex Tennis']"),
            ("document.querySelectorAll('#sportsRail .gcard').length===3&&document.querySelectorAll('#allGrid .gcard').length===33","document.querySelectorAll('#sportsRail .gcard').length===4&&document.querySelectorAll('#allGrid .gcard').length===34"),
            ("-sports-three-adjacent","-sports-four-adjacent"),
            ("['/apexkick/','/apexpool/','/apexgolf/']","['/apexkick/','/apexpool/','/apexgolf/','/apextennis/']"),
            ("s.shelf.length===33&&['Apex Kick','Apex Pool','Apex Golf'].every","s.shelf.length===34&&['Apex Kick','Apex Pool','Apex Golf','Apex Tennis'].every"),
            ("n(s.sports,'Apex Golf')===1&&n(s.shelf,'Apex Golf')===1","n(s.sports,'Apex Golf')===1&&n(s.shelf,'Apex Golf')===1&&n(s.sports,'Apex Tennis')===1&&n(s.shelf,'Apex Tennis')===1"),
            ('13 curated favourites of 33 games','13 curated favourites of 34 games')
          ]
          for old,new in pairs:
              n=s.count(old)
              if n<1: raise SystemExit(f'browser verifier anchor missing: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          node --check tools/verify_arcade_sports.js
          node --check tools/verify_arcade_sports_browser.js
          node tools/verify_arcade_sports.js
          node tools/verify_arcade_sports.js --self-test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/index.html tools/verify_arcade_sports.js tools/verify_arcade_sports_browser.js tools/apply_arcade_sports_catalogue_correction.py
          git commit -m 'feat: join Apex Tennis to Arcade Sports'
          git push origin HEAD:codex/apextennis-arcade-sports
