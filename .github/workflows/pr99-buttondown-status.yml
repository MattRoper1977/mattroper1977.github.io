name: PR99 Buttondown status

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr99-buttondown-status.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read status-only provider diagnostic
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            https://fhulisooqhbyldphmnca.supabase.co/functions/v1/subscribe-mailing-list
