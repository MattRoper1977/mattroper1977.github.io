name: AGX-1 live verification

# Pass AGX-1 §11.6 / §12.3 C2 — the deployment proof.
#
# The agent container cannot reach the custom domain (the proxy answers 403 on
# CONNECT) and the Pages API is blocked through it too. CI is the channel.
# This workflow is READ-ONLY against production: it fetches, hashes and
# compares. It writes nothing to any surface.
#
# It closes the gap §12.3 C2 names: /apexgolf/ has never been fetched by
# anyone, and Tennis skipped its live check on a container DNS failure.

# Runs on the verification-only pull request, per §11.6's proven pattern
# (Apex Pool's instance: run 30908723551, PR site#42, closed unmerged).
# The PR is opened to carry this run and is then CLOSED UNMERGED by design —
# closed-unmerged is its correct terminal state, not a failure.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'claude/apexgolf-build-2026-08-04-b1hbwj'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  live:
    name: Fetch the live estate and compare to raw-at-SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main (the deployed tree)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Check out the INSTRUMENTS from the ref under review
        # Step 1 deliberately checks out `ref: main` — the deployed tree is the
        # SUBJECT of this gate and must not be the branch. But the tools that do
        # the measuring are the INSTRUMENT, and on a pull request the instrument
        # under review is the branch's, not main's.
        #
        # Conflating the two broke this gate on its first run: the derive step
        # below calls tools/derive_live_routes.mjs, which does not exist on main
        # until this PR merges, so the step died MODULE_NOT_FOUND and took every
        # later step with it. Subject from main, instrument from here.
        uses: actions/checkout@v4
        with:
          path: _tools
          fetch-depth: 1

      - name: Check out the canonical shelf
        # The route set below is DERIVED from this file. It is checked out
        # rather than read from data/source-manifests/games.json because the
        # mirror is a copy: shelf-mirror-guard.yml owns whether the copy is
        # current, and a live gate should be held to what the estate actually
        # sells, not to a mirror that may be mid-drift.
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Games
          ref: main
          path: _shelf
          fetch-depth: 1

      - name: Record the SHA and derive the full-home route under test
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "main is $(git rev-parse HEAD)"
          if test -f main/index.html; then
            echo "FULL_HOME_ROUTE=/main/" >> "$GITHUB_ENV"
            echo "FULL_HOME_FILE=main/index.html" >> "$GITHUB_ENV"
            echo "full homepage is /main/"
          else
            echo "FULL_HOME_ROUTE=/" >> "$GITHUB_ENV"
            echo "FULL_HOME_FILE=index.html" >> "$GITHUB_ENV"
            echo "full homepage is legacy root /"
          fi

      - name: GitHub Pages build status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          echo "== Pages =="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("status ",d.get("status")); print("commit ",d.get("commit")); print("updated",d.get("updated_at")); print("error  ",d.get("error"))' \
            || echo "Pages API unavailable to this token — recorded, not faked."

      - name: Derive the route set from the canonical shelf, with controls
        # The hand-list this replaced named six games. The shelf names
        # fifty-two, twenty-three of them served from this repository, and
        # /emberwild/ - which moved twice in one day - was not among the six.
        # Same species as verify_games_audience_faces.py: a list kept by hand
        # beside a record kept by machine never goes red when the record grows.
        #
        # This step also runs the tool's own controls, so the derivation is
        # proven able to fail in the same run that relies on it. It exits 2
        # INCONCLUSIVE if the shelf cannot be read, because a derivation that
        # silently yields zero routes would turn this whole gate green by
        # checking nothing.
        shell: bash
        run: |
          set -euo pipefail
          node _tools/tools/derive_live_routes.mjs --canonical _shelf/games.json --root .
          node _tools/tools/derive_live_routes.mjs --canonical _shelf/games.json --root . --emit routes > /tmp/live-routes.txt
          echo "derived $(wc -l < /tmp/live-routes.txt) route(s) for the live check — games plus the covered infrastructure routes"

      - name: Custom-domain HTTP status for every surface
        shell: bash
        run: |
          set -o pipefail
          fail=0
          # Games come from the derivation. The five that follow are the
          # declared RESIDUE - infrastructure no manifest lists, kept because
          # dropping coverage to make the list purely derived would be a worse
          # gate, and named here rather than blended into the game count.
          mapfile -t derived < /tmp/live-routes.txt
          urls=()
          for r in "${derived[@]}"; do urls+=("https://madebymatt.uk$r"); done
          # Three of the five former residue routes — / , /games/ and /site.json —
          # are now EMITTED BY THE DERIVATION and arrive in "${derived[@]}".
          # Listing them here as well would check them twice and, worse, print a
          # count that no longer describes what ran. Only the two that stay
          # EXEMPT are still named by hand.
          urls+=( "https://madebymatt.uk${FULL_HOME_ROUTE}" \
                  https://madebymatt.uk/Games/games.json )
          echo "checking ${#derived[@]} derived route(s) + 2 exempt route(s) named by hand"
          for u in "${urls[@]}" ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$u" || echo "000")
            printf '%-46s %s\n' "$u" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - name: Live bytes must equal the committed tree, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          echo "game                 live_bytes  repo_bytes  live_sha256                                                       match"
          status=0
          # Derived, not named. The six this used to list were the six that
          # happened to have been built when it was written.
          mapfile -t derived < /tmp/live-routes.txt
          # A ROUTE IS NOT ALWAYS <slug>/index.html, AND THIS LOOP USED TO ASSUME IT WAS.
          # The derivation now emits infrastructure routes as well as games, so
          # "/" resolves to index.html and "/site.json" resolves to itself. The
          # old form produced `g=""` for "/" and then read the ABSOLUTE path
          # /index.html, which does not exist — the failure that caught this.
          for r in "${derived[@]}"; do
            g="${r#/}"; g="${g%/}"
            if [ -z "$g" ]; then
              file="index.html"; url="https://madebymatt.uk/"; label="/"
            elif [ "$g" != "${g%.*}" ]; then
              file="$g"; url="https://madebymatt.uk/$g"; label="$g"
            else
              file="$g/index.html"; url="https://madebymatt.uk/$g/"; label="$g"
            fi
            tmp="/tmp/live-$(printf '%s' "$label" | tr -c 'A-Za-z0-9._-' '_')"
            curl -sS --max-time 60 "$url" -o "$tmp"
            lb=$(wc -c < "$tmp"); rb=$(wc -c < "$file")
            ls=$(sha256sum "$tmp" | cut -d' ' -f1)
            rs=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$ls" = "$rs" ]; then m=IDENTICAL; else m="*** DIFFERS ***"; status=1; fi
            printf '%-20s %10s %11s  %s  %s\n' "$label" "$lb" "$rb" "$ls" "$m"
          done
          echo
          # NINTH INSTANCE, in the live gate itself. This line printed a literal
          # "expected Apex Golf: 64513 bytes, sha256 c0701ee1..." — the PRE-D5
          # deployed figure, wrong the moment the Golf branch merged. The
          # comparison above already DERIVES the repo side; only the caption was
          # frozen. Derive the caption too, so it can never disagree with the
          # thing it captions.
          printf 'Apex Golf in the tree under test: %s bytes, sha256 %s\n' \
            "$(wc -c < apexgolf/index.html)" "$(sha256sum apexgolf/index.html | cut -d' ' -f1)"
          printf 'Neon Sync in the tree under test: %s bytes, sha256 %s\n' \
            "$(wc -c < neonsync/index.html)" "$(sha256sum neonsync/index.html | cut -d' ' -f1)"
          exit $status

      - name: Live site.json door census — the C1 ruling, as served
        shell: bash
        run: |
          set -euo pipefail
          # The surface list above only proves site.json returns 200. That is
          # not a door count. C1 removed Apex Golf's door (14 -> 13, games
          # 8 -> 7) and the ruling is only verified once the SERVED file is
          # counted, so count it and compare it to the committed tree.
          curl -sS --max-time 30 https://madebymatt.uk/site.json -o /tmp/site.live.json
          python3 - <<'PY'
          import json,sys
          live=json.load(open('/tmp/site.live.json'))
          repo=json.load(open('site.json'))
          def census(d):
              doors=d.get('doors',[])
              return (len(doors),
                      sum(1 for x in doors if x.get('zone')=='games'),
                      sum(1 for x in doors if x.get('title')=='Apex Golf'))
          l,r=census(live),census(repo)
          print(f'  served site.json : {l[0]} doors, {l[1]} in games, {l[2]} Apex Golf door(s)')
          print(f'  repo   site.json : {r[0]} doors, {r[1]} in games, {r[2]} Apex Golf door(s)')
          if not l[0]:
              print('  FAIL served site.json has no doors[] — an empty census would pass vacuously'); sys.exit(1)
          if l!=r:
              print('  PENDING served site.json has not caught up with the tree (Pages lag).')
              sys.exit(0)
          if l[2]==0 and l[0]==r[0]:
              print(f'  PASS C1 holds as served: Apex Golf takes NO door, {l[0]} doors, {l[1]} in the games zone')
          else:
              print('  FAIL served door census does not satisfy the C1 ruling'); sys.exit(1)
          PY

      - name: Live manifest and placement census
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 https://madebymatt.uk/Games/games.json -o /tmp/games.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/games.json'))
          g=d['games']
          print('entries            ', len(g))
          print('art                ', sum(1 for e in g if e.get('art')), '/', len(g))
          print('duplicate ids      ', len(g)-len({e['href'] for e in g}))
          sports=[e['title'] for e in g if e.get('collection')=='Sports']
          print('Sports             ', ' · '.join(sports))
          from collections import Counter
          print('Physics (derived)  ', Counter(e['tag'] for e in g)['Physics'])
          print('Sport chip minted  ', any(e['tag']=='Sport' for e in g))
          hues={e['title']:e['hue'] for e in g if e.get('collection')=='Sports'}
          print('Sports hues        ', hues)
          print('hues all distinct  ', len(set(hues.values()))==len(hues))
          print('Biopunk in manifest', any('biopunk' in e['href'].lower() for e in g))
          PY

      # THE MIRROR LEG — ruled 2026-08-13, closing the two-shelves divergence.
      # The served /Games/games.json (the Games repository's file, which the
      # arcade fetches at runtime) is the canonical shelf; this repository's
      # data/source-manifests/games.json is a generated mirror of it, written
      # only by tools/render_games_manifest_mirror.py. No local gate can see
      # both repositories, so the byte comparison runs HERE, against the
      # served canonical, on every pull request. The 2026-08-12 launch put two
      # shelf entries in the mirror by hand and the estate ran for a day with
      # two hand-written shelves; the census report carries the account. This
      # leg is what makes that impossible to repeat silently.
      - name: Shelf mirror equals the served canonical, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 https://madebymatt.uk/Games/games.json -o /tmp/canonical.json
          if cmp -s /tmp/canonical.json data/source-manifests/games.json; then
            echo "  PASS mirror is byte-identical to the served canonical ($(wc -c < /tmp/canonical.json) bytes)"
          else
            echo "  FAIL data/source-manifests/games.json is not the served canonical:"
            echo "       mirror    $(wc -c < data/source-manifests/games.json) B $(sha256sum data/source-manifests/games.json | cut -c1-16)"
            echo "       canonical $(wc -c < /tmp/canonical.json) B $(sha256sum /tmp/canonical.json | cut -c1-16)"
            echo "       regenerate with tools/render_games_manifest_mirror.py --write, never by hand"
            exit 1
          fi

      - name: Homepage and arcade, as served
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 "https://madebymatt.uk${FULL_HOME_ROUTE}" -o /tmp/home.html
          echo "== full homepage at ${FULL_HOME_ROUTE} (served bytes, no JS executed) =="
          for n in "Apex Kick" "Apex Pool" "Apex Golf" "Apex Tennis" "New release"; do
            printf '  %-14s %s\n' "$n" "$(grep -oic "$n" /tmp/home.html || true)"
          done
          echo "  apexgolf href occurrences: $(grep -oc 'apexgolf/' /tmp/home.html || true)"
          echo "== New Release occupant, ASSERTED against the committed tree =="
          # This was a grep that printed a snippet and could not fail — it
          # matched the "New releases" eyebrow and reported nothing about the
          # tenant. Derive the occupant from BOTH sides and require agreement.
          # The shelf is fetched here rather than inherited from the census
          # step's /tmp/games.json: a gate that depends on a previous step's
          # leftovers passes for the wrong reason the day that step is moved.
          curl -sS --max-time 30 https://madebymatt.uk/Games/games.json -o /tmp/shelf.json || true
          python3 - <<'PY'
          import re,sys,os,json
          served=open('/tmp/home.html',encoding='utf-8',errors='replace').read()
          repo=open(os.environ['FULL_HOME_FILE'],encoding='utf-8').read()
          s=re.findall(r'data-release="([^"]+)"',served)
          r=re.findall(r'data-release="([^"]+)"',repo)
          print('  served occupant(s):',s)
          print('  repo   occupant(s):',r)
          # RULING — Matt, 5 Aug 2026: "New Release is a stack; each game holds
          # at most ONE box." That ruling is durable and is still asserted below.
          #
          # TENTH INSTANCE, and the second in this same limb. The membership
          # list beside the ruling was a PIN: RULED_OCCUPANTS=['Neon Sync',
          # 'Neon Breach'], frozen 5 Aug. Relicforge's homepage box landed
          # legitimately on 6 Aug (0b6caa9, "Fracture Engine Pass 4: card art,
          # the RPG rail, and the homepage box) and from that commit this gate
          # failed on EVERY branch — 31118184732 onward — while printing
          # served and repo occupants that were byte-identical to each other.
          # The homepage was never wrong; the allowlist was. A pin that has to
          # be hand-edited every time a game ships is not an invariant, it is a
          # scheduled outage.
          #
          # ELEVENTH INSTANCE — and the repair is a different mechanism, ruled
          # 2026-08-13. The derived replacement below compared DISPLAY TITLES:
          # occupant "Rally Vector 3D" against shelf title "Rally Vector 3D —
          # Championship Edition" is honest copy on both sides, and the title
          # match called it a phantom anyway. Display strings are authored per
          # surface; identity is the folder slug. So the check now maps each
          # occupant label to its slug through data/new-release-occupants.json
          # — a declared editorial input, the sixth of its kind — and asks the
          # only real question: is /<slug>/ an href on the served shelf?
          #
          # This is NOT the RULED_OCCUPANTS pin returning: that pin froze
          # MEMBERSHIP (who may occupy), which stays derived from the shelf.
          # The record declares IDENTITY (what a label means), which nothing
          # on the page binds machine-readably. A new box means a new line in
          # the record — a visible decision — and an unmapped occupant fails
          # loudly below, which the self-test proves on demand.
          shelf=[]
          try:
              shelf=json.load(open('/tmp/shelf.json'))['games']
          except Exception as e:
              print('  FAIL served shelf manifest unreadable, cannot derive occupants:',e); sys.exit(1)
          slugs={str(e.get('href','')).strip('/') for e in shelf}
          occupants=json.load(open('data/new-release-occupants.json'))['occupants']
          print('  shelf slugs       :',len(slugs),'derived from the served manifest')
          print('  occupant record   :',occupants)

          # Negative control. The gate must prove it can exit non-zero, so this
          # injects an occupant with no entry in the record.
          if os.environ.get('AGX1_SELFTEST')=='occupant':
              r=r+['Ghost Game That Never Shipped']
              print('  SELF-TEST injecting an unmapped occupant:',r[-1])

          if not slugs:
              print('  FAIL served shelf has no games — an empty shelf would pass vacuously'); sys.exit(1)
          if not r:
              print('  FAIL committed tree carries NO New Release occupant — an empty stack would pass vacuously'); sys.exit(1)
          unmapped=[o for o in r if o not in occupants]
          if unmapped:
              print('  FAIL occupant has no entry in data/new-release-occupants.json (a new box is a visible decision):',unmapped); sys.exit(1)
          offshelf=[o for o in r if occupants[o] not in slugs]
          dupes=sorted({o for o in r if r.count(o)>1})
          if offshelf:
              print('  FAIL occupant maps to a slug that is not on the served shelf:',
                    [f'{o} -> /{occupants[o]}/' for o in offshelf]); sys.exit(1)
          if dupes:
              print('  FAIL a game holds more than one homepage surface:',dupes); sys.exit(1)
          print('  PASS every occupant maps to a live shelf slug; no game holds two boxes')
          if s==r:
              print('  PASS live JS-off full homepage serves',r,'as New Release, matching the tree and the ruling')
          else:
              print('  PENDING live homepage has not caught up with the tree yet.')
              print('  This is a Pages deployment lag, NOT a content mismatch, and is')
              print('  recorded as PENDING rather than reported as a pass or a failure.')
          PY
          echo "== JS-off proof: the occupant is in the SERVED BYTES, no JavaScript executed =="
          echo "  /neonsync/ hrefs in served full homepage: $(grep -oc 'neonsync/' /tmp/home.html || true)"
          echo "  data-release attributes in served full homepage: $(grep -oc 'data-release=' /tmp/home.html || true)"
