name: AGX-1 live verification

# Pass AGX-1 §11.6 / §12.3 C2 — the deployment proof.
#
# The agent container cannot reach the custom domain (the proxy answers 403 on
# CONNECT) and the Pages API is blocked through it too. CI is the channel.
# This workflow is READ-ONLY against production: it fetches, hashes and
# compares. It writes nothing to any surface.
#
# It closes the gap §12.3 C2 names: /apexgolf/ has never been fetched by
# anyone, and Tennis skipped its live check on a container DNS failure.

# Runs on the verification-only pull request, per §11.6's proven pattern
# (Apex Pool's instance: run 30908723551, PR site#42, closed unmerged).
# The PR is opened to carry this run and is then CLOSED UNMERGED by design —
# closed-unmerged is its correct terminal state, not a failure.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'claude/apexgolf-build-2026-08-04-b1hbwj'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  live:
    name: Fetch the live estate and compare to raw-at-SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main (the deployed tree)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Record the SHA and derive the full-home route under test
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "main is $(git rev-parse HEAD)"
          if test -f main/index.html; then
            echo "FULL_HOME_ROUTE=/main/" >> "$GITHUB_ENV"
            echo "FULL_HOME_FILE=main/index.html" >> "$GITHUB_ENV"
            echo "full homepage is /main/"
          else
            echo "FULL_HOME_ROUTE=/" >> "$GITHUB_ENV"
            echo "FULL_HOME_FILE=index.html" >> "$GITHUB_ENV"
            echo "full homepage is legacy root /"
          fi

      - name: GitHub Pages build status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          echo "== Pages =="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("status ",d.get("status")); print("commit ",d.get("commit")); print("updated",d.get("updated_at")); print("error  ",d.get("error"))' \
            || echo "Pages API unavailable to this token — recorded, not faked."

      - name: Custom-domain HTTP status for every surface
        shell: bash
        run: |
          set -o pipefail
          fail=0
          for u in \
            https://madebymatt.uk/neonsync/ \
            https://madebymatt.uk/apexgolf/ \
            https://madebymatt.uk/apextennis/ \
            https://madebymatt.uk/biopunkhive/ \
            https://madebymatt.uk/apexpool/ \
            https://madebymatt.uk/apexkick/ \
            https://madebymatt.uk/ \
            "https://madebymatt.uk${FULL_HOME_ROUTE}" \
            https://madebymatt.uk/games/ \
            https://madebymatt.uk/site.json \
            https://madebymatt.uk/Games/games.json ; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$u" || echo "000")
            printf '%-46s %s\n' "$u" "$code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail

      - name: Live bytes must equal the committed tree, byte for byte
        shell: bash
        run: |
          set -euo pipefail
          echo "game                 live_bytes  repo_bytes  live_sha256                                                       match"
          status=0
          for g in neonsync apexgolf apextennis apexpool apexkick biopunkhive; do
            curl -sS --max-time 60 "https://madebymatt.uk/$g/" -o "/tmp/$g.live"
            lb=$(wc -c < "/tmp/$g.live"); rb=$(wc -c < "$g/index.html")
            ls=$(sha256sum "/tmp/$g.live" | cut -d' ' -f1)
            rs=$(sha256sum "$g/index.html" | cut -d' ' -f1)
            if [ "$ls" = "$rs" ]; then m=IDENTICAL; else m="*** DIFFERS ***"; status=1; fi
            printf '%-20s %10s %11s  %s  %s\n' "$g" "$lb" "$rb" "$ls" "$m"
          done
          echo
          # NINTH INSTANCE, in the live gate itself. This line printed a literal
          # "expected Apex Golf: 64513 bytes, sha256 c0701ee1..." — the PRE-D5
          # deployed figure, wrong the moment the Golf branch merged. The
          # comparison above already DERIVES the repo side; only the caption was
          # frozen. Derive the caption too, so it can never disagree with the
          # thing it captions.
          printf 'Apex Golf in the tree under test: %s bytes, sha256 %s\n' \
            "$(wc -c < apexgolf/index.html)" "$(sha256sum apexgolf/index.html | cut -d' ' -f1)"
          printf 'Neon Sync in the tree under test: %s bytes, sha256 %s\n' \
            "$(wc -c < neonsync/index.html)" "$(sha256sum neonsync/index.html | cut -d' ' -f1)"
          exit $status

      - name: Live site.json door census — the C1 ruling, as served
        shell: bash
        run: |
          set -euo pipefail
          # The surface list above only proves site.json returns 200. That is
          # not a door count. C1 removed Apex Golf's door (14 -> 13, games
          # 8 -> 7) and the ruling is only verified once the SERVED file is
          # counted, so count it and compare it to the committed tree.
          curl -sS --max-time 30 https://madebymatt.uk/site.json -o /tmp/site.live.json
          python3 - <<'PY'
          import json,sys
          live=json.load(open('/tmp/site.live.json'))
          repo=json.load(open('site.json'))
          def census(d):
              doors=d.get('doors',[])
              return (len(doors),
                      sum(1 for x in doors if x.get('zone')=='games'),
                      sum(1 for x in doors if x.get('title')=='Apex Golf'))
          l,r=census(live),census(repo)
          print(f'  served site.json : {l[0]} doors, {l[1]} in games, {l[2]} Apex Golf door(s)')
          print(f'  repo   site.json : {r[0]} doors, {r[1]} in games, {r[2]} Apex Golf door(s)')
          if not l[0]:
              print('  FAIL served site.json has no doors[] — an empty census would pass vacuously'); sys.exit(1)
          if l!=r:
              print('  PENDING served site.json has not caught up with the tree (Pages lag).')
              sys.exit(0)
          if l[2]==0 and l[0]==r[0]:
              print(f'  PASS C1 holds as served: Apex Golf takes NO door, {l[0]} doors, {l[1]} in the games zone')
          else:
              print('  FAIL served door census does not satisfy the C1 ruling'); sys.exit(1)
          PY

      - name: Live manifest and placement census
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 https://madebymatt.uk/Games/games.json -o /tmp/games.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/games.json'))
          g=d['games']
          print('entries            ', len(g))
          print('art                ', sum(1 for e in g if e.get('art')), '/', len(g))
          print('duplicate ids      ', len(g)-len({e['href'] for e in g}))
          sports=[e['title'] for e in g if e.get('collection')=='Sports']
          print('Sports             ', ' · '.join(sports))
          from collections import Counter
          print('Physics (derived)  ', Counter(e['tag'] for e in g)['Physics'])
          print('Sport chip minted  ', any(e['tag']=='Sport' for e in g))
          hues={e['title']:e['hue'] for e in g if e.get('collection')=='Sports'}
          print('Sports hues        ', hues)
          print('hues all distinct  ', len(set(hues.values()))==len(hues))
          print('Biopunk in manifest', any('biopunk' in e['href'].lower() for e in g))
          PY

      - name: Homepage and arcade, as served
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 30 "https://madebymatt.uk${FULL_HOME_ROUTE}" -o /tmp/home.html
          echo "== full homepage at ${FULL_HOME_ROUTE} (served bytes, no JS executed) =="
          for n in "Apex Kick" "Apex Pool" "Apex Golf" "Apex Tennis" "New release"; do
            printf '  %-14s %s\n' "$n" "$(grep -oic "$n" /tmp/home.html || true)"
          done
          echo "  apexgolf href occurrences: $(grep -oc 'apexgolf/' /tmp/home.html || true)"
          echo "== New Release occupant, ASSERTED against the committed tree =="
          # This was a grep that printed a snippet and could not fail — it
          # matched the "New releases" eyebrow and reported nothing about the
          # tenant. Derive the occupant from BOTH sides and require agreement.
          # The shelf is fetched here rather than inherited from the census
          # step's /tmp/games.json: a gate that depends on a previous step's
          # leftovers passes for the wrong reason the day that step is moved.
          curl -sS --max-time 30 https://madebymatt.uk/Games/games.json -o /tmp/shelf.json || true
          python3 - <<'PY'
          import re,sys,os,json
          served=open('/tmp/home.html',encoding='utf-8',errors='replace').read()
          repo=open(os.environ['FULL_HOME_FILE'],encoding='utf-8').read()
          s=re.findall(r'data-release="([^"]+)"',served)
          r=re.findall(r'data-release="([^"]+)"',repo)
          print('  served occupant(s):',s)
          print('  repo   occupant(s):',r)
          # RULING — Matt, 5 Aug 2026: "New Release is a stack; each game holds
          # at most ONE box." That ruling is durable and is still asserted below.
          #
          # TENTH INSTANCE, and the second in this same limb. The membership
          # list beside the ruling was a PIN: RULED_OCCUPANTS=['Neon Sync',
          # 'Neon Breach'], frozen 5 Aug. Relicforge's homepage box landed
          # legitimately on 6 Aug (0b6caa9, "Fracture Engine Pass 4: card art,
          # the RPG rail, and the homepage box) and from that commit this gate
          # failed on EVERY branch — 31118184732 onward — while printing
          # served and repo occupants that were byte-identical to each other.
          # The homepage was never wrong; the allowlist was. A pin that has to
          # be hand-edited every time a game ships is not an invariant, it is a
          # scheduled outage.
          #
          # Derived replacement: an occupant is legitimate iff it NAMES A GAME
          # THAT IS ACTUALLY ON THE SHELF. A typo, a phantom, or a box for a
          # game that never shipped still fails; a game that legitimately
          # launched passes with no edit here. The shelf is the same served
          # manifest the census step above reads, and the NEW· marker prefix is
          # stripped before comparison because the marker rides on the shelf
          # title, not on the homepage box.
          shelf=[]
          try:
              shelf=json.load(open('/tmp/shelf.json'))['games']
          except Exception as e:
              print('  FAIL served shelf manifest unreadable, cannot derive occupants:',e); sys.exit(1)
          strip_marker=lambda t: re.sub(r'^NEW\s*·\s*','',t).strip()
          known={strip_marker(e['title']) for e in shelf}
          print('  shelf titles      :',len(known),'derived from the served manifest')

          # Negative control. The gate must prove it can exit non-zero, so this
          # injects an occupant naming a game that is not on the shelf.
          if os.environ.get('AGX1_SELFTEST')=='occupant':
              r=r+['Ghost Game That Never Shipped']
              print('  SELF-TEST injecting an off-shelf occupant:',r[-1])

          if not known:
              print('  FAIL served shelf has no games — an empty shelf would pass vacuously'); sys.exit(1)
          if not r:
              print('  FAIL committed tree carries NO New Release occupant — an empty stack would pass vacuously'); sys.exit(1)
          unknown=[o for o in r if strip_marker(o) not in known]
          dupes=sorted({o for o in r if r.count(o)>1})
          if unknown:
              print('  FAIL New Release occupant does not name a game on the shelf:',unknown); sys.exit(1)
          if dupes:
              print('  FAIL a game holds more than one homepage surface:',dupes); sys.exit(1)
          print('  PASS every occupant names a live shelf game; no game holds two boxes')
          if s==r:
              print('  PASS live JS-off full homepage serves',r,'as New Release, matching the tree and the ruling')
          else:
              print('  PENDING live homepage has not caught up with the tree yet.')
              print('  This is a Pages deployment lag, NOT a content mismatch, and is')
              print('  recorded as PENDING rather than reported as a pass or a failure.')
          PY
          echo "== JS-off proof: the occupant is in the SERVED BYTES, no JavaScript executed =="
          echo "  /neonsync/ hrefs in served full homepage: $(grep -oc 'neonsync/' /tmp/home.html || true)"
          echo "  data-release attributes in served full homepage: $(grep -oc 'data-release=' /tmp/home.html || true)"
