name: MBM Games audience production completion note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mbm-games-audience-production-comment.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify live routes and discover the production run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          merge_sha=e4bff239c49012f41067c1313dc7a2f943923282
          sentinel=mbm-games-audience-faces-2026-08-08
          routes=(/ /games/ /start/ /for/pupils/ /for/teachers/ /for/parents-carers/ /for/schools-semh/ /for/trusts/ /for/councils-organisations/ /for/partners/ /Lessons/ /Matt-s-Apps-/ /tools/ /resources/)
          for route in "${routes[@]}"; do
            curl -fsS --retry 5 -H 'Cache-Control: no-cache, no-store, max-age=0' "https://madebymatt.uk${route}?mbm=${merge_sha}" -o /tmp/mbm-live.html
            test -s /tmp/mbm-live.html
          done
          for route in /games/ /start/ /for/pupils/ /for/teachers/ /for/parents-carers/ /for/schools-semh/ /for/trusts/ /for/councils-organisations/ /for/partners/; do
            curl -fsS --retry 5 -H 'Cache-Control: no-cache, no-store, max-age=0' "https://madebymatt.uk${route}?mbm=${merge_sha}" -o /tmp/mbm-face.html
            grep -Fq "$sentinel" /tmp/mbm-face.html
          done
          python - <<'PY'
          import json, os, time, urllib.request
          repo='MattRoper1977/mattroper1977.github.io'
          target='e4bff239c49012f41067c1313dc7a2f943923282'
          token=os.environ['GH_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Made-by-Matt-production-note/1'}
          found=None
          for _ in range(80):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=100',headers=headers)
              with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
              runs=[x for x in data.get('workflow_runs',[]) if x.get('name')=='Verify Games and audience faces' and x.get('head_sha')==target]
              if runs:
                  runs.sort(key=lambda x:x.get('created_at',''),reverse=True)
                  run=runs[0]
                  if run.get('status')=='completed':
                      found=run;break
              time.sleep(10)
          if not found:
              raise SystemExit('production workflow did not complete within the evidence window')
          if found.get('conclusion')!='success':
              raise SystemExit(f"production workflow {found['id']} concluded {found.get('conclusion')}")
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs/{found['id']}/jobs?per_page=100",headers=headers)
          with urllib.request.urlopen(req,timeout=45) as r: jobs=json.load(r).get('jobs',[])
          required={'static-contract','browser-matrix','live-proof'}
          states={j.get('name'):j.get('conclusion') for j in jobs}
          missing=required-set(states)
          if missing or any(states.get(name)!='success' for name in required):
              raise SystemExit(f'production jobs not all successful: {states}')
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/runs/{found['id']}/artifacts?per_page=100",headers=headers)
          with urllib.request.urlopen(req,timeout=45) as r: artifacts=json.load(r).get('artifacts',[])
          live=[a for a in artifacts if a.get('name','').startswith('mbm-games-audience-live-') and not a.get('expired')]
          if not live:
              raise SystemExit('successful production run has no retained live artifact')
          summary={'run_id':found['id'],'head_sha':found['head_sha'],'conclusion':found['conclusion'],'jobs':states,'artifact':{k:live[0].get(k) for k in ['id','name','size_in_bytes','digest','expires_at']}}
          open('/tmp/mbm-production-summary.json','w').write(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY

      - name: Record completion on PR 103
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=$(python -c "import json;print(json.load(open('/tmp/mbm-production-summary.json'))['run_id'])")
          head_sha=$(python -c "import json;print(json.load(open('/tmp/mbm-production-summary.json'))['head_sha'])")
          artifact=$(python -c "import json;print(json.load(open('/tmp/mbm-production-summary.json'))['artifact']['name'])")
          digest=$(python -c "import json;print(json.load(open('/tmp/mbm-production-summary.json'))['artifact'].get('digest') or '')")
          gh pr comment 103 --repo "$GITHUB_REPOSITORY" --body "Games + audience production proof completed successfully. Exact served source: \`$head_sha\`. Workflow run: \`$run_id\`. Static contract, eight-width Games/chooser browser matrix and served live-proof jobs all passed. All fourteen primary/audience routes returned successfully; the Games hub, chooser and seven audience faces contained the release sentinel. Retained artifact: \`$artifact\` ($digest). Evidence run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
