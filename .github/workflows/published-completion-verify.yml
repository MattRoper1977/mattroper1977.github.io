name: Published Education completion
on:
  workflow_run:
    workflows: ['Education publication']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-education-completion
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
