name: Published Education completion
on:
  workflow_run:
    workflows: ['Education publication']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-education-completion
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          # Pinned 2026-09-16 to the Lessons commit the education publication publishes from (PLAY-Q1 batch 2, #557), held equal to it.
          # Moved 2026-09-25 (RULING RS1-G3b R1): the Lessons pin b54c9006 -> 7aed39b3e2e6c38fc162a4639aba80deaaa44e23, the squash
          # merge of Lessons #673 -- the commit the four EQUAL pins in domain-split-verify.yml and education-publication.yml hold.
          # At b54c9006 this job failed on every Site publication since at least 2026-09-22 ("BUILD collection lost or duplicated
          # teaching versions"): the stale checkout's expected BUILD collection predates later decks. At this commit it passes
          # against the served bytes, locally and live. HELD EQUAL TO THE FOUR EQUAL PINS from 2026-09-25 (RULING RS1-G3b R1),
          # so the #655 route's EQUAL window discharges this pin with them at every future window. Derived with git rev-parse
          # on the Lessons checkout, never typed.
          # Moved 2026-09-25 (LAND-A2 Science window W2, ruling R6) with the four EQUAL pins, as RULING RS1-G3b R1 holds it: the
          # Lessons pin 7aed39b3 -> c0b9b51f76d26c03f3de13951e85fa38497a509e, the squash merge of Lessons #677. Derived with git rev-parse on
          # the Lessons checkout, never typed.
          # Moved 2026-09-26 (DLG-1 window W2, LAND-A2 R11) with the four EQUAL pins, as RULING RS1-G3b R1 holds it: the
          # Lessons pin c0b9b51f -> 5c9e02a8309ca81ffd83b609068d525b7bf57fd1, the squash merge of Lessons #679. Derived with git rev-parse on
          # the Lessons checkout, never typed.
          # Moved 2026-10-04 (Science Week 8 window W2, ruling ex) with the four EQUAL pins, as RULING RS1-G3b R1 holds it: the
          # Lessons pin 5c9e02a8 -> 966204729232da46683e4687439f8be618b4bdb6, the squash merge of Lessons #683. Derived with git rev-parse on
          # the Lessons checkout, never typed.
          # Moved 2026-10-05 (RE Week 8 window W2, rulings fm-6 and fp-3) with the four EQUAL pins, as RULING RS1-G3b R1 holds it: the
          # Lessons pin 96620472 -> 32cf241dc6ecf75ef01129815bc9cf8b3e77ba57, the squash merge of Lessons #685. Derived with git rev-parse on
          # the Lessons checkout, never typed.
          # Moved 2026-10-08 (Names fix window W2, rulings fv-2 and fm-6) with the four EQUAL pins, as RULING RS1-G3b R1 holds it: the
          # Lessons pin 32cf241d -> 033a33db52cf03451a44a4d884a4dd7eb9371004, the squash merge of Lessons #688. Derived with git rev-parse on
          # the Lessons checkout, never typed.
          # Moved 2026-10-09 (Names fix PR 9 window W2, rulings lv, lw, md and mf) with the four EQUAL pins, as RULING RS1-G3b R1 holds it: the
          # Lessons pin 033a33db -> 747452c89077a6be2aaa07c3e16041e1fcb27038, the squash merge of Lessons #690. Derived with git rev-parse on
          # the Lessons checkout, never typed.
          # Moved 2026-10-10 (jw-1 subject hub window W2, rulings mh-7 and ok-4) with the four EQUAL pins, as RULING RS1-G3b R1 holds it: the
          # Lessons pin 747452c8 -> ed55c3be55263e3163f0a3e63bb4276e0970d08f, the squash merge of Lessons #693. Derived with git rev-parse on
          # the Lessons checkout, never typed.
          ref: ed55c3be55263e3163f0a3e63bb4276e0970d08f
          path: .sources/Lessons
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the established browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify published phone and desktop journeys and downloads
        env:
          MBM_EDUCATION_ORIGIN: https://madebymatt.uk
          MBM_COMPLETION_LESSONS: .sources/Lessons
          MBM_REQUIRE_TEACHING_PACKS: 'true'
        run: |
          # Companion repositories publish independently. Record each attempt
          # while their already-reviewed Pages deployments finish.
          for attempt in $(seq 1 8); do
            export MBM_COMPLETION_OUTPUT="audit-output/published-completion/attempt-$attempt"
            if node domain-split/check_completion.cjs && node domain-split/check_device_stats.cjs; then exit 0; fi
            if [ "$attempt" -lt 8 ]; then sleep 30; fi
          done
          exit 1
      - name: Preserve published screenshots and exact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-education-completion-${{ github.run_id }}
          path: audit-output/published-completion/
          if-no-files-found: error
          retention-days: 30
