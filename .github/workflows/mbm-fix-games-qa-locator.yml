name: Fix Games QA chip locator

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/mbm-fix-games-qa-locator.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mbm-fix-games-qa-locator
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/mbm-games-audience-faces-2026-08-08
          fetch-depth: 0

      - name: Correct multi-match touch-target measurement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/verify_games_audience_faces.mjs')
          text=path.read_text(encoding='utf-8')
          old="page.locator(selector).evaluate(el=>"
          new="page.locator(selector).first().evaluate(el=>"
          if text.count(old)!=1:
              raise SystemExit(f'expected one sizeOf locator anchor, found {text.count(old)}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          node --check tools/verify_games_audience_faces.mjs
          grep -Fq 'page.locator(selector).first().evaluate' tools/verify_games_audience_faces.mjs
          git diff --check

      - name: Commit only the verifier correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Made by Matt Games release'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/verify_games_audience_faces.mjs
          git diff --cached --check
          git commit -m 'test: measure the first matching Games control'
          git push origin HEAD:codex/mbm-games-audience-faces-2026-08-08
