name: Repair full-estate audit instrumentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-full-estate-instrumentation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-repair-upgrade-2026-08-07
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch scanner and runtime watchdog at their root causes
        run: |
          python - <<'PY'
          from pathlib import Path

          scanner_path = Path('tools/full_estate_audit.py')
          scanner = scanner_path.read_text(encoding='utf-8')

          replacements = []
          replacements.append((
              "import os\nimport re\n",
              "import os\nimport posixpath\nimport re\n",
          ))

          old = '''    def _check_javascript_syntax(self) -> None:
        for repo, state in self.repos.items():
'''
          helpers = '''    @staticmethod
    def _should_scan_dynamic_references(rel: str) -> bool:
        lower = rel.lower()
        parts = set(PurePosixPath(lower).parts)
        name = PurePosixPath(lower).name
        if "vendor" in parts or lower.startswith("_pass"):
            return False
        if name.endswith((".min.js", ".wasm.js")):
            return False
        if lower == "tools/full_estate_runtime.mjs" or lower.startswith("tools/verify_") or lower.startswith("tools/film/"):
            return False
        return True

    @staticmethod
    def _strip_js_comments(text: str) -> str:
        """Mask JS comments while preserving strings and line positions.

        The dynamic-reference scan is deliberately conservative. Documentation
        examples such as ``<script src=...>`` and regex literals must not become
        imaginary files, while quoted URLs in executable code remain visible.
        """
        out: list[str] = []
        i = 0
        state = "code"
        quote = ""
        while i < len(text):
            char = text[i]
            nxt = text[i + 1] if i + 1 < len(text) else ""
            if state == "code":
                if char in {"'", '"', "`"}:
                    state = "string"
                    quote = char
                    out.append(char)
                elif char == "/" and nxt == "/":
                    out.extend((" ", " "))
                    i += 2
                    state = "line-comment"
                    continue
                elif char == "/" and nxt == "*":
                    out.extend((" ", " "))
                    i += 2
                    state = "block-comment"
                    continue
                else:
                    out.append(char)
            elif state == "string":
                out.append(char)
                if char == "\\\\" and i + 1 < len(text):
                    out.append(text[i + 1])
                    i += 2
                    continue
                if char == quote:
                    state = "code"
            elif state == "line-comment":
                if char in "\\r\\n":
                    out.append(char)
                    state = "code"
                else:
                    out.append(" ")
            else:
                if char == "*" and nxt == "/":
                    out.extend((" ", " "))
                    i += 2
                    state = "code"
                    continue
                out.append("\\n" if char == "\\n" else " ")
            i += 1
        return "".join(out)

    def _check_javascript_syntax(self) -> None:
        for repo, state in self.repos.items():
'''
          replacements.append((old, helpers))

          replacements.append((
              '''                text = self._read_text(repo, p)
                if text:
                    for match in list(STATIC_JS_REF_RE.finditer(text)) + list(ASSIGN_JS_REF_RE.finditer(text)):
                        raw = match.group(2).strip()
                        if self._looks_reference(raw):
                            self._check_reference(repo, rel, raw, "script", "dynamic")
''',
              '''                text = self._read_text(repo, p)
                if text and self._should_scan_dynamic_references(rel):
                    scan_text = self._strip_js_comments(text)
                    for match in list(STATIC_JS_REF_RE.finditer(scan_text)) + list(ASSIGN_JS_REF_RE.finditer(scan_text)):
                        raw = match.group(2).strip()
                        if self._looks_reference(raw):
                            self._check_reference(repo, rel, raw, "script", "dynamic")
''',
          ))

          replacements.append((
              '''    @staticmethod
    def _looks_reference(raw: str) -> bool:
        return bool(raw) and not raw.startswith(("${", "{{", "<%")) and not re.search(r"[{}]", raw)
''',
              '''    @staticmethod
    def _looks_reference(raw: str) -> bool:
        raw = raw.strip()
        if not raw or raw.startswith(("${", "{{", "<%")) or re.search(r"[{}]", raw):
            return False
        if raw.upper() in {"GET", "HEAD", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "CONNECT", "TRACE"}:
            return False
        if raw.startswith(("/dev/std", "\\\\/", "(?:", "([^")) or "\\\\." in raw:
            return False
        if raw.startswith(("/", "./", "../", "//", "#")):
            return True
        try:
            if urllib.parse.urlsplit(raw).scheme:
                return True
        except ValueError:
            return False
        return bool(re.search(
            r"\\.(?:html?|js|mjs|cjs|css|json|webmanifest|svg|png|jpe?g|gif|webp|avif|mp3|wav|ogg|mp4|webm|wasm|pdf)(?:[?#].*)?$",
            raw,
            re.I,
        ))
''',
          ))

          replacements.append((
              '''        if not path:
            return (source_repo, source_rel, fragment, "same-document")
        base = PurePosixPath(source_rel).parent
        rel = (base / path).as_posix()
        return (source_repo, rel, fragment, "relative")
''',
              '''        if not path:
            return (source_repo, source_rel, fragment, "same-document")
        mount_prefix = {
            "site": "",
            "Lessons": "Lessons",
            "Games": "Games",
            "Apps": "Matt-s-Apps-",
        }.get(source_repo, "")
        served_source = "/" + "/".join(part for part in (mount_prefix, source_rel) if part)
        served_target = posixpath.normpath(posixpath.join(posixpath.dirname(served_source), path))
        if not served_target.startswith("/"):
            served_target = "/" + served_target
        return self._map_site_path(served_target, fragment, "relative")
''',
          ))

          for old_text, new_text in replacements:
              count = scanner.count(old_text)
              if count != 1:
                  raise SystemExit(f'scanner patch expected one match, found {count}: {old_text[:100]!r}')
              scanner = scanner.replace(old_text, new_text)
          scanner_path.write_text(scanner, encoding='utf-8')

          runtime_path = Path('tools/full_estate_runtime.mjs')
          runtime = runtime_path.read_text(encoding='utf-8')
          old_runtime = '''  const result = await Promise.race([body, timeout]);
  clearTimeout(timer);
  // A timed-out body may reject after its browser context is force-closed.
  body.catch(() => {});
  return result;
'''
          new_runtime = '''  const result = await Promise.race([body, timeout]);
  clearTimeout(timer);
  // A timed-out body may reject after its browser context is force-closed.
  body.catch(() => {});
  if (lifecycle.timedOut && !result.issues.some(issue => issue.code === 'TARGET_TIMEOUT')) {
    const reason = `target exceeded ${timeoutMs}ms watchdog`;
    result.loaded = false;
    result.issues = [
      ...result.issues.filter(issue => !(issue.code === 'NAVIGATION_FAILED' && issue.message.includes(reason))),
      { severity: 'P0', code: 'TARGET_TIMEOUT', stage: 'harness', message: reason },
    ];
  }
  return result;
'''
          if runtime.count(old_runtime) != 1:
              raise SystemExit(f'runtime patch expected one match, found {runtime.count(old_runtime)}')
          runtime_path.write_text(runtime.replace(old_runtime, new_runtime), encoding='utf-8')
          PY

      - name: Prove syntax, positive control and false-positive regressions
        run: |
          python -m py_compile tools/full_estate_audit.py
          node --check tools/full_estate_runtime.mjs
          python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 html5lib==1.1
          python tools/full_estate_audit.py --self-test
          python - <<'PY'
          import importlib.util
          import tempfile
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('audit', 'tools/full_estate_audit.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              lessons = root / 'Lessons'
              site = root / 'site'
              lessons.mkdir()
              site.mkdir()
              (lessons / 'index.html').write_text('<!doctype html><title>Lessons</title>', encoding='utf-8')
              (site / 'index.html').write_text('<!doctype html><title>Site</title>', encoding='utf-8')
              audit = module.Audit(lessons, site)
              assert audit._map_reference('site', 'tools/index.html', '../Lessons/')[:2] == ('Lessons', '')
              assert audit._map_reference('Lessons', 'primary/index.html', '../../index.html')[:2] == ('site', 'index.html')
              stripped = audit._strip_js_comments("/* fetch('/comment-only.js') */ fetch('/real.js')")
              assert '/comment-only.js' not in stripped and '/real.js' in stripped
              for value in ('GET', 'HEAD', r'https:\/\/madebymatt\.uk\/game\/', r'([^'):
                  assert not audit._looks_reference(value), value
              assert audit._looks_reference('./worker.min.js')
          print('REGRESSION PASSED — relative mounts, comment masking and regex/method rejection are correct')
          PY
          git diff --check

      - name: Commit instrumentation repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/full_estate_audit.py tools/full_estate_runtime.mjs
          git commit -m 'test: repair audit path and timeout classification'
          git push origin HEAD:codex/full-repair-upgrade-2026-08-07
