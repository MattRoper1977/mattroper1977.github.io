name: Materialize Apex Golf

on:
  push:
    branches:
      - codex/apexgolf-build
    paths:
      - '.github/apexgolf-payload/**'
      - '.github/workflows/apexgolf-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode checked payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/apexgolf-payload/p* | base64 --decode > /tmp/apexgolf-final.tgz
          echo "aa3feedf9608d5a9ea592b931dfc1dd1bfc5ae51a3fdf691a9a27af2fbea62e2  /tmp/apexgolf-final.tgz" | sha256sum -c -
          tar -xzf /tmp/apexgolf-final.tgz
          rm -rf .github/apexgolf-payload
          rm -f .github/workflows/apexgolf-materialize.yml

      - name: Commit materialized build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build Apex Golf"
          git push
