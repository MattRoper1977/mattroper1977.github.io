name: Fix Apex Golf rendered contract extraction

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apexgolf-contract-extract-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Select the rendered contract node rather than its source-code literal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/verify_apexgolf.js')
          source = path.read_text()
          old = (
              '      const match = dom.match(/<pre id="ag-contract-results">([\\s\\S]*?)<\\/pre>/i);\n'
              '      assert(match, `${c.name}: browser contract did not return results; DOM tail ${dom.slice(-800)}`);\n'
              '      const data = JSON.parse(decodeHtmlText(match[1]));'
          )
          new = (
              '      const openTag = \'<pre id="ag-contract-results">\';\n'
              '      const start = dom.lastIndexOf(openTag);\n'
              '      const end = start >= 0 ? dom.indexOf(\'</pre>\', start + openTag.length) : -1;\n'
              '      assert(start >= 0 && end > start, `${c.name}: browser contract did not return results; DOM tail ${dom.slice(-800)}`);\n'
              '      const payload = decodeHtmlText(dom.slice(start + openTag.length, end));\n'
              '      assert(payload.trim().startsWith(\'{\'), `${c.name}: final contract node did not contain JSON; payload ${payload.slice(0, 160)}`);\n'
              '      const data = JSON.parse(payload);'
          )
          if source.count(old) != 1:
              raise SystemExit(f'rendered contract extraction anchor count was {source.count(old)}')
          source = source.replace(old, new)
          old_nojs = '      noContract: !/ag-contract-results/.test(noJsDom)'
          new_nojs = '      noContract: !/<pre id="ag-contract-results">\\s*\\{/.test(noJsDom)'
          if source.count(old_nojs) != 1:
              raise SystemExit(f'no-JS contract anchor count was {source.count(old_nojs)}')
          source = source.replace(old_nojs, new_nojs)
          path.write_text(source)
          PY
          node --check tools/verify_apexgolf.js
          node tools/verify_apexgolf.js --no-browser
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/verify_apexgolf.js
          git commit -m "fix: read the rendered Apex Golf contract node"
          git push origin "HEAD:${{ github.head_ref }}"
