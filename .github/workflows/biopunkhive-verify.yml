name: Biopunk Hive containment contract

on:
  pull_request:
    paths:
      - 'biopunkhive/**'
      - 'assets/cards/biopunk-hive.svg'
      - 'docs/biopunkhive-verification.md'
      - 'tools/verify_biopunkhive.js'
      - 'tools/verify_biopunkhive_browser.js'
      - 'tools/biopunkhive_index.html.gz.b64'
      - 'tools/biopunkhive.sha256'
      - '.github/workflows/biopunkhive-verify.yml'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biopunkhive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record measured identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/biopunkhive
          {
            node --version
            wc -c biopunkhive/index.html
            sha256sum biopunkhive/index.html
            printf 'sentinels='; grep -o 'biopunkhive-build-2026-08-04' biopunkhive/index.html | wc -l
          } | tee artifacts/biopunkhive/identity.txt

      - name: Reconstruct and hash-verify delivered file
        shell: bash
        run: |
          set -euo pipefail
          base64 -d tools/biopunkhive_index.html.gz.b64 | gzip -dc > /tmp/biopunkhive-index.html
          cmp -s /tmp/biopunkhive-index.html biopunkhive/index.html
          sha256sum -c tools/biopunkhive.sha256

      - name: Run deterministic contract
        shell: bash
        run: |
          set -o pipefail
          node tools/verify_biopunkhive.js | tee artifacts/biopunkhive/static-contract.log
          node tools/verify_biopunkhive.js --self-test | tee artifacts/biopunkhive/nonvacuity.log

      - name: Install pinned Chromium harness
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve repository with bounded readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/biopunkhive/server.log 2>&1 &
          echo $! > artifacts/biopunkhive/server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/biopunkhive/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/biopunkhive/server.log
          exit 1

      - name: Run Chromium systems contract
        shell: bash
        env:
          BIOPUNKHIVE_BASE_URL: http://127.0.0.1:4173
          BIOPUNKHIVE_ARTIFACT_DIR: artifacts/biopunkhive
        run: |
          set -o pipefail
          node tools/verify_biopunkhive_browser.js | tee artifacts/biopunkhive/browser-contract.log

      - name: Verify sitemap entry exactly once
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '<loc>https://madebymatt.uk/biopunkhive/</loc>' sitemap.xml)" -eq 1

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biopunkhive-evidence-${{ github.run_id }}
          path: artifacts/biopunkhive/
          if-no-files-found: error
          retention-days: 30
