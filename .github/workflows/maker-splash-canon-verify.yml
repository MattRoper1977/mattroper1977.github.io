name: Maker splash canon and application

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'data/hud-coverage.json'
      - 'data/mbm-search-index.json'
      - 'tools/render_maker_splash.py'
      - 'tools/verify_maker_splash.mjs'
      - '.github/workflows/maker-splash-canon-verify.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'data/hud-coverage.json'
      - 'data/mbm-search-index.json'
      - 'tools/render_maker_splash.py'
      - 'tools/verify_maker_splash.mjs'
      - '.github/workflows/maker-splash-canon-verify.yml'
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: read

concurrency:
  group: maker-splash-${{ github.event_name }}-${{ github.event.deployment.id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  serial-proof:
    name: Generator controls, SS1–SS8, and Site routes
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install the measured browser engine
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Syntax, declarations, clean check, idempotence, and positive control
        run: |
          set -euo pipefail
          mkdir -p artifacts/maker-splash
          python3 -m py_compile tools/render_maker_splash.py
          node --check tools/verify_maker_splash.mjs
          python3 -m json.tool data/hud-coverage.json >/dev/null
          python3 tools/render_maker_splash.py --root . --check | tee artifacts/maker-splash/generator-check.log
          before=$(git status --porcelain)
          python3 tools/render_maker_splash.py --root . --write >/dev/null
          python3 tools/render_maker_splash.py --root . --write >/dev/null
          after=$(git status --porcelain)
          test "$before" = "$after"
          control=$(mktemp -d)
          mkdir -p "$control/tools" "$control/data" "$control/townlife" "$control/apexpool"
          cp tools/render_maker_splash.py "$control/tools/"
          cp data/hud-coverage.json "$control/data/"
          cp townlife/index.html "$control/townlife/"
          cp apexpool/index.html "$control/apexpool/"
          python3 - "$control/data/hud-coverage.json" <<'PY'
          import json,sys
          p=sys.argv[1]; d=json.load(open(p)); d['makerSplash']={
            '_what':'temporary real-route removal and non-invention controls',
            'applied':[{'route':'/townlife/'}],
            'declined-with-reason':[],
            'variant-retained-with-reason':[{'route':'/apexpool/','reason':'non-invention byte control'}]}
          open(p,'w').write(json.dumps(d,indent=1)+'\n')
          PY
          before_variant=$(sha256sum "$control/apexpool/index.html" | cut -d' ' -f1)
          python3 "$control/tools/render_maker_splash.py" --root "$control" --write >/dev/null
          after_variant=$(sha256sum "$control/apexpool/index.html" | cut -d' ' -f1)
          test "$before_variant" = "$after_variant"
          python3 - "$control/townlife/index.html" <<'PY'
          import re,sys
          p=sys.argv[1]; s=open(p).read(); b='<!-- MBM-MAKER-SPLASH:BEGIN generated by tools/render_maker_splash.py, do not edit by hand -->'; e='<!-- MBM-MAKER-SPLASH:END -->'
          s,n=re.subn(r'(?:\r?\n)?'+re.escape(b)+r'.*?'+re.escape(e)+r'(?:\r?\n)?','',s,count=1,flags=re.S); assert n==1; open(p,'w').write(s)
          PY
          if python3 "$control/tools/render_maker_splash.py" --root "$control" --check > artifacts/maker-splash/generator-positive.log 2>&1; then
            echo 'positive removal control unexpectedly passed'; exit 1
          fi
          grep -F 'missing   /townlife/' artifacts/maker-splash/generator-positive.log

      - name: Known-state SS1–SS8 and dismissal controls on real Site routes
        run: |
          set -o pipefail
          node tools/verify_maker_splash.mjs \
            --mode=controls --scope=site \
            --site-root="$GITHUB_WORKSPACE" \
            --report=artifacts/maker-splash/controls.json | tee artifacts/maker-splash/controls.log

      - name: Every applied Site route behaves at both viewports
        run: |
          set -o pipefail
          node tools/verify_maker_splash.mjs \
            --mode=verify --scope=site \
            --site-root="$GITHUB_WORKSPACE" \
            --report=artifacts/maker-splash/routes.json | tee artifacts/maker-splash/routes.log

      - name: Pull-request origin-adapter control
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/maker-origin.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/townlife/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:8765/townlife/ >/dev/null
          node tools/verify_maker_splash.mjs \
            --mode=verify --scope=site \
            --origin=http://127.0.0.1:8765 \
            --site-root="$GITHUB_WORKSPACE" \
            --report=artifacts/maker-splash/origin-adapter.json \
            | tee artifacts/maker-splash/origin-adapter.log

      - name: Exact deployment provenance
        if: github.event_name == 'deployment_status'
        run: |
          set -euo pipefail
          python3 tools/verify_deployment_provenance.py \
            --expected-sha "${{ github.event.deployment.sha }}" \
            | tee artifacts/maker-splash/deployment-provenance.log

      - name: Every live generated region equals the deployed commit
        if: github.event_name == 'deployment_status'
        env:
          EXPECTED_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee artifacts/maker-splash/live-regions.log
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.request

          root = pathlib.Path('.')
          begin = '<!-- MBM-MAKER-SPLASH:BEGIN generated by tools/render_maker_splash.py, do not edit by hand -->'
          end = '<!-- MBM-MAKER-SPLASH:END -->'
          region_re = re.compile(re.escape(begin).encode() + rb'[\s\S]*?' + re.escape(end).encode())
          ledger = json.loads((root / 'data/hud-coverage.json').read_text(encoding='utf-8'))
          declared = ledger['makerSplash']['applied']
          routes = [item if isinstance(item, str) else item['route'] for item in declared]
          evidence = []
          for route in routes:
              relative = route.strip('/')
              local_path = root / relative / 'index.html' if route.endswith('/') else root / relative
              committed = local_path.read_bytes()
              committed_regions = region_re.findall(committed)
              assert len(committed_regions) == 1, f'{route}: committed region count {len(committed_regions)}'
              request = urllib.request.Request(
                  f'https://madebymatt.uk{route}?mbm={os.environ["EXPECTED_SHA"]}',
                  headers={'Cache-Control': 'no-cache', 'User-Agent': 'maker-splash-live-proof'},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  served = response.read()
                  served_regions = region_re.findall(served)
                  row = {
                      'route': route,
                      'finalUrl': response.geturl(),
                      'status': response.status,
                      'contentType': response.headers.get('Content-Type', 'MISSING'),
                      'cacheControl': response.headers.get('Cache-Control', 'MISSING'),
                      'etag': response.headers.get('ETag', 'MISSING'),
                      'lastModified': response.headers.get('Last-Modified', 'MISSING'),
                      'servedBytes': len(served),
                      'servedRegionSha256': hashlib.sha256(served_regions[0]).hexdigest() if len(served_regions) == 1 else None,
                      'committedRegionSha256': hashlib.sha256(committed_regions[0]).hexdigest(),
                  }
              assert row['status'] == 200, f'{route}: status {row["status"]}'
              assert row['contentType'].lower().startswith('text/html'), f'{route}: content type {row["contentType"]}'
              assert len(served_regions) == 1, f'{route}: served region count {len(served_regions)}'
              assert served_regions[0] == committed_regions[0], f'{route}: generated region differs from committed bytes'
              evidence.append(row)
              print(json.dumps(row, sort_keys=True))
          report = {'expectedSha': os.environ['EXPECTED_SHA'], 'routes': evidence}
          pathlib.Path('artifacts/maker-splash/live-regions.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(f'LIVE REGIONS GREEN — {len(evidence)}/{len(routes)} served generated regions equal committed bytes')
          PY

      - name: Live Town Life SS1–SS8, cross-route controls, and every applied route
        if: github.event_name == 'deployment_status'
        run: |
          set -o pipefail
          node tools/verify_maker_splash.mjs \
            --mode=controls --scope=site \
            --site-route=/townlife/ --second-route=/echovault/ \
            --origin=https://madebymatt.uk \
            --site-root="$GITHUB_WORKSPACE" \
            --report=artifacts/maker-splash/live-controls.json \
            | tee artifacts/maker-splash/live-controls.log
          node tools/verify_maker_splash.mjs \
            --mode=verify --scope=site \
            --origin=https://madebymatt.uk \
            --site-root="$GITHUB_WORKSPACE" \
            --report=artifacts/maker-splash/live-routes.json \
            | tee artifacts/maker-splash/live-routes.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maker-splash-application-${{ github.run_id }}
          path: artifacts/maker-splash/
          if-no-files-found: error
          retention-days: 30
