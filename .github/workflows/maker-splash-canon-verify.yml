name: Maker splash canon and census

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'data/hud-coverage.json'
      - 'data/mbm-search-index.json'
      - 'tools/render_maker_splash.py'
      - 'tools/verify_maker_splash.mjs'
      - '.github/workflows/maker-splash-canon-verify.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'data/hud-coverage.json'
      - 'data/mbm-search-index.json'
      - 'tools/render_maker_splash.py'
      - 'tools/verify_maker_splash.mjs'
      - '.github/workflows/maker-splash-canon-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maker-splash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  serial-proof:
    name: Generator controls, SS1–SS8, and route census
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Check out the current Lessons estate
        uses: actions/checkout@v4
        with:
          repository: MattRoper1977/Lessons
          ref: main
          path: _lessons
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install the measured browser engine
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Syntax and byte-identical mirror preconditions
        run: |
          set -euo pipefail
          mkdir -p artifacts/maker-splash
          python3 -m py_compile tools/render_maker_splash.py
          node --check tools/verify_maker_splash.mjs
          python3 -m json.tool data/hud-coverage.json >/dev/null
          python3 -m json.tool _lessons/data/hud-coverage.json >/dev/null

      - name: Generator positive, negative, idempotence and non-invention controls
        run: |
          set -euo pipefail
          control=$(mktemp -d)
          mkdir -p "$control/site/tools" "$control/site/data" "$control/site/townlife" "$control/site/apexgolf"
          mkdir -p "$control/lessons/tools" "$control/lessons/data" "$control/lessons/Assembly/Behaviour Focus"
          cp tools/render_maker_splash.py "$control/site/tools/"
          cp tools/render_maker_splash.py "$control/lessons/tools/"
          cp data/hud-coverage.json "$control/site/data/"
          cp townlife/index.html "$control/site/townlife/"
          cp apexgolf/index.html "$control/site/apexgolf/"
          cp _lessons/data/hud-coverage.json "$control/lessons/data/"
          cp "_lessons/Assembly/Behaviour Focus/resilience_assembly.html" "$control/lessons/Assembly/Behaviour Focus/"
          python3 - "$control/lessons/data/hud-coverage.json" <<'PY'
          import json,sys
          p=sys.argv[1];d=json.load(open(p))
          d['makerSplash']={
            '_what':'temporary cross-repository control target',
            'applied':[{'route':'/Lessons/Assembly/Behaviour Focus/resilience_assembly.html'}],
            'declined-with-reason':[],
            'variant-retained-with-reason':[]}
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          python3 - "$control/site/data/hud-coverage.json" <<'PY'
          import json,sys
          p=sys.argv[1];d=json.load(open(p))
          d['makerSplash']['variant-retained-with-reason']=[{'route':'/apexgolf/','reason':'non-invention control'}]
          open(p,'w').write(json.dumps(d,indent=2)+'\n')
          PY
          before=$(sha256sum "$control/site/apexgolf/index.html" | cut -d' ' -f1)
          python3 "$control/site/tools/render_maker_splash.py" --root "$control/site" --write | tee artifacts/maker-splash/generator-site-write.log
          python3 "$control/lessons/tools/render_maker_splash.py" --root "$control/lessons" --write | tee artifacts/maker-splash/generator-lessons-write.log
          after=$(sha256sum "$control/site/apexgolf/index.html" | cut -d' ' -f1)
          test "$before" = "$after"
          python3 "$control/site/tools/render_maker_splash.py" --root "$control/site" --check | tee artifacts/maker-splash/generator-negative.log
          tree1=$(find "$control" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          python3 "$control/site/tools/render_maker_splash.py" --root "$control/site" --write >/dev/null
          python3 "$control/lessons/tools/render_maker_splash.py" --root "$control/lessons" --write >/dev/null
          tree2=$(find "$control" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          test "$tree1" = "$tree2"
          python3 - "$control/site/townlife/index.html" <<'PY'
          import re,sys
          p=sys.argv[1];s=open(p).read();b='<!-- MBM-MAKER-SPLASH:BEGIN generated by tools/render_maker_splash.py, do not edit by hand -->';e='<!-- MBM-MAKER-SPLASH:END -->'
          s,n=re.subn(r'(?:\r?\n)?'+re.escape(b)+r'.*?'+re.escape(e)+r'(?:\r?\n)?','\n',s,count=1,flags=re.S);assert n==1;open(p,'w').write(s)
          PY
          if python3 "$control/site/tools/render_maker_splash.py" --root "$control/site" --check > artifacts/maker-splash/generator-positive.log 2>&1; then
            echo 'positive control unexpectedly passed'; exit 1
          fi
          grep -F 'missing   /townlife/' artifacts/maker-splash/generator-positive.log
          echo "$control" > artifacts/maker-splash/control-root.txt
          echo "CONTROL=$control" >> "$GITHUB_ENV"

      - name: SS1–SS8 and dismissal controls on real HTTP origins
        run: |
          set -o pipefail
          node tools/verify_maker_splash.mjs \
            --mode=controls \
            --site-root="$CONTROL/site" \
            --lessons-root="$CONTROL/lessons" \
            --report=artifacts/maker-splash/controls.json | tee artifacts/maker-splash/controls.log

      - name: Upload control evidence before the census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maker-splash-controls-${{ github.run_id }}
          path: artifacts/maker-splash/
          if-no-files-found: error
          retention-days: 30

      - name: Pre-application browser census
        if: ${{ success() }}
        run: |
          set -o pipefail
          node tools/verify_maker_splash.mjs \
            --mode=census \
            --site-root="$GITHUB_WORKSPACE" \
            --lessons-root="$GITHUB_WORKSPACE/_lessons" \
            --report=artifacts/maker-splash/census.json | tee artifacts/maker-splash/census.log

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maker-splash-canon-${{ github.run_id }}
          path: artifacts/maker-splash/
          if-no-files-found: error
          retention-days: 30
