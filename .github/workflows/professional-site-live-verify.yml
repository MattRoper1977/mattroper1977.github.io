name: Professional site live verification

# This is a served-production parity gate. Running it on pull_request is
# self-contradictory whenever a PR changes a served file: the workflow checks
# out the proposed PR source but compares it with madebymatt.uk, which still
# serves main until the PR is merged. PRs are covered by the professional-site
# design/static audit; this workflow proves production after main changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-site-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact source under verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate verifier syntax
        run: python -m py_compile tools/verify_professional_site_live.py

      # READINESS COMES FROM ONE PLACE NOW.
      #
      # This workflow used to establish readiness with its own signal - page
      # markers plus the sha256 of mbm-platform.css/js - which moves only when
      # those two assets move. On 9 August it retried 36 times against a
      # deployment it could not have detected. Same mistake as the route matrix,
      # and as a stamp-based provenance check: a readiness signal chosen from
      # what was convenient rather than from what changes.
      #
      # It consumes the provenance tool rather than keeping a third signal. That
      # tool picks its witness per deployment from the files that actually
      # changed, and reports INCONCLUSIVE where none did. By the time the step
      # below runs, the origin is known to be serving this commit, and its own
      # retry is a safety net rather than the thing establishing readiness.
      - name: The origin is serving this commit, before anything is asserted about it
        run: |
          set -euo pipefail
          python3 tools/verify_deployment_provenance.py --expected-sha "${{ github.sha }}"

      - name: Prove the served platform and cross-repository feeds
        run: |
          set -euo pipefail
          python tools/verify_professional_site_live.py \
            --base https://madebymatt.uk/ \
            --publication education \
            --attempts 36 \
            --delay 10 \
            --timeout 20 \
            --json-out live-output/production.json

      - name: Prove the verifier rejects a broken fixture
        run: |
          set -euo pipefail
          if python tools/verify_professional_site_live.py \
            --base https://madebymatt.uk/ \
            --publication education \
            --attempts 1 \
            --delay 0 \
            --timeout 20 \
            --expect-home-marker __MBM_DELIBERATE_MISSING_MARKER__ \
            --json-out live-output/positive-control.json; then
            echo "Positive control failed: impossible marker was accepted."
            exit 1
          fi
          python -c "import json; d=json.load(open('live-output/positive-control.json')); assert not d['passed']; assert any('__MBM_DELIBERATE_MISSING_MARKER__' in e for e in d['errors']); print('Positive control: PASS — broken marker was rejected.')"

      - name: Upload production proof
        uses: actions/upload-artifact@v4
        with:
          name: professional-site-live-${{ github.run_id }}
          path: live-output/
          if-no-files-found: error
          retention-days: 14
