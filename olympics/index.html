<!-- Head furniture, matching what the estate's other published games already
     do (fracture, neonturf, luminahaven, auroralinks): canonical, the og block,
     and a large summary card.

     THE REAL-ASSET RULE. og:image points at olympics/banner.png, and that file
     is rendered from the game itself by tools/render_olympics_stills.mjs on a
     deterministic virtual clock — it lands in the same commit as this tag. A
     head that advertises an image which is not on disk is a head that lies to
     every crawler and every share preview, and it lies silently.

     Every string below is the game's own: the title is its <title>, and the
     og:description is drawn from its meta description rather than written
     fresh for the share card. -->

   there are ZERO @keyframes and exactly two `transition:` declarations, while
   every piece of real movement — the crowd shimmer, the particle bursts, the
   ceremony confetti, the ambient runners and the rotating rings — is drawn on
   the canvas, where no CSS rule can reach it. Reduced motion was therefore
   honoured almost nowhere it actually mattered.

   Two decisions follow.

   The preference is read in JS and kept LIVE through a change listener, so a
   player who turns reduced motion on mid-session gets it without reloading.

   And every moving thing is gated by NAME rather than by `if`s scattered
   through the draw calls. A named family is something a gate can assert about:
   a test can ask "is ceremonyConfetti suppressed under reduced motion" and get
   an answer, where "does the screen move less" is not a question code can be
   asked. allows() throws on a name outside the list precisely so the list
   cannot quietly rot into decoration.

   no in-game control that switches it back off, so nothing the player can
   click will re-enable motion the operating system asked to have removed.

  for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=speed*(.35+Math.random()*.75);this.items.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-45,g:180,life,max:life*(.7+Math.random()*.55),size:2+Math.random()*5,color,rot:Math.random()*6.2,vr:(Math.random()-.5)*8})}

  /* ceremonyConfetti. This is the single largest moving object in the game —
     up to 240 pieces falling across the whole frame at the final ceremony —
     and it is the one a photosensitive player is most likely to be hurt by.
     Refused outright under reduced motion; the ceremony keeps its fanfare,
     its podium and its announcement. */
  if(!Motion.allows('ceremonyConfetti'))return;
  const colors=['#47e7ff','#ffd75e','#ff557f','#62f2a2','#bb8cff','#ffffff'];
  for(let i=0;i<count;i++)this.items.push({x:Math.random()*DESIGN_W,y:-20-Math.random()*180,vx:(Math.random()-.5)*80,vy:90+Math.random()*180,g:28,life:4+Math.random()*2,max:6,size:4+Math.random()*8,color:colors[i%colors.length],rot:Math.random()*6.2,vr:(Math.random()-.5)*8});

class Tournament{

  this.teams=[{...selected,id:'player',athlete:config.athleteName||'Athlete',isPlayer:true,stats:null,points:0,medals:{gold:0,silver:0,bronze:0},lastResult:'—'}];
  const pool=NATIONS.filter(n=>n.code!==selected.code).sort(()=>this.rng()-.5).slice(0,5);
  pool.forEach((n,i)=>this.teams.push({...n,id:`ai${i+1}`,isPlayer:false,points:0,medals:{gold:0,silver:0,bronze:0},lastResult:'—'}));

  else return false;
  this.prepUsed=true;return true;

  const m=EVENT_META[eventId],z=gaussian(this.rng),b=this.difficultyBonus;
  const s=team.stats.speed+b,p=team.stats.power+b,st=team.stats.stamina+b;

  else if(eventId==='longJump')v=4.45+s*.35+p*.225+z*.22;

  this.teams.filter(t=>!t.isPlayer).forEach(t=>results.push({teamId:t.id,score:this.aiScore(eventId,t),extra:{}}));

    <div class="card"><h3>Championship format</h3><div class="modes">${modes}</div>${d.mode==='custom'?`<div class="checks">${checks}</div><p class="note" style="margin:10px 0 0">Choose at least four events. Current schedule: ${schedule.length}.</p>`:''}</div>

   </div></div></section>`,'#athleteName');
  $('#setupBack').addEventListener('click',()=>this.showTitle());

  $$('.mode').forEach(btn=>btn.addEventListener('click',()=>{d.mode=btn.dataset.mode;if(d.mode==='custom'&&d.custom.size<4)d.custom=new Set(MODES.quick.schedule);this.showSetup()}));

  $$('[data-custom]').forEach(ch=>ch.addEventListener('change',()=>{if(ch.checked)d.custom.add(ch.dataset.custom);else d.custom.delete(ch.dataset.custom);this.showSetup()}));

 adjustSetupAttribute(key,delta){

 }
 autoAllocateAttributes(){

  for(let i=0;i<10;i++){let k=keys[i%keys.length];if(d.attrs[k]>=10)k=keys.find(x=>d.attrs[x]<10)||k;d.attrs[k]++}this.showSetup();
 }
 beginTournament(){
  const d=this.setupDraft,left=this.setupPointsLeft(),schedule=d.mode==='custom'?EVENT_ORDER.filter(id=>d.custom.has(id)):[...MODES[d.mode].schedule];

  const athleteName=d.athleteName.trim()||'Athlete',config={athleteName,nation:d.nation,primary:d.primary,secondary:d.secondary,difficulty:d.difficulty,mode:d.mode,schedule,attrs:{...d.attrs}};

 timelineMarkup(markCurrent=true){

 }
 showHub(){
  const t=this.tournament;if(!t)return this.showTitle();if(t.finished)return this.showFinal();const id=t.currentId,m=EVENT_META[id],stand=t.standings(),playerRank=stand.findIndex(x=>x.isPlayer)+1,attrs=t.effectiveAttrs(),pb=this.save.records[id];
  const prep=t.prepType||'',used=t.prepUsed,prepButtons=[['rest','🛌 Rest','Recover 22 energy'],['speed','⚡ Speed session','+1.5 Speed next event · −6 energy'],['power','💥 Power session','+1.5 Power next event · −6 energy'],['stamina','🫁 Stamina session','+1.5 Stamina next event · −6 energy']].map(([key,title,desc])=>`<button class="prep${prep===key?' sel':''}" data-prep="${key}" ${used||(key==='rest'&&t.energy>=100)?'disabled':''}><b>${title}</b><span>${desc}</span></button>`).join('');

   <div class="hubgrid"><div><article class="next"><div class="bigicon">${m.icon}</div><div class="day">Day ${t.index+1} of ${t.schedule.length} · ${m.category}</div><h2 class="eventName">${m.name}</h2><p class="copy">${m.description}</p><div class="pills"><span class="pill">PB ${pb===undefined?'—':formatScore(id,pb)}</span><span class="pill">Benchmark ${formatScore(id,m.arcadeRecord)}</span><span class="pill">Energy cost ${m.energyCost}</span></div><button id="eventBriefing" class="primary">Open Event Briefing</button></article>
    <div class="card"><h3>Competition timeline</h3><div class="timeline">${this.timelineMarkup()}</div></div></div>
    <div><div class="card"><div class="meterHead"><span>${t.player.flag} ${escapeHTML(t.player.athlete)} · ${ordinal(playerRank)} overall</span><span>${Math.round(t.energy)}% energy</span></div><div class="meter"><i style="width:${t.energy}%"></i></div><div class="pills" style="margin:13px 0 0"><span class="pill">Speed ${attrs.speed.toFixed(1)}</span><span class="pill">Power ${attrs.power.toFixed(1)}</span><span class="pill">Stamina ${attrs.stamina.toFixed(1)}</span></div></div>
     <div class="card"><h3>${used?'Preparation locked':'Choose optional preparation'}</h3><div class="preps">${prepButtons}</div><p class="note" style="margin:10px 0 0">Starting immediately is always allowed. Training boosts last for one event only.</p></div>
     <div class="card"><h3>Live standings</h3><div class="tablebox"><table><thead><tr><th>#</th><th>Nation / athlete</th><th>Medals</th><th>Last</th><th>Pts</th></tr></thead><tbody>${this.standingsTableRows(stand)}</tbody></table></div></div></div></div></section>`,'#eventBriefing');
  $('#eventBriefing').addEventListener('click',()=>this.showEventIntro());$('#hubQuit').addEventListener('click',()=>{if(confirm('Withdraw from this championship and return to the title screen?'))this.showTitle()});
  $$('[data-prep]').forEach(btn=>btn.addEventListener('click',()=>this.applyPrep(btn.dataset.prep)));

 applyPrep(type){

 showEventIntro(){

  const instructions=m.instructions.map((x,i)=>`<div class="instruction"><b>${i+1}. ${x[0]}</b>${x[1]}</div>`).join('');const controls=(m.touch||[]).map(c=>c.label).join(' · ');
  this.showScreen('INTRO',`<section class="intro glass"><div class="introIcon">${m.icon}</div><div class="eyebrow">Day ${t.index+1} · ${m.category}</div><h2>${m.name}</h2><p class="copy" style="margin:12px auto">${m.description}</p><div class="instructions">${instructions}</div><div class="records"><span class="record">Personal best: ${pb===undefined?'No mark':formatScore(id,pb)}</span><span class="record">Arcade benchmark: ${formatScore(id,m.arcadeRecord)}</span><span class="record">Energy: ${Math.round(t.energy)}%</span></div><div class="pills" style="justify-content:center"><span class="pill">Speed ${attrs.speed.toFixed(1)}</span><span class="pill">Power ${attrs.power.toFixed(1)}</span><span class="pill">Stamina ${attrs.stamina.toFixed(1)}</span></div><p class="note" style="margin:14px auto 20px">Keyboard / touch: ${escapeHTML(controls)}. Press Escape at any time to pause.</p><div class="btnrow"><button id="startEvent" class="primary">Start ${m.short}</button><button id="introBack" class="ghost">Back to Village</button></div></section>`,'#startEvent');
  $('#startEvent').addEventListener('click',()=>this.startActiveEvent());$('#introBack').addEventListener('click',()=>this.showHub());
 }
 startActiveEvent(){
  const t=this.tournament,id=t&&t.currentId;if(!t||!id||!EVENT_CLASSES[id])return;this.audio.unlock();this.state='PLAYING';this.paused=false;this.screen.classList.add('hidden');this.hud.classList.remove('hidden');this.pauseLayer.classList.add('hidden');this.input.clearAll();this.particles.clear();this.accumulator=0;this.lastAnnouncedStatus='';
  this.activeEvent=new EVENT_CLASSES[id](this,t);this.setupTouch(id);this.audio.setCrowd(.025);this.updateHUD();this.canvas.focus({preventScroll:true});this.announce(`${EVENT_META[id].name} started`);
 }
 restartActiveEvent(){

 togglePause(force){

 }
 quitToTitle(){this.paused=false;this.pauseLayer.classList.add('hidden');this.activeEvent=null;this.tournament=null;this.showTitle()}
 finishActiveEvent(ev){
  if(this.state!=='PLAYING'||ev!==this.activeEvent||!this.tournament)return;const meta=EVENT_META[ev.id],raw=Number(ev.result&&ev.result.score),fallback=meta.higherIsBetter?0:999,score=Number.isFinite(raw)?raw:fallback,extra=ev.result&&ev.result.extra||{};
  this.input.clearAll();this.clearTouch();this.hud.classList.add('hidden');this.activeEvent=null;this.lastEntry=this.tournament.resolveEvent(ev.id,score,extra);this.showEventResult(this.lastEntry);
 }
 resultDetailItems(entry){
  const e=entry.extra||{},id=entry.eventId,items=[];
  if(id==='sprint'){items.push(['False-start penalty',`${Number(e.falsePenalty||0).toFixed(2)} s`],['Modelled top speed',`${e.topSpeed||0} m/s`])}
  else if(id==='hurdles'){items.push(['Clean clearances',String(e.clears??0)],['Hurdles hit',String(e.hits??0)],['Time penalty',`${Number(e.penalty||0).toFixed(2)} s`])}
  else if(id==='longJump'||id==='javelin'){(e.attempts||[]).forEach((v,i)=>items.push([`Attempt ${i+1}`,v?formatScore(id,v):'FOUL']))}
  else if(id==='swimming'){items.push(['Perfect strokes',`${e.perfects||0} / ${e.strokes||0}`],['Oxygen remaining',`${Math.round((e.oxygen||0)*100)}%`])}
  else if(id==='archery'){(e.arrows||[]).forEach((v,i)=>items.push([`Arrow ${i+1}`,`${v} pts`]))}
  else if(id==='curling'){(e.stones||[]).forEach((v,i)=>items.push([`Stone ${i+1}`,`${v} pts`]))}
  else if(id==='weightlifting'){items.push(['Successful lifts',(e.attempts||[]).length?(e.attempts||[]).join(' kg, ')+' kg':'None'],['Last decision',e.lastSuccess?'Three white lights':'No lift'])}
  else if(id==='skiJump'){items.push(['Distance',`${e.distance??0} m`],['Style',`${e.style??0} pts`],['Landing',String(e.landing||'—')],['Take-off',`${e.takeoff??0}%`])}
  return items;
 }
 showEventResult(entry){

  const rows=entry.results.map(x=>`<tr class="${x.teamId==='player'?'playerRow':''}"><td>${x.rank}</td><td>${teamNameMarkup(x.team)}</td><td>${formatScore(entry.eventId,x.score)}</td><td>+${x.points}</td></tr>`).join('');
  this.audio.setCrowd(rank<=3?.16:.045);if(rank<=3)this.audio.medal(rank);if(rank<=3||entry.newPB){this.particles.confetti(rank===1?130:80)}
  this.showScreen('RESULT',`<section class="result glass"><div class="head"><div><div class="eyebrow">Official event result · ${m.category}</div><h1 class="title">${m.name}</h1></div><div class="brand">Made by Matt</div></div><div class="resultHero"><div class="orb ${orbClass}"><div><strong>${rank}</strong><small>${medal}</small></div></div><div><div class="score">${formatScore(entry.eventId,r.score)}</div><div class="badges">${badges}</div><p class="copy">${r.team.flag} ${escapeHTML(r.team.athlete)} has earned ${r.points} points for ${escapeHTML(r.team.name)}.</p></div></div>${detail?`<div class="recordGrid" style="margin-bottom:18px">${detail}</div>`:''}<div class="tablebox"><table><thead><tr><th>Place</th><th>Nation / athlete</th><th>Result</th><th>Points</th></tr></thead><tbody>${rows}</tbody></table></div><div class="btnrow" style="margin-top:18px"><button id="resultContinue" class="primary">View Championship Standings</button></div></section>`,'#resultContinue');
  $('#resultContinue').addEventListener('click',()=>this.showStandings());
  /* THE ANNOUNCEMENT WAS POORER THAN THE SCREEN. The result panel shows the

  this.announce([`${m.name} complete`,
   rank<=3?`${medal} medal`:`${ordinal(rank)} place`,
   `Result ${formatScore(entry.eventId,r.score)}`,
   entry.newPB?'New personal best':null,
   entry.beatArcade?'Benchmark beaten':null,

 showStandings(){

 podiumSpot(team,place){return `<div class="pod p${place}"><div class="podCard"><div style="font-size:1.8rem">${team.flag}</div><strong>${escapeHTML(team.code)}</strong><div class="note">${escapeHTML(team.athlete)}</div><div style="color:var(--gold);font-weight:1000;margin-top:5px">${team.points} pts</div></div><div class="podBlock">${place}</div></div>`}
 showFinal(){
  const t=this.tournament;if(!t)return this.showTitle();const stand=t.standings(),playerRank=stand.findIndex(x=>x.isPlayer)+1,top=stand.slice(0,3),title=playerRank===1?'Champions of the Games':playerRank<=3?'Global Games Medallists':`${ordinal(playerRank)} in the World Final`;
  if(!this.finalRecorded){this.save.gamesPlayed=(this.save.gamesPlayed||0)+1;persist(this.save);this.finalRecorded=true}
  if(!this.finalCelebrated){this.particles.confetti(playerRank===1?240:150);this.audio.setCrowd(.24);if(playerRank<=3)this.audio.medal(playerRank);else this.audio.success();this.finalCelebrated=true}
  const records=t.schedule.map(id=>`<div class="recordCard"><span class="eyebrow">${EVENT_META[id].icon} ${EVENT_META[id].short}</span><b>${this.save.records[id]===undefined?'No PB':formatScore(id,this.save.records[id])}</b><div class="note">Player finish: ${ordinal((t.history.find(h=>h.eventId===id)||{}).playerResult?.rank||6)}</div></div>`).join('');
  const podium=top.length>=3?`${this.podiumSpot(top[1],2)}${this.podiumSpot(top[0],1)}${this.podiumSpot(top[2],3)}`:'';
  this.showScreen('FINAL',`<section class="final glass"><div class="brand">Made by Matt</div><div class="eyebrow" style="margin-top:15px">Final medal ceremony</div><h2>${title}</h2><p class="copy" style="margin:10px auto">${t.player.flag} ${escapeHTML(t.player.athlete)} finishes ${ordinal(playerRank)} with ${t.player.points} points and ${t.player.medals.gold} gold, ${t.player.medals.silver} silver and ${t.player.medals.bronze} bronze.</p><div class="podium">${podium}</div><h3 style="text-align:left;text-transform:uppercase">Championship personal bests</h3><div class="recordGrid">${records}</div><div class="btnrow" style="margin-top:22px"><button id="runAgain" class="primary">Run It Back</button><button id="editTeam" class="secondary">Edit Team &amp; Format</button><button id="copySummary" class="ghost">Copy Result</button><button id="finalTitle" class="ghost">Title Screen</button></div></section>`,'#runAgain');
  $('#runAgain').addEventListener('click',()=>this.runAgain());$('#editTeam').addEventListener('click',()=>this.editLastSetup());$('#copySummary').addEventListener('click',()=>this.copyFinalSummary());$('#finalTitle').addEventListener('click',()=>this.showTitle());
  /* The ceremony is the payoff for nine events and it announced nothing. Under
     reduced motion the confetti is refused outright, which makes this the ONLY
     signal that the ceremony happened at all — so it carries the podium and the
     personal bests, not just the finishing place. */
  const pm=t.player.medals;
  const pbs=t.schedule.filter(id=>this.save.records[id]!==undefined)
    .map(id=>`${EVENT_META[id].name} ${formatScore(id,this.save.records[id])}`);
  this.announce(`${title}. ${t.player.athlete} finishes ${ordinal(playerRank)} with `+
   `${t.player.points} points, ${pm.gold} gold, ${pm.silver} silver, ${pm.bronze} bronze. `+
   (top.length>=3?`Podium: ${top[0].athlete} first, ${top[1].athlete} second, ${top[2].athlete} third. `:'')+
   (pbs.length?`Personal bests: ${pbs.join('; ')}.`:'No personal bests recorded.'));
 }
 runAgain(){
  if(!this.lastConfig)return this.showTitle();const c={...this.lastConfig,schedule:[...this.lastConfig.schedule],attrs:{...this.lastConfig.attrs}};this.tournament=new Tournament(c,this.save);this.tournament.prepType=null;this.finalRecorded=false;this.finalCelebrated=false;this.showHub();
 }
 editLastSetup(){
  if(!this.lastConfig){this.setupDraft=this.newSetupDraft();return this.showSetup()}const c=this.lastConfig;this.setupDraft={nation:c.nation,athleteName:c.athleteName,primary:c.primary,secondary:c.secondary,difficulty:c.difficulty,mode:c.mode,attrs:{...c.attrs},custom:new Set(c.schedule)};this.showSetup();
 }
 async copyFinalSummary(){
  if(!this.tournament)return;const s=this.tournament.standings(),pr=s.findIndex(x=>x.isPlayer)+1,p=this.tournament.player,text=`Made by Matt Global Games — ${p.athlete} (${p.code}) finished ${ordinal(pr)} with ${p.points} points. Medals: ${p.medals.gold} gold, ${p.medals.silver} silver, ${p.medals.bronze} bronze.`;
  try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}this.toast('Championship summary copied','good')}catch{this.toast('Could not copy the summary','warn')}
 }
 debugFinishCurrent(score){
  if(this.state!=='PLAYING'||!this.activeEvent)return false;const m=EVENT_META[this.activeEvent.id],v=Number.isFinite(Number(score))?Number(score):m.arcadeRecord;this.activeEvent.result={score:v,extra:{debug:true}};this.activeEvent.done=true;this.activeEvent.finishDelay=0;return true;
 }
}

try{
 game=new GlobalGamesApp();
 window.MBMGlobalGames={version:VERSION,get app(){return game},debugFinish:score=>game.debugFinishCurrent(score)};
 /* ---- DIAGNOSTIC SURFACE ------------------------------------------------
    MBMGlobalGames above is untouched — nothing is deleted — and this sits
    beside it as the surface the harness reads.

    Every field is a GETTER over live state rather than a snapshot taken at
    boot. A cached diagnostic surface is worse than none: it agrees with
    whatever was true when it was built and then drifts, and a harness reading
    it would report confident greens about a game that had moved on. Reading
    through to the real objects means this cannot describe a state the game is
    not in.

    saveKeys reports the key NAME and whether anything is stored under it,
    never the contents — a harness needs to know persistence happened, and does
    not need the player's profile to do that. */
 window.__olympics={
  version:VERSION,
  get screen(){return game?game.state:null},
  get paused(){return !!(game&&game.paused)},
  get eventId(){return game&&game.activeEvent?game.activeEvent.id:null},
  get eventIndex(){return game&&game.tournament?game.tournament.index:-1},
  get day(){return game&&game.tournament?game.tournament.index+1:0},
  get schedule(){return game&&game.tournament?game.tournament.schedule.slice():[]},
  get energy(){return game&&game.tournament?game.tournament.energy:null},
  get athlete(){
   const t=game&&game.tournament;if(!t)return null;const p=t.player;
   return{name:p.athlete,nation:p.code,points:p.points,medals:{...p.medals},
          attrs:{...t.config.attrs},effective:t.effectiveAttrs(),
          difficulty:t.config.difficulty,mode:t.config.mode};
  },
  get standings(){
   const t=game&&game.tournament;if(!t)return[];
   return t.standings().map((x,i)=>({rank:i+1,code:x.code,athlete:x.athlete,
     points:x.points,medals:{...x.medals},isPlayer:!!x.isPlayer}));
  },
  get records(){return game?{...game.save.records}:{}},
  get saveKeys(){
   let present=false;
   try{present=localStorage.getItem(SAVE_KEY)!==null}catch(e){}
   return{save:SAVE_KEY,present};
  },
  get motion(){
   const allowed={};
   for(const f of Motion.families())allowed[f]=Motion.allows(f);
   return{osReduced:Motion.reduced,families:Motion.families(),allowed};
  },
  get particles(){return game?game.particles.items.length:0},
  get fixedDt(){return FIXED_DT},
  finishEvent(score){return game?game.debugFinishCurrent(score):false}
 };
}catch(error){
 console.error(error);const screenEl=$('#screen');if(screenEl)screenEl.innerHTML=`<section class="wrap glass"><div class="eyebrow">Launch error</div><h1 class="title">Global Games could not start</h1><p class="copy">${escapeHTML(error&&error.message||String(error))}</p><button class="primary" onclick="location.reload()">Reload</button></section>`;
}

})();
</script>

<!-- mbm-splash-inline: Made by Matt splash, BESPOKE IN-THEME for Global Games.

     Classified rather than copied. The ten marker-carrying games in Lessons/Games
     inline the canonical brand splash verbatim; the four site-published games
     (fracture, neonturf, luminahaven, auroralinks) each ship a bespoke start
     screen that carries no marker and is certified by nothing. Neither pattern is
     what was asked for here, so this is the synthesis: the VISUALS are the game's
     own — its palette tokens, and the three concentric arcs its renderAmbient()
     already draws — while the CONTRACT is the canonical one, class names and
     hardening included, so tools/verify_games_splash.mjs judges it as a real
     target instead of a parallel checker judging it alone.

     Deliberately NOT five interlocking rings. That device is an IOC mark; the
     game calls itself Global Games and draws three arcs, so three arcs is both
     the safer choice and the more faithful one.

     Every word here is the game's own. "GLOBAL GAMES" and "CHAMPIONSHIP
     SIMULATOR" are lifted from its <title>; "NINE EVENTS" from its own meta
     description. Nothing is invented for the splash.

     The hardening is the proven form and the reason is specific: this game binds
     its keydown on window in the BUBBLE phase, so preventDefault alone would
     stop the browser default while still letting Space fire a gameplay action
     underneath. Capture phase plus stopImmediatePropagation is what actually
     prevents the leak, and S2/S3 exist to prove it. -->
<script>
(function () {
  var CSS = ".mbm-splash{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;" +
    "background:radial-gradient(circle at 50% 40%,#0b2141,#050816 70%);color:#f7fbff;" +
    "font-family:'Segoe UI',system-ui,-apple-system,sans-serif;transition:opacity .55s ease,visibility .55s}" +
    ".mbm-splash.is-leaving{opacity:0;visibility:hidden}" +
    ".mbm-stage{text-align:center;padding:24px;max-width:860px}" +
    ".mbm-mark{width:min(34vmin,210px);height:auto;filter:drop-shadow(0 18px 32px rgba(0,0,0,.55))}" +
    ".mbm-mark .marc{stroke-dasharray:1;stroke-dashoffset:1;animation:mbmArc 1s cubic-bezier(.6,0,.3,1) forwards}" +
    ".mbm-mark .a1{animation-delay:.15s}.mbm-mark .a2{animation-delay:.35s}.mbm-mark .a3{animation-delay:.55s}" +
    ".mbm-mark .mflame{transform-origin:50px 50px;transform:scale(0);opacity:0;" +
    "animation:mbmPop .45s cubic-bezier(.34,1.56,.64,1) 1.15s forwards}" +
    ".mbm-kicker,.mbm-title,.mbm-tagline{opacity:0;transform:translateY(12px);animation:mbmRise .6s ease forwards}" +
    ".mbm-kicker{animation-delay:1.3s;margin-top:20px;color:#ffd75e;font-size:.78rem;" +
    "letter-spacing:.32em;text-transform:uppercase;font-weight:700}" +
    ".mbm-title{animation-delay:1.45s;margin:.35rem 0 .2rem;font-size:clamp(2rem,7vw,4.6rem);" +
    "line-height:.95;letter-spacing:.05em;text-transform:uppercase;font-weight:800}" +
    ".mbm-tagline{animation-delay:1.65s;color:#47e7ff;letter-spacing:.18em;text-transform:uppercase;font-weight:700;font-size:.82rem}" +
    ".mbm-skip{position:absolute;right:max(22px,env(safe-area-inset-right,0px));" +
    "bottom:max(20px,env(safe-area-inset-bottom,0px));border:1px solid rgba(150,220,255,.38);border-radius:99px;" +
    "background:rgba(10,16,35,.72);color:#f7fbff;padding:.7rem 1.15rem;cursor:pointer;font:inherit;" +
    "min-height:44px;min-width:44px}" +
    ".mbm-skip:focus-visible{outline:3px solid #ffd75e;outline-offset:3px}" +
    "@keyframes mbmArc{to{stroke-dashoffset:0}}@keyframes mbmPop{to{transform:scale(1);opacity:1}}" +
    "@keyframes mbmRise{to{opacity:1;transform:translateY(0)}}" +
    /* S6: under reduced motion every animation is removed outright and each
       element is placed at its FINISHED state, so the splash is a still image
       rather than a fast one. The transition is dropped too, because a fade-out
       is motion as much as a fade-in is. */
    "@media(prefers-reduced-motion:reduce){.mbm-splash{transition:none}" +
    ".mbm-mark .marc{animation:none;stroke-dashoffset:0}" +
    ".mbm-mark .mflame{animation:none;transform:scale(1);opacity:1}" +
    ".mbm-kicker,.mbm-title,.mbm-tagline{animation:none;opacity:1;transform:none}}";

  /* Three arcs, cyan / gold / purple, at the same radii and in the same order
     the game's own ambient scene draws them. */
  var MARK = '<svg class="mbm-mark" viewBox="0 0 100 100" role="img" aria-label="Global Games">' +
    '<circle class="marc a1" pathLength="1" cx="50" cy="50" r="46" fill="none" stroke="#47e7ff" stroke-width="3.2" stroke-linecap="round" transform="rotate(-90 50 50)"/>' +
    '<circle class="marc a2" pathLength="1" cx="50" cy="50" r="37" fill="none" stroke="#ffd75e" stroke-width="3.2" stroke-linecap="round" transform="rotate(-30 50 50)"/>' +
    '<circle class="marc a3" pathLength="1" cx="50" cy="50" r="28" fill="none" stroke="#bb8cff" stroke-width="3.2" stroke-linecap="round" transform="rotate(40 50 50)"/>' +
    '<path class="mflame" d="M50 33c6 7 10 12 10 18a10 10 0 0 1-20 0c0-6 4-11 10-18z" fill="#ffd75e"/>' +
    '</svg>';

  function start(o) {
    o = o || {};
    var duration = o.duration || 3200;
    if (!document.getElementById("mbm-splash-css")) {
      var st = document.createElement("style");
      st.id = "mbm-splash-css"; st.textContent = CSS;
      document.head.appendChild(st);
    }
    var reduced = false;
    try { reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
    var prevFocus = document.activeElement;
    var el = document.createElement("section");
    el.className = "mbm-splash";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", "Global Games introduction");
    el.innerHTML = '<div class="mbm-stage">' + MARK +
      '<p class="mbm-kicker">Made by Matt</p>' +
      '<h1 class="mbm-title">Global Games</h1>' +
      '<p class="mbm-tagline">Championship Simulator • Nine Events</p></div>' +
      '<button class="mbm-skip" type="button">Skip intro</button>';
    document.body.appendChild(el);

    var done = false, timer;
    function close() {
      if (done) return;            /* S4: closing is idempotent by construction */
      done = true;
      clearTimeout(timer);
      el.classList.add("is-leaving");
      window.removeEventListener("keydown", onKey, true);
      setTimeout(function () {
        el.remove();
        /* S5: hand focus back where it was. The game focuses its canvas during
           boot, so this returns to a live element rather than to <body>. */
        if (prevFocus && prevFocus.isConnected && prevFocus.focus) prevFocus.focus({ preventScroll: true });
        else if (document.body) document.body.focus && document.body.focus();
      }, reduced ? 0 : 600);
    }
    el.querySelector(".mbm-skip").addEventListener("click", function (e) { e.stopPropagation(); close(); });
    /* the overlay swallows stray pointer input so a skip tap can never reach
       the game underneath */
    el.addEventListener("click", function (e) { e.stopPropagation(); });
    function onKey(e) {
      if (done) return;
      if (e.key === "Escape" || e.key === "Enter" || e.key === " ") {
        e.preventDefault(); e.stopPropagation();
        if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        close();
      }
    }
    window.addEventListener("keydown", onKey, true);
    el.addEventListener("keydown", onKey);
    el.tabIndex = -1;
    el.focus({ preventScroll: true });
    timer = setTimeout(close, reduced ? Math.min(duration, 1200) : duration);
    return { close: close, element: el };
  }
  window.MadeByMattSplash = { start: start };

  function boot() {
    /* S10: the splash plays ABOVE the game's own title screen and fades to
       reveal it. It creates no second start state and calls nothing on close. */
    start({});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<script defer src="/hud.js"></script>
