<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Rutline</title>
  <desc id="desc">A rider on an orange dirt bike in mid-air off a dirt ramp, under a low sun in an amber evening sky, with green valley hills, pine trees and a winding trail behind, and a violet job ring glowing beside the landing slope.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23344F"/>
      <stop offset="0.6" stop-color="#C96F3B"/>
      <stop offset="1" stop-color="#F2B25A"/>
    </linearGradient>
  </defs>
  <rect width="120" height="96" rx="10" fill="url(#sky)"/>
  <!-- low sun -->
  <circle cx="92" cy="40" r="11" fill="#FFE2A0" opacity="0.9"/>
  <!-- far hills -->
  <path d="M0 58 Q20 40 42 54 T84 50 T120 56 V96 H0 Z" fill="#3E5A4A"/>
  <!-- near hills and trail -->
  <path d="M0 70 Q28 56 56 68 T120 66 V96 H0 Z" fill="#2C4636"/>
  <path d="M70 96 Q78 84 66 76 Q58 70 72 64" fill="none" stroke="#B98A55" stroke-width="2.4" stroke-linecap="round"/>
  <!-- pines -->
  <path d="M100 68 l5 -12 5 12 Z M103 62 l2 -7 2 7 Z" fill="#1E3327"/>
  <path d="M8 72 l4 -10 4 10 Z" fill="#1E3327"/>
  <path d="M52 66 l3 -8 3 8 Z" fill="#1E3327"/>
  <!-- ramp and landing slope -->
  <path d="M0 96 V84 L26 70 L34 70 L34 96 Z" fill="#8A6238"/>
  <path d="M26 70 L34 70" stroke="#D9A566" stroke-width="1.4"/>
  <path d="M84 96 L104 80 L120 80 V96 Z" fill="#8A6238"/>
  <!-- violet job ring -->
  <ellipse cx="96" cy="74" rx="9" ry="3.4" fill="none" stroke="#B48CFF" stroke-width="1.8"/>
  <path d="M96 74 V58" stroke="#B48CFF" stroke-width="1" opacity="0.6"/>
  <!-- dust -->
  <circle cx="30" cy="66" r="2.6" fill="#D9A566" opacity="0.55"/>
  <circle cx="35" cy="61" r="1.8" fill="#D9A566" opacity="0.4"/>
  <!-- bike, nose slightly up -->
  <g transform="translate(60 40) rotate(-14)">
    <circle cx="-12" cy="8" r="6.5" fill="#14181F" stroke="#C9CED6" stroke-width="1.2"/>
    <circle cx="13" cy="8" r="6.5" fill="#14181F" stroke="#C9CED6" stroke-width="1.2"/>
    <circle cx="-12" cy="8" r="1.6" fill="#C9CED6"/>
    <circle cx="13" cy="8" r="1.6" fill="#C9CED6"/>
    <path d="M-12 8 L-3 -1 L7 -2 L13 8" fill="none" stroke="#9AA3AF" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M-15 -1 L-2 -4 L8 -4 L5 2 L-4 3 Z" fill="#F28C28"/>
    <path d="M-17 0 L-9 -2 L-10 1 Z" fill="#F28C28"/>
    <path d="M8 -4 L12 -9" stroke="#9AA3AF" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M10 -1 L17 1 L16 3 L10 2 Z" fill="#F28C28"/>
    <!-- rider -->
    <path d="M-4 -4 L-2 -13 L5 -15 L11 -9" fill="none" stroke="#2F6FE0" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-3 -4 L1 2" stroke="#1F2937" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="4" cy="-19" r="4" fill="#F5F7FA"/>
    <path d="M5 -20 h4 v2.4 h-4 Z" fill="#1F2937"/>
  </g>
</svg>
