<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Crown &amp; Badge: Frontier Watch</title>
  <desc id="desc">A frontier command map with six linked districts, three officer badges and a gold Crown Watch shield.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071926"/><stop offset="1" stop-color="#194C47"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2F7065"/><stop offset="1" stop-color="#123B3C"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="120" height="96" rx="10" fill="url(#sky)"/>
  <path d="M4 68 18 34l24-11 23 8 18-12 31 19 2 45H4Z" fill="url(#land)" stroke="#6BA59A" stroke-width="1.2"/>
  <path d="M17 55 37 42l23 9 20-17 24 16M37 42l5 29m18-20 17 22m3-39 7 31" fill="none" stroke="#A3C7B7" stroke-width="1.2" stroke-dasharray="2 2" opacity=".72"/>
  <g fill="#E7BC57" stroke="#FFF2C1" stroke-width="1" filter="url(#glow)">
    <circle cx="17" cy="55" r="3"/><circle cx="37" cy="42" r="3"/><circle cx="42" cy="71" r="3"/>
    <circle cx="60" cy="51" r="3"/><circle cx="80" cy="34" r="3"/><circle cx="87" cy="65" r="3"/>
  </g>
  <g transform="translate(77 48)">
    <path d="M15 3 29 9v16q0 11-14 17Q1 36 1 25V9Z" fill="#0B2431" stroke="#E7BC57" stroke-width="2"/>
    <path d="m8 17 4-2 3-7 3 7 4 2-3 4 1 6-5-3-5 3 1-6Z" fill="#E7BC57"/>
  </g>
  <g transform="translate(8 70)">
