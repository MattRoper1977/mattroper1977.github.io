<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Global Games: Championship Simulator</title>
  <desc id="desc">A floodlit night stadium seen from the back straight. Banked stands of coloured seats rise behind a six-lane running track, three concentric arcs hang in the sky above like a scoreboard emblem, and a lone athlete runs the near lane toward a finish line.</desc>
  <defs>
    <linearGradient id="ggsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07152C"/>
      <stop offset="0.55" stop-color="#0B2141"/>
      <stop offset="1" stop-color="#18253C"/>
    </linearGradient>
    <radialGradient id="ggglow" cx="72%" cy="12%" r="62%">
      <stop offset="0" stop-color="#47E7FF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#47E7FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ggtrack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B64A42"/>
      <stop offset="1" stop-color="#7E2F2C"/>
    </linearGradient>
  </defs>

  <rect width="120" height="96" fill="url(#ggsky)"/>
  <rect width="120" height="62" fill="url(#ggglow)"/>

  <!-- scoreboard emblem: the three concentric arcs the game draws in its own title scene -->
  <g fill="none" stroke-linecap="round" opacity="0.9">
    <circle cx="92" cy="17" r="12.5" stroke="#47E7FF" stroke-width="1.1" stroke-dasharray="60 20" stroke-dashoffset="8"/>
    <circle cx="92" cy="17" r="9" stroke="#FFD75E" stroke-width="1.1" stroke-dasharray="42 16" stroke-dashoffset="20"/>
    <circle cx="92" cy="17" r="5.5" stroke="#BB8CFF" stroke-width="1.1" stroke-dasharray="26 12"/>
  </g>

  <!-- floodlight masts -->
  <g stroke="#22344F" stroke-width="1.4">
    <path d="M14 34 L14 22"/><path d="M106 34 L106 22"/>
  </g>
  <rect x="9" y="17" width="10" height="5" rx="1" fill="#FFF3C4" opacity="0.85"/>
  <rect x="101" y="17" width="10" height="5" rx="1" fill="#FFF3C4" opacity="0.85"/>

  <!-- stands: banked rows of coloured seats -->
  <rect x="0" y="33" width="120" height="21" fill="#0A1020"/>
  <g>
    <rect x="4" y="35" width="2" height="2" fill="#47E7FF"/><rect x="10" y="35" width="2" height="2" fill="#FFD75E"/>
    <rect x="16" y="35" width="2" height="2" fill="#FF557F"/><rect x="22" y="35" width="2" height="2" fill="#62F2A2"/>
    <rect x="28" y="35" width="2" height="2" fill="#BB8CFF"/><rect x="34" y="35" width="2" height="2" fill="#DBE9FF"/>
    <rect x="40" y="35" width="2" height="2" fill="#47E7FF"/><rect x="46" y="35" width="2" height="2" fill="#FFD75E"/>
    <rect x="52" y="35" width="2" height="2" fill="#FF557F"/><rect x="58" y="35" width="2" height="2" fill="#62F2A2"/>
    <rect x="64" y="35" width="2" height="2" fill="#BB8CFF"/><rect x="70" y="35" width="2" height="2" fill="#DBE9FF"/>
    <rect x="76" y="35" width="2" height="2" fill="#47E7FF"/><rect x="82" y="35" width="2" height="2" fill="#FFD75E"/>
    <rect x="88" y="35" width="2" height="2" fill="#FF557F"/><rect x="94" y="35" width="2" height="2" fill="#62F2A2"/>
    <rect x="100" y="35" width="2" height="2" fill="#BB8CFF"/><rect x="106" y="35" width="2" height="2" fill="#DBE9FF"/>
    <rect x="112" y="35" width="2" height="2" fill="#47E7FF"/>
    <rect x="7" y="40" width="2" height="2" fill="#FFD75E"/><rect x="13" y="40" width="2" height="2" fill="#62F2A2"/>
    <rect x="19" y="40" width="2" height="2" fill="#DBE9FF"/><rect x="25" y="40" width="2" height="2" fill="#47E7FF"/>
    <rect x="31" y="40" width="2" height="2" fill="#FF557F"/><rect x="37" y="40" width="2" height="2" fill="#BB8CFF"/>
    <rect x="43" y="40" width="2" height="2" fill="#FFD75E"/><rect x="49" y="40" width="2" height="2" fill="#62F2A2"/>
    <rect x="55" y="40" width="2" height="2" fill="#DBE9FF"/><rect x="61" y="40" width="2" height="2" fill="#47E7FF"/>
    <rect x="67" y="40" width="2" height="2" fill="#FF557F"/><rect x="73" y="40" width="2" height="2" fill="#BB8CFF"/>
    <rect x="79" y="40" width="2" height="2" fill="#FFD75E"/><rect x="85" y="40" width="2" height="2" fill="#62F2A2"/>
    <rect x="91" y="40" width="2" height="2" fill="#DBE9FF"/><rect x="97" y="40" width="2" height="2" fill="#47E7FF"/>
    <rect x="103" y="40" width="2" height="2" fill="#FF557F"/><rect x="109" y="40" width="2" height="2" fill="#BB8CFF"/>
    <rect x="4" y="45" width="2" height="2" fill="#62F2A2"/><rect x="10" y="45" width="2" height="2" fill="#DBE9FF"/>
    <rect x="16" y="45" width="2" height="2" fill="#47E7FF"/><rect x="22" y="45" width="2" height="2" fill="#FFD75E"/>
    <rect x="28" y="45" width="2" height="2" fill="#BB8CFF"/><rect x="34" y="45" width="2" height="2" fill="#FF557F"/>
    <rect x="40" y="45" width="2" height="2" fill="#62F2A2"/><rect x="46" y="45" width="2" height="2" fill="#DBE9FF"/>
    <rect x="52" y="45" width="2" height="2" fill="#47E7FF"/><rect x="58" y="45" width="2" height="2" fill="#FFD75E"/>
    <rect x="64" y="45" width="2" height="2" fill="#BB8CFF"/><rect x="70" y="45" width="2" height="2" fill="#FF557F"/>
    <rect x="76" y="45" width="2" height="2" fill="#62F2A2"/><rect x="82" y="45" width="2" height="2" fill="#DBE9FF"/>
    <rect x="88" y="45" width="2" height="2" fill="#47E7FF"/><rect x="94" y="45" width="2" height="2" fill="#FFD75E"/>
    <rect x="100" y="45" width="2" height="2" fill="#BB8CFF"/><rect x="106" y="45" width="2" height="2" fill="#FF557F"/>
    <rect x="112" y="45" width="2" height="2" fill="#62F2A2"/>
  </g>
  <rect x="0" y="52" width="120" height="4" fill="#04070F" opacity="0.72"/>

  <!-- infield and six-lane track -->
  <rect x="0" y="56" width="120" height="40" fill="#17382A"/>
  <rect x="0" y="60" width="120" height="30" fill="url(#ggtrack)"/>
  <g stroke="#F3F7FF" stroke-width="0.5" opacity="0.55">
    <path d="M0 65 H120"/><path d="M0 70 H120"/><path d="M0 75 H120"/><path d="M0 80 H120"/><path d="M0 85 H120"/>
  </g>
  <path d="M96 60 V90" stroke="#F3F7FF" stroke-width="1.4" opacity="0.9"/>

  <!-- the athlete, mid-stride in the near lane -->
  <g transform="translate(44,86)">
    <circle cx="0" cy="-13" r="2.4" fill="#F2D2B0"/>
    <path d="M0 -11 L0 -5" stroke="#225CFF" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M0 -10 L-4 -6" stroke="#F2D2B0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0 -10 L4.5 -12" stroke="#F2D2B0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M0 -5 L-3.5 0" stroke="#FF315E" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M0 -5 L4 -1.5" stroke="#FF315E" stroke-width="1.7" stroke-linecap="round"/>
  </g>
</svg>
