<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Sky Seeder</title>
  <desc id="desc">A red, white and orange glider swooping over low-poly floating sky islands in a pale blue sky, dropping a seed towards a green island with young trees, while a stone summit beacon glows on a far island.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8FC6E8"/><stop offset="1" stop-color="#E4F1F7"/></linearGradient>
  </defs>
  <rect width="120" height="96" rx="10" fill="url(#sky)"/>
  <!-- soft clouds -->
  <path d="M10 30 q4 -6 10 -3 q4 -5 10 0 q5 0 5 4 H10 Z" fill="#FFFFFF" opacity=".8"/>
  <path d="M84 52 q3 -4 8 -2 q4 -4 8 0 q4 0 4 3 H84 Z" fill="#FFFFFF" opacity=".7"/>
  <!-- far island with the summit beacon -->
  <path d="M74 30 h24 l-4 4 l-6 9 l-5 -6 l-5 -3 Z" fill="#5C6B7A"/>
  <path d="M74 30 h24 l-3 -2 h-18 Z" fill="#7FA77A"/>
  <path d="M84 28 v-9 h4 v9 Z" fill="#8C8F96"/>
  <circle cx="86" cy="16" r="3.2" fill="#F4B942"/>
  <circle cx="86" cy="16" r="5.5" fill="none" stroke="#F4B942" stroke-width=".8" opacity=".6"/>
  <!-- near island, greened -->
  <path d="M14 66 h44 l-6 7 l-9 13 l-7 -9 l-8 -4 l-8 -1 Z" fill="#4E5A68"/>
  <path d="M28 73 l8 4 l7 9 l-12 -8 Z" fill="#3D4753"/>
  <path d="M14 66 q22 -7 44 0 Z" fill="#3FA65A"/>
  <path d="M14 66 h44 l-4 -2 h-36 Z" fill="#59C06E"/>
  <!-- young trees -->
  <path d="M24 64 l4 -9 l4 9 Z M36 63 l5 -11 l5 11 Z M48 64 l3.5 -7 l3.5 7 Z" fill="#2E8B4A"/>
  <path d="M28 64 v2 M41 63 v3 M51.5 64 v2" stroke="#6B4A2B" stroke-width="1.2"/>
  <!-- falling seed and its trail -->
  <path d="M60 44 q-4 6 -8 10" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
  <circle cx="51" cy="55.5" r="1.8" fill="#8B5A2B"/>
  <!-- the glider -->
  <path d="M46 38 L66 42 L86 36 L66 46 Z" fill="#F7F5EE"/>
  <path d="M46 38 L56 40 L66 46 Z" fill="#E4573D"/>
  <path d="M86 36 L76 39.6 L66 46 Z" fill="#8E3B2A"/>
  <path d="M62 40 L66 34 L70 40 L66 46 Z" fill="#F08A24"/>
  <circle cx="66" cy="41" r="1.4" fill="#2E8B4A"/>
</svg>
