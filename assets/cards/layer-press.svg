<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Layer Press</title>
  <desc id="desc">A cream hoodie on a print-studio bench, half rolled in blue stripes with a red dotted star printed on the chest, a strip of masking tape peeling back at one corner and an ink roller resting beside it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1A1F2B"/><stop offset="1" stop-color="#2A303D"/></linearGradient>
    <pattern id="stripe" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#F3EEE4"/><rect width="2.4" height="5" fill="#3B82F6"/></pattern>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#E5484D"/><circle cx="2" cy="2" r=".9" fill="#FDF6E3"/></pattern>
  </defs>
  <rect width="120" height="96" rx="10" fill="url(#bg)"/>
  <!-- the bench grid and registration corners -->
  <path d="M10 22h100M10 46h100M10 70h100M30 10v76M60 10v76M90 10v76" stroke="#94A3B8" stroke-width=".4" opacity=".18"/>
  <path d="M24 14h-6v6M96 14h6v6M24 84h-6v-6M96 84h6v-6" stroke="#CBD5E1" stroke-width="1" fill="none" opacity=".6"/>
  <!-- the hoodie blank, stripes rolled on -->
  <path d="M44 22 C48 16 72 16 76 22 L92 30 L98 56 L88 58 L84 44 L84 80 L36 80 L36 44 L32 58 L22 56 L28 30 Z" fill="url(#stripe)" stroke="#0F172A" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M50 22 C52 30 68 30 70 22" fill="#CBD5E1" stroke="#0F172A" stroke-width="1"/>
  <!-- the printed star -->
  <path d="M60 40 L63.5 49 L73 49 L65.5 54.5 L68.5 64 L60 58.5 L51.5 64 L54.5 54.5 L47 49 L56.5 49 Z" fill="url(#dots)" stroke="#0F172A" stroke-width=".9" stroke-linejoin="round"/>
  <!-- masking tape peeling back -->
  <path d="M36 70 L84 70 L84 76 L36 76 Z" fill="#E8D9A8" opacity=".9"/>
  <path d="M84 70 C90 66 94 70 92 76 L84 76 Z" fill="#F5E9C2" stroke="#B9A56A" stroke-width=".5"/>
  <!-- the ink roller -->
  <rect x="96" y="66" width="16" height="7" rx="3" fill="#F59E0B" stroke="#0F172A" stroke-width=".9"/>
  <path d="M104 73 v8 h-6" stroke="#CBD5E1" stroke-width="1.4" fill="none" stroke-linecap="round"/>
</svg>
