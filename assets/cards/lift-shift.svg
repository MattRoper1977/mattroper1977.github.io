<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Lift Shift</title>
  <desc id="desc">A glass lift cab with a small robot rider hanging on a cable in a dark workshop shaft, under a brass pulley wheel, with a striped counterweight beside it and five coloured floor lines marked with a star, a diamond, a hexagon, a triangle and a square.</desc>
  <rect width="120" height="96" rx="10" fill="#18202B"/>
  <!-- the shaft -->
  <rect x="30" y="14" width="52" height="76" rx="3" fill="#212B38" stroke="#334255" stroke-width="1"/>
  <!-- floor lines and their shapes -->
  <path d="M30 26 h52" stroke="#F4B942" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M30 41 h52" stroke="#3CC4E8" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M30 56 h52" stroke="#E84A5F" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M30 71 h52" stroke="#2BD39A" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M30 86 h52" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M18 21 l1.6 3.3 3.6 .5 -2.6 2.5 .6 3.6 -3.2 -1.7 -3.2 1.7 .6 -3.6 -2.6 -2.5 3.6 -.5 Z" fill="#F4B942"/>
  <path d="M18 36 l4 4 -4 4 -4 -4 Z" fill="#3CC4E8"/>
  <path d="M15 53 l3 -1.8 3 1.8 v3.4 l-3 1.8 -3 -1.8 Z" fill="#E84A5F"/>
  <path d="M18 66 l4 7 h-8 Z" fill="#2BD39A"/>
  <rect x="14.5" y="81.5" width="7" height="7" rx="1" fill="#A78BFA"/>
  <!-- pulley wheel and cables -->
  <circle cx="50" cy="10" r="7" fill="none" stroke="#E0B04A" stroke-width="2"/>
  <path d="M50 3 v14 M43 10 h14 M45 5 l10 10 M55 5 l-10 10" stroke="#E0B04A" stroke-width="1"/>
  <path d="M50 17 V44" stroke="#C9B48A" stroke-width="1.2"/>
  <path d="M57 10 h15 V36" stroke="#C9B48A" stroke-width="1.2" fill="none"/>
  <!-- counterweight -->
  <rect x="68.5" y="36" width="7" height="14" rx="1.5" fill="#3A4656" stroke="#E0B04A" stroke-width="1"/>
  <path d="M69 40 h6 M69 43 h6 M69 46 h6" stroke="#6E7B8C" stroke-width="1"/>
  <!-- the glass cab, level with the hexagon floor -->
  <rect x="36" y="44" width="28" height="12" rx="2" fill="#9FD9E8" fill-opacity=".25" stroke="#CFE7EE" stroke-width="1.4"/>
  <path d="M50 44 v12" stroke="#CFE7EE" stroke-width=".8"/>
  <!-- robot rider -->
  <rect x="40" y="48" width="7" height="6" rx="1.2" fill="#8C9BAE"/>
  <circle cx="42" cy="50.5" r=".9" fill="#2BD39A"/><circle cx="45" cy="50.5" r=".9" fill="#2BD39A"/>
  <path d="M43.5 48 v-1.6" stroke="#8C9BAE" stroke-width=".8"/>
  <!-- balance needle -->
  <rect x="88" y="60" width="24" height="6" rx="3" fill="#212B38" stroke="#334255"/>
  <rect x="98" y="60.5" width="4" height="5" rx="1" fill="#2BD39A"/>
</svg>
