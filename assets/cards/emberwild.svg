<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Emberwild</title>
  <desc id="desc">A green valley at dusk seen from above in stepped isometric tiles, with a dark seam splitting the rock in the foreground and warm ember light rising out of it. A small creature stands at the lip of the seam, and a thrown capsule hangs in the air above it, caught mid-arc.</desc>
  <defs>
    <linearGradient id="ewsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D3B52"/>
      <stop offset=".62" stop-color="#4A6E63"/>
      <stop offset="1" stop-color="#7FA968"/>
    </linearGradient>
    <radialGradient id="ewglow" cx="50%" cy="78%" r="46%">
      <stop offset="0" stop-color="#FFB347" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#A04B00" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A04B00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ewseam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1206"/>
      <stop offset="1" stop-color="#0A0703"/>
    </linearGradient>
  </defs>

  <rect width="120" height="96" fill="url(#ewsky)"/>

  <!-- stepped isometric terraces: the Vale, read as tiles rather than hills -->
  <g opacity=".92">
    <path d="M12 44 L44 30 L76 44 L44 58 Z" fill="#6E9C5C"/>
    <path d="M12 44 L44 58 L44 63 L12 49 Z" fill="#4F7442"/>
    <path d="M76 44 L44 58 L44 63 L76 49 Z" fill="#3F5F36"/>
    <path d="M52 33 L78 22 L104 33 L78 44 Z" fill="#7FAE68"/>
    <path d="M52 33 L78 44 L78 48 L52 37 Z" fill="#587A48"/>
    <path d="M104 33 L78 44 L78 48 L104 37 Z" fill="#46603A"/>
  </g>

  <!-- water garden -->
  <path d="M4 56 L22 49 L40 56 L22 63 Z" fill="#3E7E92" opacity=".85"/>

  <!-- the seam into the Depths, and the light coming up out of it -->
  <ellipse cx="60" cy="76" rx="40" ry="19" fill="url(#ewglow)"/>
  <path d="M34 74 L60 64 L86 74 L60 86 Z" fill="url(#ewseam)"/>
  <path d="M44 74 L60 68 L76 74 L60 80 Z" fill="#C25A16" opacity=".55"/>
  <path d="M52 74 L60 71 L68 74 L60 77 Z" fill="#FFC163" opacity=".9"/>

  <!-- ember motes rising -->
  <g fill="#FFC163">
    <circle cx="50" cy="62" r="1.3" opacity=".85"/>
    <circle cx="66" cy="57" r="1" opacity=".7"/>
    <circle cx="58" cy="52" r=".8" opacity=".55"/>
    <circle cx="72" cy="64" r="1.1" opacity=".6"/>
  </g>

  <!-- the creature at the lip of the seam: shape first, colour second -->
  <g transform="translate(36,58)">
    <ellipse cx="0" cy="8" rx="6" ry="2" fill="#0B1A12" opacity=".45"/>
    <path d="M-5 6 L-3 -3 L0 -7 L3 -3 L5 6 Z" fill="#2E6B3A"/>
    <path d="M0 -7 L3 -3 L0 -1 L-3 -3 Z" fill="#8FE07A"/>
    <circle cx="-1.6" cy="0" r="1" fill="#F6F8F2"/>
    <circle cx="1.6" cy="0" r="1" fill="#F6F8F2"/>
    <circle cx="-1.6" cy="0" r=".45" fill="#12210F"/>
    <circle cx="1.6" cy="0" r=".45" fill="#12210F"/>
  </g>

  <!-- the called throw, caught mid-arc -->
  <g transform="translate(84,40)">
    <path d="M-16 14 Q-7 -2 1 0" fill="none" stroke="#F6D979" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3" opacity=".8"/>
    <circle cx="2" cy="0" r="4.6" fill="#E8EEF2"/>
    <path d="M-2.6 0 A4.6 4.6 0 0 1 6.6 0 Z" fill="#A04B00"/>
    <circle cx="2" cy="0" r="4.6" fill="none" stroke="#12210F" stroke-width="1"/>
    <circle cx="2" cy="0" r="1.5" fill="#FFC163"/>
  </g>
</svg>
