<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Magnet Mates</title>
  <desc id="desc">Two magnet pods, one blue and one orange, stretching a glowing cyan band between them on a dark foundry floor, with a gold star gear bouncing up off the band toward a pink hexagon chute marked 2x.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0E172A"/><stop offset="1" stop-color="#15233C"/></linearGradient>
  </defs>
  <rect width="120" height="96" rx="10" fill="url(#bg)"/>
  <!-- the foundry grid -->
  <path d="M10 24h100M10 48h100M10 72h100M30 10v76M60 10v76M90 10v76" stroke="#94A3B8" stroke-width=".4" opacity=".16"/>
  <!-- the 2x chute -->
  <path d="M86 10 L110 10 L108 30 L88 30 Z" fill="#9D174D" stroke="#F472B6" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M98 15 l4.3 2.5 v5 l-4.3 2.5 l-4.3 -2.5 v-5 Z" fill="#FDF2F8"/>
  <text x="98" y="37.5" font-family="system-ui, sans-serif" font-size="6.5" font-weight="800" fill="#FDE047" text-anchor="middle">2x</text>
  <!-- the stretched band -->
  <path d="M30 72 Q60 80 90 72" stroke="#22D3EE" stroke-width="5" fill="none" opacity=".28" stroke-linecap="round"/>
  <path d="M30 72 Q60 80 90 72" stroke="#22D3EE" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- the two magnet pods -->
  <path d="M18 66 l6 -6 h8 l6 6 v10 h-20 Z" fill="#162238" stroke="#38BDF8" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M82 66 l6 -6 h8 l6 6 v10 h-20 Z" fill="#162238" stroke="#FB923C" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M24 70 h8M88 70 h8" stroke="#E2E8F0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- the star gear's bounce arc -->
  <path d="M60 74 Q70 44 90 34" stroke="#FDE047" stroke-width="1" fill="none" stroke-dasharray="2 2.5" opacity=".75"/>
  <path d="M68 38 L70.4 44.2 L77 44.2 L71.8 48 L73.8 54.4 L68 50.6 L62.2 54.4 L64.2 48 L59 44.2 L65.6 44.2 Z" fill="#FBBF24" stroke="#0F172A" stroke-width=".9" stroke-linejoin="round"/>
  <!-- the coil waiting on the floor -->
  <path d="M44 84 c2 -3 4 -3 6 0 c2 3 4 3 6 0 c2 -3 4 -3 6 0 c2 3 4 3 6 0" stroke="#FBBF24" stroke-width="1.4" fill="none" opacity=".7"/>
</svg>
