<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Hill Hound</title>
  <desc id="desc">A black and white sheepdog in an amber bandana crouching on a sunlit green hillside behind two blocky sheep, one with navy stripes and one with maroon spots, with a wooden pen gate and a low stone wall on the slope above.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#BFE6F2"/><stop offset="1" stop-color="#F3E7B8"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7BCB5C"/><stop offset="1" stop-color="#3F9A45"/></linearGradient>
  </defs>
  <rect width="120" height="96" rx="10" fill="url(#sky)"/>
  <!-- the sun -->
  <circle cx="98" cy="17" r="8" fill="#F4B942"/>
  <!-- far hill and near hill -->
  <path d="M0 46 Q30 30 64 38 T120 34 V96 H0 Z" fill="#A6D98A"/>
  <path d="M0 58 Q40 44 80 52 T120 50 V86 Q120 96 110 96 H10 Q0 96 0 86 Z" fill="url(#hill)"/>
  <!-- low stone wall on the slope -->
  <path d="M8 52 h7 v-4 h-7 Z M16 51 h7 v-4.5 h-7 Z M24 50 h7 v-4.5 h-7 Z M32 49.5 h7 v-4 h-7 Z" fill="#E9E4D2" stroke="#B9B39C" stroke-width=".5"/>
  <!-- the pen gate -->
  <path d="M84 40 v12 M100 39 v12 M84 43 h16 M84 47.5 h16 M84 52 l16 -13" stroke="#8A5A2B" stroke-width="1.6" stroke-linecap="round"/>
  <!-- striped sheep -->
  <rect x="44" y="56" width="16" height="11" rx="2.5" fill="#F9F5E8"/>
  <path d="M47 56 v11 M51.5 56 v11 M56 56 v11" stroke="#1E2E54" stroke-width="2"/>
  <rect x="58" y="54" width="6" height="7" rx="1.6" fill="#2A2A2A"/>
  <path d="M46 67 v4 M57 67 v4" stroke="#2A2A2A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- spotted sheep -->
  <rect x="68" y="62" width="16" height="11" rx="2.5" fill="#FFF0D1"/>
  <circle cx="72" cy="66" r="2" fill="#612046"/><circle cx="78" cy="68.5" r="2.2" fill="#612046"/><circle cx="81" cy="64.5" r="1.4" fill="#612046"/>
  <rect x="82" y="60" width="6" height="7" rx="1.6" fill="#2A2A2A"/>
  <path d="M70 73 v4 M81 73 v4" stroke="#2A2A2A" stroke-width="1.6" stroke-linecap="round"/>
  <!-- the sheepdog, crouched low behind the flock -->
  <path d="M14 78 q2 -9 12 -9 h8 q5 0 7 -4 l3 -2 q3 0 3 3 v4 q0 3 -3 3 l-3 1 q-2 7 -9 7 h-12 q-6 0 -6 -3 Z" fill="#1C1C1C"/>
  <path d="M30 76 q4 -1 7 -4 l2 3 q-3 4 -9 4 Z" fill="#F7F5EE"/>
  <path d="M44 66 l2 -4 l1.5 4.5 Z" fill="#1C1C1C"/>
  <path d="M41 69.5 q3 1.5 6 0 l-1 2.6 q-2 .8 -4 0 Z" fill="#F4B942" stroke="#B9831F" stroke-width=".4"/>
  <circle cx="46.5" cy="66.5" r=".9" fill="#F7F5EE"/>
  <path d="M14 78 q-5 -3 -6 -8" stroke="#1C1C1C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M18 81 v5 M36 81 v5" stroke="#1C1C1C" stroke-width="2.2" stroke-linecap="round"/>
</svg>
