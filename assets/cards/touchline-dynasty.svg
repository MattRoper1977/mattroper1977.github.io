<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" role="img" aria-labelledby="title desc">
  <title id="title">Touchline Dynasty</title>
  <desc id="desc">A floodlit pitch in perspective seen from the touchline, with a manager's tactics board marking four positions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071026"/><stop offset="1" stop-color="#4A1942"/></linearGradient>
    <linearGradient id="turf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1E7A4C"/><stop offset="1" stop-color="#0D3F2A"/></linearGradient>
  </defs>
  <rect width="120" height="96" rx="10" fill="url(#bg)"/>
  <!-- pitch, receding to a vanishing point above the halfway line -->
  <path d="M14 88 44 34h32l30 54Z" fill="url(#turf)"/>
  <path d="M14 88 44 34h32l30 54Z" fill="none" stroke="#CFE6FF" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- halfway line and centre circle -->
  <path d="M29 61h62" stroke="#CFE6FF" stroke-width="1.2"/>
  <ellipse cx="60" cy="61" rx="11" ry="4.4" fill="none" stroke="#CFE6FF" stroke-width="1.2"/>
  <!-- far goal area -->
  <path d="M52 34h16v7H52z" fill="none" stroke="#CFE6FF" stroke-width="1.2"/>
  <!-- near penalty area -->
  <path d="M31 88 35 74h50l4 14" fill="none" stroke="#CFE6FF" stroke-width="1.2"/>
  <!-- floodlight wash -->
  <path d="M44 34h32l8 14H36Z" fill="#E8F4FF" opacity=".10"/>
  <!-- the tactics board: this is a management game, not a match game -->
  <rect x="6" y="8" width="42" height="34" rx="4" fill="#1E0A1B" stroke="#E2A6C8" stroke-width="1.6"/>
  <path d="M27 11v28M12 25h30" stroke="#8C5476" stroke-width="1"/>
  <circle cx="16" cy="17" r="2.6" fill="#FFD34D"/>
  <circle cx="38" cy="17" r="2.6" fill="#FFD34D"/>
  <circle cx="16" cy="33" r="2.6" fill="#FF6B6B"/>
  <circle cx="38" cy="33" r="2.6" fill="#FF6B6B"/>
  <path d="M18 19 36 31" stroke="#E2A6C8" stroke-width="1.3" stroke-dasharray="3 2"/>
  <!-- ball on the spot -->
  <circle cx="60" cy="72" r="3.2" fill="#FFFFFF"/>
  <path d="M60 69.2v6.4M57 71.4l6 1.2" stroke="#0D3F2A" stroke-width=".9"/>
</svg>
